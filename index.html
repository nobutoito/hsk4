<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="HSK4">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#e8590c">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<title>HSK 4 标准教程 · 练习</title>
<style>
:root{
  --bg:#f6f3ee; --card:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e5e0d8;
  --red:#e8590c; --red-soft:#fff0e6; --green:#15803d; --green-soft:#e7f6ec;
  --amber:#b45309; --amber-soft:#fff4e0; --blue:#1d4ed8; --blue-soft:#e8efff;
  --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.06),0 4px 14px rgba(0,0,0,.05);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#15171a; --card:#1f2226; --ink:#e8e6e3; --muted:#9aa0a6; --line:#33373d;
  --red:#ff8a3d; --red-soft:#3a2416; --green:#4ade80; --green-soft:#16301f;
  --amber:#fbbf24; --amber-soft:#35290f; --blue:#7aa2ff; --blue-soft:#1b2640;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
  -webkit-text-size-adjust:100%}
.zh{font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC","KaiTi",sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
a{color:inherit}
header.top{position:relative;background:var(--red);color:#fff;
  padding:10px 16px 10px;display:flex;align-items:center;gap:10px}
header.top .back{background:rgba(255,255,255,.18);border:0;border-radius:10px;padding:6px 10px;color:#fff}
header.top h1{font-size:17px;margin:0;font-weight:600;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header.top .icon{background:none;border:0;color:#fff;font-size:20px;padding:4px 6px}
header.top #home{background:rgba(255,255,255,.18);border-radius:10px;padding:4px 10px;font-size:18px}
.topwrap{position:sticky;top:0;z-index:10}
.prog{background:#b5420a;color:#fff;padding:calc(6px + env(safe-area-inset-top)) 16px 6px;display:flex;align-items:center;gap:10px;font-size:12px}
/* Home-screen app (iOS 26+): the system blurs a band below the status bar that is taller than the
   safe-area inset. Pad the solid top bar past that band so the progress row sits below the blur. */
@media (display-mode: standalone){.prog{padding-top:calc(24px + env(safe-area-inset-top))}}
html.standalone .prog{padding-top:calc(24px + env(safe-area-inset-top))}
.prog .track{flex:1;height:8px;background:rgba(255,255,255,.25);border-radius:4px;overflow:hidden}
.prog .track i{display:block;height:100%;background:#ffd34d;border-radius:4px;transition:width .4s}
.prog b{font-weight:600;white-space:nowrap}
main{max-width:860px;margin:0 auto;padding:16px 14px 90px}
.card{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:12px}
.chap{display:block;text-decoration:none;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 14px 12px;border-left:5px solid var(--red)}
.chap .num{font-size:12px;color:var(--muted);letter-spacing:.05em}
.chap .cn{font-size:18px;margin:4px 0 2px}
.chap .en{font-size:13px;color:var(--muted)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--green)}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 14px;padding-bottom:4px;scrollbar-width:thin}
.tabs.wrap{flex-wrap:wrap;overflow:visible}
.tabs.wrap a{padding:6px 12px;font-size:13px}
.tabs.wrap .grp{flex-basis:100%;height:0}
.tabs a{flex:none;text-decoration:none;padding:8px 14px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font-size:14px}
.tabs a.on{background:var(--ink);color:var(--bg)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:9px 14px}
.btn.primary{background:var(--red);border-color:var(--red);color:#fff}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:default}
.speak{border:0;background:var(--blue-soft);color:var(--blue);border-radius:50%;width:34px;height:34px;flex:none;font-size:15px;line-height:34px;padding:0;text-align:center}
.speak.big{width:52px;height:52px;font-size:22px;line-height:52px}
h2{font-size:18px;margin:6px 0 12px}
h3{font-size:15px;margin:0 0 10px}
.sechead{display:flex;align-items:baseline;gap:10px;margin:22px 0 10px}
.sechead .roman{font-weight:700;color:var(--red)}
.part-title{font-weight:600}
.pill{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--line);color:var(--muted)}
.pill.ok{background:var(--green-soft);color:var(--green)}
.pill.mid{background:var(--amber-soft);color:var(--amber)}
/* vocab */
table.vocab{width:100%;border-collapse:collapse}
table.vocab td{padding:9px 6px;border-bottom:1px solid var(--line);vertical-align:middle}
table.vocab .w{font-size:22px;white-space:nowrap}
table.vocab .p{color:var(--red);white-space:nowrap}
table.vocab .pos{color:var(--muted);font-size:12px;white-space:nowrap}
.star{border:0;background:none;font-size:18px;color:var(--line);padding:2px}
.star.on{color:#f5b301}
.flash{min-height:260px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;user-select:none}
.flash .big{font-size:64px;line-height:1.1}
.flash .py{font-size:22px;color:var(--red);margin-top:8px}
.flash .def{font-size:17px;margin-top:6px}
/* questions */
.q{padding:12px 0;border-bottom:1px dashed var(--line)}
.q:last-child{border-bottom:0}
.qn{display:inline-block;min-width:24px;font-weight:600;color:var(--muted)}
.sent{font-size:19px;line-height:1.7}
.opts{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.opt{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;font-size:17px;text-align:left}
.opt.sel{border-color:var(--blue);background:var(--blue-soft)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opts.col{flex-direction:column}
.opts.col .opt{width:100%}
.letter{display:inline-block;width:22px;font-weight:700;color:var(--muted)}
.bank{display:flex;flex-wrap:wrap;gap:8px;padding:10px;border:1.5px dashed var(--line);border-radius:12px;margin-bottom:6px}
.bank span{font-size:18px}
.blank{display:inline-block;min-width:56px;border-bottom:2px solid var(--ink);text-align:center;padding:0 4px;color:var(--blue)}
.fb{margin-top:8px;font-size:14px;padding:8px 10px;border-radius:8px}
.fb.ok{background:var(--green-soft);color:var(--green)}
.fb.no{background:var(--red-soft);color:var(--red)}
.en{color:var(--muted);font-size:14px;margin-top:4px}
.hidden{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.chip{border:1.5px solid var(--line);background:var(--card);border-radius:10px;padding:7px 11px;font-size:18px}
.chip.used{opacity:.25}
.build{min-height:48px;border:1.5px solid var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--bg)}
.build .chip{background:var(--card)}
.score{font-size:30px;font-weight:700}
.stickybar{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom));display:flex;gap:10px;justify-content:center;z-index:9}
.gram .pt{border-left:4px solid var(--red);padding-left:12px}
.ex{display:flex;gap:10px;align-items:flex-start;padding:8px 0}
.ex .zh{font-size:18px}
input.hz{font-size:22px;width:70px;text-align:center;border:1.5px solid var(--line);border-radius:8px;padding:4px;background:var(--card);color:var(--ink)}
.star-mark{color:var(--red);font-weight:700}
.dlg div{font-size:17px;line-height:1.7}
.toggle{font-size:13px;color:var(--blue);background:none;border:0;padding:4px 0}
.kpi{display:flex;gap:12px;flex-wrap:wrap}
.kpi .card{flex:1;min-width:140px;margin:0;text-align:center}
.kpi .v{font-size:26px;font-weight:700}
select,input[type=range]{font:inherit}
.stat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.stat-grid a{text-decoration:none;display:flex;justify-content:space-between;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px}
/* texts (课文) */
.txhead{display:flex;align-items:flex-start;gap:10px;justify-content:space-between}
.txline{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px dashed var(--line)}
.txline:last-child{border-bottom:0}
.txline.playing{background:var(--amber-soft);border-radius:8px}
.txsp{flex:none;min-width:52px;font-weight:600;font-size:15px;padding-top:3px}
.txsp.m{color:var(--blue)} .txsp.f{color:var(--red)}
.txzh{font-size:20px;line-height:1.6}
.txpy{color:var(--red);font-size:14px;line-height:1.4}
.txen{color:var(--muted);font-size:14px;margin-top:2px}
.txzh .nw{border-bottom:2px solid var(--amber);cursor:pointer}
.nwtip{font-size:13px;color:var(--amber);margin-top:2px}
</style>
</head>

<script>
// iOS home-screen apps set navigator.standalone; mark it so the CSS can clear the status-bar blur.
if (navigator.standalone || matchMedia('(display-mode: standalone)').matches) document.documentElement.classList.add('standalone');
const DATA = [{"n":1,"cn":"简单的爱情","en":"Simple love","vocab":[{"w":"法律","p":"fǎlǜ","pos":"n.","d":"law"},{"w":"俩","p":"liǎ","pos":"num./mw.","d":"two, both"},{"w":"印象","p":"yìnxiàng","pos":"n.","d":"impression"},{"w":"深","p":"shēn","pos":"adj.","d":"deep"},{"w":"熟悉","p":"shúxī","pos":"v.","d":"to be familiar with"},{"w":"不仅","p":"bùjǐn","pos":"conj.","d":"not only"},{"w":"性格","p":"xìnggé","pos":"n.","d":"character, personality"},{"w":"开玩笑","p":"kāiwánxiào","pos":"v.","d":"joke"},{"w":"从来","p":"cónglái","pos":"adv.","d":"always, all along"},{"w":"最好","p":"zuìhǎo","pos":"adv.","d":"had better"},{"w":"共同","p":"gòngtóng","pos":"adj.","d":"common, shared"},{"w":"适合","p":"shìhé","pos":"v.","d":"to suit, to fit"},{"w":"幸福","p":"xìngfú","pos":"adj.","d":"happy"},{"w":"生活","p":"shēnghuó","pos":"n./v.","d":"life; to live"},{"w":"刚","p":"gāng","pos":"adv.","d":"just, not long"},{"w":"浪漫","p":"làngmàn","pos":"adj.","d":"romantic"},{"w":"够","p":"gòu","pos":"v.","d":"to be enough"},{"w":"缺点","p":"quēdiǎn","pos":"n.","d":"shortcoming"},{"w":"接受","p":"jiēshòu","pos":"v.","d":"to accept"},{"w":"羡慕","p":"xiànmù","pos":"v.","d":"to envy, to admire"},{"w":"爱情","p":"àiqíng","pos":"n.","d":"love (between a man and a woman)"},{"w":"星星","p":"xīngxing","pos":"n.","d":"star"},{"w":"即使","p":"jíshǐ","pos":"conj.","d":"even if"},{"w":"加班","p":"jiābān","pos":"v.","d":"to work overtime"},{"w":"亮","p":"liàng","pos":"v.","d":"to shine, to be lit"},{"w":"感动","p":"gǎndòng","pos":"v.","d":"to touch, to move"},{"w":"自然","p":"zìrán","pos":"adv.","d":"naturally, certainly"},{"w":"原因","p":"yuányīn","pos":"n.","d":"reason"},{"w":"互相","p":"hùxiāng","pos":"adv.","d":"mutually"},{"w":"吸引","p":"xīyǐn","pos":"v.","d":"to attract"},{"w":"幽默","p":"yōumò","pos":"adj.","d":"humourous"},{"w":"脾气","p":"píqi","pos":"n.","d":"temper, disposition"}],"proper":"高 (Gāo), 李 (Lǐ), 李进 (LǐJìn), 孙月 (SūnYuè), 王静 (WángJìng)","grammar":[{"t":"不仅……而且/也/还…… — Not only … but also …","m":"Links two facts where the second adds to or goes further than the first. When both clauses share one subject, 不仅 goes after the subject; when the subjects differ, 不仅 goes before the first subject. The second clause takes 而且, 也 or 还 (often 而且……也……).","ex":[["他不仅会说英语，而且会说日语。","Not only can he speak English, he can also speak Japanese."],["这家饭馆的菜不仅好吃，而且很便宜。","The food in this restaurant is not only tasty but also cheap."],["不仅学生喜欢王老师，家长也都很喜欢她。","Not only do the students like Teacher Wang, the parents all like her too."]]},{"t":"从来 + 不/没(有) — never, have never","m":"从来 means 'always, all along' and is almost always followed by a negative. 从来不 + verb describes a habit or principle (never does); 从来没(有) + verb + 过 describes experience up to now (has never done). 从来 always comes before the negative word.","ex":[["我爷爷从来不喝咖啡。","My grandpa never drinks coffee."],["我从来没去过南方。","I have never been to the south."],["她上班从来没有迟到过。","She has never once been late for work."]]},{"t":"即使……也…… — Even if …, still …","m":"Presents a supposition: even if the condition in the first clause were true, the result after 也 does not change. Unlike 虽然 (which states a real fact, 'although'), 即使 usually introduces a hypothetical or extreme case. 也 must come after the subject of the second clause.","ex":[["即使你不说，我也知道你在想什么。","Even if you don't say it, I know what you're thinking."],["即使工作再忙，他每天也要跑步半个小时。","Even if work is very busy, he still runs for half an hour every day."],["即使这次考得不好，你也别太难过。","Even if you don't do well in this exam, don't be too sad."]]},{"t":"刚 vs 刚才 — just / a moment ago","m":"刚 is an adverb placed right before the verb: the action happened only a short time ago (the time can feel short to the speaker, even days), and it may be followed by a duration: 刚来两天. 刚才 is a time noun meaning 'a moment ago'; it can stand before the subject, modify nouns (刚才的电影) and take negation (刚才你不在), but it can't be followed by a duration.","ex":[["我刚到家，你就打电话来了。","I had only just got home when you called."],["他刚来北京一个星期，还不太习惯。","He's only been in Beiji "lines":[{"sp":"刘芳","s":"f","zh":"小雨，听说你有男朋友了？他是做什么的？","py":"Xiǎoyǔ, tīngshuō nǐ yǒu nán péngyou le? Tā shì zuò shénme de?","en":"Xiaoyu, I hear you've got a boyfriend? What does he do?"},{"sp":"林小雨","s":"f","zh":"他是学法律的，现在在一家公司工作。我们俩是去年在朋友家认识的。","py":"Tā shì xué fǎlǜ de, xiànzài zài yì jiā gōngsī gōngzuò. Wǒmen liǎ shì qùnián zài péngyou jiā rènshi de.","en":"He studied law and now works at a company. We met at a friend's place last year."},{"sp":"刘芳","s":"f","zh":"第一次见到他的时候，你对他印象深吗？","py":"Dì-yī cì jiàndào tā de shíhou, nǐ duì tā yìnxiàng shēn ma?","en":"When you first saw him, did he make a strong impression?"},{"sp":"林小雨","s":"f","zh":"很深！他不仅很幽默，而且特别会照顾人。那天他一直在开玩笑，大家都笑得停不下来。","py":"Hěn shēn! Tā bùjǐn hěn yōumò, érqiě tèbié huì zhàogù rén. Nà tiān tā yìzhí zài kāi wánxiào, dàjiā dōu xiào de tíng bu xiàlái.","en":"A strong one! He's not only funny, he's also really caring. That day he kept joking and everyone couldn't stop laughing."},{"sp":"刘芳","s":"f","zh":"那他有什么缺点吗？","py":"Nà tā yǒu shénme quēdiǎn ma?","en":"So does he have any faults?"},{"sp":"林小雨","s":"f","zh":"有啊，他工作太忙，经常加班。但是他从来不对我发脾气，我觉得这就够了。","py":"Yǒu a, tā gōngzuò tài máng, jīngcháng jiābān. Dànshì tā cónglái bú duì wǒ fā píqi, wǒ juéde zhè jiù gòu le.","en":"Sure, he's too busy at work and often works overtime. But he never loses his temper with me, and that's enough for me."},{"sp":"刘芳","s":"f","zh":"真羡慕你！下次带他来跟我们一起吃饭吧。","py":"Zhēn xiànmù nǐ! Xià cì dài tā lái gēn wǒmen yìqǐ chī fàn ba.","en":"I really envy you! Bring him to eat with us next time."}]},{"t":"新的城市 · A new city","scene":"Zhang Wei offers to show Mark, who has just arrived in China, around at the weekend.","g":[2,3],"lines":[{"sp":"张伟","s":"m","zh":"马克，你刚来中国，生活上都习惯了吗？","py":"Mǎkè, nǐ gāng lái Zhōngguó, shēnghuó shang dōu xíguàn le ma?","en":"Mark, you've just come to China — are you used to daily life here?"},{"sp":"马克","s":"m","zh":"还好，就是对这里还不太熟悉，常常找不到路。","py":"Hái hǎo, jiùshì duì zhèlǐ hái bú tài shúxī, chángcháng zhǎo bu dào lù.","en":"Pretty much, it's just that I don't know the place well yet and often get lost."},{"sp":"张伟","s":"m","zh":"别担心，过一段时间自然就熟悉了。周末我带你出去走走吧。","py":"Bié dānxīn, guò yí duàn shíjiān zìrán jiù shúxī le. Zhōumò wǒ dài nǐ chūqu zǒuzou ba.","en":"Don't worry, after a while you'll naturally get to know it. I'll take you out for a walk at the weekend."},{"sp":"马克","s":"m","zh":"太好了！但是你工作那么忙，周末不想休息吗？","py":"Tài hǎo le! Dànshì nǐ gōngzuò nàme máng, zhōumò bù xiǎng xiūxi ma?","en":"Great! But you're so busy at work — don't you want to rest at the weekend?"},{"sp":"张伟","s":"m","zh":"即使再累，我也愿意跟朋友出去玩儿。而且我们有共同的爱好，都喜欢拍照嘛。","py":"Jíshǐ zài lèi, wǒ yě yuànyì gēn péngyou chūqu wánr. Érqiě wǒmen yǒu gòngtóng de àihào, dōu xǐhuan pāizhào ma.","en":"However tired I am, I'm happy to go out with friends. Besides, we share a hobby — we both love taking photos."},{"sp":"马克","s":"m","zh":"那我们去哪儿？听说晚上的河边特别美。","py":"Nà wǒmen qù nǎr? Tīngshuō wǎnshang de hébiān tèbié měi.","en":"So where shall we go? I hear the riverside is beautiful at night."},{"sp":"张伟","s":"m","zh":"对，那儿的灯都亮起来以后特别漂亮，天气好的时候还能看到星星。","py":"Duì, nàr de dēng dōu liàng qǐlái yǐhòu tèbié piàoliang, tiānqì hǎo de shíhou hái néng kàndào xīngxing.","en":"Yes, once all the lights come on it's gorgeous, and on clear nights you can see the stars."}]},{"t":"记者采访 · An interview","scene":"A reporter asks Manager Wang, married thirty years, about the secret of a happy marriage.","g":[0,2],"lines":[{"sp":"记者","s":"f","zh":"王经理，您和太太结婚三十年了，很多人都羡慕你们。","py":"Wáng jīnglǐ, nín hé tàitai jiéhūn sānshí nián le, hěn duō rén dōu xiànmù nǐmen.","en":"Manager Wang, you and your wife have been married thirty years; many people envy you."},{"sp":"王经理","s":"m","zh":"谢谢。其实我们俩性格不太一样：我太太脾气急，我做事慢。","py":"Xièxie. Qíshí wǒmen liǎ xìnggé bú tài yíyàng: wǒ tàitai píqi jí, wǒ zuò shì màn.","en":"Thank you. Actually our personalities are quite different: my wife is quick-tempered and I'm slow."},{"sp":"记者","s":"f","zh":"那你们是怎么一直生活得这么幸福的？","py":"Nà nǐmen shì zěnme yìzhí shēnghuó de zhème xìngfú de?","en":"Then how have you stayed so happy all along?"},{"sp":"王经理","s":"m","zh":"我觉得最重要的是互相接受。每个人都有缺点，不要总想让别人变成另一个人。","py":"Wǒ juéde zuì zhòngyào de shì hùxiāng jiēshòu. Měi gè rén dōu yǒu quēdiǎn, búyào zǒng xiǎng ràng biérén biànchéng lìng yí gè rén.","en":"I think the key is accepting each other. Everyone has faults; don't always try to turn the other person into someone else."},{"sp":"记者","s":"f","zh":"很多年轻人觉得爱情一定要浪漫，您怎么看？","py":"Hěn duō niánqīng rén juéde àiqíng yídìng yào làngmàn, nín zěnme kàn?","en":"Many young people think love must be romantic. What's your view?"},{"sp":"王经理","s":"m","zh":"浪漫当然好，但是生活不仅需要浪漫，还需要互相关心。即使只是下雨时去车站接她，她也会很感动。","py":"Làngmàn dāngrán hǎo, dànshì shēnghuó bùjǐn xūyào làngmàn, hái xūyào hùxiāng guānxīn. Jíshǐ zhǐ shì xià yǔ shí qù chēzhàn jiē tā, tā yě huì hěn gǎndòng.","en":"Romance is nice, of course, but life needs not only romance but also caring for each other. Even just meeting her at the station when it rains moves her."},{"sp":"记者","s":"f","zh":"您说得真好，谢谢您！","py":"Nín shuō de zhēn hǎo, xièxie nín!","en":"Well said — thank you!"}]},{"t":"办公室里 · In the office","scene":"Zhang Wei notices Liu Fang is quiet; her mother wants to set her up on a date.","g":[1,3],"lines":[{"sp":"张伟","s":"m","zh":"刘芳，你刚才开会的时候怎么一句话也不说？有什么事吗？","py":"Liú Fāng, nǐ gāngcái kāihuì de shíhou zěnme yí jù huà yě bù shuō? Yǒu shénme shì ma?","en":"Liu Fang, why didn't you say a word in the meeting just now? Is something up?"},{"sp":"刘芳","s":"f","zh":"我妈又让我去见一个男孩子，说他工作好、人也好，很适合我。","py":"Wǒ mā yòu ràng wǒ qù jiàn yí gè nán háizi, shuō tā gōngzuò hǎo, rén yě hǎo, hěn shìhé wǒ.","en":"My mum wants me to meet another guy again; she says he has a good job, he's a good person, and he's right for me."},{"sp":"张伟","s":"m","zh":"那你为什么不想去？有什么原因吗？","py":"Nà nǐ wèishénme bù xiǎng qù? Yǒu shénme yuányīn ma?","en":"So why don't you want to go? Is there a reason?"},{"sp":"刘芳","s":"f","zh":"我觉得两个人在一起，最重要的是互相吸引，不能只看工作好不好。","py":"Wǒ juéde liǎng gè rén zài yìqǐ, zuì zhòngyào de shì hùxiāng xīyǐn, bù néng zhǐ kàn gōngzuò hǎo bu hǎo.","en":"I think for two people, the most important thing is mutual attraction — you can't just look at whether the job is good."},{"sp":"张伟","s":"m","zh":"我明白。但是你从来没见过他，怎么知道他吸引不了你呢？","py":"Wǒ míngbai. Dànshì nǐ cónglái méi jiànguo tā, zěnme zhīdào tā xīyǐn bu liǎo nǐ ne?","en":"I get it. But you've never met him — how do you know he can't attract you?"},{"sp":"刘芳","s":"f","zh":"你说得也对。那我最好还是先去见一面吧。","py":"Nǐ shuō de yě duì. Nà wǒ zuìhǎo háishi xiān qù jiàn yí miàn ba.","en":"You have a point. I'd better go and meet him first, then."},{"sp":"张伟","s":"m","zh":"对，就当认识一个新朋友，别想太多。","py":"Duì, jiù dāng rènshi yí gè xīn péngyou, bié xiǎng tài duō.","en":"Right — just treat it as meeting a new friend, and don't overthink it."}]}]},{"n":2,"cn":"真正的朋友","en":"A true friend","vocab":[{"w":"适应","p":"shìyìng","pos":"v.","d":"to get used to"},{"w":"交","p":"jiāo","pos":"v.","d":"to make (friends)"},{"w":"平时","p":"píngshí","pos":"n.","d":"normal times"},{"w":"逛","p":"guàng","pos":"v.","d":"to stroll, to roam"},{"w":"短信","p":"duǎnxìn","pos":"n.","d":"text message"},{"w":"正好","p":"zhènghǎo","pos":"adv.","d":"just in time, just right"},{"w":"聚会","p":"jùhuì","pos":"n./v.","d":"to have a party; party, get-together"},{"w":"联系","p":"liánxì","pos":"v.","d":"to contact"},{"w":"差不多","p":"chàbuduō","pos":"adv.","d":"almost"},{"w":"专门","p":"zhuānmén","pos":"adv.","d":"specially"},{"w":"毕业","p":"bìyè","pos":"v.","d":"to graduate"},{"w":"麻烦","p":"máfan","pos":"v.","d":"to bother"},{"w":"好像","p":"hǎoxiàng","pos":"adv.","d":"as if"},{"w":"重新","p":"chóngxīn","pos":"adv.","d":"again, once more"},{"w":"尽管","p":"jǐnguǎn","pos":"conj.","d":"although"},{"w":"真正","p":"zhēnzhèng","pos":"adj.","d":"true, real"},{"w":"友谊","p":"yǒuyì","pos":"n.","d":"friendship"},{"w":"丰富","p":"fēngfù","pos":"v.","d":"to enrich"},{"w":"无聊","p":"wúliáo","pos":"adj.","d":"boring"},{"w":"讨厌","p":"tǎoyàn","pos":"v.","d":"to dislike"},{"w":"却","p":"què","pos":"adv.","d":"but, yet"},{"w":"周围","p":"zhōuwéi","pos":"n.","d":"surrounding"},{"w":"交流","p":"jiāoliú","pos":"v.","d":"to exchange, to communicate"},{"w":"理解","p":"lǐjiě","pos":"v.","d":"to understand"},{"w":"镜子","p":"jìngzi","pos":"n.","d":"mirror"},{"w":"而","p":"ér","pos":"conj.","d":"(showing a contrast) while, yet"},{"w":"当","p":"dāng","pos":"prep.","d":"when, just at (a time or place)"},{"w":"困难","p":"kùnnan","pos":"n.","d":"difficulty"},{"w":"及时","p":"jíshí","pos":"adv.","d":"in time"},{"w":"陪","p":"péi","pos":"v.","d":"to accompany"}],"proper":"林 (Lín), 马克 (Mǎkè), 上海 (Shànghǎi), 夏 (Xià), 张远 (ZhāngYuǎn)","grammar":[{"t":"尽管……但是/还是…… — Although …, (still) …","m":"尽管 admits a fact that is true, then the second clause says the result is not what you'd expect; it is followed by 但是/却/还是/也. It is close to 虽然 but sounds a bit more formal and stresses 'in spite of this'. It is used for real facts, not hypotheses (use 即使 for those).","ex":[["尽管外面很冷，但是孩子们还是想出去玩儿。","Although it's cold outside, the children still want to go out and play."],["尽管他已经说了对不起，她还是很生气。","Even though he has said sorry, she's still angry."],["尽管工作很累，但是他从来不跟家人说累。","Although the work is tiring, he never tells his family he's tired."]]},{"t":"却 — but, yet (unexpected turn)","m":"却 is an adverb showing that what follows is contrary to expectation. Unlike 但是 (a conjunction at the head of the clause), 却 must come after the subject and before the verb or adjective. The two can be used together: 但是他却……","ex":[["我给他打了好几次电话，他却一直没接。","I called him several times, yet he never picked up."],["天气预报说今天有雨，太阳却出来了。","The forecast said it would rain today, but the sun came out."],["这个问题看起来很简单，做起来却很难。","This problem looks simple, but it's hard to actually do."]]},{"t":"而 — while, whereas (contrast)","m":"而 joins two clauses or phrases that contrast with each other, mostly in written or formal style: 'A is like this, whereas B is like that'. It usually stands at the head of the second clause, after a comma. It can also link two adjectives that complement each other (简单而有效).","ex":[["哥哥喜欢在家看书，而弟弟喜欢出去踢球。","My older brother likes reading at home, whereas my younger brother likes going out to play football."],["北方的冬天很冷，而南方的冬天不太冷。","Winter in the north is cold, while winter in the south is not very cold."],["这个办法简单而有效。","This method is simple yet effective."]]},{"t":"当……的时候/时 — when …, at the time when …","m":"当 + clause + 的时候 (or 时) marks the time when something happens, a bit more formal than a bare ……的时候. The whole phrase usually comes at the beginning of the sentence, before the subject of the main clause, e.g. 当我……的时候，他……。","ex":[["当我回到家的时候，妈妈已经做好了饭。","When I got home, Mum had already made dinner."],["当你遇到问题时，可以先问问老师。","When you run into a problem, you can ask the teacher first."],["当飞机起飞的时候，他紧紧地拉着妈妈的手。","When the plane took off, he held his mother's hand tightly."]]}],"ex":{"judge":[{"s":"我刚来上海的时候，什么都不适应：吃不惯这里的菜，也听不懂上海话。还好周围的同学都很热情，经常陪我出去逛逛。","st":"★ 说话人刚来上海时很适应。","a":false,"en":"When I first came to Shanghai I couldn't adjust to anything: I wasn't used to the food and couldn't understand Shanghainese. Luckily the classmates around me were warm and often took me out. / ★ The speaker adjusted easily at first."},{"s":"我和大学同学毕业已经十年了。尽管大家都很忙，但是每年冬天我们还是会找时间聚会一次。","st":"★ 说话人每年都和大学同学见面。","a":true,"en":"My university classmates and I graduated ten years ago. Although everyone is busy, we still find time to get together once every winter. / ★ The speaker meets classmates every year."},{"s":"小林平时很少打电话，有事一般都发短信。他说打电话常常会麻烦别人，发短信别人可以有空的时候再看。","st":"★ 小林有事一般打电话。","a":false,"en":"Xiao Lin rarely phones; he usually sends texts. He says calling often bothers people, whereas a text can be read when they're free. / ★ Xiao Lin usually phones."},{"s":"真正的朋友不一定每天在一起，但是当你遇到困难的时候，他一定会及时出现在你身边。","st":"★ 真正的朋友会在你有困难时帮助你。","a":true,"en":"True friends aren't necessarily together every day, but when you face difficulties they'll be at your side in time. / ★ True friends help you when you're in trouble."},{" e going out she always looks in the mirror to check her clothes are tidy."},{"s":"多去不同的地方旅游，可以（  ）我们的生活。","a":"丰富","en":"Travelling to different places can enrich our lives."},{"s":"这份作业我写得不好，老师让我（  ）写一遍。","a":"重新","en":"I didn't do this homework well, so the teacher told me to write it again."},{"s":"我们俩从小一起长大，这份（  ）已经有二十多年了。","a":"友谊","en":"We grew up together; this friendship is over twenty years old."},{"s":"A：你这次去上海是为了工作吗？  B：不是，我是（  ）去看一个老朋友的。","a":"专门","en":"A: Is this trip to Shanghai for work? B: No, I'm going specially to see an old friend."},{"s":"A：你怎么买了这么多菜？  B：明天有几个朋友来家里（  ），我得准备晚饭。","a":"聚会","en":"A: Why did you buy so much food? B: Some friends are coming over for a get-together tomorrow; I have to make dinner."},{"s":"A：我想去买东西，你跟我一起去吗？  B：（  ）我也要买点儿水果，一起走吧。","a":"正好","en":"A: I want to go shopping; coming with me? B: Perfect timing — I need some fruit too. Let's go."},{"s":"A：你和你的中学同学还有（  ）吗？  B：有，我们经常在网上聊天。","a":"联系","en":"A: Are you still in touch with your middle-school classmates? B: Yes, we often chat online."},{"s":"A：我说的意思你明白了吗？  B：明白了，我很（  ）你的想法。","a":"理解","en":"A: Do you understand what I mean? B: Yes, I really understand your thinking."}],"grammar":[{"q":"（  ）他每天都很忙，但是他还是每天给父母打电话。","opts":["当","尽管","而","却"],"a":1,"exp":"尽管……但是…… : although a real fact, the result is still unexpected.","g":0},{"q":"大家都很高兴，他（  ）一句话也不说。","opts":["却","尽管","当","而且"],"a":0,"exp":"却 goes after the subject and shows an unexpected contrast.","g":1},{"q":"姐姐喜欢运动，（  ）妹妹喜欢在家看书。","opts":["当","尽管","而","即使"],"a":2,"exp":"而 joins two contrasting situations: A …, whereas B ….","g":2},{"q":"（  ）我打开门的时候，大家一起唱起了生日歌。","opts":["而","却","尽管","当"],"a":3,"exp":"当……的时候 marks the moment when something happens.","g":3},{"q":"我等了他一个小时，他（  ）没来。","opts":["却","而","当","尽管"],"a":0,"exp":"却 before the verb phrase: contrary to expectation, he didn't come.","g":1},{"q":"尽管路不太好走，我们（  ）在八点以前到了。","opts":["就","还是","才","而"],"a":1,"exp":"尽管 is answered by 还是 in the second clause: 'still'.","g":0}],"order":[{"parts":["当你需要帮助的时候，","真正的朋友","会及时出现。"],"en":"When you need help, a true friend will show up in time."},{"parts":["尽管我们很少见面，","但是我们的友谊","一直没有变。"],"en":"Although we rarely meet, our friendship has never changed."},{"parts":["我平时很少逛街，","今天正好有空，","就陪妈妈去了商店。"],"en":"I rarely go shopping, but I happened to be free today, so I went to the shops with Mum."},{"parts":["有的人喜欢跟朋友在一起，","而有的人喜欢安静，","每个人都不一样。"],"en":"Some people like being with friends, while others like quiet; everyone is different."}],"reading":[{"p":"马克刚来中国时，觉得交朋友很难。后来他参加了学校的足球队，每周跟队里的同学踢两次球。差不多半年以后，他就有了很多中国朋友，汉语也说得越来越好了。","q":"★ 马克是怎么交到朋友的？","opts":["参加足球队","去逛街","发短信"],"a":0,"en":"When Mark first came to China he found it hard to make friends. Later he joined the school football team and played twice a week. About half a year later he had many Chinese friends and his Chinese was getting better and better."},{"p":"有人说，朋友就像一面镜子。从朋友身上，我们能看到自己好的地方，也能看到自己的缺点。所以，多跟不同的人交流，可以让我们更了解自己。","q":"★ 这段话说朋友像镜子，是因为：","opts":["朋友长得像我们","朋友能让我们更了解自己","朋友喜欢照镜子"],"a":1,"en":"Some say a friend is like a mirror: through friends we see our good points and our flaws. So communicating with all kinds of people helps us understand ourselves better."},{"p":"我讨厌一个人过周末，觉得特别无聊。但是我的同屋却很喜欢一个人在家，她说平时上班太累了，周末只想安安静静地休息。","q":"★ 说话人的同屋周末喜欢：","opts":["跟朋友聚会","去逛街","一个人在家休息"],"a":2,"en":"I hate spending weekends alone; it's so boring. But my roommate loves being home alone — she says work is so tiring that at weekends she just wants to rest quietly."},{"p":"张远上大学时，有一次病了，在床上躺了三天。他的同学小夏每天下课后都来陪他，还给他带饭。毕业以后，尽管两个人在不同的城市工作，但是一直是最好的朋友。","q":"★ 根据这段话，可以知道：","opts":["张远和小夏现在在一个城市工作","小夏在张远生病时照顾过他","张远和小夏毕业后没联系了"],"a":1,"en":"When Zhang Yuan was at university he was once ill in bed for three days. His classmate Xiao Xia came every day after class to keep him company and bring food. Since graduating, although they work in different cities, they've stayed best friends."}],"write":[{"words":["他","专门","来","机场接我。"],"en":"He came to the airport specially to pick me up."},{"words":["我","已经","适应了","这里的天气。"],"en":"I've got used to the weather here."},{"words":["你","最好","及时","联系他。"],"en":"You'd better contact him promptly."},{"words":["这个电影","好像","有点儿","无聊。"],"en":"This film seems a bit boring."},{"words":["谢谢你","陪我","度过了","这段困难的时间。"],"en":"Thank you for being with me through this difficult time."}],"hanzi":[{"s":"我们的友（  ）越来越深了。","py":"yì","a":"谊"},{"s":"他下个月就要（  ）业了。","py":"bì","a":"毕"},{"s":"我不喜欢一个人，太无（  ）了。","py":"liáo","a":"聊"},{"s":"我们学校周（  ）有很多饭馆。","py":"wéi","a":"围"},{"s":"我在中国（  ）了很多朋友。","py":"jiāo","a":"交"}]},"rv":{"judge":[{"s":"我和刘芳是在一次聚会上认识的。那天我们聊了差不多三个小时，发现我们有很多共同的爱好。","st":"★ 说话人和刘芳是在学校认识的。","a":false,"en":"Liu Fang and I met at a party. That day we chatted for about three hours and found we had many hobbies in common. / ★ They met at school."},{"s":"林小雨每天出门前都要照很长时间的镜子。尽管她已经很漂亮了，但是她还是觉得不够好。","st":"★ 林小雨觉得自己已经很漂亮了。","a":false,"en":"Lin Xiaoyu looks in the mirror for ages before going out every day. Although she's already very pretty, she still feels it isn't good enough. / ★ She thinks she's already pretty."},{"s":"马克说，学好汉语最好的办法就是多跟当地人交流。所以他平时很少待在家里，经常去公园跟老人们聊天。","st":"★ 马克常常和公园里的老人聊天。","a":true,"en":"Mark says the best way to learn Chinese well is to talk with local people a lot. So he seldom stays home and often chats with old people in the park. / ★ Mark often chats with old people in the park."},{"s":"上个月我的电脑坏了，正好要交作业。我的同学张伟知道以后，马上把他的电脑借给了我，帮我解决了大问题。","st":"★ 张伟帮了说话人的忙。","a":true,"en":"Last month my computer broke just when homework was due. When classmate Zhang Wei found out, he lent me his straight away and solved a big problem for me. / ★ Zhang Wei helped the speaker."}],"listen":[{"dlg":["男：你去哪儿了？我给你发了好几条短信。","女：对不起，我陪我奶奶去医院了，手机一直没看。"],"q":"女的刚才在做什么？","opts":["在发短信","陪奶奶去医院","去逛街了"],"a":1,"en":"M: Where were you? I sent you several texts. F: Sorry, I took my grandma to hospital and didn't check my phone."},{"dlg":["女：你觉得这本书怎么样？","男：我以前觉得这种书会很无聊，看了以后却觉得很有意思。"],"q":"男的觉得这本书怎么样？","opts":["很无聊","太难了","很有意思"],"a":2,"en":"F: What do you think of this book? M: I expected it to be boring, but after reading it I found it really interesting."},{"dlg":["男：你好像不太高兴，怎么了？","女：我跟好朋友吵架了，她说我不理解她。"],"q":"女的为什么不高兴？","opts":["和朋友吵架了","考试没考好","丢了手机"],"a":0,"en":"M: You don't seem very happy — what's wrong? F: I argued with my best friend; she says I don't understand her."},{"dlg":["女：毕业以后你打算去哪儿工作？","男：我想回老家，那里离父母近。","女：但是大城市的机会更多啊。","男：我知道，但是我觉得陪在父母身边更重要。"],"q":"男的为什么想回老家？","opts":["老家钱多","想离父母近一点儿","不喜欢大城市的天气"],"a":1,"en":"F: Where do you plan to work after graduating? M: I want to go back to my hometown, near my parents. F: But big cities have more opportunities. M: I know, but being with my parents matters more to me."}],"fill":[{"s":"我（  ）别人在图书馆里大声打电话。","a":"讨厌","en":"I hate it when people talk loudly on the phone in the library."},{"s":"这个周末我想去书店（  ）一下，看看有没有新书。","a":"逛","en":"This weekend I want to browse in the bookshop to see if there are new books."},{"s":"幸亏医生来得（  ），他的病才很快好了。","a":"及时","en":"Luckily the doctor came in time, so he recovered quickly."},{"s":"A：从这儿到火车站要多长时间？  B：（  ）二十分钟吧，不太远。","a":"差不多","en":"A: How long from here to the station? B: About twenty minutes, not far."},{"s":"A：你遇到什么（  ）了？跟我说说。  B：我找不到住的地方，房子都太贵了。","a":"困难","en":"A: What difficulty have you run into? Tell me. B: I can't find anywhere to live; it's all too expensive."},{"s":"A：真不好意思，这么晚还（  ）你。  B：没事，我还没睡呢。","a":"麻烦","en":"A: Sorry to bother you so late. B: No problem, I wasn't asleep yet."}],"grammar":[{"q":"他说今天会来，（  ）一直没出现。","opts":["却","尽管","当","而且"],"a":0,"exp":"却 marks the unexpected outcome; here the subject 他 is understood.","g":1},{"q":"（  ）我第一次上台唱歌的时候，心里特别害怕。","opts":["尽管","而","当","却"],"a":2,"exp":"当……的时候 = at the moment when …","g":3},{"q":"（  ）他汉语说得很好，但是写汉字还有点儿困难。","opts":["当","而","却","尽管"],"a":3,"exp":"尽管……但是 states a true fact then an unexpected result.","g":0},{"q":"我喜欢夏天，（  ）我丈夫喜欢冬天。","opts":["而","当","尽管","就"],"a":0,"exp":"而 contrasts two people's preferences.","g":2},{"q":"这家饭馆的菜不贵，（  ）很好吃。","opts":["当","却","尽管","而且是"],"a":1,"exp":"Cheap food would be expected to be average; 却 shows it's surprisingly good.","g":1},{"q":"当我遇到困难（  ），他总是第一个来帮我。","opts":["以前","的时候","以后","而"],"a":1,"exp":"当 pairs with 的时候 (or 时) to frame the time clause.","g":3}],"order":[{"parts":["尽管我们俩性格不同，","但是我们","很少吵架。"],"en":"Although our personalities differ, we rarely argue."},{"parts":["当他收到我的短信时，","已经是","晚上十二点了。"],"en":"By the time he got my text, it was already midnight."},{"parts":["我很担心他会生气，","他却笑着说","没关系。"],"en":"I was worried he'd be angry, but he smiled and said it was fine."}],"reading":[{"p":"现在很多年轻人平时更喜欢在网上跟朋友聊天，而不是见面。他们觉得这样又方便又快。但是也有人认为，只有见面交流，才能交到真正的朋友。","q":"★ 根据这段话，有人认为：","opts":["网上聊天更好","见面交流才能交到真正的朋友","年轻人不需要朋友"],"a":1,"en":"Many young people now prefer chatting online to meeting up; they find it convenient and fast. But some think only communicating in person can build true friendships."},{"p":"我是在上海读的大学。刚去的时候，我觉得那里的人做什么都很快，很不适应。大二的时候，我认识了几个好朋友，他们经常陪我去逛街、吃好吃的，我慢慢地就喜欢上了这个城市。","q":"★ 说话人后来为什么喜欢上了上海？","opts":["交了好朋友","找到了好工作","那里很安静"],"a":0,"en":"I went to university in Shanghai. At first everyone there seemed to do everything fast and I couldn't adjust. In my second year I made a few good friends who often took me shopping and out to eat, and slowly I came to love the city."},{"p":"张伟和马克是好朋友。马克刚来中国时，张伟专门带他去办银行卡、买手机。后来马克也常常帮张伟练习英语。他们俩互相帮助，友谊越来越深。","q":"★ 根据这段话，可以知道：","opts":["张伟教马克打篮球","马克帮张伟练习英语","他们俩现在不联系了"],"a":1,"en":"Zhang Wei and Mark are good friends. When Mark first came to China, Zhang Wei specially took him to get a bank card and buy a phone. Later Mark often helped Zhang Wei practise English. Helping each other, their friendship grew deeper."}],"write":[{"words":["我们","差不多","有十年","没见面了。"],"en":"We haven't seen each other for about ten years."},{"words":["她","好像","不太理解","我的意思。"],"en":"She doesn't seem to understand what I mean."},{"words":["我们","重新","开始","吧。"],"en":"Let's start again."},{"words":["我们","周围的人","都很","热情。"],"en":"The people around us are all very warm."}],"hanzi":[{"s":"我每天都给妈妈发短（  ）。","py":"xìn","a":"信"},{"s":"下雨了，我（  ）你回家吧。","py":"péi","a":"陪"},{"s":"他是我真（  ）的朋友。","py":"zhèng","a":"正"},{"s":"旅游可以丰（  ）我们的生活。","py":"fù","a":"富"}]},"tx":[{"t":"在宿舍 · In the dorm","scene":"Lin Xiaoyu asks Mark how he is settling in after a month in China.","g":[0,1],"lines":[{"sp":"林小雨","s":"f","zh":"马克，你来中国差不多一个月了，适应这里的生活了吗？","py":"Mǎkè, nǐ lái Zhōngguó chàbuduō yí gè yuè le, shìyìng zhèlǐ de shēnghuó le ma?","en":"Mark, you've been in China nearly a month — have you adjusted to life here?"},{"sp":"马克","s":"m","zh":"尽管我已经来了一个月，但是有时候还是觉得不太习惯。","py":"Jǐnguǎn wǒ yǐjīng lái le yí gè yuè, dànshì yǒu shíhou háishi juéde bú tài xíguàn.","en":"Although I've been here a month, I still sometimes don't feel used to it."},{"sp":"林小雨","s":"f","zh":"你平时下课以后都做什么？","py":"Nǐ píngshí xiàkè yǐhòu dōu zuò shénme?","en":"What do you usually do after class?"},{"sp":"马克","s":"m","zh":"一般在宿舍上网，或者一个人去附近逛逛。我想多交几个中国朋友，却不知道怎么开始。","py":"Yìbān zài sùshè shàngwǎng, huòzhě yí gè rén qù fùjìn guàngguang. Wǒ xiǎng duō jiāo jǐ gè Zhōngguó péngyou, què bù zhīdào zěnme kāishǐ.","en":"Usually I go online in the dorm or wander around nearby alone. I want to make more Chinese friends, but I don't know how to start."},{"sp":"林小雨","s":"f","zh":"这个周末我们班正好有个聚会，你跟我一起去吧，我给你介绍几个同学。","py":"Zhège zhōumò wǒmen bān zhènghǎo yǒu gè jùhuì, nǐ gēn wǒ yìqǐ qù ba, wǒ gěi nǐ jièshào jǐ gè tóngxué.","en":"Our class happens to have a get-together this weekend. Come with me and I'll introduce you to some classmates."},{"sp":"马克","s":"m","zh":"太好了！但是这样会不会太麻烦你？","py":"Tài hǎo le! Dànshì zhèyàng huì bu huì tài máfan nǐ?","en":"Great! But won't that be too much trouble for you?"},{"sp":"林小雨","s":"f","zh":"一点儿也不麻烦。到时候我给你发短信，告诉你地方。","py":"Yìdiǎnr yě bù máfan. Dào shíhou wǒ gěi nǐ fā duǎnxìn, gàosu nǐ dìfang.","en":"No trouble at all. I'll text you the place nearer the time."}]},{"t":"老同学 · An old classmate","scene":"Zhang Wei runs into Liu Fang, a classmate he hasn't seen since graduation.","g":[3,1],"lines":[{"sp":"张伟","s":"m","zh":"刘芳？真的是你！我们毕业以后好像就没见过面了。","py":"Liú Fāng? Zhēn de shì nǐ! Wǒmen bìyè yǐhòu hǎoxiàng jiù méi jiànguo miàn le.","en":"Liu Fang? It really is you! I don't think we've seen each other since graduation."},{"sp":"刘芳","s":"f","zh":"是啊，都五年了！你还跟大学同学联系吗？","py":"Shì a, dōu wǔ nián le! Nǐ hái gēn dàxué tóngxué liánxì ma?","en":"Yes, five years already! Do you still keep in touch with university classmates?"},{"sp":"张伟","s":"m","zh":"很少。大家都很忙，以前说好每年见一次，却一次也没见成。","py":"Hěn shǎo. Dàjiā dōu hěn máng, yǐqián shuōhǎo měi nián jiàn yí cì, què yí cì yě méi jiànchéng.","en":"Rarely. Everyone's busy; we agreed to meet once a year, but it never happened once."},{"sp":"刘芳","s":"f","zh":"我还记得，当我生病住院的时候，是你和几个同学每天来医院陪我的。","py":"Wǒ hái jìde, dāng wǒ shēngbìng zhùyuàn de shíhou, shì nǐ hé jǐ gè tóngxué měi tiān lái yīyuàn péi wǒ de.","en":"I still remember: when I was ill in hospital, it was you and a few classmates who came every day to keep me company."},{"sp":"张伟","s":"m","zh":"那时候你一个人在外地，有困难大家当然要帮忙。","py":"Nà shíhou nǐ yí gè rén zài wàidì, yǒu kùnnan dàjiā dāngrán yào bāngmáng.","en":"You were on your own away from home then; of course everyone should help when you're in trouble."},{"sp":"刘芳","s":"f","zh":"这才是真正的友谊。下个月我请大家来聚会，我们重新把大家找回来吧！","py":"Zhè cái shì zhēnzhèng de yǒuyì. Xià gè yuè wǒ qǐng dàjiā lái jùhuì, wǒmen chóngxīn bǎ dàjiā zhǎo huílái ba!","en":"That's true friendship. Next month I'll invite everyone to a get-together — let's get everyone back together!"}]},{"t":"电台节目：朋友是什么 · Radio show: What is a friend?","scene":"A radio host talks with guest Ms Chen about friendship.","g":[2,0],"lines":[{"sp":"记者","s":"m","zh":"陈老师，您觉得什么样的人才是真正的朋友？","py":"Chén lǎoshī, nín juéde shénme yàng de rén cái shì zhēnzhèng de péngyou?","en":"Ms Chen, what kind of person do you think is a true friend?"},{"sp":"陈老师","s":"f","zh":"我觉得朋友就像一面镜子，能让你看清楚自己。","py":"Wǒ juéde péngyou jiù xiàng yí miàn jìngzi, néng ràng nǐ kàn qīngchu zìjǐ.","en":"I think a friend is like a mirror that lets you see yourself clearly."},{"sp":"记者","s":"m","zh":"但是现在很多人周围朋友很多，却常常觉得没有人理解自己。","py":"Dànshì xiànzài hěn duō rén zhōuwéi péngyou hěn duō, què chángcháng juéde méiyǒu rén lǐjiě zìjǐ.","en":"But many people today have lots of friends around them, yet often feel no one understands them."},{"sp":"陈老师","s":"f","zh":"是的。一般的朋友只会陪你玩儿，而真正的朋友会在你需要的时候及时出现。","py":"Shì de. Yìbān de péngyou zhǐ huì péi nǐ wánr, ér zhēnzhèng de péngyou huì zài nǐ xūyào de shíhou jíshí chūxiàn.","en":"Yes. Ordinary friends just have fun with you, whereas true friends turn up in time when you need them."},{"sp":"记者","s":"m","zh":"那我们应该怎么让友谊变得更深呢？","py":"Nà wǒmen yīnggāi zěnme ràng yǒuyì biàn de gèng shēn ne?","en":"So how should we deepen a friendship?"},{"sp":"陈老师","s":"f","zh":"多交流。尽管大家都很忙，也要专门找时间聊聊天。朋友能丰富我们的生活，花这些时间很有意义。","py":"Duō jiāoliú. Jǐnguǎn dàjiā dōu hěn máng, yě yào zhuānmén zhǎo shíjiān liáoliao tiān. Péngyou néng fēngfù wǒmen de shēnghuó, huā zhèxiē shíjiān hěn yǒu yìyì.","en":"Communicate more. Even though everyone's busy, make time specially to chat. Friends enrich our lives; spending that time is meaningful."}]},{"t":"无聊的周末 · A boring weekend","scene":"Zhang Wei phones Lin Xiaoyu on a dull Saturday afternoon.","g":[2,3],"lines":[{"sp":"张伟","s":"m","zh":"小雨，你在干什么呢？我一个人在家，无聊死了。","py":"Xiǎoyǔ, nǐ zài gàn shénme ne? Wǒ yí gè rén zài jiā, wúliáo sǐ le.","en":"Xiaoyu, what are you up to? I'm home alone and bored to death."},{"sp":"林小雨","s":"f","zh":"我在家看书呢。你不是最讨厌一个人过周末吗？","py":"Wǒ zài jiā kàn shū ne. Nǐ bú shì zuì tǎoyàn yí gè rén guò zhōumò ma?","en":"I'm reading at home. Don't you hate spending weekends alone most of all?"},{"sp":"张伟","s":"m","zh":"对啊。你喜欢安静，而我一安静下来就不舒服。要不要出来逛逛？","py":"Duì a. Nǐ xǐhuan ānjìng, ér wǒ yì ānjìng xiàlái jiù bù shūfu. Yào bu yào chūlái guàngguang?","en":"Right. You like peace and quiet, while I feel awful the moment things go quiet. Want to come out for a wander?"},{"sp":"林小雨","s":"f","zh":"好吧，当我看完这一章的时候就出门，你在公园门口等我。","py":"Hǎo ba, dāng wǒ kànwán zhè yì zhāng de shíhou jiù chūmén, nǐ zài gōngyuán ménkǒu děng wǒ.","en":"OK, I'll head out once I finish this chapter; wait for me at the park gate."},{"sp":"张伟","s":"m","zh":"没问题！我再给马克打个电话，看他有没有空。","py":"Méi wèntí! Wǒ zài gěi Mǎkè dǎ gè diànhuà, kàn tā yǒu méiyǒu kòng.","en":"No problem! I'll call Mark too and see if he's free."}]}]},{"n":3,"cn":"经理对我印象不错","en":"I've made a good impression on the manager","vocab":[{"w":"挺","p":"tǐng","pos":"adv.","d":"quite, rather"},{"w":"紧张","p":"jǐnzhāng","pos":"adj.","d":"nervous"},{"w":"信心","p":"xìnxīn","pos":"n.","d":"confidence"},{"w":"能力","p":"nénglì","pos":"n.","d":"ability, competence"},{"w":"招聘","p":"zhāopìn","pos":"v.","d":"to recruit"},{"w":"提供","p":"tígōng","pos":"v.","d":"to provide"},{"w":"负责","p":"fùzé","pos":"v.","d":"to be in charge of"},{"w":"本来","p":"běnlái","pos":"adv.","d":"originally, at first"},{"w":"应聘","p":"yìngpìn","pos":"v.","d":"to apply for a job"},{"w":"材料","p":"cáiliào","pos":"n.","d":"data, material"},{"w":"符合","p":"fúhé","pos":"v.","d":"to accord with"},{"w":"通知","p":"tōngzhī","pos":"v.","d":"to inform"},{"w":"律师","p":"lǜshī","pos":"n.","d":"lawyer"},{"w":"专业","p":"zhuānyè","pos":"n.","d":"major, specialty"},{"w":"另外","p":"lìngwài","pos":"conj.","d":"besides, in addition"},{"w":"收入","p":"shōurù","pos":"n.","d":"income"},{"w":"咱们","p":"zánmen","pos":"pron.","d":"we, us"},{"w":"安排","p":"ānpái","pos":"v.","d":"to arrange"},{"w":"首先","p":"shǒuxiān","pos":"adv.","d":"first"},{"w":"正式","p":"zhèngshì","pos":"adj.","d":"formal"},{"w":"留","p":"liú","pos":"v.","d":"to leave"},{"w":"其次","p":"qícì","pos":"adv.","d":"second, next"},{"w":"诚实","p":"chéngshí","pos":"adj.","d":"honest"},{"w":"改变","p":"gǎibiàn","pos":"v.","d":"to change"},{"w":"感觉","p":"gǎnjué","pos":"n.","d":"feeling"},{"w":"判断","p":"pànduàn","pos":"v.","d":"to judge, to decide"},{"w":"顾客","p":"gùkè","pos":"n.","d":"customer, client"},{"w":"准时","p":"zhǔnshí","pos":"adj.","d":"punctual, on time"},{"w":"不管","p":"bùguǎn","pos":"conj.","d":"no matter (what, how, etc.)"},{"w":"与","p":"yǔ","pos":"prep.","d":"with"},{"w":"约会","p":"yuēhuì","pos":"v.","d":"to date, to go to an appointment"}],"proper":"马 (Mǎ), 小雨 (Xiǎoyǔ)","grammar":[{"t":"挺……的 — quite, rather","m":"挺 is a colloquial degree adverb meaning 'quite/pretty', weaker than 很 or 非常 in feeling but very common in speech. It goes before adjectives and psychological verbs (喜欢, 想), and the sentence often ends with 的: 挺好的, 挺喜欢的. It is rarely used in formal writing.","ex":[["这个房间挺大的，住三个人没问题。","This room is pretty big; three people can live here no problem."],["我挺喜欢这个城市的，就是冬天太冷了。","I quite like this city; it's just that winter is too cold."],["你做的菜挺好吃的。","The food you cooked is pretty tasty."]]},{"t":"本来 — originally, at first (vs 原来)","m":"本来 means 'at first / originally', describing a plan or situation that later changed: 我本来想……，但是……. It can also mean 'of course, as it should be' (本来就应该). It goes before the verb or before the subject. Compared with 原来, 本来 cannot express suddenly discovering the truth ('so it turns out…').","ex":[["我本来打算坐火车去，后来改坐飞机了。","I'd originally planned to go by train, but later switched to flying."],["他本来不爱运动，结婚以后却每天跑步。","He used to dislike exercise, but since marrying he runs every day."],["这件事本来就是你的错，你应该说对不起。","This was your fault in the first place; you should say sorry."]]},{"t":"不管……都/也…… — no matter …, (still) …","m":"不管 introduces a set of possibilities (a question word such as 什么/谁/怎么/多, an A不A choice, or 还是 alternatives); the main clause with 都 or 也 says the result is the same in every case. The part after 不管 cannot be a plain statement: say 不管天气好不好, not 不管天气好.","ex":[["不管你什么时候来，我都欢迎。","Whenever you come, you're welcome."],["不管工作多忙，她每天都给女儿讲故事。","No matter how busy work is, she tells her daughter a story every day."],["不管明天下不下雨，比赛也会在八点开始。","Whether or not it rains tomorrow, the match will start at eight."]]},{"t":"首先……其次…… — first …, second …","m":"Used to list reasons, steps or requirements in order, typical of formal speech or writing. 首先 introduces the first and most important item, 其次 the next one; further items can follow with 另外 or 最后. Both words usually stand at the head of their clause.","ex":[["学好汉语，首先要多听多说，其次要每天复习。","To learn Chinese well, first listen and speak a lot; second, review every day."],["选房子时，首先要看离公司远不远，其次要看贵不贵。","When choosing a flat, first check how far it is from work, then whether it's expensive."],["首先，我要谢谢大家的帮助；其次，我想介绍一下下个月的安排。","First, I want to thank everyone for their help; second, I'd like to introduce next month's arrangements."]]}],"ex":{"judge":[{"s":"我们公司正在招聘一名律师，要求是法律专业毕业，工作三年以上。有兴趣的人可以把材料发到公司的电子邮箱。","st":"★ 这家公司在找律师。","a":true,"en":"Our company is recruiting a lawyer: a law graduate who has worked at least three years. Anyone interested can email their materials to the company. / ★ The company is looking for a lawyer."},{"s":"昨天我去应聘的时候特别紧张，回答问题时声音都变了。但是经理好像对我印象挺好的，让我回家等通知。","st":"★ 说话人应聘时一点儿也不紧张。","a":false,"en":"When I went for the job interview yesterday I was so nervous my voice changed when answering. But the manager seemed to have a pretty good impression of me and told me to wait for notice at home. / ★ The speaker wasn't nervous at all."},{"s":"小马本来想当老师，但是大学毕业后，他发现自己更喜欢跟顾客聊天，所以就去了一家商店工作。","st":"★ 小马现在是老师。","a":false,"en":"Xiao Ma originally wanted to be a teacher, but after graduating he found he preferred chatting with customers, so he went to work in a shop. / ★ Xiao Ma is a teacher now."},{"s":"找工作的时候，收入当然重要，但是我觉得，工作是不是符合自己的兴趣更重要。","st":"★ 说话人认为工作要符合自己的兴趣。","a":true,"en":"When job hunting, income matters of course, but I think whether the job fits your interests matters more. / ★ The speaker thinks a job should match one's interests."},{"s":"王经理对公司里的人要求很高。不管是开会还是见顾客，他都要求大家必须准时，从来不能迟到。","st":"★ 王经理要求大家准时。","a":true,"en":"Manager Wang has high standards for his staff. Whether it's a meeting or meeting a client, everyone must be punctual and never late. / ★ Manager Wang requires punctuality."}],"listen":[{"dlg":["男：明天就要去应聘了，你准备得怎么样了？","女：材料都准备好了，就是心里有点儿紧张。"],"q":"女的现在感觉怎么样？","opts":["有点儿紧张","很高兴","很生气"],"a":0,"en":"M: The interview's tomorrow — how's your preparation? F: My documents are ready; I'm just a bit nervous."},{"dlg":["女：这份工作收入挺高的，你为什么不去？","男：要经常去外地，我想多陪陪家人。"],"q":"男的为什么不去这份工作？","opts":["收入太低","要经常去外地","离家太远"],"a":1,"en":"F: That job pays pretty well — why aren't you taking it? M: It means going out of town a lot; I want to spend more time with my family."},{"dlg":["男：你好，请问你们公司提供住的地方吗？","女：提供，公司附近有宿舍，两个人一个房间。"],"q":"关于这家公司，可以知道什么？","opts":["不提供宿舍","一个人一个房间","有宿舍"],"a":2,"en":"M: Hello, does your company provide accommodation? F: Yes, there are dorms near the company, two people to a room."},{"dlg":["女：晚上咱们去看电影吧？","男：不行，我约了一个顾客谈事情，你跟小雨去吧。"],"q":"男的晚上要做什么？","opts":["跟顾客见面","看电影","加班写材料"],"a":0,"en":"F: Shall we see a film tonight? M: Can't, I've arranged to meet a client to talk business; go with Xiaoyu."},{"dlg":["男：听说那家公司要你了？","女：是啊，公司刚通知我下星期一正式上班。","男：太好了！你负责什么工作？","女：主要负责跟顾客联系。"],"q":"女的什么时候开始上班？","opts":["今天","下星期一","下个月"],"a":1,"en":"M: I hear that company has taken you on? F: Yes, the company just told me I officially start next Monday. M: Great! What will you be responsible for? F: Mainly contacting customers."}],"match":[{"q":"你这么紧张干什么？","r":"一会儿要去见经理，我怕说错话。"},{"q":"经理，我的材料放在哪儿？","r":"先放在我桌子上吧。"},{"q":"你对这次应聘有信心吗？","r":"挺有信心的，我准备了很长时间。"},{"q":"王经理不在，你要给他留个话吗？","r":"好的，请告诉他我下午再打来。"},{"q":"你学的是什么专业？","r":"我是学法律的。"}],"fill":[{"s":"跟顾客打电话的时候一定要（  ），不能说假话。","a":"诚实","en":"When phoning customers you must be honest and never lie."},{"s":"他的汉语水平很高，有（  ）做好这个工作。","a":"能力","en":"His Chinese is very good; he has the ability to do this job well."},{"s":"这个城市这几年（  ）很大，多了很多新楼。","a":"改变","en":"This city has changed a lot in recent years; there are lots of new buildings."},{"s":"这家饭馆的服务很好，所以（  ）特别多。","a":"顾客","en":"This restaurant's service is great, so it has lots of customers."},{"s":"只看一个人长得怎么样，很难（  ）他是不是好人。","a":"判断","en":"It's hard to judge whether someone is a good person from their looks alone."},{"s":"A：明天的会几点开始？  B：九点，请大家（  ）到，不要迟到。","a":"准时","en":"A: What time does tomorrow's meeting start? B: Nine; please arrive on time, don't be late."},{"s":"A：你一个人能准备好这么多菜吗？  B：没问题，（  ）我妈妈也会来帮忙。","a":"另外","en":"A: Can you prepare so many dishes alone? B: No problem; besides, my mum will come and help."},{"s":"A：这次旅游谁（  ）订酒店？  B：小张，他对那个城市最熟悉。","a":"负责","en":"A: Who's in charge of booking the hotel this trip? B: Xiao Zhang; he knows that city best."},{"s":"A：经理，我下个星期想请两天假。  B：可以，你先把工作（  ）好。","a":"安排","en":"A: Manager, I'd like two days off next week. B: Fine; arrange your work properly first."},{"s":"A：你觉得这个人怎么样？  B：我（  ）他不太诚实，说的话前后不一样。","a":"感觉","en":"A: What do you think of this person? B: I feel he's not very honest; what he says doesn't add up."}],"grammar":[{"q":"这本书（  ）有意思的，你也看看吧。","opts":["挺","本来","不管","首先"],"a":0,"exp":"挺……的 = 'quite …' before an adjective phrase.","g":0},{"q":"我（  ）想去爬山，但是下雨了，就在家看电视了。","opts":["挺","首先","本来","不管"],"a":2,"exp":"本来 marks the original plan that was later changed.","g":1},{"q":"（  ）遇到什么问题，你都可以给我打电话。","opts":["尽管","不管","即使","虽然"],"a":1,"exp":"不管 + question word (什么) …… 都 = no matter what.","g":2},{"q":"要找到好工作，（  ）要有能力，其次要有信心。","opts":["首先","本来","挺","另外"],"a":0,"exp":"首先 pairs with 其次 to list points in order.","g":3},{"q":"不管你同意（  ），我都要去试一试。","opts":["了","不同意","吗","过"],"a":1,"exp":"After 不管 you need alternatives such as an A不A form: 同意不同意.","g":2},{"q":"首先，这个房子离公司很近；（  ），房租也不贵。","opts":["本来","挺","不管","其次"],"a":3,"exp":"其次 introduces the second item after 首先.","g":3}],"order":[{"parts":["不管你选择什么专业，","最重要的是","自己喜欢。"],"en":"Whatever major you choose, the most important thing is that you like it."},{"parts":["他本来是学法律的，","毕业以后却当了老师，","大家都觉得很奇怪。"],"en":"He studied law, but became a teacher after graduating, which everyone found strange."},{"parts":["首先请大家介绍一下自己，","其次说说为什么来应聘，","每个人五分钟。"],"en":"First please introduce yourselves, then say why you're applying — five minutes each."},{"parts":["这家公司的收入挺高的，","另外还提供住的地方，","所以很多人去应聘。"],"en":"This company pays pretty well and provides accommodation too, so lots of people apply."}],"reading":[{"p":"应聘的时候，很多人会非常紧张，担心自己说错话。其实，经理更想知道的是你诚实不诚实、有没有信心。所以应聘时不用说得特别好，最重要的是说真话。","q":"★ 根据这段话，应聘时最重要的是：","opts":["说真话","穿漂亮的衣服","说得特别好"],"a":0,"en":"In interviews many people get very nervous and worry about saying the wrong thing. Actually, managers care more about honesty and confidence. So you needn't speak perfectly; the most important thing is to tell the truth."},{"p":"小雨上个月去一家公司应聘。她的专业正好符合公司的要求，跟经理见面的时候也回答得很好。昨天公司通知她，下个月一号正式上班。","q":"★ 根据这段话，可以知道小雨：","opts":["没有被公司选上","下个月开始上班","专业不符合要求"],"a":1,"en":"Last month Xiaoyu applied to a company. Her major happened to fit their requirements and she answered well in the interview. Yesterday the company told her she officially starts on the first of next month."},{"p":"我们是一家旅游公司，现在要招聘两个人。要求：首先，性格热情，喜欢跟人交流；其次，会说英语。我们提供不错的收入，有兴趣的人请在本周五以前把材料送到公司。","q":"★ 这家公司对应聘的人的要求是：","opts":["做过律师","必须是法律专业","会说英语"],"a":2,"en":"We're a travel company recruiting two people. Requirements: first, a warm personality and enjoying communicating with people; second, spoken English. We offer good pay; those interested please bring materials to the company before this Friday."},{"p":"刘芳和男朋友约好晚上七点在饭馆见面，但是她因为加班，七点半才到。男朋友有点儿不高兴，说不管有什么事，都应该早点儿告诉他。刘芳觉得他说得对，马上跟他说了对不起。","q":"★ 男朋友为什么不高兴？","opts":["刘芳没有准时到","饭馆的菜不好吃","刘芳忘了约会"],"a":0,"en":"Liu Fang arranged to meet her boyfriend at the restaurant at seven, but because of overtime she arrived at half past. He was a bit upset and said that whatever happens, she should tell him early. She agreed and said sorry at once."}],"write":[{"words":["他的能力","很","符合","我们的要求。"],"en":"His abilities match our requirements well."},{"words":["请","在这儿","留下","你的电话。"],"en":"Please leave your phone number here."},{"words":["我","对自己","很有","信心。"],"en":"I have a lot of confidence in myself."},{"words":["公司","为大家","提供","住的地方。"],"en":"The company provides accommodation for everyone."},{"words":["咱们","明天","早上八点","在公司见吧。"]," month's arrangements. M: He's out; leave your number and I'll have him call you back."},{"dlg":["男：这个周末咱们去哪儿玩儿？","女：我想去海边，你觉得怎么样？","男：天气预报说周末有雨。","女：那不管下不下雨，都先把酒店订好吧，到时候再决定。"],"q":"女的说先做什么？","opts":["去海边","订酒店","看天气预报"],"a":1,"en":"M: Where shall we go this weekend? F: I'd like to go to the seaside, what do you think? M: The forecast says rain at the weekend. F: Then whether it rains or not, let's book the hotel first and decide later."}],"fill":[{"s":"考试以前多做练习，可以让你对自己更有（  ）。","a":"信心","en":"Doing more practice before an exam can give you more confidence."},{"s":"这份工作要求应聘的人是法律（  ）毕业的。","a":"专业","en":"This job requires applicants to be law graduates."},{"s":"你写的这些（  ）还不够，还要再找一些。","a":"材料","en":"The materials you've written aren't enough; you need to find some more."},{"s":"A：你去见他的时候，紧张吗？  B：有点儿，那是我们第一次（  ）。","a":"约会","en":"A: Were you nervous meeting him? B: A bit; it was our first date."},{"s":"A：这家公司的（  ）怎么样？  B：一个月八千多，挺不错的。","a":"收入","en":"A: How's the income at this company? B: Over 8,000 a month, pretty good."},{"s":"A：这个问题谁也解决不了，怎么办？  B：别着急，我们可以请（  ）帮忙。","a":"律师","en":"A: Nobody can solve this problem — what do we do? B: Don't worry, we can get a lawyer to help."}],"grammar":[{"q":"这家饭馆的菜（  ）便宜的，而且很好吃。","opts":["不管","首先","本来","挺"],"a":3,"exp":"挺……的 = 'quite …'.","g":0},{"q":"（  ）多晚回家，他都会先给妈妈打个电话。","opts":["不管","尽管","本来","首先"],"a":0,"exp":"不管 + 多 + adj …… 都 : no matter how late.","g":2},{"q":"我（  ）不认识他，是朋友给我们介绍的。","opts":["挺","本来","首先","不管"],"a":1,"exp":"本来 = at first (before something changed).","g":1},{"q":"这次旅游是这样安排的：（  ）去北京，其次去上海。","opts":["挺","不管","首先","本来"],"a":2,"exp":"首先……其次 lists steps in order.","g":3},{"q":"不管是谁，（  ）要准时来上班。","opts":["才","都","却","而"],"a":1,"exp":"不管 is answered by 都 in the main clause.","g":2},{"q":"这件事（  ）就是你负责的，你怎么能不管呢？","opts":["本来","首先","挺","其次"],"a":0,"exp":"本来就 = 'in the first place, as a matter of course'.","g":1}],"order":[{"parts":["我本来不想去参加聚会，","但是朋友一直打电话，","最后还是去了。"],"en":"I hadn't wanted to go to the party, but my friend kept calling, so in the end I went."},{"parts":["首先你要了解顾客需要什么，","其次要让顾客相信你，","这样才能把东西卖出去。"],"en":"First understand what customers need, then make them trust you — that's how you get things sold."},{"parts":["不管遇到什么困难，","我们都要对自己","有信心。"],"en":"Whatever difficulties we meet, we should have confidence in ourselves."}],"reading":[{"p":"很多人觉得律师的收入很高，所以想学法律专业。但是陈老师说，当律师不仅要有能力，而且工作非常累，经常要工作到很晚。如果只是为了钱，最好不要选这个专业。","q":"★ 陈老师认为：","opts":["律师的工作很简单","不应该只为了钱学法律","律师的收入不高"],"a":1,"en":"Many people think lawyers earn a lot, so they want to study law. But Ms Chen says being a lawyer needs ability and is very hard work, often late into the night. If it's just for money, better not choose this major."},{"p":"王经理说，判断一个人能不能做好工作，首先要看他是不是准时。一个人连上班都经常迟到，很难相信他能把工作做好。其次要看他是不是诚实。","q":"★ 王经理首先看的是：","opts":["准时不准时","诚实不诚实","专业是什么"],"a":0,"en":"Manager Wang says that to judge whether someone can do a job well, first look at whether they're punctual. If someone is often late even for work, it's hard to believe they'll do the job well. Second, see if they're honest."},{"p":"马克毕业以后本来打算回国工作，后来一家中国公司给他提供了一个很好的机会。他觉得在中国工作可以让他的汉语更好，所以就留了下来。","q":"★ 马克为什么留在了中国？","opts":["他的女朋友在中国","他不想回国","他得到了一个好机会"],"a":2,"en":"After graduating Mark had planned to go home to work, but then a Chinese company offered him a great opportunity. He thought working in China would improve his Chinese, so he stayed."}],"write":[{"words":["这件事","我们","得","重新安排。"],"en":"We'll have to rearrange this."},{"words":["我","感觉","他","挺紧张的。"],"en":"I feel he's quite nervous."},{"words":["公司","已经","正式","通知我了。"],"en":"The company has officially notified me."},{"words":["你","能不能","改变一下","你的安排？"],"en":"Can you change your arrangements a bit?"}],"hanzi":[{"s":"我下午要去一家公司应（  ）。","py":"pìn","a":"聘"},{"s":"他的专业很符（  ）我们的要求。","py":"hé","a":"合"},{"s":"这个问题很难判（  ）。","py":"duàn","a":"断"},{"s":"我现在的收（  ）不太高。","py":"rù","a":"入"}]},"tx":[{"t":"应聘以前 · Before the interview","scene":"Lin Xiaoyu chats nervously with Zhang Wei outside a company's office before her interview.","g":[0,1],"lines":[{"sp":"张伟","s":"m","zh":"小雨，你脸色不太好，是不是有点儿紧张？","py":"Xiǎoyǔ, nǐ liǎnsè bú tài hǎo, shì bu shì yǒudiǎnr jǐnzhāng?","en":"Xiaoyu, you look pale — a bit nervous?"},{"sp":"林小雨","s":"f","zh":"挺紧张的。这家公司招聘的人很少，来应聘的人却有一百多个。","py":"Tǐng jǐnzhāng de. Zhè jiā gōngsī zhāopìn de rén hěn shǎo, lái yìngpìn de rén què yǒu yìbǎi duō gè.","en":"Pretty nervous. This company is hiring very few people, yet over a hundred have applied."},{"sp":"张伟","s":"m","zh":"你的能力这么强，应该对自己有信心。","py":"Nǐ de nénglì zhème qiáng, yīnggāi duì zìjǐ yǒu xìnxīn.","en":"You're so capable — you should have confidence in yourself."},{"sp":"林小雨","s":"f","zh":"我本来觉得没问题，但是看到别人的材料都准备得那么好，我就有点儿担心了。","py":"Wǒ běnlái juéde méi wèntí, dànshì kàndào biérén de cáiliào dōu zhǔnbèi de nàme hǎo, wǒ jiù yǒudiǎnr dānxīn le.","en":"At first I thought it'd be fine, but seeing how well everyone else prepared their materials, I'm a bit worried."},{"sp":"张伟","s":"m","zh":"你的专业很符合他们的要求，别担心，一会儿说真话就行了。","py":"Nǐ de zhuānyè hěn fúhé tāmen de yāoqiú, bié dānxīn, yíhuìr shuō zhēnhuà jiù xíng le.","en":"Your major fits their requirements perfectly. Don't worry — just tell the truth in a bit."},{"sp":"林小雨","s":"f","zh":"好，谢谢你陪我来。结束以后我请你喝咖啡！","py":"Hǎo, xièxie nǐ péi wǒ lái. Jiéshù yǐhòu wǒ qǐng nǐ hē kāfēi!","en":"OK, thanks for coming with me. Coffee's on me after the interview!"}]},{"t":"见经理 · The interview","scene":"Manager Wang interviews Lin Xiaoyu for a customer-service position.","g":[3,2],"lines":[{"sp":"王经理","s":"m","zh":"林小姐，请你先简单介绍一下自己。","py":"Lín xiǎojiě, qǐng nǐ xiān jiǎndān jièshào yíxià zìjǐ.","en":"Ms Lin, please briefly introduce yourself first."},{"sp":"林小雨","s":"f","zh":"好的。我今年刚毕业，大学学的是中文，以前在律师那儿帮过半年忙。","py":"Hǎo de. Wǒ jīnnián gāng bìyè, dàxué xué de shì Zhōngwén, yǐqián zài lǜshī nàr bāngguo bàn nián máng.","en":"Sure. I graduated this year, majored in Chinese, and helped out at a lawyer's office for six months."},{"sp":"王经理","s":"m","zh":"这个工作主要负责跟顾客联系。你觉得自己为什么适合这个工作？","py":"Zhège gōngzuò zhǔyào fùzé gēn gùkè liánxì. Nǐ juéde zìjǐ wèishénme shìhé zhège gōngzuò?","en":"This job is mainly about contacting customers. Why do you think you're suited to this job?"},{"sp":"林小雨","s":"f","zh":"首先，我做事很认真，也很准时；其次，我性格热情，喜欢跟人交流。","py":"Shǒuxiān, wǒ zuò shì hěn rènzhēn, yě hěn zhǔnshí; qícì, wǒ xìnggé rèqíng, xǐhuan gēn rén jiāoliú.","en":"First, I'm careful and punctual; second, I'm outgoing and enjoy communicating with people."},{"sp":"王经理","s":"m","zh":"如果有顾客对你发脾气，你会怎么做？","py":"Rúguǒ yǒu gùkè duì nǐ fā píqi, nǐ huì zěnme zuò?","en":"If a customer loses their temper with you, what would you do?"},{"sp":"林小雨","s":"f","zh":"不管顾客多生气，我都会先认真听他说完，再想办法帮他解决问题。","py":"Bùguǎn gùkè duō shēngqì, wǒ dōu huì xiān rènzhēn tīng tā shuōwán, zài xiǎng bànfǎ bāng tā jiějué wèntí.","en":"However angry the customer is, I'd first listen carefully until they finish, then find a way to solve their problem."},{"sp":"王经理","s":"m","zh":"回答得很好。我们下星期会通知你。","py":"Huídá de hěn hǎo. Wǒmen xià xīngqī huì tōngzhī nǐ.","en":"Good answers. We'll let you know the result next week."}]},{"t":"好事来了 · Good news","scene":"Manager Wang phones Lin Xiaoyu to offer her the job.","g":[0,3],"lines":[{"sp":"王经理","s":"m","zh":"喂，是林小雨吗？我是王经理。我们对你的印象很好，决定请你来工作。","py":"Wèi, shì Lín Xiǎoyǔ ma? Wǒ shì Wáng jīnglǐ. Wǒmen duì nǐ de yìnxiàng hěn hǎo, juédìng qǐng nǐ lái gōngzuò.","en":"Hello, is that Lin Xiaoyu? This is Manager Wang. We were very impressed with you and have decided to offer you the job."},{"sp":"林小雨","s":"f","zh":"真的吗？太谢谢您了！请问我什么时候正式上班？","py":"Zhēn de ma? Tài xièxie nín le! Qǐngwèn wǒ shénme shíhou zhèngshì shàngbān?","en":"Really? Thank you so much! When do I officially start?"},{"sp":"王经理","s":"m","zh":"下个月一号。首先你要来公司填一些表，其次要跟老同事学习一个星期。","py":"Xià gè yuè yī hào. Shǒuxiān nǐ yào lái gōngsī tián yìxiē biǎo, qícì yào gēn lǎo tóngshì xuéxí yí gè xīngqī.","en":"On the first of next month. First you need to come and fill in some forms; then you'll spend a week learning from experienced colleagues."},{"sp":"林小雨","s":"f","zh":"好的。另外，我想问一下，公司提供宿舍吗？","py":"Hǎo de. Lìngwài, wǒ xiǎng wèn yíxià, gōngsī tígōng sùshè ma?","en":"OK. Also, may I ask — does the company provide a dorm?"},{"sp":"王经理","s":"m","zh":"提供，但是要两个人住一个房间。宿舍离公司挺近的，走路十分钟。","py":"Tígōng, dànshì yào liǎng gè rén zhù yí gè fángjiān. Sùshè lí gōngsī tǐng jìn de, zǒulù shí fēnzhōng.","en":"Yes, though it's two to a room. The dorm is pretty close — ten minutes' walk."},{"sp":"林小雨","s":"f","zh":"太好了，那我就不用担心住的问题了。","py":"Tài hǎo le, nà wǒ jiù búyòng dānxīn zhù de wèntí le.","en":"Great, then I needn't worry about accommodation."},{"sp":"王经理","s":"m","zh":"关于收入和其他的安排，我们会发邮件给你。","py":"Guānyú shōurù hé qítā de ānpái, wǒmen huì fā yóujiàn gěi nǐ.","en":"We'll email you about the pay and other arrangements."}]},{"t":"第一次约会 · A first date","scene":"Liu Fang tells Mark about her date and why she judges people by punctuality.","g":[1,2],"lines":[{"sp":"马克","s":"m","zh":"刘芳，昨天的约会怎么样？咱们公司的人都想知道。","py":"Liú Fāng, zuótiān de yuēhuì zěnmeyàng? Zánmen gōngsī de rén dōu xiǎng zhīdào.","en":"Liu Fang, how was yesterday's date? Everyone at our company wants to know."},{"sp":"刘芳","s":"f","zh":"别提了！我们本来约好六点见面，他七点才到。","py":"Bié tí le! Wǒmen běnlái yuēhǎo liù diǎn jiànmiàn, tā qī diǎn cái dào.","en":"Don't ask! We'd agreed to meet at six, and he didn't arrive until seven."},{"sp":"马克","s":"m","zh":"可能他有什么特别的原因吧？你不能只因为这一点就判断他不好。","py":"Kěnéng tā yǒu shénme tèbié de yuányīn ba? Nǐ bù néng zhǐ yīnwèi zhè yì diǎn jiù pànduàn tā bù hǎo.","en":"Maybe he had a special reason? You can't judge him as bad on that alone."},{"sp":"刘芳","s":"f","zh":"他说路上车太多。但是不管什么原因，都应该早点儿打个电话吧？","py":"Tā shuō lù shang chē tài duō. Dànshì bùguǎn shénme yuányīn, dōu yīnggāi zǎo diǎnr dǎ gè diànhuà ba?","en":"He said there was too much traffic. But whatever the reason, he should have phoned earlier, right?"},{"sp":"马克","s":"m","zh":"这倒是。我感觉准时和诚实一样，都很重要。","py":"Zhè dào shì. Wǒ gǎnjué zhǔnshí hé chéngshí yíyàng, dōu hěn zhòngyào.","en":"That's true. I feel punctuality matters just as much as honesty."},{"sp":"刘芳","s":"f","zh":"所以我决定不再与他见面了。我不想为了一个不准时的人改变自己。","py":"Suǒyǐ wǒ juédìng bú zài yǔ tā jiànmiàn le. Wǒ bù xiǎng wèile yí gè bù zhǔnshí de rén gǎibiàn zìjǐ.","en":"So I've decided not to see him again. I don't want to change myself for someone who isn't punctual."},{"sp":"马克","s":"m","zh":"那你给他留个机会，听听他怎么说吧。","py":"Nà nǐ gěi tā liú gè jīhuì, tīngting tā zěnme shuō ba.","en":"Then leave him a chance — hear what he has to say."}]}]},{"n":4,"cn":"不要太着急赚钱","en":"Don't be anxious to make money","vocab":[{"w":"提","p":"tí","pos":"v.","d":"to mention"},{"w":"以为","p":"yǐwéi","pos":"v.","d":"to think, to believe"},{"w":"份","p":"fèn","pos":"m.","d":"used for jobs among other things"},{"w":"完全","p":"wánquán","pos":"adv.","d":"completely"},{"w":"赚","p":"zhuàn","pos":"v.","d":"to earn"},{"w":"调查","p":"diàochá","pos":"v.","d":"to survey, to investigate"},{"w":"原来","p":"yuánlái","pos":"adv.","d":"originally"},{"w":"计划","p":"jìhuà","pos":"n./v.","d":"plan; to intend to"},{"w":"提前","p":"tíqián","pos":"v.","d":"to do (sth.) in advance or ahead of time"},{"w":"保证","p":"bǎozhèng","pos":"v.","d":"to guarantee"},{"w":"提醒","p":"tíxǐng","pos":"v.","d":"to remind"},{"w":"乱","p":"luàn","pos":"adj.","d":"hurry-scurry, confused"},{"w":"生意","p":"shēngyi","pos":"n.","d":"business, trade"},{"w":"谈","p":"tán","pos":"v.","d":"to talk, to discuss"},{"w":"并","p":"bìng","pos":"adv.","d":"used before a negative for emphasis"},{"w":"积累","p":"jīlěi","pos":"v.","d":"to accumulate"},{"w":"经验","p":"jīngyàn","pos":"n.","d":"experience"},{"w":"一切","p":"yīqiè","pos":"pron.","d":"all, every"},{"w":"按照","p":"ànzhào","pos":"prep.","d":"according to"},{"w":"成功","p":"chénggōng","pos":"adj.","d":"successful"},{"w":"顺利","p":"shùnlì","pos":"adj.","d":"smooth"},{"w":"感谢","p":"gǎnxiè","pos":"v.","d":"to thank"},{"w":"消息","p":"xiāoxi","pos":"n.","d":"news"},{"w":"按时","p":"ànshí","pos":"adv.","d":"on time, on schedule"},{"w":"奖金","p":"jiǎngjīn","pos":"n.","d":"money award, bonus"},{"w":"工资","p":"gōngzī","pos":"n.","d":"pay, salary"},{"w":"方法","p":"fāngfǎ","pos":"n.","d":"method, way"},{"w":"知识","p":"zhīshi","pos":"n.","d":"knowledge"},{"w":"不得不","p":"bùdébù","pos":"adv.","d":"to have to, to have no choice but"},{"w":"甚至","p":"shènzhì","pos":"conj.","d":"even, so far as to"},{"w":"责任","p":"zérèn","pos":"n.","d":"responsibility, duty"}],"proper":"王 (Wáng)","grammar":[{"t":"以为 — to (mistakenly) think","m":"以为 means 'to think/assume', and in everyday speech it very often signals that the belief turned out to be wrong: 我以为……，原来/其实…… . By contrast, 认为 states a considered opinion or judgement that the speaker still holds, and is not used for mistaken assumptions.","ex":[["我以为今天是星期五，原来才星期四。","I thought today was Friday, but it turns out it's only Thursday."],["大家都以为他是老师，其实他是学生。","Everyone assumed he was a teacher; actually he's a student."],["我还以为你不来了呢！","I thought you weren't coming!"]]},{"t":"并 + 不/没(有) — not at all, actually not","m":"并 is placed before 不 or 没(有) to strengthen the negation, usually to deny or correct what someone thinks or expects: 'it isn't actually so'. It often follows a clause stating the common belief, or appears with 其实. 并 cannot be used before an affirmative verb in this sense.","ex":[["这个问题并不难，你别担心。","This question isn't hard at all — don't worry."],["他嘴上说同意，心里并没有同意。","He said he agreed, but in his heart he didn't actually agree."],["很多人觉得这儿的冬天很冷，其实并不冷。","Many people think winter here is cold, but in fact it isn't."]]},{"t":"甚至 — even, so much as","m":"甚至 introduces the most extreme or surprising item in a series, going one step further than what came before. It can stand before a verb phrase, a noun or a whole clause, and is often followed by 都/也 (甚至连……都……). It typically comes at the end of a list or a second clause.","ex":[["他太忙了，有时候甚至忘了吃饭。","He's so busy that sometimes he even forgets to eat."],["这首歌大家都很喜欢，老人甚至孩子都会唱。","Everyone loves this song — the elderly and even children can sing it."],["她学习非常努力，周末甚至过年都在看书。","She studies very hard, reading at weekends and even at New Year."]]},{"t":"不得不 — to have no choice but to","m":"不得不 + verb means 'have to (against one's wishes)', stressing that circumstances force the action. It is stronger and more reluctant than 得 (děi) or 只好, and is often preceded by a reason clause with 因为 or a situation that leaves no alternative.","ex":[["飞机晚点了，我们不得不在机场等了五个小时。","The flight was delayed, so we had to wait at the airport for five hours."],["下雨了，比赛不得不停下来。","It started raining, so the match had to stop."],["钱包丢了，他不得不给爸爸打电话借钱。","He lost his wallet, so he had no choice but to call his dad to borrow money."]]}],"ex":{"judge":[{"s":"很多大学生毕业后，都希望马上找到一份收入高的工作。其实，刚开始工作时，积累经验比赚钱更重要。","st":"★ 说话人认为刚工作时赚钱最重要。","a":false,"en":"Many graduates hope to find a well-paid job straight away. Actually, when you start working, building experience matters more than making money. / ★ The speaker thinks earning money matters most at first."},{"s":"我本来以为这次考试很难，没想到考题并不难，我只用了一个小时就做完了。","st":"★ 这次考试比说话人想的容易。","a":true,"en":"I'd thought this exam would be hard, but the questions weren't hard at all; I finished in just an hour. / ★ The exam was easier than the speaker expected."},{"s":"王经理做事很有计划，每次去外地前都会提前一个星期把一切安排好，所以他的工作总是很顺利。","st":"★ 王经理去外地前不做准备。","a":false,"en":"Manager Wang is very organised; before every business trip he arranges everything a week ahead, so his work always goes smoothly. / ★ Manager Wang doesn't prepare before trips."},{"s":"这个月我们公司的生意特别好，经理说大家都很努力，每个人都可以多拿一千块奖金。","st":"★ 这个月大家都有奖金。","a":true,"en":"Our company did great business this month; the manager said everyone had worked hard and each person gets an extra 1,000 yuan bonus. / ★ Everyone gets a bonus this month."},{"s":"小张的房间特别乱，衣服、书放得哪儿都是。他妈妈每天都提醒他打扫，但是他总说没时间。","st":"★ 小张的房间很干净。","a":false,"en":"Xiao Zhang's room is a real mess, with clothes and books everywhere. His mum reminds him daily to clean it, but he always says he has no time. / ★ Xiao Zhang's room is clean."}],"listen":[{"dlg":["女：你怎么又换工作了？以前那份工资不是挺高的吗？","男：工资是不错，但是我在那儿学不到新的知识。"],"q":"男的为什么换工作？","opts":["工资太低","学不到知识","离家太远"],"a":1,"en":"F: Why have you changed jobs again? Wasn't the last one well paid? M: The pay was good, but I couldn't learn anything new there."},{"dlg":["男：你听说了吗？小林的公司要让她去国外工作。","女：真的吗？这个消息我还是第一次听说。"],"q":"女的是什么意思？","opts":["她早就知道了","她不相信","她刚知道这个消息"],"a":2,"en":"M: Have you heard? Xiao Lin's company is sending her abroad. F: Really? This is the first I've heard of it."},{"dlg":["女：明天的会你能保证准时到吗？","男：放心吧，我一定按时到，不会迟到的。"],"q":"男的明天会怎么样？","opts":["按时到","晚一点儿到","不去开会"],"a":0,"en":"F: Can you guarantee you'll be on time for tomorrow's meeting? M: Don't worry, I'll definitely be on time."},{"dlg":["男：这次调查做得怎么样？","女：挺顺利的，我们按照计划问了五百个人。"],"q":"关于这次调查，可以知道什么？","opts":["不太顺利","问了五百个人","还没开始"],"a":1,"en":"M: How did the survey go? F: Pretty smoothly; we asked five hundred people as planned."},{"dlg":["女：你做生意这么成功，有什么好方法吗？","男：哪有什么方法，就是诚实，对顾客负责。","女：就这么简单？","男：对，说起来简单，做起来并不容易。"],"q":"男的认为做生意要：","opts":["多赚钱","对顾客负责","多认识朋友"],"a":1,"en":"F: You're so successful in business — any tips? M: No real tips; just be honest and responsible to customers. F: That simple? M: Yes — easy to say, but not at all easy to do."}],"match":[{"q":"谢谢你昨天帮我搬家。","r":"不用谢，我们是好朋友嘛。"},{"q":"你别忘了明天上午九点开会。","r":"谢谢你提醒我，我差点儿忘了。"},{"q":"你怎么才来？大家都等你半天了。","r":"对不起，路上车太多了。"},{"q":"你的房间怎么这么乱？","r":"这几天太忙了，没时间打扫。"},{"q":"听说你下个月要结婚了？","r":"是啊，到时候请你来参加。"}],"fill":[{"s":"这家公司的（  ）每个月十号发，从来没有晚过。","a":"工资","en":"This company pays salaries on the 10th of every month and has never been late."},{"s":"他找到了一（  ）新工作，离家很近。","a":"份","en":"He found a new job close to home."},{"s":"多读书可以让我们学到很多（  ）。","a":"知识","en":"Reading more lets us learn a lot of knowledge."},{"s":"做父母的都有（  ）照顾好自己的孩子。","a":"责任","en":"All parents have a responsibility to take good care of their children."},{"s":"为了了解大学生的生活习惯，我们做了一次（  ）。","a":"调查","en":"To understand university students' habits, we did a survey."},{"s":"A：你怎么知道这件事的？  B：我也是刚听到这个（  ），还不知道是不是真的。","a":"消息","en":"A:
