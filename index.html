/* ----- texts (课文: original dialogues) ----- */
function texts(n, which){
  const c = CH[n]; setTitle(`第${n}课 课文`, true);
  const tx = c.tx || [];
  S.set.tx ??= {py: true, en: false, hl: true};
  const o = S.set.tx;
  const wordsByLen = c.vocab.map(v => v.w).filter(w => !/\.\.\.|…/.test(w)).sort((a, b) => b.length - a.length);
  const vmap = Object.fromEntries(c.vocab.map(v => [v.w, v]));
  const mark = zh => {
    let s = esc(zh); if (!o.hl || !wordsByLen.length) return s;
    const re = new RegExp(wordsByLen.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|'), 'g');
    return s.replace(re, m => `<span class="nw" data-w="${esc(m)}">${m}</span>`);
  };
  if (!tx.length){ $('#app').innerHTML = tabs(n, 'texts') + `<div class="card muted">课文 texts for this lesson aren't available yet.</div>`; return; }
  const sel = which != null && tx[+which] ? [+which] : tx.map((_, i) => i);
  $('#app').innerHTML = tabs(n, 'texts') + `
    <div class="card small muted" style="padding:10px 14px">Original practice dialogues using this lesson's words and grammar (not the textbook's own 课文). <span style="color:var(--amber)">Underlined</span> = new word — tap for its meaning.</div>
    <div class="row" style="margin-bottom:12px">
      <label class="small"><input type="checkbox" id="opy" ${o.py ? 'checked' : ''}> 拼音 Pinyin</label>
      <label class="small"><input type="checkbox" id="oen" ${o.en ? 'checked' : ''}> English</label>
      <label class="small"><input type="checkbox" id="ohl" ${o.hl ? 'checked' : ''}> 生词 Highlight new words</label>
    </div>
    ${sel.length < tx.length ? `<div class="row" style="margin-bottom:10px"><a class="btn" style="text-decoration:none" href="#/ch/${n}/texts">‹ 全部课文 All texts</a></div>` : ''}
    ${sel.map(i => { const t = tx[i]; const gp = (t.g || []).map(g => c.grammar[g]).filter(Boolean);
      return `<div class="card" id="tx${i}">
        <div class="txhead"><div><div class="small muted">课文 ${i + 1}</div><h3 class="zh" style="font-size:18px;margin:2px 0 4px">${esc(t.t)}</h3>
          <div class="small muted">${esc(t.scene || '')}</div></div>
          <button class="btn primary" data-play="${i}" style="flex:none">▶ 播放 Play</button></div>
        <div style="margin-top:10px">${t.lines.map((l, j) => `
          <div class="txline" id="tl${i}-${j}">
            <div class="txsp ${l.s} zh">${esc(l.sp)}：</div>
            <div style="flex:1"><div class="txzh zh">${mark(l.zh)}</div>
              <div class="txpy ${o.py ? '' : 'hidden'}">${esc(l.py)}</div>
              <div class="txen ${o.en ? '' : 'hidden'}">${esc(l.en)}</div>
              <div class="nwtip hidden" id="nw${i}-${j}"></div></div>
            ${spk((l.s === 'm' ? '男：' : '女：') + l.zh)}
          </div>`).join('')}</div>
        ${gp.length ? `<div class="small" style="margin-top:10px">语法 Grammar: ${gp.map((g, k) => `<a href="#/ch/${n}/grammar" class="pill">${esc(g.t.split(' — ')[0])}</a>`).join(' ')}</div>` : ''}
      </div>`; }).join('')}
    <div class="row">${n > 1 ? `<a class="btn" href="#/ch/${n-1}/texts">‹ 第${n-1}课</a>` : ''}<span style="flex:1"></span><a class="btn primary" style="text-decoration:none" href="#/ch/${n}/vocab">生词 Vocab ›</a></div>`;
  const re = () => texts(n, which);
  $('#opy').onchange = e => { o.py = e.target.checked; save(); re(); };
  $('#oen').onchange = e => { o.en = e.target.checked; save(); re(); };
  $('#ohl').onchange = e => { o.hl = e.target.checked; save(); re(); };
  document.querySelectorAll('.nw').forEach(w => w.onclick = e => {
    e.stopPropagation(); const v = vmap[w.dataset.w]; const tip = w.closest('.txline').querySelector('.nwtip');
    tip.innerHTML = v ? `<b class="zh">${esc(v.w)}</b> ${esc(v.p)} · ${esc(v.pos)} · ${esc(v.d)}` : ''; tip.classList.remove('hidden'); say(w.dataset.w);
  });
  document.querySelectorAll('[data-play]').forEach(b => b.onclick = () => playText(n, +b.dataset.play, b));
}
function playText(n, i, btn){
  const t = CH[n].tx[i];
  if (!('speechSynthesis' in window)) { alert('Speech is not supported in this browser.'); return; }
  if (btn.dataset.on){ speechSynthesis.cancel(); return; }
  speechSynthesis.cancel();
  document.querySelectorAll('.txline.playing').forEach(x => x.classList.remove('playing'));
  btn.dataset.on = '1'; btn.textContent = '■ 停止 Stop';
  const done = () => { delete btn.dataset.on; btn.textContent = '▶ 播放 Play'; document.querySelectorAll('.txline.playing').forEach(x => x.classList.remove('playing')); };
  t.lines.forEach((l, j) => {
    const u = new SpeechSynthesisUtterance(l.zh);
    u.lang = 'zh-CN'; u.rate = S.set.rate; const g = l.s; const v = pickVoice(g); if (v) u.voice = v;
    if (g === 'm' && v && !/Yunxi|Yunyang|Kangkang|Male|Yunjian/i.test(v.name)) u.pitch = .7;
    if (g === 'f') u.pitch = 1.1;
    u.onstart = () => { document.querySelectorAll('.txline.playing').forEach(x => x.classList.remove('playing')); document.getElementById(`tl${i}-${j}`)?.classList.add('playing'); };
    if (j === t.lines.length - 1){ u.onend = done; }
    u.onerror = done;
    speechSynthesis.speak(u);
  });
}

/* ----- vocab ----- */
function vocab(n, mode){
  const c = CH[n]; setTitle(`第${n}课 生词`, true);
  const sub = `<div class="row" style="margin-bottom:12px">
    ${[['', '列表 List'], ['cards', '卡片 Flashcards'], ['quiz', '测验 Quiz']].map(([k, l]) => `<a class="btn ${ (mode||'') === k ? 'primary' : ''}" style="text-decoration:none" href="#/ch/${n}/vocab${k ? '/' + k : ''}">${l}</a>`).join('')}</div>`;
  if (mode === 'cards') return flashcards(c.vocab.map(v => ({...v, n})), tabs(n, 'vocab') + sub);
  if (mode === 'quiz') return vquiz(n, tabs(n, 'vocab') + sub);
  $('#app').innerHTML = tabs(n, 'vocab') + sub + `<div class="card"><table class="vocab">${c.vocab.map((v, i) => `
    <tr><td class="small muted">${i + 1}</td><td class="w zh">${esc(v.w)}</td><td>${spk(v.w)}</td>
    <td><div class="p">${esc(v.p)}</div><div>${esc(v.d)}</div></td><td class="pos">${esc(v.pos)}</td>
    <td><button class="star ${S.stars[wid(n, v.w)] ? 'on' : ''}" data-star="${esc(wid(n, v.w))}">★</button></td></tr>`).join('')}</table>
    ${c.proper ? `<div class="small muted" style="margin-top:10px">专有名词: <span class="zh">${esc(c.proper)}</span></div>` : ''}</div>`;
  document.querySelectorAll('[data-star]').forEach(b => b.onclick = () => { const k = b.dataset.star; S.stars[k] = !S.stars[k]; if (!S.stars[k]) delete S.stars[k]; save(); b.classList.toggle('on'); });
}

function flashcards(list, head, onDone){
  let deck = shuffle(list), i = 0, flipped = false, known = 0;
  const front = S.set.cardFront || 'hz';
  function draw(){
    if (i >= deck.length){
      $('#app').innerHTML = head + `<div class="card" style="text-align:center"><div class="score">${known}/${deck.length}</div><p>认识 known this round</p>
        <button class="btn primary" id="again">再来一遍 Again</button></div>`;
      $('#again').onclick = () => { deck = shuffle(list); i = 0; known = 0; draw(); }; onDone?.(); return;
    }
    const v = deck[i];
    const hz = `<div class="big zh">${esc(v.w)}</div>`, back = `<div class="py">${esc(v.p)}</div><div class="def">${esc(v.d)}</div><div class="small muted">${esc(v.pos)} · 第${v.n}课</div>`;
    const fr = front === 'hz' ? hz : `<div class="def" style="font-size:24px">${esc(v.d)}</div>`;
    $('#app').innerHTML = head + `
      <div class="row small muted" style="margin-bottom:6px"><span>${i + 1} / ${deck.length}</span><span style="flex:1"></span>
      正面 Front: <select id="front"><option value="hz">汉字</option><option value="en" ${front==='en'?'selected':''}>English</option></select></div>
      <div class="card flash" id="fc">${fr}${flipped ? (front === 'hz' ? back : hz + back) : '<div class="small muted" style="margin-top:14px">tap to flip</div>'}
      <div style="margin-top:12px">${spk(v.w, true)}</div></div>`;
    $('#fc').onclick = e => { if (e.target.closest('[data-say]')) return; flipped = !flipped; if (flipped) say(v.w); draw(); };
    $('#front').onchange = e => { S.set.cardFront = e.target.value; save(); flashcards(list, head, onDone); };
    setBar(flipped ? `<button class="btn" id="no">✗ 不认识 Again</button><button class="btn primary" id="yes">✓ 认识 Know it</button>` : `<button class="btn primary" id="flip">翻转 Flip</button>`);
    if (flipped){ $('#no').onclick = () => { srsGrade(v.n, v.w, false); i++; flipped = false; draw(); };
                  $('#yes').onclick = () => { srsGrade(v.n, v.w, true); known++; i++; flipped = false; draw(); }; }
    else $('#flip').onclick = () => { flipped = true; say(v.w); draw(); };
  }
  draw();
}

function makeVQ(n){
  const c = CH[n]; const pool = c.vocab.length >= 4 ? c.vocab : c.vocab.concat(CH[n - 1]?.vocab || []);
  const near = [...pool, ...(CH[n - 1]?.vocab || []), ...(CH[n + 1]?.vocab || [])];
  const uniq = (arr, f) => [...new Map(arr.map(x => [f(x), x])).values()];
  return shuffle(c.vocab).map((v, i) => {
    const type = ['hz2en', 'en2hz', 'hz2py', 'audio'][i % 4];
    const others = sample(uniq(near.filter(x => x.w !== v.w && x.d !== v.d && x.p !== v.p), x => x.w), 3);
    const opts = shuffle([v, ...others]);
    const label = x => type === 'hz2en' ? x.d : type === 'hz2py' ? x.p : x.w;
    const prompt = type === 'hz2en' ? `<span class="zh" style="font-size:30px">${esc(v.w)}</span> <span class="muted small">是什么意思？</span>`
      : type === 'en2hz' ? `<span style="font-size:18px">“${esc(v.d)}”</span> <span class="muted small">用汉语怎么说？</span>`
      : type === 'hz2py' ? `<span class="zh" style="font-size:30px">${esc(v.w)}</span> <span class="muted small">怎么读？ pinyin?</span>`
      : `${spk(v.w, true)} <span class="muted small">听录音，选汉字 Listen and pick</span>`;
    return {v, type, prompt, opts: opts.map(label), a: opts.indexOf(v)};
  });
}
function vquiz(n, head){
  const qs = makeVQ(n); let i = 0, right = 0, answered = false;
  function draw(){
    if (i >= qs.length){ const pct = Math.round(right / qs.length * 100); setBest(n, 'vquiz', pct);
      $('#app').innerHTML = head + `<div class="card" style="text-align:center"><div class="score">${pct}%</div><p>${right} / ${qs.length}</p><button class="btn primary" onclick="route()">再测一次 Retry</button></div>`; setBar(''); return; }
    const q = qs[i]; answered = false;
    $('#app').innerHTML = head + `<div class="card"><div class="small muted">${i + 1} / ${qs.length}</div>
      <div style="margin:14px 0 10px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">${q.prompt}</div>
      <div class="opts col">${q.opts.map((o, j) => `<button class="opt ${q.type === 'hz2en' ? '' : 'zh'}" data-j="${j}"><span class="letter">${L[j]}</span>${esc(o)}</button>`).join('')}</div>
      <div id="fb"></div></div>`;
    if (q.type === 'audio') setTimeout(() => say(q.v.w), 250);
    document.querySelectorAll('.opt').forEach(b => b.onclick = () => {
      if (answered) return; answered = true; const j = +b.dataset.j; const ok = j === q.a;
      if (ok) right++; srsGrade(n, q.v.w, ok);
      document.querySelectorAll('.opt').forEach((x, k) => { if (k === q.a) x.classList.add('right'); else if (k === j) x.classList.add('wrong'); });
      $('#fb').innerHTML = `<div class="fb ${ok ? 'ok' : 'no'}"><span class="zh">${esc(q.v.w)}</span> ${esc(q.v.p)} — ${esc(q.v.d)}</div>`;
      if (q.type !== 'audio') say(q.v.w);
      setBar(`<button class="btn primary" id="next">下一题 Next ›</button>`); $('#next').onclick = () => { i++; setBar(''); draw(); };
    });
  }
  draw();
}

/* ----- grammar ----- */
function grammar(n){
  const c = CH[n]; setTitle(`第${n}课 语法`, true);
  const ex = c.ex?.grammar || [];
  $('#app').innerHTML = tabs(n, 'grammar') + c.grammar.map((g, gi) => `
    <div class="card gram"><div class="pt">
      <div class="small muted">语法 ${gi + 1}</div>
      <h3 class="zh" style="font-size:18px;margin:4px 0 8px">${esc(g.t)}</h3>
      <p style="margin:0 0 8px;line-height:1.55">${esc(g.m)}</p></div>
      ${g.ex.map(([z, e]) => `<div class="ex">${spk(z)}<div><div class="zh">${esc(z)}</div><div class="en">${esc(e)}</div></div></div>`).join('')}
      ${ex.some(q => q.g === gi) ? `<button class="btn" data-gp="${gi}" style="margin-top:6px">练一练 Practise this point (${ex.filter(q => q.g === gi).length})</button><div id="gp${gi}"></div>` : ''}
    </div>`).join('') + `<div class="row"><a class="btn primary" style="text-decoration:none" href="#/ch/${n}/wb/grammar">本课语法练习 All grammar exercises for this lesson ›</a></div>`;
  document.querySelectorAll('[data-gp]').forEach(b => b.onclick = () => {
    const gi = +b.dataset.gp; b.remove();
    const idx = ex.map((q, i) => q.g === gi ? i : -1).filter(i => i >= 0);
    runSection(n, 'grammar', $('#gp' + gi), {only: idx, inline: true});
  });
}

/* ----- workbook ----- */
function workbook(n, k){
  const c = CH[n]; setTitle(`第${n}课 练习册`, true);
  const secs = k ? [SECT[k]] : SECTIONS;
  let lastGrp = '';
  const sub = `<div class="tabs wrap" style="margin-top:-4px">${[['', '全部 All'], ...SECTIONS.map(s => [s.k, SHORT[s.k]])].map(([kk, l]) => `<a class="${(k||'') === kk ? 'on' : ''}" href="#/ch/${n}/wb${kk ? '/' + kk : ''}">${l}</a>`).join('')}</div>`;
  $('#app').innerHTML = tabs(n, 'wb') + sub + secs.map(s => {
    const g = s.grp !== lastGrp ? `<div class="sechead"><span class="roman">${s.roman}、</span><span class="part-title">${s.grp}</span></div>` : ''; lastGrp = s.grp;
    return g + `<div class="card" id="sec-${s.k}"></div>`; }).join('');
  secs.forEach(s => runSection(n, s.k, $('#sec-' + s.k)));
}

function runSection(n, k, el, o = {}){
  const c = CH[n]; const all = (o.src === 'rv' ? c.rv : c.ex)?.[k] || [];
  const idx = o.only || all.map((_, i) => i);
  const items = idx.map(i => { const it = {...all[i], _i: i};
    if (it.opts && ['listen', 'reading', 'grammar'].includes(k)){ const ord = shuffle(it.opts.map((_, j) => j)); it.opts = ord.map(j => all[i].opts[j]); it.a = ord.indexOf(all[i].a); }
    return it; });
  const s = SECT[k];
  if (!items.length){ el.innerHTML = `<div class="muted">No exercises yet.</div>`; return; }
  const st = {ans: {}, checked: false};
  const ctx = {n, k, items, st, el, s, o};
  RENDER[k](ctx);
}
function header(ctx, extra = ''){
  const {s, n, k, o} = ctx; if (o.inline) return '';
  return `<div class="row" style="justify-content:space-between;margin-bottom:6px"><div><div class="part-title zh">${s.t}</div><div class="small muted">${s.en}</div></div>${o.mistakes || o.review ? '' : pill(S.best[n]?.[k])}</div>${extra}`;
}
function footer(ctx){
  if (ctx.o.review) return `<div class="row" style="margin-top:12px"><button class="btn primary" data-check>检查 Check</button><span data-score class="part-title"></span></div>`;
  return `<div class="row" style="margin-top:12px"><button class="btn primary" data-check>检查 Check</button><button class="btn ghost" data-reset>重做 Redo</button><span data-score class="part-title"></span>
    ${ctx.o.inline || ctx.o.mistakes ? '' : `<label class="small muted" style="margin-left:auto"><input type="checkbox" data-en ${S.set.en ? 'checked' : ''}> English</label>`}</div>`;
}
function wire(ctx, grade){
  const {el, st, items, n, k, o} = ctx;
  el.querySelector('[data-check]').onclick = () => {
    if (o.review && st.checked) return;
    if (o.review && !o.answered(ctx)) { el.querySelector('[data-score]').textContent = '请先作答 Answer first'; return; }
    st.checked = true; let right = 0;
    const src = o.src || 'ex';
    items.forEach((it, qi) => { const ok = grade(it, qi); if (ok) right++;
      if (ok) clearMistake(n, k, it._i, src); else addMistake(n, k, it._i, src); });
    const pct = Math.round(right / items.length * 100);
    if (!o.only && !o.mistakes && !o.review) setBest(n, k, pct);
    el.querySelector('[data-score]').textContent = o.review ? (right ? '✓ 对了 Correct' : '✗ 错了 Not quite') : `${right} / ${items.length}`;
    if (o.review) el.querySelector('[data-check]').disabled = true;
    el.querySelectorAll('.en').forEach(x => x.classList.remove('hidden'));
    el.querySelectorAll('[data-reveal]').forEach(x => x.classList.remove('hidden'));
    o.onGraded?.(right, items.length);
  };
  const rs = el.querySelector('[data-reset]'); if (rs) rs.onclick = () => RENDER[k]({...ctx, st: {ans: {}, checked: false}});
  const en = el.querySelector('[data-en]'); if (en) en.onchange = e => { S.set.en = e.target.checked; save(); el.querySelectorAll('.en').forEach(x => x.classList.toggle('hidden', !S.set.en && !ctx.st.checked)); };
}
const enLine = t => t ? `<div class="en ${S.set.en ? '' : 'hidden'}">${esc(t)}</div>` : '';
function optClicks(ctx, sel = '.opt'){
  ctx.el.querySelectorAll(sel).forEach(b => b.onclick = () => {
    if (ctx.st.checked) return; const q = b.dataset.q;
    ctx.el.querySelectorAll(`${sel}[data-q="${q}"]`).forEach(x => x.classList.remove('sel'));
    b.classList.add('sel'); ctx.st.ans[q] = +b.dataset.j;
  });
}
function markOpts(ctx, qi, a, sel = '.opt'){
  const pick = ctx.st.ans[qi];
  ctx.el.querySelectorAll(`${sel}[data-q="${qi}"]`).forEach(x => { const j = +x.dataset.j; x.classList.remove('sel');
    if (j === a) x.classList.add('right'); else if (j === pick) x.classList.add('wrong'); });
  return pick === a;
}

const RENDER = {
  judge(ctx){
    const {el, items} = ctx;
    el.innerHTML = header(ctx, `<div class="small muted" style="margin-bottom:6px">例如: 听录音 → 判断 ★ 句子对 (✓) 还是错 (✗)</div>`) + items.map((it, qi) => `
      <div class="q"><div class="row"><span class="qn">${qi + 1}.</span>${spk(it.s)}
        <button class="toggle" data-show="${qi}">显示原文 show text</button></div>
        <div class="sent zh hidden" data-reveal id="tx${qi}" style="margin-top:6px">${esc(it.s)}</div>
        <div class="sent zh" style="margin-top:6px"><span class="star-mark">★</span> ${esc(it.st)}</div>
        <div class="opts"><button class="opt" data-q="${qi}" data-j="1">✓ 对</button><button class="opt" data-q="${qi}" data-j="0">✗ 错</button></div>
        ${enLine(it.en)}</div>`).join('') + footer(ctx);

/* ----- random review quiz (separate question pool: CH[n].rv) ----- */
const RV_KEYS = ['judge', 'listen', 'fill', 'grammar', 'order', 'reading', 'write', 'hanzi'];
const rvId = (n, k, i) => `${n}|${k}|${i}`;
function studiedChapters(){
  const s = new Set();
  Object.entries(S.best).forEach(([n, b]) => { if (b && Object.keys(b).length) s.add(+n); });
  Object.keys(S.srs).forEach(k => s.add(+k.split('|')[0]));
  return [...s].filter(n => CH[n]).sort((a, b) => a - b);
}
function rvPool(chs, keys){
  const out = [];
  chs.forEach(n => keys.forEach(k => (CH[n].rv?.[k] || []).forEach((_, i) => out.push({n, k, i}))));
  return out;
}
function pickReview(chs, keys, count){
  const pool = rvPool(chs, keys);
  const unseen = pool.filter(q => !S.rvSeen[rvId(q.n, q.k, q.i)]);
  // spread across chapters: round-robin over shuffled per-chapter lists
  const byCh = {}; shuffle(unseen).forEach(q => (byCh[q.n] ??= []).push(q));
  const picked = []; let order = shuffle(Object.keys(byCh));
  while (picked.length < count && order.length){
    order = order.filter(n => byCh[n].length);
    for (const n of order){ if (picked.length >= count) break; picked.push(byCh[n].shift()); }
  }
  // not enough unseen left: top up with the least-recently-seen questions (new cycle)
  if (picked.length < count){
    const seen = pool.filter(q => S.rvSeen[rvId(q.n, q.k, q.i)]).sort((a, b) => S.rvSeen[rvId(a.n, a.k, a.i)] - S.rvSeen[rvId(b.n, b.k, b.i)]);
    picked.push(...seen.slice(0, count - picked.length));
  }
  // avoid two of the same type back-to-back where possible
  const out = shuffle(picked);
  for (let i = 1; i < out.length; i++) if (out[i].k === out[i - 1].k){ const j = out.findIndex((q, x) => x > i && q.k !== out[i - 1].k); if (j > 0) [out[i], out[j]] = [out[j], out[i]]; }
  return out;
}
function answeredAll(ctx){
  const {k, items, st, el} = ctx;
  return items.every((it, qi) => {
    if (k === 'hanzi') return !!el.querySelector(`input[data-q="${qi}"]`)?.value.trim();
    if (k === 'order' || k === 'write') return (st.ans[qi] || []).length === (it.parts || it.words).length;
    return st.ans[qi] != null;
  });
}
function rquizSetup(){
  setTitle('随机复习 Random review', true);
  const studied = studiedChapters();
  const set = S.set.rq ||= {scope: 'studied', from: 1, to: Math.max(1, ...studied), count: 15, listen: true};
  const hasRv = DATA.some(c => c.rv && Object.keys(c.rv).length);
  const total = rvPool(DATA.map(c => c.n), RV_KEYS).length;
  const seenN = Object.keys(S.rvSeen).length;
  $('#app').innerHTML = `<div class="card"><h3>🎲 随机复习 Random review</h3>
    <p class="small muted" style="margin-top:0">Mixed questions from the lessons you've studied, drawn from a separate review bank — not the questions in each lesson's workbook. Questions you haven't seen yet come first; once you've been through them all, the oldest come back.</p>
    ${hasRv ? '' : '<p class="small" style="color:var(--red)">The review question bank is not built yet.</p>'}
    <div style="margin:10px 0 6px" class="part-title">范围 Which lessons</div>
    <label class="row small" style="margin:6px 0"><input type="radio" name="scope" value="studied" ${set.scope === 'studied' ? 'checked' : ''}>
      已学的课 Lessons I've studied <span class="muted">${studied.length ? '(' + studied.map(n => '第' + n + '课').join('、') + ')' : '(none yet — studying a lesson\'s vocab or workbook adds it)'}</span></label>
    <label class="row small" style="margin:6px 0"><input type="radio" name="scope" value="range" ${set.scope === 'range' ? 'checked' : ''}>
      从 <select id="rf">${DATA.map(c => `<option ${c.n === set.from ? 'selected' : ''}>${c.n}</option>`).join('')}</select>
      到 <select id="rt">${DATA.map(c => `<option ${c.n === set.to ? 'selected' : ''}>${c.n}</option>`).join('')}</select> 课</label>
    <div style="margin:12px 0 6px" class="part-title">题数 Questions</div>
    <div class="row">${[10, 15, 20, 30].map(c => `<label class="small"><input type="radio" name="cnt" value="${c}" ${set.count === c ? 'checked' : ''}> ${c}</label>`).join(' ')}</div>
    <label class="row small" style="margin-top:12px"><input type="checkbox" id="rl" ${set.listen ? 'checked' : ''}> 包括听力题 Include listening (needs sound)</label>
    <div class="row" style="margin-top:14px"><button class="btn primary" id="rgo" ${hasRv ? '' : 'disabled'}>开始 Start</button>
      <span class="small muted" id="rinfo"></span></div></div>
    <div class="card small muted">Review bank: ${seenN} of ${total} questions seen. Wrong answers are saved to the 错题本 mistakes list.
      ${seenN ? '<button class="toggle" id="rclr">重新开始 Reset seen questions</button>' : ''}</div>
    ${S.rvLog.length ? `<div class="card"><h3>最近 Recent rounds</h3>${rqHistory()}</div>` : ''}`;
  const read = () => {
    set.scope = document.querySelector('input[name=scope]:checked').value;
    set.from = +$('#rf').value; set.to = +$('#rt').value; set.count = +document.querySelector('input[name=cnt]:checked').value; set.listen = $('#rl').checked; save();
    const chs = set.scope === 'studied' ? (studied.length ? studied : [1]) : DATA.map(c => c.n).filter(n => n >= Math.min(set.from, set.to) && n <= Math.max(set.from, set.to));
    const keys = RV_KEYS.filter(k => set.listen || !['judge', 'listen'].includes(k));
    const pool = rvPool(chs, keys), unseen = pool.filter(q => !S.rvSeen[rvId(q.n, q.k, q.i)]).length;
    $('#rinfo').textContent = `${pool.length} questions available · ${unseen} not seen yet`;
    return {chs, keys};
  };
  document.querySelectorAll('input[name=scope],input[name=cnt],#rf,#rt,#rl').forEach(x => x.onchange = read);
  ['#rf', '#rt'].forEach(s => $(s).addEventListener('focus', () => { document.querySelector('input[name=scope][value=range]').checked = true; }));
  read();
  $('#rgo').onclick = () => { const {chs, keys} = read(); const qs = pickReview(chs, keys, set.count); if (!qs.length) return; rquizRun(qs); };
  const clr = $('#rclr'); if (clr) clr.onclick = () => { if (confirm('Mark all review questions as unseen?')){ S.rvSeen = {}; save(); rquizSetup(); } };
}
function rqHistory(){
  const rounds = {}; S.rvLog.forEach(r => { const d = rounds[r.r] ??= {t: r.t, ok: 0, n: 0}; d.n++; d.ok += r.ok ? 1 : 0; });
  return Object.values(rounds).sort((a, b) => b.t - a.t).slice(0, 5).map(d =>
    `<div class="row small" style="justify-content:space-between;padding:4px 0"><span>${new Date(d.t).toLocaleString()}</span>${pill(Math.round(d.ok / d.n * 100))}<span class="muted">${d.ok}/${d.n}</span></div>`).join('');
}
function rquizRun(qs){
  const round = Date.now(); let i = 0; const res = [];
  const head = () => `<div class="row small muted" style="margin-bottom:8px"><span>${Math.min(i + 1, qs.length)} / ${qs.length}</span><span style="flex:1"></span><span>✓ ${res.filter(Boolean).length}</span></div>
    <div class="bar" style="margin:-2px 0 12px"><i style="width:${i / qs.length * 100}%"></i></div>`;
  function draw(){
    setBar('');
    if (i >= qs.length) return summary();
    const q = qs[i];
    $('#app').innerHTML = head() + `<div class="small muted" style="margin-bottom:6px">第 ${q.n} 课 · <span class="zh">${esc(CH[q.n].cn)}</span></div><div class="card" id="rq"></div>`;
    runSection(q.n, q.k, $('#rq'), {only: [q.i], src: 'rv', review: true, answered: answeredAll, onGraded: (right) => {
      const ok = right > 0; res[i] = ok;
      S.rvSeen[rvId(q.n, q.k, q.i)] = Date.now();
      S.rvLog.push({r: round, t: round, n: q.n, k: q.k, i: q.i, ok}); if (S.rvLog.length > 600) S.rvLog = S.rvLog.slice(-600); save();
      setBar(`<button class="btn primary" id="rnext">${i + 1 < qs.length ? '下一题 Next ›' : '看结果 Results'}</button>`);
      $('#rnext').onclick = () => { i++; draw(); window.scrollTo(0, 0); };
    }});
    // auto-play audio for listening items
    if (q.k === 'judge' || q.k === 'listen') setTimeout(() => $('#rq .speak')?.click(), 300);
  }
  function summary(){
    const ok = res.filter(Boolean).length, pct = Math.round(ok / qs.length * 100);
    const byCh = {}; qs.forEach((q, j) => { const d = byCh[q.n] ??= {ok: 0, n: 0}; d.n++; if (res[j]) d.ok++; });
    const byK = {}; qs.forEach((q, j) => { const d = byK[q.k] ??= {ok: 0, n: 0}; d.n++; if (res[j]) d.ok++; });
    $('#app').innerHTML = `<div class="card" style="text-align:center"><div class="score">${pct}%</div><p>${ok} / ${qs.length} 对</p>
      <div class="row" style="justify-content:center"><button class="btn primary" id="ragain">再来一轮 Another round</button><a class="btn" href="#/mistakes" style="text-decoration:none">错题本 Mistakes (${S.mistakes.length})</a></div></div>
      <div class="card"><h3>按课 By lesson</h3><div class="stat-grid">${Object.keys(byCh).sort((a, b) => a - b).map(n => `<a href="#/ch/${n}">第${n}课 ${pill(Math.round(byCh[n].ok / byCh[n].n * 100))}</a>`).join('')}</div></div>
      <div class="card"><h3>按题型 By question type</h3><div class="stat-grid">${Object.keys(byK).map(k => `<a>${esc(SHORT[k])} <span class="small muted">${byK[k].ok}/${byK[k].n}</span></a>`).join('')}</div></div>`;
    $('#ragain').onclick = () => rquizSetup();
  }
  draw();
}

function mistakes(){
  setTitle('错题本 Mistakes', true);
  if (!S.mistakes.length){ $('#app').innerHTML = `<div class="card">没有错题 — no mistakes saved. Items you get wrong in the workbook land here; get them right here to clear them.</div>`; return; }
  const by = {}; S.mistakes.forEach(m => { const key = srcOf(m) + '|' + m.k; (by[m.n] ??= {}); (by[m.n][key] ??= []).push(m.i); });
  $('#app').innerHTML = Object.keys(by).sort((a, b) => a - b).map(n => Object.keys(by[n]).map(key => { const [src, k] = key.split('|');
    return `<div class="small muted" style="margin:14px 0 6px">第${n}课 · ${SECT[k].t}${src === 'rv' ? ' · 🎲 复习' : ''}</div><div class="card" id="m-${n}-${src}-${k}"></div>`; }).join('')).join('');
  Object.keys(by).forEach(n => Object.keys(by[n]).forEach(key => { const [src, k] = key.split('|'); const pool = (src === 'rv' ? CH[n].rv : CH[n].ex)?.[k] || [];
    runSection(+n, k, $(`#m-${n}-${src}-${k}`), {only: by[n][key].filter(i => pool[i]), mistakes: true, src}); }));
}
function settings(){
  setTitle('设置 Settings', true);
  const vs = VOICES.filter(v => /CN|Hans/i.test(v.lang));
  $('#app').innerHTML = `<div class="card"><h3>语音 Speech</h3>
    <div class="row">语速 Speed <input type="range" min=".5" max="1.2" step=".05" value="${S.set.rate}" id="rate"> <span id="rv">${S.set.rate}</span>
    <button class="btn" onclick="say('我最近越来越喜欢学汉语了。')">Test 🔊</button></div>
    <div class="row" style="margin-top:10px">声音 Voice <select id="voice"><option value="">Auto</option>${vs.map(v => `<option ${S.set.voice === v.name ? 'selected' : ''}>${esc(v.name)}</option>`).join('')}</select></div>
    ${vs.length ? '' : '<p class="small" style="color:var(--red)">No Chinese voice found. On Windows: Settings → Time &amp; language → Speech → add Chinese (Simplified). On iPhone: Settings → Accessibility → Spoken Content → Voices → Chinese.</p>'}
    <p class="small muted">Dialogues use a male/female voice for 男/女 where the device has both.</p></div>
    <div class="card"><h3>考试 Exam</h3>
    <div class="row">考试日期 Exam date <input type="date" id="exam" value="${esc(S.set.exam || '')}"> <button class="btn" id="examclr">Clear</button></div>
    <p class="small muted" id="examinfo">${examDays() === null ? 'Set your HSK 4 exam date to show a countdown on the home page.' : `Countdown: ${examDays()} day(s).`}</p></div>
    <div class="card"><h3>进度 Progress</h3>
    <p class="small muted">Progress is stored in this browser only. Export it to move between devices.</p>
    <div class="row"><button class="btn" id="exp">导出 Export</button><button class="btn" id="imp">导入 Import</button><button class="btn" id="rst" style="color:var(--red)">重置 Reset all</button></div>
    <textarea id="io" class="hidden" style="width:100%;height:120px;margin-top:10px;font-size:12px"></textarea></div>
    <div class="card small muted">Content follows the lesson structure, vocabulary and grammar points of <i>HSK Standard Course 4</i> (BLCUP) and the section format of its workbook. Sentences and exercises are original practice material, not reproduced from the books.</div>`;
  $('#rate').oninput = e => { S.set.rate = +e.target.value; $('#rv').textContent = S.set.rate; save(); };
  $('#voice').onchange = e => { S.set.voice = e.target.value; save(); };
  const examInfo = () => { const n = examDays(); $('#examinfo').textContent = n === null ? 'Set your HSK 4 exam date to show a countdown on the home page.' : `Saved — ${n} day(s) to go. Shown on the home page.`; };
  $('#exam').onchange = e => { S.set.exam = e.target.value || ''; save(); examInfo(); };
  $('#examclr').onclick = () => { S.set.exam = ''; $('#exam').value = ''; save(); examInfo(); };
  $('#exp').onclick = () => { const t = $('#io'); t.classList.remove('hidden'); t.value = JSON.stringify(S); t.select(); navigator.clipboard?.writeText(t.value); };
  $('#imp').onclick = () => { const t = $('#io'); if (t.classList.contains('hidden') || !t.value.trim()){ t.classList.remove('hidden'); t.value=''; t.placeholder = 'Paste exported progress here, then press Import again'; return; }
    try { S = JSON.parse(t.value); save(); alert('Imported.'); location.hash = '#/'; } catch { alert('Invalid data.'); } };
  $('#rst').onclick = () => { if (confirm('Erase all progress?')){ localStorage.removeItem(KEY); location.hash = '#/'; location.reload(); } };
}

route();
</script>
</body>
</html>
