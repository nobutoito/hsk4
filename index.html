],"hanzi":[{"s":"我们一起谈谈下个月的计（  ）吧。","py":"huà","a":"划"},{"s":"工作经（  ）比工资更重要。","py":"yàn","a":"验"},{"s":"他做生意赚（  ）了很多钱。","py":"zhuàn","a":"赚"},{"s":"祝你考试成（  ）！","py":"gōng","a":"功"},{"s":"你这个月的奖（  ）是多少？","py":"jīn","a":"金"}]},"rv":{"judge":[{"s":"刘芳原来在银行工作，工资挺高的。后来她发现自己更喜欢教孩子，就去了一所小学当老师。","st":"★ 刘芳现在在银行工作。","a":false,"en":"Liu Fang used to work at a bank with a good salary. Later she found she preferred teaching children, so she became a primary-school teacher. / ★ Liu Fang works at a bank now."},{"s":"马克以为中国人过生日都吃蛋糕，后来他发现，很多老人过生日的时候更喜欢吃面条。","st":"★ 很多中国老人过生日喜欢吃面条。","a":true,"en":"Mark thought Chinese people always eat cake on birthdays; later he found that many elderly people prefer a bowl of noodles. / ★ Many elderly Chinese like noodles on birthdays."},{"s":"我们公司要求每个人每天都要按时到公司。如果迟到三次，这个月的奖金就没有了。","st":"★ 迟到会影响奖金。","a":true,"en":"Our company requires that everyone must arrive on time. Three late arrivals and you lose this month's bonus. / ★ Being late affects the bonus."},{"s":"小王刚开始做生意的时候，因为没有经验，没赚到钱。但是他并没有不做，而是一边工作一边学习。","st":"★ 小王做生意一开始就很成功。","a":false,"en":"When Xiao Wang started in business he had no experience and didn't make money. But he didn't quit; he studied while working. / ★ Xiao Wang succeeded from the start."}],"listen":[{"dlg":["男：你怎么买了这么多东西？","女：我按照妈妈写的单子买的，一样也不能少。"],"q":"女的是按照什么买东西的？","opts":["自己的想法","妈妈写的单子","朋友说的话"],"a":1,"en":"M: Why did you buy so much? F: I bought it all from Mum's list; not a single thing can be missing."},{"dlg":["女：这次比赛你们准备得怎么样了？","男：一切都准备好了，我们一定能拿第一。"],"q":"男的觉得比赛会怎么样？","opts":["会赢","会输","不知道"],"a":0,"en":"F: How's your preparation for the competition? M: Everything's ready; we'll definitely come first."},{"dlg":["男：你不是说今天要去面试吗？怎么还在家？","女：公司通知我，面试改到下星期了。"],"q":"女的为什么还在家？","opts":["她不想去","她生病了","面试改时间了"],"a":2,"en":"M: Didn't you say you had an interview today? Why are you still home? F: The company told me it's been moved to next week."},{"dlg":["女：你一个月赚多少钱？","男：工资不高，四千多，但是年底有奖金。","女：奖金多吗？","男：要看公司那一年的生意怎么样。"],"q":"男的的奖金跟什么有关系？","opts":["他的工作时间","公司的生意","他多大"],"a":1,"en":"F: How much do you make a month? M: The salary isn't high, just over 4,000, but there's a year-end bonus. F: Is it big? M: Depends on how the company does that year."}],"fill":[{"s":"我（  ）他已经回家了，原来他还在办公室。","a":"以为","en":"I thought he'd gone home; it turns out he was still in the office."},{"s":"考试的时候别紧张，相信自己，你一定会（  ）的。","a":"成功","en":"Don't be nervous in the exam; believe in yourself and you'll succeed."},{"s":"如果每天学一点儿，慢慢地就能（  ）很多生词。","a":"积累","en":"If you learn a bit every day, you'll gradually accumulate lots of words."},{"s":"A：这件事你跟经理说了吗？  B：还没有，我打算明天开会的时候（  ）一下。","a":"提","en":"A: Have you told the manager about this? B: Not yet; I plan to mention it at tomorrow's meeting."},{"s":"A：你怎么记得这么清楚？  B：是小雨（  ）我的，不然我早就忘了。","a":"提醒","en":"A: How do you remember it so clearly? B: Xiaoyu reminded me, otherwise I'd have forgotten long ago."},{"s":"A：你的电脑用了几年了？  B：这台电脑（  ）是我哥哥的，他买了新的以后就给我了。","a":"原来","en":"A: How many years have you used your computer? B: It was originally my brother's; he gave it to me after buying a new one."}],"grammar":[{"q":"我（  ）这家店九点开门，到了才知道十点才开。","opts":["甚至","并","以为","不得不"],"a":2,"exp":"以为 = mistakenly thought.","g":0},{"q":"他的病（  ）不重，休息两天就好了。","opts":["并","以为","甚至","不得不"],"a":0,"exp":"并不 denies the worry that it's serious.","g":1},{"q":"他太紧张了，（  ）连自己的名字都写错了。","opts":["以为","并","不得不","甚至"],"a":3,"exp":"甚至连……都…… = so much that even ….","g":2},{"q":"电梯坏了，我们（  ）走上十二楼。","opts":["甚至","不得不","以为","并"],"a":1,"exp":"不得不 = had no choice (the lift is broken).","g":3},{"q":"大家都以为他会生气，他却（  ）没有生气。","opts":["甚至","以为","并","不得不"],"a":2,"exp":"并没有 corrects everyone's expectation.","g":1},{"q":"公司突然让他去上海，他（  ）把旅游计划改了。","opts":["不得不","并","甚至","以为"],"a":0,"exp":"不得不 + verb: forced by the sudden assignment.","g":3}],"order":[{"parts":["这个消息让他非常高兴，","他甚至","高兴得跳了起来。"],"en":"The news made him so happy he even jumped for joy."},{"parts":["很多人以为当经理很舒服，","其实经理","并不舒服。"],"en":"Many people think being a manager is cushy; actually it isn't at all."},{"parts":["为了让这次聚会顺利，","我们提前一个月","就开始准备了。"],"en":"To make sure this get-together went smoothly, we started preparing a month ahead."}],"reading":[{"p":"刘芳原来打算毕业后马上工作赚钱，但是她的老师提醒她，她的知识可能还不够，最好再读几年书。她想了很久，最后决定先不工作，再读几年书。","q":"★ 刘芳最后决定：","opts":["马上去工作","再读几年书","去国外旅游"],"a":1,"en":"Liu Fang had planned to start earning straight after graduating, but her teacher reminded her her knowledge might not be enough yet and she'd better study a few more years. After thinking for a long time, she decided to hold off on work and study a few more years."},{"p":"做事情要有计划。如果一切都按照计划做，就不容易乱。像出去旅游，最好提前订好酒店和车票，这样到了地方就不会着急。","q":"★ 这段话主要谈的是：","opts":["做事要有计划","旅游很累","酒店很贵"],"a":0,"en":"You need a plan to do things. If everything follows the plan, things won't get chaotic. For example, when travelling it's best to book the hotel and tickets in advance, so you won't panic when you arrive."},{"p":"王经理常说，一个人赚多少钱并不是最重要的，最重要的是对自己的工作负责。他认为，有责任的人做事才能成功。","q":"★ 王经理认为最重要的是：","opts":["赚很多钱","工作不累","对工作负责"],"a":2,"en":"Manager Wang often says how much you earn isn't the most important thing; what matters most is being responsible for your work. He believes only responsible people succeed."}],"write":[{"words":["这个方法","并不","适合","每个人。"],"en":"This method doesn't suit everyone."},{"words":["我们","终于","顺利地","写完了材料。"],"en":"We finally finished writing the materials smoothly."},{"words":["他","甚至","连饭","都忘了吃。"],"en":"He even forgot to eat."},{"words":["请你","按时","把材料","交给我。"],"en":"Please hand the materials to me on time."}],"hanzi":[{"s":"做事要有（  ）任心。","py":"zé","a":"责"},{"s":"外面下雨了，我（  ）醒你带伞。","py":"tí","a":"提"},{"s":"我们公司的工（  ）不太高。","py":"zī","a":"资"},{"s":"祝你一切顺（  ）！","py":"lì","a":"利"}]},"tx":[{"t":"第一份工作 · The first job","scene":"Mark tells Ms Chen why he turned down a well-paid job offer.","g":[0,1],"lines":[{"sp":"陈老师","s":"f","zh":"马克，听说有家公司给你的工资很高，你为什么没去？","py":"Mǎkè, tīngshuō yǒu jiā gōngsī gěi nǐ de gōngzī hěn gāo, nǐ wèishénme méi qù?","en":"Mark, I heard a company offered you a high salary — why didn't you go?"},{"sp":"马克","s":"m","zh":"我本来也以为那是一份好工作，后来做了一些调查，发现那儿的人每天都要加班到很晚。","py":"Wǒ běnlái yě yǐwéi nà shì yí fèn hǎo gōngzuò, hòulái zuòle yìxiē diàochá, fāxiàn nàr de rén měi tiān dōu yào jiābān dào hěn wǎn.","en":"I also thought it was a good job at first, but after looking into it I found people there work overtime till late every day."},{"sp":"陈老师","s":"f","zh":"刚毕业的时候，不要太着急赚钱，学到知识更重要。","py":"Gāng bìyè de shíhou, búyào tài zháojí zhuàn qián, xuédào zhīshi gèng zhòngyào.","en":"Right after graduating, don't be in too much of a hurry to earn money; learning is more important."},{"sp":"马克","s":"m","zh":"我也是这么想的。钱多的工作并不一定就是好工作。","py":"Wǒ yě shì zhème xiǎng de. Qián duō de gōngzuò bìng bù yídìng jiù shì hǎo gōngzuò.","en":"That's what I think too. More money doesn't necessarily mean a better job."},{"sp":"陈老师","s":"f","zh":"那你现在的计划是什么？","py":"Nà nǐ xiànzài de jìhuà shì shénme?","en":"So what's your plan now?"},{"sp":"马克","s":"m","zh":"我想先去一家小公司积累经验，学一些做生意的方法。","py":"Wǒ xiǎng xiān qù yì jiā xiǎo gōngsī jīlěi jīngyàn, xué yìxiē zuò shēngyi de fāngfǎ.","en":"I want to go to a small company first to build experience and learn some ways of doing business."}]},{"t":"加班的夜晚 · A late night at work","scene":"Zhang Wei is still in the office late; Manager Wang checks on him.","g":[2,3],"lines":[{"sp":"王经理","s":"m","zh":"小张，都十点了，你怎么还没回家？","py":"Xiǎo Zhāng, dōu shí diǎn le, nǐ zěnme hái méi huí jiā?","en":"Xiao Zhang, it's already ten — why haven't you gone home?"},{"sp":"张伟","s":"m","zh":"顾客突然要求明天上午就看材料，我不得不留下来把它写完。","py":"Gùkè tūrán yāoqiú míngtiān shàngwǔ jiù kàn cáiliào, wǒ bùdébù liú xiàlái bǎ tā xiěwán.","en":"The client suddenly wants to see the materials tomorrow morning, so I had no choice but to stay and finish them."},{"sp":"王经理","s":"m","zh":"谢谢你。这个月你特别努力，有时候甚至周末都来公司。","py":"Xièxie nǐ. Zhège yuè nǐ tèbié nǔlì, yǒu shíhou shènzhì zhōumò dōu lái gōngsī.","en":"Thanks for your hard work. You've been extra diligent this month — sometimes you even come in at weekends."},{"sp":"张伟","s":"m","zh":"这是我的责任。我保证明天按时把材料交给顾客。","py":"Zhè shì wǒ de zérèn. Wǒ bǎozhèng míngtiān ànshí bǎ cáiliào jiāo gěi gùkè.","en":"It's my responsibility. I promise to give the client the materials on time tomorrow."},{"sp":"王经理","s":"m","zh":"好。这次生意如果谈成了，公司会给你发一笔奖金。","py":"Hǎo. Zhè cì shēngyi rúguǒ tánchéng le, gōngsī huì gěi nǐ fā yì bǐ jiǎngjīn.","en":"Good. If this deal goes through, the company will give you a bonus."},{"sp":"张伟","s":"m","zh":"谢谢经理！我写完就走，您先回去休息吧。","py":"Xièxie jīnglǐ! Wǒ xiěwán jiù zǒu, nín xiān huíqu xiūxi ba.","en":"Thanks, boss! I'll leave as soon as I'm done; you go home and rest first."}]},{"t":"好消息 · Good news","scene":"Lin Xiaoyu phones her mother with news about her work.","g":[0,2],"lines":[{"sp":"林小雨","s":"f","zh":"妈，告诉您一个好消息，我们这次的工作非常成功！","py":"Mā, gàosu nín yí gè hǎo xiāoxi, wǒmen zhè cì de gōngzuò fēicháng chénggōng!","en":"Mum, I've got good news — our work this time was a big success!"},{"sp":"妈妈","s":"f","zh":"太好了！我还以为你们会遇到很多麻烦呢。","py":"Tài hǎo le! Wǒ hái yǐwéi nǐmen huì yùdào hěn duō máfan ne.","en":"Wonderful! I thought you'd run into lots of trouble."},{"sp":"林小雨","s":"f","zh":"一开始是有点儿乱，后来我们按照新的计划做，一切都很顺利。","py":"Yì kāishǐ shì yǒudiǎnr luàn, hòulái wǒmen ànzhào xīn de jìhuà zuò, yíqiè dōu hěn shùnlì.","en":"At first it was a bit chaotic, but then we followed a new plan and everything went smoothly."},{"sp":"妈妈","s":"f","zh":"你最近太累了，甚至连中秋节都没回家。","py":"Nǐ zuìjìn tài lèi le, shènzhì lián Zhōngqiū Jié dōu méi huí jiā.","en":"You've been so tired lately — you didn't even come home for the Mid-Autumn Festival."},{"sp":"林小雨","s":"f","zh":"我知道。下个月我提前请几天假，回去好好陪陪您和爸爸。","py":"Wǒ zhīdào. Xià gè yuè wǒ tíqián qǐng jǐ tiān jià, huíqu hǎohāo péipei nín hé bàba.","en":"I know. Next month I'll ask for a few days off in advance and come back to spend time with you and Dad."},{"sp":"妈妈","s":"f","zh":"好啊！你一定要感谢一下帮助过你的同事。","py":"Hǎo a! Nǐ yídìng yào gǎnxiè yíxià bāngzhù guo nǐ de tóngshì.","en":"Great! Be sure to thank the colleagues who helped you."}]},{"t":"电台节目：钱重要吗 · Radio show: Does money matter?","scene":"A radio host interviews businessman Manager Wang about money and success.","g":[1,3],"lines":[{"sp":"记者","s":"f","zh":"王经理，很多年轻人一工作就想赚大钱，您怎么看？","py":"Wáng jīnglǐ, hěn duō niánqīng rén yì gōngzuò jiù xiǎng zhuàn dà qián, nín zěnme kàn?","en":"Manager Wang, many young people want to make big money the moment they start work. What's your view?"},{"sp":"王经理","s":"m","zh":"想赚钱没有错，但是赚钱的方法很重要。刚开始的时候，工资高并不一定是好事。","py":"Xiǎng zhuàn qián méiyǒu cuò, dànshì zhuàn qián de fāngfǎ hěn zhòngyào. Gāng kāishǐ de shíhou, gōngzī gāo bìng bù yídìng shì hǎoshì.","en":"Wanting to earn isn't wrong, but how you earn matters. At the start, a high salary isn't necessarily a good thing."},{"sp":"记者","s":"f","zh":"您年轻的时候也是这样吗？","py":"Nín niánqīng de shíhou yě shì zhèyàng ma?","en":"Was it like that for you when you were young?"},{"sp":"王经理","s":"m","zh":"是的。我第一次做生意就没赚到钱，不得不重新找工作，从最简单的事做起。","py":"Shì de. Wǒ dì-yī cì zuò shēngyi jiù méi zhuàndào qián, bùdébù chóngxīn zhǎo gōngzuò, cóng zuì jiǎndān de shì zuò qǐ.","en":"Yes. My first business made no money, so I had to look for a job again and start from the simplest tasks."},{"sp":"记者","s":"f","zh":"那时候的事对您有什么帮助？","py":"Nà shíhou de shì duì nín yǒu shénme bāngzhù?","en":"How did that period help you?"},{"sp":"王经理","s":"m","zh":"它让我明白，知识和经验比钱更有用。有了这些，钱自然会来的。","py":"Tā ràng wǒ míngbai, zhīshi hé jīngyàn bǐ qián gèng yǒuyòng. Yǒule zhèxiē, qián zìrán huì lái de.","en":"It taught me that knowledge and experience are more useful than money. With those, the money naturally follows."}]}]},{"n":5,"cn":"只买对的，不买贵的","en":"Buy the right, not the expensive","vocab":[{"w":"家具","p":"jiājù","pos":"n.","d":"furniture"},{"w":"沙发","p":"shāfā","pos":"n.","d":"sofa"},{"w":"打折","p":"dǎzhé","pos":"v.","d":"to give a discount"},{"w":"价格","p":"jiàgé","pos":"n.","d":"price"},{"w":"质量","p":"zhìliàng","pos":"n.","d":"quality"},{"w":"肯定","p":"kěndìng","pos":"adv.","d":"surely, certainly"},{"w":"流行","p":"liúxíng","pos":"v.","d":"to be popular"},{"w":"顺便","p":"shùnbiàn","pos":"adv.","d":"in passing"},{"w":"台","p":"tái","pos":"m.","d":"used for machines"},{"w":"光","p":"guāng","pos":"adv.","d":"only, merely"},{"w":"实在","p":"shízài","pos":"adv.","d":"really"},{"w":"制冷","p":"zhìlěng","pos":"v.","d":"to refrigerate"},{"w":"效果","p":"xiàoguǒ","pos":"n.","d":"effect"},{"w":"现金","p":"xiànjīn","pos":"n.","d":"cash"},{"w":"邀请","p":"yāoqǐng","pos":"v.","d":"to invite"},{"w":"葡萄","p":"pútao","pos":"n.","d":"grape"},{"w":"艺术","p":"yìshù","pos":"n.","d":"art"},{"w":"广告","p":"guǎnggào","pos":"n.","d":"advertisement"},{"w":"味道","p":"wèidào","pos":"n.","d":"taste"},{"w":"优点","p":"yōudiǎn","pos":"n.","d":"merit"},{"w":"实际","p":"shíjì","pos":"n.","d":"reality"},{"w":"考虑","p":"kǎolǜ","pos":"v.","d":"to consider"},{"w":"标准","p":"biāozhǔn","pos":"n.","d":"standard"},{"w":"样子","p":"yàngzi","pos":"n.","d":"look, appearance"},{"w":"年龄","p":"niánlíng","pos":"n.","d":"age"},{"w":"浪费","p":"làngfèi","pos":"v.","d":"to waste"},{"w":"购物","p":"gòuwù","pos":"v.","d":"to shop, to buy things"},{"w":"尤其","p":"yóuqí","pos":"adv.","d":"especially"},{"w":"受到","p":"shòudào","pos":"v.","d":"to receive"},{"w":"任何","p":"rènhé","pos":"pron.","d":"any, whatever"},{"w":"寄","p":"jì","pos":"v.","d":"to mail, to send"}],"proper":"","grammar":[{"t":"光……（就）…… — only / … alone already …","m":"As an adverb, 光 means 'only, merely' (like 只, but more colloquial). It goes before a verb or a noun phrase. In the pattern 光 + X + 就 + big amount, it stresses that one part ALONE already reaches a large number, so the whole is even more. 别光…… means 'don't just … (and nothing else)'.","ex":[["光看价格是不够的，还要看质量。","Looking only at the price isn't enough; you have to look at the quality too."],["这次搬家，光买家具就花了两万多块。","For this move, the furniture alone cost over twenty thousand yuan."],["你别光说不做，快去试试吧。","Don't just talk without doing anything — go and try it."]]},{"t":"尤其（是） — especially, particularly","m":"尤其 singles out one member of a group that stands out even more than the rest. Typical order: a general statement first, then '，尤其（是）+ the special case'. 尤其 is an adverb, so it can sit directly before a verb or adjective (尤其喜欢、尤其便宜); use 尤其是 before a noun or a time/place phrase.","ex":[["我喜欢吃水果，尤其是葡萄。","I like fruit, especially grapes."],["这个城市的冬天很冷，尤其是晚上。","Winters in this city are cold, especially at night."],["年轻人尤其喜欢在网上买衣服。","Young people especially like buying clothes online."]]},{"t":"任何……都／也…… — any … at all","m":"任何 ('any, whatever') must be followed by a noun (任何人、任何东西、任何问题、任何时候) and is normally echoed by 都 or 也 in the predicate. In positive sentences it means 'every single …'; with a negative it means 'none at all'. Unlike English 'any', it cannot stand alone without a noun.","ex":[["任何东西都有优点和缺点。","Everything has its strong points and its weak points."],["如果有任何问题，你都可以给我打电话。","If you have any problem at all, you can phone me."],["我现在不想买任何东西，只想回家休息。","Right now I don't want to buy anything; I just want to go home and rest."]]},{"t":"实在 — really, truly (stressing an undeniable fact)","m":"As an adverb, 实在 means 'really, honestly' and stresses that the situation is truly so — often used when explaining, complaining or apologising: 实在太贵了、实在对不起、实在没办法. It is stronger and more emotional than 很; it usually comes right before 太/是/不/没 or an adjective.","ex":[["这台电脑实在太旧了，该换一台新的了。","This computer is really too old; it's time to get a new one."],["实在对不起，我今天有事，不能去你家了。","I'm really sorry, something's come up today and I can't come to your place."],["这件衣服样子不错，可是价格实在太高了。","This piece of clothing looks nice, but the price is really too high."]]}],"ex":{"judge":[{"s":"我家的旧沙发已经用了十几年了，坐上去很不舒服。上个周末，我和妻子去家具店看了看，发现有一个沙发正在打折，就买了下来。","st":"★ 他们买的沙发没有打折。","a":false,"en":"Our old sofa had been used for over ten years and was uncomfortable. Last weekend my wife and I went to a furniture store and found a sofa on sale, so we bought it. ★ The sofa they bought wasn't discounted."},{"s":"现在很多年轻人喜欢在网上购物，因为又方便又便宜。但是网上的东西只能看照片，实际的质量怎么样，常常要拿到手才知道。","st":"★ 网上购物时，很难提前知道东西的实际质量。","a":true,"en":"Many young people like shopping online because it's convenient and cheap. But online you can only see photos; you often only know the real quality once it's in your hands. ★ When shopping online, it's hard to know the real quality in advance."},{"s":"这台空调是去年买的，价格不高，可是制冷效果很好，夏天一开，房间里马上就凉了。","st":"★ 这台空调的制冷效果不太好。","a":false,"en":"This air conditioner was bought last year. It wasn't expensive, but it cools very well — in summer the room gets cool as soon as you turn it on. ★ This air conditioner doesn't cool very well."},{"s":"我朋友下个月过生日，邀请我去他家吃饭。我住得太远，去不了，所以打算给他寄一份礼物。","st":"★ 他准备把礼物寄给朋友。","a":true,"en":"My friend has a birthday next month and invited me to dinner at his place. I live too far away to go, so I plan to mail him a present. ★ He plans to mail the present to his friend."},{"s":"选衣服的时候，不能只看流行不流行，还要考虑自己的年龄和工作。适合自己的才是最好的。","st":"★ 说话人认为，买衣服最重要的是流行。","a":false,"en":"When choosing clothes, you can't only look at whether they're fashionable; you also have to consider your age and job. What suits you is best. ★ The speaker thinks being fashionable matters most when buying clothes."}],"listen":[{"dlg":["女：这个沙发样子挺好看的，多少钱？","男：原价五千，这个星期打八折，四千块。"],"q":"现在买这个沙发要多少钱？","opts":["五千块","四千块","八百块"],"a":1,"en":"W: This sofa looks nice, how much is it? M: Originally 5,000; this week it's 20% off, so 4,000. Q: How much is the sofa now?"},{"dlg":["男：你今天怎么带了这么多现金？","女：我要去买家具，那家小店只收现金，不能用信用卡。"],"q":"女的为什么带了很多现金？","opts":["要还朋友钱","要去银行","那家店只收现金"],"a":2,"en":"M: Why are you carrying so much cash today? W: I'm buying furniture; that little shop only takes cash, no credit cards. Q: Why is she carrying a lot of cash?"},{"dlg":["女：你去超市的话，顺便帮我买点儿葡萄吧。","男：没问题，还要别的吗？"],"q":"女的让男的做什么？","opts":["顺便买葡萄","去超市工作","不要买水果"],"a":0,"en":"W: If you're going to the supermarket, could you pick up some grapes for me while you're there? M: Sure, anything else? Q: What does she ask him to do?"},{"dlg":[" ave an age requirement? B: Yes, thirty-five at most."},{"s":"A：这台电视的（  ）怎么样？  B：比我们在商场看到的便宜五百块。","a":"价格","en":"A: How's the price of this TV? B: It's 500 yuan cheaper than the one we saw at the mall."}],"grammar":[{"q":"（  ）房租，每个月就要花三千块。","opts":["光","任何","尤其","实在"],"a":0,"exp":"光……就…… stresses that the rent alone already costs a lot.","g":0},{"q":"我喜欢各种运动，（  ）是游泳。","opts":["实在","尤其","任何","肯定"],"a":1,"exp":"尤其是 picks out swimming as the special case within 'all kinds of sports'.","g":1},{"q":"我把钱都花完了，现在不能再买（  ）东西了。","opts":["任何","每个","一些","尤其"],"a":0,"exp":"With a negative, 任何 + noun means 'not … anything at all'.","g":2},{"q":"这里的葡萄（  ）太甜了，你一定要买一点儿回去。","opts":["光","任何","实在","尤其"],"a":2,"exp":"实在太…了 stresses that the grapes really are very sweet.","g":3},{"q":"（  ）商品，如果质量有问题，都可以换。","opts":["尤其","光","任何","实在"],"a":2,"exp":"任何 + noun … 都 means 'any product at all'.","g":2},{"q":"你别（  ）看广告，买以前要多问问用过的人。","opts":["实在","任何","尤其","光"],"a":3,"exp":"别光 + verb = 'don't only/just do …'.","g":0}],"order":[{"parts":["这家店的家具虽然不便宜，","但是质量特别好，","所以买的人一直很多。"],"en":"Although this shop's furniture isn't cheap, the quality is excellent, so it always has lots of buyers."},{"parts":["你下班回家的时候，","如果经过超市，","就顺便买点儿水果吧。"],"en":"When you come home from work, if you pass the supermarket, pick up some fruit on the way."},{"parts":["现在的广告越来越有意思，","尤其是电视上的广告，","有的就像一个小电影。"],"en":"Ads are getting more and more interesting, especially TV ads — some are like little films."},{"parts":["很多东西买回来以后从来没用过，","这样实在太浪费了，","所以买东西以前一定要考虑清楚。"],"en":"Lots of things are never used after they're bought, which is really wasteful, so think carefully before you buy."}],"reading":[{"p":"很多人买东西时喜欢“买贵的”，觉得贵的东西肯定质量好。其实价格高的东西，质量不一定就好，因为你花的钱里有很多是给广告的。所以买东西以前，最好多问问、多比较，看看东西的实际质量怎么样。","q":"★ 这段话主要想告诉我们：","opts":["贵的东西质量肯定好","买东西以前要多比较","最好只买便宜的东西"],"a":1,"en":"Many people like to 'buy expensive', thinking expensive means good quality. In fact high price doesn't guarantee quality, since a lot of what you pay goes to advertising. So ask around and compare before buying, and check the real quality. ★ The price may include money for advertising."},{"p":"我奶奶今年七十多岁了，她买东西有自己的标准：不看样子，不看流行不流行，只看用起来方便不方便。她说，东西是给人用的，不是给别人看的。","q":"★ 关于奶奶，可以知道：","opts":["奶奶买东西很看样子","奶奶认为方便最重要","奶奶喜欢买流行的东西"],"a":1,"en":"My grandma is over seventy and has her own standard for shopping: not looks, not fashion — only whether it's convenient to use. She says things are for using, not for showing others. ★ Grandma thinks convenience matters most."},{"p":"我家附近新开了一家水果店。为了吸引顾客，这个星期店里的水果都打八折，葡萄尤其便宜，五块钱一斤。我昨天顺便买了两斤，味道很甜，打算明天再去买一些。","q":"★ 关于葡萄，可以知道：","opts":["说话人觉得葡萄很好吃","水果店已经开了很多年","葡萄比别的水果贵"],"a":0,"en":"A new fruit shop opened near my home. To attract customers, all fruit is 20% off this week, and grapes are especially cheap — five yuan a jin. I bought two jin yesterday; they're sweet, and I plan to buy more tomorrow. ★ The speaker thinks the grapes taste good."},{"p":"现在越来越多的人喜欢在网上购物，在家里就能买到想要的东西，还会有人送到门口。可是有的人一看见打折就买，买回来的东西很多都用不上，这其实是一种浪费。","q":"★ 关于网上购物，可以知道：","opts":["网上的东西都不打折","网上购物很不方便","看见打折就买可能会浪费"],"a":2,"en":"More and more people shop online: you can get what you want at home and it's delivered to your door. But some people buy as soon as they see a discount, and much of it goes unused — which is actually a waste. ★ Buying whenever there's a discount can be wasteful."}],"write":[{"words":["这台空调","的","制冷效果","非常好。"],"en":"This air conditioner cools really well."},{"words":["他","邀请","我们","去他家","吃饭。"],"en":"He invited us to dinner at his place."},{"words":["这种沙发","在年轻人中","很流行。"],"en":"This kind of sofa is popular among young people."},{"words":["你","考虑","得","怎么样了？"],"en":"How's your thinking coming along? (Have you decided?)"},{"words":["我","已经","把那份材料","寄给你了。"],"en":"I've already mailed you that document."}],"hanzi":[{"s":"这家店的家（  ）质量都很好。","py":"jù","a":"具"},{"s":"现在买的话可以打（  ），比平时便宜一些。","py":"zhé","a":"折"},{"s":"这个广（  ）做得很有意思。","py":"gào","a":"告"},{"s":"葡（  ）是我最喜欢的水果。","py":"táo","a":"萄"},{"s":"买东西的时候不要浪（  ）钱。","py":"fèi","a":"费"}]},"rv":{"judge":[{"s":"小王想买一台电脑，他在网上看了很多广告，最后还是决定去商店买，因为他想先试一试。","st":"★ 小王最后在网上买了电脑。","a":false,"en":"Xiao Wang wanted a computer. He looked at lots of ads online but finally decided to buy it in a shop, because he wanted to try it first. ★ He ended up buying it online."},{"s":"这种葡萄不仅好看，而且味道很甜，所以虽然价格高一些，买的人还是很多。","st":"★ 这种葡萄的价格比较高。","a":true,"en":"These grapes look good and taste sweet, so although the price is higher, many people still buy them. ★ These grapes are fairly expensive."},{"s":"我叔叔是做艺术的，他家里的家具都是自己做的，样子很特别，来他家的人都说好看。","st":"★ 叔叔家的家具是在商店买的。","a":false,"en":"My uncle works in art. All the furniture at his home is handmade by him and looks unusual; every visitor says it's beautiful. ★ Uncle's furniture was bought in a shop."},{"s":"马克刚来中国的时候，买东西只用现金。后来他发现，这里很多地方用手机就能买东西，比带现金方便多了。","st":"★ 马克后来觉得用手机买东西更方便。","a":true,"en":"When Mark first came to China he only paid cash. Later he found that in many places you can pay with your phone, which is much more convenient than carrying cash. ★ Mark later found paying by phone more convenient."}],"listen":[{"dlg":["男：这个沙发有好几种颜色，你喜欢哪种？","女：白色的好看是好看，可是孩子还小，咱们还是买个蓝色的吧。"],"q":"他们最后可能买什么颜色的沙发？","opts":["白色","蓝色","黑色"],"a":1,"en":"M: This sofa comes in several colours, which do you like? W: The white one is pretty, but the kids are little — let's get a blue one. Q: Which colour will they probably buy?"},{"dlg":["女：你这台电脑用了几年了？","男：差不多五年了，有点儿慢，但是还能用，我不想浪费钱买新的。"],"q":"男的为什么不买新电脑？","opts":["不想浪费钱","没有时间","新电脑不好看"],"a":0,"en":"W: How long have you had this computer? M: About five years. It's a bit slow but still works; I don't want to waste money on a new one. Q: Why doesn't he buy a new computer?"},{"dlg":["男：你觉得这个房子怎么样？","女：优点是离地铁站近，缺点是房间有点儿小。","男：那价格呢？","女：价格还可以，我们再考虑考虑吧。"],"q":"女的觉得这个房子有什么优点？","opts":["房间很大","价格很低","离地铁站近"],"a":2,"en":"M: What do you think of this flat? W: The good point is it's near the metro; the drawback is the rooms are small. M: And the price? W: It's OK, let's think it over. Q: What advantage does she see?"},{"dlg":["女：你这件衬衫真好看，在哪儿买的？","男：在网上买的，现在正流行这种样子。"],"q":"关于这件衬衫，可以知道什么？","opts":["是在网上买的","是女的送的","现在不流行了"],"a":0,"en":"W: That shirt looks great, where did you get it? M: Online — this style is in fashion right now. Q: What do we know about the shirt?"}],"fill":[{"s":"这首歌去年特别（  ），很多年轻人都会唱。","a":"流行","en":"This song was really popular last year; lots of young people can sing it."},{"s":"谢谢你的（  ），可是我那天晚上要加班，去不了了。","a":"邀请","en":"Thanks for the invitation, but I have to work late that evening, so I can't come."},{"s":"这家公司花了很多钱在电视上做（  ），所以很多人都知道他们的手机。","a":"广告","en":"This company spent a lot on TV advertising, so many people know their phones."},{"s":"A：你觉得小李这个人怎么样？  B：他最大的（  ）是很诚实，大家都相信他。","a":"优点","en":"A: What do you think of Xiao Li? B: His biggest strength is honesty; everyone trusts him."},{"s":"A：你们公司招聘的（  ）是什么？  B：首先要有经验，其次要会说英语。","a":"标准","en":"A: What are your company's hiring criteria? B: First, experience; second, the ability to speak English."},{"s":"A：这本书为什么这么流行？  B：因为它（  ）了很多年轻人的欢迎。","a":"受到","en":"A: Why is this book so popular? B: Because it's been welcomed by lots of young people."}],"grammar":[{"q":"他（  ）知道玩手机，作业一个字也没写。","opts":["尤其","光","任何","实在"],"a":1,"exp":"光知道 + verb = 'only knows how to …', criticising doing nothing else.","g":0},{"q":"这个城市的夏天很热，（  ）是七八月。","opts":["任何","光","实在","尤其"],"a":3,"exp":"尤其是 picks out July and August as the hottest part of summer.","g":1},{"q":"你放心，遇到（  ）困难，我都会帮你。","opts":["任何","尤其","光","实在"],"a":0,"exp":"任何 + noun … 都 = 'whatever difficulty'.","g":2},{"q":"今天的作业（  ）太多了，我写到十二点还没写完。","opts":["尤其","任何","实在","光"],"a":2,"exp":"实在太…了 stresses how truly excessive the homework is.","g":3},{"q":"我对这个城市的印象很好，（  ）是这里的老房子。","opts":["任何","实在","尤其","每"],"a":2,"exp":"尤其是 + noun singles out the old houses as what impressed most.","g":1},{"q":"我（  ）走不动了，咱们休息一会儿吧。","opts":["光","实在","任何","尤其"],"a":1,"exp":"实在 + negative stresses 'I really can't walk any more'.","g":3}],"order":[{"parts":["这台冰箱虽然有点儿旧了，","但是制冷效果还不错，","所以我们还不想换新的。"],"en":"Although this fridge is a bit old, it still cools well, so we don't want to replace it yet."},{"parts":["我昨天去商场买衬衫，","发现鞋也在打折，","就顺便买了一双。"],"en":"Yesterday I went to the mall for a shirt, found shoes were on sale too, and bought a pair while I was at it."},{"parts":["选礼物的时候，","要先考虑他的年龄和爱好，","这样他才会喜欢。"],"en":"When choosing a present, first consider his age and hobbies; only then will he like it."}],"reading":[{"p":"张伟上个月买了一个新沙发。广告上说这个沙发坐上去特别舒服，可是买回来以后，他发现实际坐起来一点儿也不舒服，跟广告上说的完全不一样。","q":"★ 根据这段话，可以知道：","opts":["张伟对沙发很满意","广告上说的跟实际不一样","沙发是朋友送的"],"a":1,"en":"Zhang Wei bought a new sofa last month. The ad said it was very comfortable, but at home he found it wasn't comfortable at all — completely different from the ad. ★ The ad differs from reality."},{"p":"林小雨喜欢艺术，周末常常在家画画儿。上个月她把自己画的一张画儿寄给了远方的朋友，朋友看到以后高兴极了。","q":"★ 根据这段话，可以知道：","opts":["林小雨把画儿送给了朋友","林小雨不喜欢画画儿","朋友来林小雨家看画儿"],"a":0,"en":"Lin Xiaoyu loves art and often paints at home at weekends. Last month she mailed one of her paintings to a faraway friend, who was overjoyed. ★ She gave a painting to her friend."},{"p":"王经理买东西有一个习惯：任何东西，他都要先在网上看看用过的人怎么说，然后再决定买不买。他说，这样虽然要多花一点儿时间，但是很少买到不满意的东西。","q":"★ 根据这段话，可以知道：","opts":["王经理买东西很快","王经理经常买到不好的东西","王经理买东西前会先了解一下"],"a":2,"en":"Manager Wang has a habit: for anything he buys, he first checks online what users say, then decides. It takes a bit more time but he rarely buys anything disappointing. ★ He finds out about things before buying."}],"write":[{"words":["这种","葡萄","的味道","特别甜。"],"en":"These grapes taste especially sweet."},{"words":["我们","受到了","热情的","欢迎。"],"en":"We received a warm welcome."},{"words":["他","顺便","帮我","买了一瓶水。"],"en":"He bought me a bottle of water while he was at it."},{"words":["这台冰箱","的价格","实在","太高了。"],"en":"This fridge's price is really too high."}],"hanzi":[{"s":"这个沙（  ）坐起来很舒服。","py":"fā","a":"发"},{"s":"我想把这本书（  ）给远方的朋友。","py":"jì","a":"寄"},{"s":"他对（  ）术很感兴趣。","py":"yì","a":"艺"},{"s":"这台空调的制（  ）效果不太好。","py":"lěng","a":"冷"}]},"tx":[{"t":"在家具店 · At the furniture store","scene":"Zhang Wei has just moved, and Lin Xiaoyu helps him choose a sofa.","g":[0,3],"lines":[{"sp":"张伟","s":"m","zh":"小雨，你看这个沙发怎么样？样子挺流行的，正在打折。","py":"Xiǎoyǔ, nǐ kàn zhège shāfā zěnmeyàng? Yàngzi tǐng liúxíng de, zhèngzài dǎzhé.","en":"Xiaoyu, what do you think of this sofa? It's a trendy style, and it's on sale."},{"sp":"林小雨","s":"f","zh":"好看是好看，可是你别光看样子，还要看质量。你坐上去试试。","py":"Hǎokàn shì hǎokàn, kěshì nǐ bié guāng kàn yàngzi, hái yào kàn zhìliàng. Nǐ zuò shàngqu shìshi.","en":"It is nice-looking, but don't just go by looks — check the quality too. Sit on it and see."},{"sp":"张伟","s":"m","zh":"嗯……坐着不太舒服，而且打完折还要八千块，实在太贵了。","py":"Ńg…… zuòzhe bú tài shūfu, érqiě dǎwán zhé hái yào bāqiān kuài, shízài tài guì le.","en":"Hmm… it's not very comfortable, and even after the discount it's 8,000 yuan — really too expensive."},{"sp":"林小雨","s":"f","zh":"买家具要多考虑自己的实际需要。你的房间不大，买个小一点儿、质量好的就够了。","py":"Mǎi jiājù yào duō kǎolǜ zìjǐ de shíjì xūyào. Nǐ de fángjiān bú dà, mǎi gè xiǎo yìdiǎnr, zhìliàng hǎo de jiù gòu le.","en":"With furniture you should think about what you actually need. Your room isn't big; a smaller, good-quality one is enough."},{"sp":"张伟","s":"m","zh":"那边那个蓝色的呢？价格才三千，样子也不错。","py":"Nàbiān nàge lánsè de ne? Jiàgé cái sānqiān, yàngzi yě búcuò.","en":"What about that blue one over there? Only 3,000, and it looks good too."},{"sp":"林小雨","s":"f","zh":"这个好，坐着也舒服。就是这家店好像只能用现金，你带够钱了吗？","py":"Zhège hǎo, zuòzhe yě shūfu. Jiùshì zhè jiā diàn hǎoxiàng zhǐ néng yòng xiànjīn, nǐ dàigòu qián le ma?","en":"That one's good, and comfy. Only thing is this shop seems to take cash only — did you bring enough?"},{"sp":"张伟","s":"m","zh":"带了，我出门前专门去了一次银行。","py":"Dài le, wǒ chūmén qián zhuānmén qùle yí cì yínháng.","en":"I did — I made a special trip to the bank before I came out."}]},{"t":"买空调 · Buying an air conditioner","scene":"Mark wants an air conditioner and asks Liu Fang how to choose one.","g":[1,2],"lines":[{"sp":"马克","s":"m","zh":"刘芳，我房间太热了，想买一台空调。你觉得电视上广告里的那种怎么样？","py":"Liú Fāng, wǒ fángjiān tài rè le, xiǎng mǎi yì tái kōngtiáo. Nǐ juéde diànshì shang guǎnggào li de nà zhǒng zěnmeyàng?","en":"Liu Fang, my room is too hot; I want to buy an air conditioner. What do you think of the one in that TV ad?"},{"sp":"刘芳","s":"f","zh":"任何广告都只说优点，不说缺点。你要看实际的制冷效果。","py":"Rènhé guǎnggào dōu zhǐ shuō yōudiǎn, bù shuō quēdiǎn. Nǐ yào kàn shíjì de zhìlěng xiàoguǒ.","en":"Every ad only talks about the good points, never the bad ones. You need to look at how well it actually cools."},{"sp":"马克","s":"m","zh":"那我应该按照什么标准来选呢？","py":"Nà wǒ yīnggāi ànzhào shénme biāozhǔn lái xuǎn ne?","en":"So what standard should I use to choose?"},{"sp":"刘芳","s":"f","zh":"我的标准是：制冷要快，声音要小，尤其是晚上睡觉的时候，声音大了就睡不好。","py":"Wǒ de biāozhǔn shì: zhìlěng yào kuài, shēngyīn yào xiǎo, yóuqí shì wǎnshang shuìjiào de shíhou, shēngyīn dà le jiù shuì bu hǎo.","en":"My rule: it should cool fast and be quiet — especially at night, because if it's loud you can't sleep well."},{"sp":"马克","s":"m","zh":"有道理。明天我去商场看看，你如果有空，能陪我去吗？","py":"Yǒu dàolǐ. Míngtiān wǒ qù shāngchǎng kànkan, nǐ rúguǒ yǒu kòng, néng péi wǒ qù ma?","en":"Makes sense. I'll go to the mall tomorrow — if you're free, could you come with me?"},{"sp":"刘芳","s":"f","zh":"可以啊，我正好要去那边给我妈寄个生日礼物，顺便陪你去看看。","py":"Kěyǐ a, wǒ zhènghǎo yào qù nàbiān gěi wǒ mā jì gè shēngrì lǐwù, shùnbiàn péi nǐ qù kànkan.","en":"Sure — I happen to be going that way to mail my mum a birthday present, so I'll come along while I'm there."}]},{"t":"老师的邀请 · The teacher's invitation","scene":"Teacher Chen phones Lin Xiaoyu to invite the class to a small party at her home.","g":[1,3],"lines":[{"sp":"陈老师","s":"f","zh":"小雨，这个星期六我家有个小聚会，想邀请你和同学们来玩儿。","py":"Xiǎoyǔ, zhège xīngqīliù wǒ jiā yǒu gè xiǎo jùhuì, xiǎng yāoqǐng nǐ hé tóngxuémen lái wánr.","en":"Xiaoyu, I'm having a small get-together at home this Saturday and I'd like to invite you and your classmates."},{"sp":"林小雨","s":"f","zh":"谢谢陈老师！我们一定去。需要我们带点儿什么吗？","py":"Xièxie Chén lǎoshī! Wǒmen yídìng qù. Xūyào wǒmen dài diǎnr shénme ma?","en":"Thank you, Ms Chen! We'll definitely come. Should we bring anything?"},{"sp":"陈老师","s":"f","zh":"什么都不用带。我先生很会做菜，尤其是他做的鱼，味道特别好。","py":"Shénme dōu búyòng dài. Wǒ xiānsheng hěn huì zuò cài, yóuqí shì tā zuò de yú, wèidào tèbié hǎo.","en":"No need to bring anything. My husband is a good cook — his fish especially tastes wonderful."},{"sp":"林小雨","s":"f","zh":"太好了！那我们带点儿水果吧，我知道您喜欢吃葡萄。","py":"Tài hǎo le! Nà wǒmen dài diǎnr shuǐguǒ ba, wǒ zhīdào nín xǐhuan chī pútao.","en":"Great! Then we'll bring some fruit — I know you like grapes."},{"sp":"陈老师","s":"f","zh":"你们实在太客气了。对了，我先生是教艺术的，家里有很多他画的画儿，你们可以看看。","py":"Nǐmen shízài tài kèqi le. Duì le, wǒ xiānsheng shì jiāo yìshù de, jiā li yǒu hěn duō tā huà de huàr, nǐmen kěyǐ kànkan.","en":"You're really too kind. Oh, my husband teaches art, and there are lots of his paintings at home you can look at."},{"sp":"林小雨","s":"f","zh":"我听说过！他的画儿在网上受到了很多年轻人的欢迎。","py":"Wǒ tīngshuō guo! Tā de huàr zài wǎngshang shòudàole hěn duō niánqīngrén de huānyíng.","en":"I've heard! His paintings are really popular with young people online."}]},{"t":"电视节目：聊购物 · TV talk: shopping","scene":"A TV reporter interviews Manager Wang about online shopping habits.","g":[0,1,2],"lines":[{"sp":"记者","s":"f","zh":"王经理，现在很多人喜欢在网上购物，您怎么看？","py":"Wáng jīnglǐ, xiànzài hěn duō rén xǐhuan zài wǎngshang gòuwù, nín zěnme kàn?","en":"Manager Wang, lots of people now like shopping online. What's your view?"},{"sp":"王经理","s":"m","zh":"网上购物方便，价格也便宜一些。可是有的人一看见打折就买，买回来的东西光放着不用，这就是浪费。","py":"Wǎngshang gòuwù fāngbiàn, jiàgé yě piányi yìxiē. Kěshì yǒude rén yí kànjiàn dǎzhé jiù mǎi, mǎi huílai de dōngxi guāng fàngzhe bú yòng, zhè jiù shì làngfèi.","en":"Online shopping is convenient and a bit cheaper. But some people buy the moment they see a discount, and then the things just sit there unused — that's waste."},{"sp":"记者","s":"f","zh":"哪些人比较容易这样呢？","py":"Nǎxiē rén bǐjiào róngyì zhèyàng ne?","en":"Who tends to do that?"},{"sp":"王经理","s":"m","zh":"跟年龄关系不大，主要看习惯。但是年轻人尤其容易受到广告的影响。","py":"Gēn niánlíng guānxi bú dà, zhǔyào kàn xíguàn. Dànshì niánqīngrén yóuqí róngyì shòudào guǎnggào de yǐngxiǎng.","en":"It's not really about age; it's mostly habit. But young people are especially easily influenced by ads."},{"sp":"记者","s":"f","zh":"那您觉得买东西以前应该注意什么？","py":"Nà nín juéde mǎi dōngxi yǐqián yīnggāi zhùyì shénme?","en":"So what should people pay attention to before buying?"},{"sp":"王经理","s":"m","zh":"买任何东西以前，都先问问自己：这个东西我真的需要吗？想清楚了再买，肯定没错。","py":"Mǎi rènhé dōngxi yǐqián, dōu xiān wènwen zìjǐ: zhège dōngxi wǒ zhēn de xūyào ma? Xiǎng qīngchu le zài mǎi, kěndìng méi cuò.","en":"Before buying anything, ask yourself: do I really need this? Think it through first and you can't go wrong."}]}]},{"n":6,"cn":"一分钱一分货","en":"The higher the price, the better the quality","vocab":[{"w":"果汁","p":"guǒzhī","pos":"n.","d":"fruit juice"},{"w":"售货员","p":"shòuhuòyuán","pos":"n.","d":"salesperson"},{"w":"袜子","p":"wàzi","pos":"n.","d":"socks"},{"w":"打扰","p":"dǎrǎo","pos":"v.","d":"to disturb, to bother"},{"w":"竟然","p":"jìngrán","pos":"adv.","d":"indicating unexpectedness"},{"w":"西红柿","p":"xīhóngshì","pos":"n.","d":"tomato"},{"w":"百分之","p":"bǎifēnzhī","pos":"num.","d":"percent"},{"w":"倍","p":"bèi","pos":"m.","d":"times, -fold"},{"w":"皮肤","p":"pífū","pos":"n.","d":"skin"},{"w":"好处","p":"hǎochu","pos":"n.","d":"benefit, advantage"},{"w":"尝","p":"cháng","pos":"v.","d":"to taste"},{"w":"轻","p":"qīng","pos":"adj.","d":"light, of little weight"},{"w":"方面","p":"fāngmiàn","pos":"n.","d":"aspect"},{"w":"值得","p":"zhíde","pos":"v.","d":"to be worth"},{"w":"活动","p":"huódòng","pos":"n.","d":"activity, event"},{"w":"内","p":"nèi","pos":"n.","d":"in, within"},{"w":"免费","p":"miǎnfèi","pos":"v.","d":"to be free of charge"},{"w":"修理","p":"xiūlǐ","pos":"v.","d":"to repair, to mend"},{"w":"支持","p":"zhīchí","pos":"v.","d":"to support"},{"w":"举行","p":"jǔxíng","pos":"v.","d":"to hold (a meeting, event, etc.)"},{"w":"满","p":"mǎn","pos":"v.","d":"to reach a quota or limit"},{"w":"其中","p":"qízhōng","pos":"n.","d":"among (which, them, etc.)"},{"w":"小说","p":"xiǎoshuō","pos":"n.","d":"novel, fiction"},{"w":"会员卡","p":"huìyuánkǎ","pos":"n.","d":"membership card"},{"w":"所有","p":"suǒyǒu","pos":"adj.","d":"all"},{"w":"获得","p":"huòdé","pos":"v.","d":"to get, to obtain"},{"w":"情况","p":"qíngkuàng","pos":"n.","d":"situation, circumstances"},{"w":"例如","p":"lìrú","pos":"v.","d":"for example"},{"w":"举办","p":"jǔbàn","pos":"v.","d":"to hold, to conduct"},{"w":"各","p":"gè","pos":"pron.","d":"various, different"},{"w":"降低","p":"jiàngdī","pos":"v.","d":"to lower, to reduce"}],"proper":"","grammar":[{"t":"竟然 — unexpectedly, to one's surprise","m":"竟然 is an adverb placed before the verb/predicate to show that something happened against the speaker's expectation — surprising, often surprisingly good or bad. It expresses the speaker's feeling, so it is common with 会、是、这么、没. Compare 居然 (very similar, more colloquial) and 果然 (the opposite: 'just as expected').","ex":[["这么简单的问题，他竟然答错了。","Such an easy question, and he actually got it wrong."],["我以为这双鞋很贵，没想到竟然只要五十块。","I thought these shoes were expensive; to my surprise they're only fifty yuan."],["他学了半年汉语，竟然能看懂中文小说了。","He's studied Chinese for just half a year and, amazingly, can already read Chinese novels."]]},{"t":"百分之…… / ……倍 — percentages and multiples","m":"百分之 + number expresses a percentage: 百分之二十 = 20% (the 百分之 comes FIRST, unlike English). 倍 measures multiples: A 是 B 的三倍 'A is three times B'; 多了一倍 'increased by 100% (doubled)'; 提高了两倍 'is now three times as much'. To compare, use A 比 B 多/贵 + number + 倍. For decreases, use 百分之 rather than 倍 (降低了百分之三十).","ex":[["这个月的电费是上个月的两倍。","This month's electricity bill is twice last month's."],["我们班百分之八十的同学都会开车。","Eighty percent of the students in our class can drive."],["换了新工作以后，他的收入多了一倍。","After changing jobs, his income doubled."]]},{"t":"值得 — be worth (doing)","m":"值得 is followed by a verb (phrase) and means 'something is worth doing' — 值得一看、值得买、值得考虑. The thing being judged is the subject: 这本书值得读. Negative: 不值得. It can also stand alone as a predicate: 花这么多钱，值得吗？ Do not confuse it with 值 + price ('be worth X money').","ex":[["这个公园非常有名，很值得去看看。","This park is very famous and well worth a visit."],["为了这么小的事情生气，不值得。","It's not worth getting angry over such a small thing."],["这家店的东西虽然贵一点儿，但是值得买。","This shop's things are a bit pricey, but worth buying."]]},{"t":"其中 — among them / of which","m":"其中 means 'among them, in it'. It refers back to a group or whole mentioned just before and picks out a part of it, so it usually starts the second clause: 我们班有二十个人，其中有八个是男生. It cannot be placed after a noun like 中间 (wrong: 学生其中); use 其中 alone or 其中的 + noun / 其中一个.","ex":[["这次一共来了三十个人，其中一半是第一次来。","Thirty people came this time, half of whom were here for the first time."],["我看过很多小说，其中最喜欢的是这一本。","I've read many novels; of them my favourite is this one."],["他做了五道菜，其中有两道是他第一次做。","He made five dishes, two of which he was cooking for the first time."]]}],"ex":{"judge":[{"s":"我买了一台洗衣机，商店说三年内免费修理。上个月洗衣机坏了，我给商店打了个电话，第二天就有人来修好了，一分钱也没花。","st":"★ 修理洗衣机花了不少钱。","a":false,"en":"I bought a washing machine with three years of free repairs. Last month it broke; I phoned the shop and someone fixed it the next day without my paying anything. ★ Repairing it cost a lot."},{"s":"西红柿是很多人都喜欢的蔬菜，它不仅味道好，而且对皮肤有很多好处。有人说，常吃西红柿的人看起来更年轻。","st":"★ 常吃西红柿对皮肤好。","a":true,"en":"Tomatoes are a vegetable many people love. They taste good and are very good for the skin; some say people who eat them often look younger. ★ Eating tomatoes regularly is good for the skin."},{"s":"这家书店这个月举行读书活动，买书满一百块就送一本小说。我买了一百二十块的书，获得了一本免费的小说。","st":"★ 说话人在书店买了不到一百块的书。","a":false,"en":"This bookshop is holding a reading event this month: spend 100 yuan and get a free novel. I spent 120 and got a free novel. ★ The speaker spent under 100 yuan."},{"s":"以前这种电脑一台要一万多，现在价格降低了很多，只要四五千块，很多学生也买得起了。","st":"★ 这种电脑现在比以前便宜。","a":true,"en":"This computer used to cost over 10,000; now the price has dropped a lot to 4,000–5,000, so many students can afford it. ★ It's cheaper now than before."},{"s":"我们公司有两百多个人，其中百分之六十是女的。所以每次公司举办活动，女同事都比男同事多。","st":"★ 这个公司男同事比女同事多。","a":false,"en":"Our company has over 200 people, 60% of whom are women, so at every company event there are more female colleagues than male. ★ There are more men than women."}],"listen":[{"dlg":["男：这双袜子多少钱？","女：十五块一双，有会员卡的话可以打九折。"],"q":"女的最可能是做什么的？","opts":["老师","售货员","医生"],"a":1,"en":"M: How much are these socks? W: Fifteen a pair, 10% off with a membership card. Q: What is the woman most likely?"},{"dlg":["女：你尝尝这个果汁，是我自己做的。","男：真好喝！你竟然还会做果汁。"],"q":"男的觉得怎么样？","opts":["果汁太甜了","没想到她会做","不想喝"],"a":1,"en":"W: Try this juice, I made it myself. M: Delicious! I didn't know you could make juice. Q: How does the man feel?"},{"dlg":["男：这个箱子看起来很大，重不重？","女：一点儿也不重，很轻，你拿一下试试。"],"q":"关于箱子，可以知道什么？","opts":["很轻","很重","很小"],"a":0,"en":"M: This suitcase looks big — is it heavy? W: Not at all, it's light. Try lifting it. Q: What do we know about the suitcase?"},{"dlg":["女：对不起，打扰一下，请问这附近有超市吗？","男：往前走两百米，左边就有一个。"],"q":"女的想去哪儿？","opts":["银行","饭馆","超市"],"a":2,"en":"W: Sorry to bother you, is there a supermarket near here? M: Go straight 200 metres, there's one on the left. Q: Where does she want to go?"},{"dlg":["男：你们学校下个月要举办运动会吗？","女：是啊，各个班都要参加。","男：你参加吗？","女：参加，我参加跑步比赛，我们班的同学都很支持我。"],"q":"女的要参加什么比赛？","opts":["游泳","跑步","打篮球"],"a":1,"en":"M: Is your school holding a sports day next month? W: Yes, every class takes part. M: Are you taking part? W: Yes, the running race; my classmates are all behind me. Q: Which event will she enter?"}],"match":[{"q":"对不起，打扰你了。","r":"没关系，有什么事吗？"},{"q":"这家店的东西都是免费的吗？","r":"不是，只有今天参加活动的才免费。"},{"q":"你看过这本小说吗？","r":"看过，写得很好，值得一看。"},{"q":"你的电脑修理好了吗？","r":"还没有，修理的人说明天才能修好。"},{"q":"我想换一个工作，你觉得呢？","r":"不管你做什么决定，我都支持你。"}],"fill":[{"s":"天气冷了，我想买几双厚一点儿的（  ）。","a":"袜子","en":"It's getting cold; I want to buy a few pairs of thicker socks."},{"s":"这个手机很（  ），放在口袋里一点儿感觉都没有。","a":"轻","en":"This phone is so light you can't even feel it in your pocket."},{"s":"这几年，这种手机的价格（  ）了不少，很多学生都买得起了。","a":"降低","en":"In recent years the price of this phone has dropped quite a bit; many students can now afford it."},{"s":"多喝水对身体有很多（  ）。","a":"好处","en":"Drinking plenty of water has many benefits for the body."},{"s":"这家店的（  ）都很热情，有什么问题都可以问她们。","a":"售货员","en":"The shop assistants here are very friendly; you can ask them anything."},{"s":"A：这个菜是我第一次做，你（  ）一下怎么样？  B：嗯，比饭馆里做的还好吃！","a":"尝","en":"A: It's my first time making this dish — taste it, how is it? B: Mmm, better than a restaurant's!"},{"s":"A：你的自行车怎么了？  B：坏了，我正要拿去（  ）。","a":"修理","en":"A: What's wrong with your bike? B: It's broken; I'm about to take it to be repaired."},{"s":"A：参加这个活动要花钱吗？  B：不用，完全（  ）。","a":"免费","en":"A: Does it cost money to join this event? B: No, it's completely free."},{"s":"A：现在你那边的（  ）怎么样了？  B：好多了，问题已经差不多解决了。","a":"情况","en":"A: How's the situation on your end now? B: Much better; the problem's mostly solved."},{"s":"A：我想去学画画儿，你觉得怎么样？  B：好啊，我（  ）你！","a":"支持","en":"A: I'd like to take up painting, what do you think? B: Great, I support you!"}],"grammar":[{"q":"我等了他一个小时，他（  ）忘了我们今天要见面。","opts":["竟然","其中","值得","倍"],"a":0,"exp":"竟然 shows the speaker's surprise that he forgot.","g":0},{"q":"这家店的果汁太贵了，价格是外面的两（  ）。","opts":["次","倍","个","遍"],"a":1,"exp":"A 是 B 的两倍 = A is twice B; 倍 is the measure for multiples.","g":1},{"q":"这个城市（  ）三十的人都住在城东。","opts":["倍","其中","百分之","所有"],"a":2,"exp":"Percentages are said 百分之 + number.","g":1},{"q":"这部电影拍得很好，（  ）一看。","opts":["竟然","其中","值得","例如"],"a":2,"exp":"值得 + verb = 'worth doing'.","g":2},{"q":"我们班有二十个学生，（  ）有五个是从国外来的。","opts":["其中","竟然","值得","所有"],"a":0,"exp":"其中 refers back to the twenty students and picks out five of them.","g":3},{"q":"为了省一点儿钱，跑那么远去买，我觉得不（  ）。","opts":["其中","竟然","倍","值得"],"a":3,"exp":"不值得 = 'not worth it', used as a predicate.","g":2}],"order":[{"parts":["商场这个周末要举办购物活动，","所有的衣服都打八折，","我们一起去看看吧。"],"en":"The mall is holding a shopping event this weekend — all clothes 20% off. Let's go and have a look."},{"parts":["我买了五本小说，","其中两本是送给我妹妹的，","她最喜欢看小说了。"],"en":"I bought five novels, two of which are for my younger sister — she loves novels."},{"parts":["办了会员卡以后，","每次买东西都能打折，","还可以获得一些小礼物。"],"en":"Once you have a membership card, you get a discount every time you buy, plus some small gifts."},{"parts":["这家店的空调虽然比别的地方贵，","但是三年内可以免费修理，","所以还是很值得买的。"],"en":"This shop's air conditioners are pricier than elsewhere, but come with three years of free repairs, so they're still worth buying."}],"reading":[{"p":"现在很多商店都有会员卡。有了会员卡，买东西可以打折，过生日的时候还能获得一份小礼物。但是有的人钱包里有十几张会员卡，其中很多张一年也用不了一次。","q":"★ 关于会员卡，可以知道：","opts":["只能在生日那天用","有的人办了很多却不常用","所有商店都没有会员卡"],"a":1,"en":"Many shops have membership cards: discounts, and a small gift on your birthday. But some people carry a dozen cards, many of which they don't use once a year. ★ Some people have many cards but rarely use them."},{"p":"我妈妈每天早上都要喝一杯西红柿果汁。她说西红柿对皮肤好，而且还能让人少生病。我以前不喜欢这个味道，可是喝了一个月以后，竟然也觉得挺好喝的。","q":"★ 说话人现在觉得西红柿果汁：","opts":["挺好喝的","太难喝了","对身体不好"],"a":0,"en":"My mum drinks a glass of tomato juice every morning, saying it's good for the skin and helps you get ill less. I didn't like the taste, but after a month I surprisingly found it quite nice. ★ The speaker now finds it quite tasty."},{"p":"网上购物有很多好处，例如价格便宜、不用出门等等。但是也有一些方面让人不放心，例如买到的东西跟照片不一样，或者坏了以后找不到地方修理。","q":"★ 这段话主要谈的是：","opts":["怎么修理东西","网上购物的好处和问题","怎样拍好看的照片"],"a":1,"en":"Online shopping has many advantages, e.g. low prices and not having to go out. But some aspects are worrying, e.g. items differing from the photos, or nowhere to get them repaired. ★ It discusses the pros and cons of online shopping."},{"p":"去年我们城市举行了一次读书活动，参加的人比前年多了一倍。很多人说，这个活动让他们重新喜欢上了看书，所以今年还要再举办一次。","q":"★ 根据这段话，去年参加读书活动的人：","opts":["比前年少","跟前年一样多","是前年的两倍"],"a":2,"en":"Last year our city held a reading event; participants doubled compared with the year before. Many said it made them love books again, so it will be held again this year. ★ Last year's participants were twice the previous year's."}],"write":[{"words":["这本小说","值得","我们","好好儿读一读。"],"en":"This novel is worth reading carefully."},{"words":["他","竟然","一个人","把房间打扫完了。"],"en":"Surprisingly, he cleaned the whole room on his own."},{"words":["这次比赛","他","获得了","第一名。"],"en":"He took first place in this competition."},{"words":["今年的","收入","比去年","多了一倍。"],"en":"This year's income has doubled compared with last year."},{"words":["不好意思，","这么晚","还来","打扰你。"],"en":"Sorry to bother you so late."}],"hanzi":[{"s":"这家店的果（  ）都是新鲜水果做的。","py":"zhī","a":"汁"},{"s":"多吃水果对皮（  ）好。","py":"fū","a":"肤"},{"s":"这个房子的价格比十年前高了三（  ）。","py":"bèi","a":"倍"},{"s":"这个电影很值（  ）一看。","py":"dé","a":"得"},{"s":"他的电脑坏了，正在修（  ）。","py":"lǐ","a":"理"}]},"rv":{"judge":[{"s":"马克上周去买手机，售货员告诉他，现在办一张会员卡就能免费获得一个手机包。马克觉得很不错，就办了一张。","st":"★ 马克办了会员卡。","a":true,"en":"Last week Mark went to buy a phone. The salesperson said if he got a membership card now he'd get a free phone case. Mark thought it was a good deal and got one. ★ Mark got a membership card."},{"s":"刘芳以前觉得跑步很无聊，可是跟朋友一起跑了一个月以后，她竟然爱上了这个运动，现在每天早上都去跑。","st":"★ 刘芳现在还是觉得跑步很无聊。","a":false,"en":"Liu Fang used to find running boring, but after a month of running with friends she surprisingly fell in love with it and now runs every morning. ★ She still finds running boring."},{"s":"这本小说一共有十个故事，其中我最喜欢第三个，因为它让我想起了自己小时候的生活。","st":"★ 说话人最喜欢小说里的最后一个故事。","a":false,"en":"This novel has ten stories; my favourite is the third, because it reminds me of my childhood. ★ The speaker likes the last story best."},{"s":"我们公司今年的情况不错，卖出去的空调比去年多了一倍，所以老板给每个人都发了奖金。","st":"★ 公司今年卖的空调是去年的两倍。","a":true,"en":"Our company did well this year: we sold twice as many air conditioners as last year, so the boss gave everyone a bonus. ★ This year's sales were double last year's."}],"listen":[{"dlg":["女：这个西红柿鸡蛋汤是你做的？","男：对，你尝尝，味道怎么样？","女：正好，比我做的好吃多了。","男：那你以后常来我家吃饭吧。"],"q":"女的觉得这个菜怎么样？","opts":["太酸了","很好吃","没有放盐"],"a":1,"en":"W: Did you make this tomato and egg soup? M: Yes, taste it — zhé ma? Qízhōng nǎ zhǒng zuì shòu huānyíng?","en":"Are these socks on sale too? Which of them is most popular?"},{"sp":"售货员","s":"f","zh":"白色的这种卖得最好，很轻，穿着也舒服。","py":"Báisè de zhè zhǒng mài de zuì hǎo, hěn qīng, chuānzhe yě shūfu.","en":"This white kind sells best — it's light and comfortable."}]},{"t":"修电脑 · Getting a computer repaired","scene":"Zhang Wei's laptop broke; he tells Lin Xiaoyu how the repair went.","g":[0,2],"lines":[{"sp":"林小雨","s":"f","zh":"你的电脑修好了吗？要花多少钱？","py":"Nǐ de diànnǎo xiūhǎo le ma? Yào huā duōshao qián?","en":"Is your computer fixed? How much did it cost?"},{"sp":"张伟","s":"m","zh":"修好了，竟然一分钱都没花！店里说买了一年内都是免费修理。","py":"Xiūhǎo le, jìngrán yì fēn qián dōu méi huā! Diàn li shuō mǎile yì nián nèi dōu shì miǎnfèi xiūlǐ.","en":"Yes — and amazingly it didn't cost a cent! The shop said repairs are free within a year of purchase."},{"sp":"林小雨","s":"f","zh":"太好了。我还以为你得买台新的呢。","py":"Tài hǎo le. Wǒ hái yǐwéi nǐ děi mǎi tái xīn de ne.","en":"Great. I thought you'd have to buy a new one."},{"sp":"张伟","s":"m","zh":"刚买的时候我觉得太贵了，现在看来，多花点儿钱买个质量好的，还是值得的。","py":"Gāng mǎi de shíhou wǒ juéde tài guì le, xiànzài kànlái, duō huā diǎnr qián mǎi gè zhìliàng hǎo de, háishi zhíde de.","en":"When I bought it I thought it was too expensive; now I see spending a bit more on good quality was worth it."},{"sp":"林小雨","s":"f","zh":"是啊，买东西不能光看价格，修理、服务这些方面也要考虑。","py":"Shì a, mǎi dōngxi bù néng guāng kàn jiàgé, xiūlǐ, fúwù zhèxiē fāngmiàn yě yào kǎolǜ.","en":"Right, you can't only look at price — repairs, service and so on have to be considered too."},{"sp":"张伟","s":"m","zh":"对，这就叫“一分钱一分货”。","py":"Duì, zhè jiù jiào “yì fēn qián yì fēn huò”.","en":"Exactly — that's what 'you get what you pay for' means."}]},{"t":"读书活动 · A reading event","scene":"Mark tells Teacher Chen about a novel he won at a bookshop event.","g":[1,2,3],"lines":[{"sp":"马克","s":"m","zh":"陈老师，上个周末书店举办了一个读书活动，我参加了，还获得了一本小说！","py":"Chén lǎoshī, shàng ge zhōumò shūdiàn jǔbànle yí gè dúshū huódòng, wǒ cānjiā le, hái huòdéle yì běn xiǎoshuō!","en":"Ms Chen, the bookshop held a reading event last weekend — I took part and even won a novel!"},{"sp":"陈老师","s":"f","zh":"真不错！参加的人多吗？","py":"Zhēn búcuò! Cānjiā de rén duō ma?","en":"Well done! Were there a lot of people?"},{"sp":"马克","s":"m","zh":"特别多，比去年多了一倍。其中有很多是外国留学生，各个国家的都有。","py":"Tèbié duō, bǐ qùnián duōle yí bèi. Qízhōng yǒu hěn duō shì wàiguó liúxuéshēng, gège guójiā de dōu yǒu.","en":"Loads — twice as many as last year. Many of them were foreign students from all sorts of countries."},{"sp":"陈老师","s":"f","zh":"你得到的是哪本小说？","py":"Nǐ dédào de shì nǎ běn xiǎoshuō?","en":"Which novel did you get?"},{"sp":"马克","s":"m","zh":"是一本写北京人生活的，听说写得很好，但是我担心太难了，看不懂。","py":"Shì yì běn xiě Běijīng rén shēnghuó de, tīngshuō xiě de hěn hǎo, dànshì wǒ dānxīn tài nán le, kàn bu dǒng.","en":"One about people's lives in Beijing. I hear it's very well written, but I'm worried it's too hard for me."},{"sp":"陈老师","s":"f","zh":"别担心，我支持你慢慢看。这本书很值得一读，有不懂的地方就来问我。","py":"Bié dānxīn, wǒ zhīchí nǐ mànmàn kàn. Zhè běn shū hěn zhíde yì dú, yǒu bù dǒng de dìfang jiù lái wèn wǒ.","en":"Don't worry, I'm all for you reading it slowly. It's well worth reading — if there's anything you don't understand, come and ask me."}]},{"t":"西红柿的好处 · The benefits of tomatoes","scene":"On a radio health show, a host talks with a doctor about tomatoes.","g":[0,1],"lines":[{"sp":"记者","s":"f","zh":"医生您好，很多人想知道，常吃西红柿真的对身体好吗？","py":"Yīshēng nín hǎo, hěn duō tīngzhòng xiǎng zhīdào, cháng chī xīhóngshì zhēn de duì shēntǐ hǎo ma?","en":"Hello, doctor. Many people want to know: is eating tomatoes often really good for you?"},{"sp":"医生","s":"m","zh":"是的，西红柿的好处很多，例如对皮肤好，还能让人吃得更健康。","py":"Shì de, xīhóngshì de hǎochu hěn duō, lìrú duì pífū hǎo, hái néng ràng rén chī de gèng jiànkāng.","en":"Yes, tomatoes have many benefits — for example they're good for the skin, and they help people eat more healthily."},{"sp":"记者","s":"f","zh":"我听说西红柿里差不多都是水，是这样吗？","py":"Wǒ tīngshuō xīhóngshì li chàbuduō dōu shì shuǐ, shì zhèyàng ma?","en":"I've heard tomatoes are almost all water — is that so?"},{"sp":"医生","s":"m","zh":"对，百分之九十以上都是水。所以夏天喝一杯西红柿汁，又健康又舒服。","py":"Duì, bǎifēnzhī jiǔshí yǐshàng dōu shì shuǐ. Suǒyǐ xiàtiān hē yì bēi xīhóngshì zhī, yòu jiànkāng yòu shūfu.","en":"Right, over ninety percent is water. So a glass of tomato juice in summer is healthy and refreshing."},{"sp":"记者","s":"f","zh":"我以前一直不爱吃西红柿，最近尝了一下我妈做的西红柿汤，竟然觉得很好喝。","py":"Wǒ yǐqián yìzhí bú ài chī xīhóngshì, zuìjìn chángle yíxià wǒ mā zuò de xīhóngshì tāng, jìngrán juéde hěn hǎohē.","en":"I never used to like tomatoes, but I recently tasted my mum's tomato soup and, to my surprise, found it delicious."},{"sp":"医生","s":"m","zh":"那就好。不过不管吃什么，都要看自己的情况，吃得太多也不好。","py":"Nà jiù hǎo. Búguò bùguǎn chī shénme, dōu yào kàn zìjǐ de qíngkuàng, chī de tài duō yě bù hǎo.","en":"Good. But whatever you eat, it depends on your own situation — too much isn't good either."}]}]},{"n":7,"cn":"最好的医生是自己","en":"The best doctor is yourself","vocab":[{"w":"流血","p":"liúxuè","pos":"v.","d":"to bleed"},{"w":"擦","p":"cā","pos":"v.","d":"to wipe"},{"w":"气候","p":"qìhòu","pos":"n.","d":"climate"},{"w":"估计","p":"gūjì","pos":"v.","d":"to estimate, to reckon"},{"w":"咳嗽","p":"késou","pos":"v.","d":"to cough"},{"w":"严重","p":"yánzhòng","pos":"adj.","d":"serious, grave"},{"w":"窗户","p":"chuānghu","pos":"n.","d":"window"},{"w":"空气","p":"kōngqì","pos":"n.","d":"air"},{"w":"抽烟","p":"chōuyān","pos":"v.","d":"to smoke"},{"w":"动作","p":"dòngzuò","pos":"n.","d":"action, movement"},{"w":"帅","p":"shuài","pos":"adj.","d":"handsome"},{"w":"出现","p":"chūxiàn","pos":"v.","d":"to appear, to emerge"},{"w":"后悔","p":"hòuhuǐ","pos":"v.","d":"to regret"},{"w":"来不及","p":"láibují","pos":"v.","d":"to have not enough time to, to be too late to"},{"w":"反对","p":"fǎnduì","pos":"v.","d":"to oppose, to object to"},{"w":"大夫","p":"dàifu","pos":"n.","d":"doctor"},{"w":"植物","p":"zhíwù","pos":"n.","d":"plant"},{"w":"研究","p":"yánjiū","pos":"v.","d":"to study, to do research"},{"w":"超过","p":"chāoguò","pos":"v.","d":"to exceed, to surpass"},{"w":"散步","p":"sànbù","pos":"v.","d":"to take a walk"},{"w":"指","p":"zhǐ","pos":"v.","d":"to refer to"},{"w":"精神","p":"jīngshén","pos":"n.","d":"spirit, mind"},{"w":"教授","p":"jiàoshòu","pos":"n.","d":"professor"},{"w":"数字","p":"shùzì","pos":"n.","d":"number"},{"w":"说明","p":"shuōmíng","pos":"v.","d":"to explain, to show"},{"w":"要是","p":"yàoshi","pos":"conj.","d":"if, supposing"},{"w":"既","p":"jì","pos":"adv.","d":"(used together with “又”) both…and…"},{"w":"减肥","p":"jiǎnféi","pos":"v.","d":"to lose weight"},{"w":"辛苦","p":"xīnkǔ","pos":"adj.","d":"hard, toilsome"},{"w":"肚子","p":"dùzi","pos":"n.","d":"belly, stomach"},{"w":"感情","p":"gǎnqíng","pos":"n.","d":"affection, love"},{"w":"烦恼","p":"fánnǎo","pos":"adj.","d":"worried, vexed"},{"w":"掉","p":"diào","pos":"v.","d":"used after certain verbs, indicating the result of an action"}],"proper":"","grammar":[{"t":"既……又／也…… — both … and …","m":"既 A 又 B (or 既 A 也 B) joins two qualities or actions that exist at the same time: 既便宜又好吃. A and B are usually parallel (two adjectives or two verb phrases) and normally both positive or both negative. It sounds a little more formal than 又 A 又 B. Put 既 after the subject, never before it.","ex":[["这个办法既简单又方便。","This method is both simple and convenient."],["她既是我的老师，也是我的好朋友。","She is both my teacher and my good friend."],["多走路既能锻炼身体，又不用花钱。","Walking more keeps you fit and costs nothing."]]},{"t":"要是……（就）…… — if …, (then) …","m":"要是 is a spoken word for 'if', like 如果. The condition comes first, and the result clause often uses 就. It can be placed before or after the subject (要是你累了 / 你要是累了). 要是……的话 is also common. It is more colloquial than 如果 and is often used for advice or warnings.","ex":[["要是明天不下雨，我们就去公园散步。","If it doesn't rain tomorrow, we'll go for a walk in the park."],["你要是觉得不舒服，就早点儿回家休息吧。","If you're not feeling well, go home early and rest."],["要是早知道这么堵，我就坐地铁来了。","If I'd known the traffic would be this bad, I'd have taken the subway."]]},{"t":"V + 掉 — result complement: away, off, gone","m":"掉 after a verb is a result complement showing that something is removed, lost or gone as a result of the action: 擦掉 (wipe off), 吃掉 (eat up), 忘掉 (forget), 卖掉 (sell off), 改掉 (get rid of a habit). The negative uses 没: 没擦掉. With 得/不 it becomes a potential complement: 擦得掉 / 擦不掉.","ex":[["桌子上的字我已经擦掉了。","I've already wiped the writing off the table."],["这些旧报纸没用了，卖掉吧。","These old newspapers are no use any more — let's sell them off."],["衣服上的咖啡怎么洗也洗不掉。","However I wash it, the coffee won't come out of the shirt."]]},{"t":"来不及 — there isn't enough time; too late (to …)","m":"来不及 means there isn't enough time to do something, or it's already too late. It can be followed by a verb phrase (来不及吃早饭) or stand alone as the predicate (快走吧，要来不及了). It is very common with 后悔: 现在后悔也来不及了 'it's too late to regret it now'.","ex":[["我起晚了，来不及吃早饭就出门了。","I got up late and left without time for breakfast."],["电影七点半就开始了，你再不走就来不及了。","The film starts at 7:30 — if you don't leave now you'll be too late."],["身体不好的时候再后悔，就来不及了。","If you wait until your health is bad to regret it, it'll be too late."]]}],"ex":{"judge":[{"s":"我爸爸以前每天都要抽一包烟，还常常咳嗽。去年医生说他的情况有点儿严重，从那以后他就再也不抽烟了。","st":"★ 爸爸现在还抽烟。","a":false,"en":"My dad used to smoke a pack a day and often coughed. Last year the doctor said his condition was getting serious, and since then he's never smoked again. ★ Dad still smokes."},{"s":"这个城市的气候很好，冬天不太冷，夏天也不太热，空气也很新鲜，所以很多老人喜欢搬到这里来住。","st":"★ 这个城市的空气不错。","a":true,"en":"This city has a great climate — winters aren't too cold, summers aren't too hot, and the air is fresh, so many elderly people move here after retiring. ★ The air in this city is good."},{"s":"王教授研究植物三十多年了，他家的阳台上、窗户边，都是他种的花草。","st":"★ 王教授是研究植物的。","a":true,"en":"Professor Wang has researched plants for over thirty years; his balcony and windowsills are covered with plants he's grown. ★ Professor Wang researches plants."},{"s":"小刘为了减肥，每天晚上只喝一杯牛奶。一个月以后，她瘦了五公斤，可是精神越来越差，上班的时候总想睡觉。","st":"★ 小刘减肥以后精神更好了。","a":false,"en":"To lose weight, Xiao Liu drank only a glass of milk each evening. After a month she'd lost five kilos, but felt worse and worse and kept wanting to sleep at work. ★ She felt more energetic after dieting."},{"s":"医生说，每天吃完晚饭以后散步半个小时，既能让身体更健康，又能让人睡得更好。","st":"★ 医生认为饭后散步对身体有好处。","a":true,"en":"The doctor said a half-hour walk after dinner each day helps digestion and helps you sleep better. ★ The doctor thinks walking after meals is good for you."}],"listen":[{"dlg":["女：你怎么了？脸色这么不好。","男：我肚子疼，可能是中午吃坏了。"],"q":"男的怎么了？","opts":["头疼","肚子疼","发烧了"],"a":1,"en":"W: What's wrong? You look awful. M: My stomach hurts — maybe something I ate at lunch. Q: What's wrong with him?"},{"dlg":["男：你估计这个会还要开多长时间？","女：最少还得一个小时吧。"],"q":"女的认为会议还要开多久？","opts":["半个小时","不到一个小时","一个小时以上"],"a":2,"en":"M: How much longer do you reckon this meeting will go on? W: At least another hour. Q: How long does she think it will last?"},{"dlg":["女：外面空气不好，你还是把窗户关上吧。","男：好的，我马上关。"],"q":"女的让男的做什么？","opts":["关窗户","开窗户","出去散步"],"a":0,"en":"W: The air outside is bad, close the window. M: OK, right away. Q: What does she ask him to do?"},{"dlg":["男：你的手怎么流血了？","女：刚才切菜的时候不小心切到了。","男：快去擦一擦，我去拿药。","女：没事，不太严重。"],"q":"女的手为什么流血了？","opts":["运动的时候受伤了","切菜时切到了","在外面走路时受伤了"],"a":1,"en":"M: Why is your hand bleeding? W: I cut it by accident chopping vegetables. M: Wipe it quickly, I'll get some medicine. W: It's fine, not serious. Q: Why is her hand bleeding?"},{"dlg":["女：听说你女朋友不让你抽烟了？","男：是啊，她特别反对我抽烟，我现在已经一个月没抽了。"],"q":"关于男的，可以知道什么？","opts":["他还在抽烟","他女朋友也抽烟","他一个月没抽烟了"],"a":2,"en":"W: I hear your girlfriend has stopped you smoking? M: Yes, she's strongly against it; I haven't smoked for a month. Q: What do we know about the man?"}],"match":[{"q":"你最近怎么老是咳嗽？","r":"可能是感冒了，我明天去看看大夫。"},{"q":"这个动作我做得对不对？","r":"差不多了，手再往上一点儿就好。"},{"q":"今天工作了一整天，辛苦了！","r":"不辛苦，大家一起做，很快就做完了。"},{"q":"你后悔选这个专业吗？","r":"一点儿也不后悔，我很喜欢。"},{"q":"最近有什么烦恼吗？","r":"工作有点儿忙，但是还好。"}],"fill":[{"s":"他感冒了，一直在（  ），晚上也睡不好。","a":" etter stop smoking — it's bad for your health."},{"parts":["这位大夫既有经验，","又特别热情，","所以病人都喜欢找他看病。"],"en":"This doctor is both experienced and very warm, so warms all like to see him."},{"parts":["他每天早上都起得很晚，","常常来不及吃早饭，","所以经常肚子疼。"],"en":"He gets up late every morning, often has no time for breakfast, and so often has stomach aches."},{"parts":["研究说明，","每天散步半个小时以上的人，","身体一般都比较好。"],"en":"Research shows that people who walk over half an hour a day are generally healthier."}],"reading":[{"p":"很多人觉得减肥就是少吃饭。其实，要是一点儿东西都不吃，不仅对身体没有好处，而且以后更容易胖。最好的办法是少吃甜的东西，多运动。","q":"★ 根据这段话，减肥最好：","opts":["什么都不吃","少吃甜的，多运动","多吃甜的东西"],"a":1,"en":"Many people think losing weight means eating less. In fact, eating nothing at all not only does your body no good but makes you gain weight more easily later. The best way is less sweet food and more exercise. ★ The best way: less sweet food, more exercise."},{"p":"这里说的“好精神”，指的是一个人每天都高高兴兴的，没有什么烦恼。研究说明，每天都很高兴的人很少生病，因为人的精神对身体有很大的影响。","q":"★ 这段话主要谈的是：","opts":["精神和身体的关系","怎样研究植物","怎么去看病"],"a":0,"en":"'Good spirits' here means being cheerful every day with no worries. Research shows cheerful people rarely fall ill, because the mind greatly affects the body. ★ It's about the link between mind and health."},{"p":"我们家有很多植物，房间里、窗户边都有。妈妈说，植物不但好看，还能让房间里的空气变得更新鲜。所以每次搬家，我们都要把这些植物一起带走。","q":"★ 妈妈认为植物：","opts":["很难养","让空气变好","太多了"],"a":1,"en":"Our home has lots of plants, in the living room and by the windows. Mum says plants look nice and freshen the air, so whenever we move we take them with us. ★ Mum thinks plants improve the air."},{"p":"年轻的时候，很多人觉得自己身体好，常常工作到很晚，饭也不按时吃。等到身体出现了问题，再后悔就来不及了。所以，最好的医生就是我们自己。","q":"★ 这段话主要想告诉我们：","opts":["年轻人身体都很好","医生的工作很辛苦","要早点儿注意自己的身体"],"a":2,"en":"When young, many think they're healthy, work late and eat irregularly. When problems appear, regret is too late. So the best doctor is ourselves. ★ Take care of your health early."}],"write":[{"words":["他","把","桌子上的水","擦掉了。"],"en":"He wiped the water off the table."},{"words":["这个","数字", mber of people in this competition exceeded three hundred."},{"words":["他们","俩","的感情","一直很好。"],"en":"The two of them have always been close."},{"words":["你","估计","他","几点能到？"],"en":"What time do you reckon he'll arrive?"}],"hanzi":[{"s":"外面的空（  ）很新鲜。","py":"qì","a":"气"},{"s":"我们家养了很多（  ）物。","py":"zhí","a":"植"},{"s":"吃完饭以后，我们去公园散（  ）吧。","py":"bù","a":"步"},{"s":"这个动（  ）有点儿难，我做不好。","py":"zuò","a":"作"}]},"tx":[{"t":"在医院 · At the hospital","scene":"Zhang Wei has had a bad cough for two weeks and sees a doctor.","g":[1,3],"lines":[{"sp":"医生","s":"f","zh":"你哪儿不舒服？","py":"Nǐ nǎr bù shūfu?","en":"What seems to be the problem?"},{"sp":"张伟","s":"m","zh":"大夫，我咳嗽两个星期了，晚上咳得特别多，睡不好觉。","py":"Dàifu, wǒ késou liǎng gè xīngqī le, wǎnshang ké de tèbié duō, shuì bu hǎo jiào.","en":"Doctor, I've been coughing for two weeks. It's especially bad at night and I can't sleep."},{"sp":"医生","s":"f","zh":"你抽烟吗？","py":"Nǐ chōuyān ma?","en":"Do you smoke?"},{"sp":"张伟","s":"m","zh":"抽，一天差不多半包。工作太累，不抽烟就没精神。","py":"Chōu, yì tiān chàbuduō bàn bāo. Gōngzuò tài lèi, bù chōuyān jiù méi jīngshén.","en":"Yes, about half a pack a day. Work is exhausting — without a cigarette I have no energy."},{"sp":"医生","s":"f","zh":"现在还不算严重，可是要是你还这样抽下去，以后出现大问题，后悔就来不及了。","py":"Xiànzài hái bú suàn yánzhòng, kěshì yàoshi nǐ hái zhèyàng chōu xiàqu, yǐhòu chūxiàn dà wèntí, hòuhuǐ jiù láibují le.","en":"It's not serious yet, but if you keep smoking like this and a big problem appears later, it'll be too late for regrets."},{"sp":"张伟","s":"m","zh":"我明白了。我女朋友也一直反对我抽烟，这次我一定不抽了。","py":"Wǒ míngbai le. Wǒ nǚpéngyou yě yìzhí fǎnduì wǒ chōuyān, zhè cì wǒ yídìng bù chōu le.","en":"I understand. My girlfriend has always been against my smoking too — this time I'll definitely quit."},{"sp":"医生","s":"f","zh":"好。我估计吃一个星期的药就好了，这几天多喝点儿水。","py":"Hǎo. Wǒ gūjì chī yí gè xīngqī de yào jiù hǎo le, zhè jǐ tiān duō hē diǎnr shuǐ.","en":"Good. I reckon a week of medicine will clear it up. Drink plenty of water these next few days."}]},{"t":"减肥 · Losing weight","scene":"Lin Xiaoyu has been skipping dinner to lose weight; Liu Fang worries about her.","g":[0,2],"lines":[{"sp":"刘芳","s":"f","zh":"小雨，你最近怎么晚饭都不吃了？","py":"Xiǎoyǔ, nǐ zuìjìn zěnme wǎnfàn dōu bù chī le?","en":"Xiaoyu, why have you stopped eating dinner lately?"},{"sp":"林小雨","s":"f","zh":"我在减肥呢。下个月要参加朋友的结婚聚会，我想把肚子上的肉减掉。","py":"Wǒ zài jiǎnféi ne. Xià ge yuè yào cānjiā péngyou de jiéhūn jùhuì, wǒ xiǎng bǎ dùzi shang de ròu jiǎndiào.","en":"I'm on a diet. I'm going to a friend's wedding party next month and want to lose the fat on my belly."},{"sp":"刘芳","s":"f","zh":"光不吃饭可不行，那样太辛苦了，而且对身体也不好。","py":"Guāng bù chī fàn kě bù xíng, nàyàng tài xīnkǔ le, érqiě duì shēntǐ yě bù hǎo.","en":"Just not eating won't work — it's too hard on you and bad for your health."},{"sp":"林小雨","s":"f","zh":"那你说我应该怎么办？","py":"Nà nǐ shuō wǒ yīnggāi zěnme bàn?","en":"So what do you think I should do?"},{"sp":"刘芳","s":"f","zh":"晚饭少吃一点儿，吃完了去散步。散步既能减肥，又能让你更高兴。","py":"Wǎnfàn shǎo chī yìdiǎnr, chīwánle qù sànbù. Sànbù jì néng jiǎnféi, yòu néng ràng nǐ gèng gāoxìng.","en":"Eat a smaller dinner and go for a walk afterwards. Walking helps you lose weight and also puts you in a better mood."},{"sp":"林小雨","s":"f","zh":"有道理。还有，我得把冰箱里的那些糖都送掉，看见了就想吃。","py":"Yǒu dàolǐ. Háiyǒu, wǒ děi bǎ bīngxiāng li de nàxiē táng dōu sòngdiào, kànjiànle jiù xiǎng chī.","en":"Makes sense. And I should give away all those sweets in my fridge — if I see it, I want to eat it."}]},{"t":"教授的研究 · The professor's research","scene":"Mark interviews a professor about plants and air for a class project.","g":[0,1],"lines":[{"sp":"马克","s":"m","zh":"教授您好，听说您研究植物和空气的关系，能给我们介绍一下吗？","py":"Jiàoshòu nín hǎo, tīngshuō nín yánjiū zhíwù hé kōngqì de guānxi, néng gěi wǒmen jièshào yíxià ma?","en":"Hello, Professor. I hear you research the relationship between plants and air — could you tell us about it?"},{"sp":"教授","s":"f","zh":"好的。我们的研究说明，房间里放一些植物，空气会好很多。","py":"Hǎo de. Wǒmen de yánjiū shuōmíng, fángjiān li fàng yìxiē zhíwù, kōngqì huì hǎo hěn duō.","en":"Sure. Our research shows that putting some plants in a room makes the air a lot better."},{"sp":"马克","s":"m","zh":"有数字能说明吗？","py":"Yǒu shùzì néng shuōmíng ma?","en":"Are there figures to show that?"},{"sp":"教授","s":"f","zh":"有。在我们的调查中，放了植物的办公室，觉得头疼的人少了超过三分之一。","py":"Yǒu. Zài wǒmen de diàochá zhōng, fàngle zhíwù de bàngōngshì, juéde tóuténg de rén shǎole chāoguò sān fēn zhī yī.","en":"Yes. In our survey, offices with plants had over a third fewer people complaining of headaches."},{"sp":"马克","s":"m","zh":"那如果我的房间窗户很小，要是放植物的话，应该选哪种呢？","py":"Nà rúguǒ wǒ de fángjiān chuānghu hěn xiǎo, yàoshi fàng zhíwù dehuà, yīnggāi xuǎn nǎ zhǒng ne?","en":"If my room has a small window, which kind should I choose?"},{"sp":"教授","s":"f","zh":"选那种不需要太多太阳的，既好养，又好看。这里的气候比较干，记得常给它喝水。","py":"Xuǎn nà zhǒng bù xūyào tài duō tàiyáng de, jì hǎo yǎng, yòu hǎokàn. Zhèlǐ de qìhòu bǐjiào gān, jìde cháng gěi tā hē shuǐ.","en":"Choose one that doesn't need much sun — easy to keep and pretty too. The climate here is quite dry, so remember to water it often."}]},{"t":"在体育馆 · At the sports centre","scene":"Zhang Wei meets Manager Wang at the sports centre after work.","g":[2,3],"lines":[{"sp":"王经理","s":"m","zh":"小张，你也来锻炼？我刚才还以为看错了。","py":"Xiǎo Zhāng, nǐ yě lái duànliàn? Wǒ gāngcái hái yǐwéi kàncuò le.","en":"Xiao Zhang, you work out here too? I thought my eyes were playing tricks."},{"sp":"张伟","s":"m","zh":"是啊，王经理。医生说我身体不太好，我就决定每天来运动一个小时。","py":"Shì a, Wáng jīnglǐ. Yīshēng shuō wǒ shēntǐ bú tài hǎo, wǒ jiù juédìng měi tiān lái yùndòng yí gè xiǎoshí.","en":"Yes, Manager Wang. The doctor said my health isn't great, so I decided to come and exercise an hour every day."},{"sp":"王经理","s":"m","zh":"你这个动作做得不对，手应该再往上一点儿，这样效果才好。","py":"Nǐ zhège dòngzuò zuò de bú duì, shǒu yīnggāi zài wǎng shàng yìdiǎnr, zhèyàng xiàoguǒ cái hǎo.","en":"You're doing that movement wrong — your hands should be a bit higher, that way it works better."},{"sp":"张伟","s":"m","zh":"谢谢！您练得真好，看起来又年轻又帅。","py":"Xièxie! Nín liàn de zhēn hǎo, kàn qǐlai yòu niánqīng yòu shuài.","en":"Thanks! You're in great shape — you look young and handsome."},{"sp":"王经理","s":"m","zh":"哈哈，我年轻的时候也不注意身体，后来才慢慢把坏习惯都改掉了。","py":"Hāha, wǒ niánqīng de shíhou yě bú zhùyì shēntǐ, hòulái cái mànmàn bǎ huài xíguàn dōu gǎidiào le.","en":"Ha, when I was young I didn't look after my health either; only later did I gradually get rid of my bad habits."},{"sp":"张伟","s":"m","zh":"您说得对。我每天下班都很累，可是锻炼完了，所有的烦恼好像都忘掉了。","py":"Nín shuō de duì. Wǒ měi tiān xiàbān dōu hěn lèi, kěshì duànliàn wánle, suǒyǒu de fánnǎo hǎoxiàng dōu wàngdiào le.","en":"You're right. I'm exhausted after work every day, but after a workout all my worries seem to vanish."},{"sp":"王经理","s":"m","zh":"快八点了，我得走了，再晚就来不及回家吃饭了。你也别练太久，注意休息。","py":"Kuài bā diǎn le, wǒ děi zǒu le, zài wǎn jiù láibují huí jiā chī fàn le. Nǐ yě bié liàn tài jiǔ, zhùyì xiūxi.","en":"It's nearly eight — I have to go, any later and I won't make it home for dinner. Don't overdo it, and get some rest."}]}]},{"n":8,"cn":"生活中不缺少美","en":"Beauty is not rare in life","vocab":[{"w":"巧克力","p":"qiǎokèlì","pos":"n.","d":"chocolate"},{"w":"亲戚","p":"qīnqi","pos":"n.","d":"relative, kinsfolk"},{"w":"伤心","p":"shāngxīn","pos":"adj.","d":"sad, sorrowful"},{"w":"使","p":"shǐ","pos":"v.","d":"to make, to cause"},{"w":"心情","p":"xīnqíng","pos":"n.","d":"mood, state of mind"},{"w":"愉快","p":"yúkuài","pos":"adj.","d":"glad, cheerful"},{"w":"景色","p":"jǐngsè","pos":"n.","d":"scene, view"},{"w":"放松","p":"fàngsōng","pos":"v.","d":"to relax"},{"w":"压力","p":"yālì","pos":"n.","d":"pressure, stress"},{"w":"回忆","p":"huíyì","pos":"v.","d":"to call to mind, to recall"},{"w":"发生","p":"fāshēng","pos":"v.","d":"to happen, to take place"},{"w":"成为","p":"chéngwéi","pos":"v.","d":"to become"},{"w":"只要","p":"zhǐyào","pos":"conj.","d":"as long as, provided"},{"w":"师傅","p":"shīfu","pos":"n.","d":"a polite title for one with accomplished skills in a trade or handicraft"},{"w":"大使馆","p":"dàshǐguǎn","pos":"n.","d":"embassy"},{"w":"堵车","p":"dǔchē","pos":"v.","d":"traffic jam"},{"w":"距离","p":"jùlí","pos":"n.","d":"distance"},{"w":"耐心","p":"nàixīn","pos":"n.","d":"patience"},{"w":"生命","p":"shēngmìng","pos":"n.","d":"life"},{"w":"缺少","p":"quēshǎo","pos":"v.","d":"to lack"},{"w":"到处","p":"dàochù","pos":"adv.","d":"everywhere"},{"w":"态度","p":"tàidù","pos":"n.","d":"attitude"},{"w":"因此","p":"yīncǐ","pos":"conj.","d":"therefore, so"},{"w":"科学","p":"kēxué","pos":"n.","d":"science"},{"w":"证明","p":"zhèngmíng","pos":"v.","d":"to prove"},{"w":"往往","p":"wǎngwǎng","pos":"adv.","d":"often, usually"},{"w":"阳光","p":"yángguāng","pos":"adj.","d":"optimistic, cheerful"},{"w":"积极","p":"jījí","pos":"adj.","d":"positive"},{"w":"特点","p":"tèdiǎn","pos":"n.","d":"characteristic"}],"proper":"","grammar":[{"t":"使 — to make, to cause (causative)","m":"使 is a causative verb: A 使 B + verb/adjective = 'A makes B (feel/become) …'. It is more formal and written than 让 or 叫, and the subject is usually a thing or event rather than a person giving orders (这个消息使他很伤心). It is NOT used for asking someone to do something — for requests use 让/请.","ex":[["这次去中国使我对这个国家有了新的了解。","This visit to China gave me a new understanding of this country."],["他的一句话使大家都笑了起来。","One remark from him made everyone burst out laughing."],["经常运动能使人心情愉快。","Regular exercise can put people in a cheerful mood."]]},{"t":"只要……就…… — as long as …, then …","m":"只要 introduces a sufficient condition: if just this condition is met, the result after 就 will follow. It stresses that the condition is easy or minimal. Compare 只有……才…… ('only if', a necessary condition, stricter). 只要 can go before or after the subject.","ex":[["只要你愿意学，我就愿意教你。","As long as you're willing to learn, I'm willing to teach you."],["只要不下雨，比赛就会按时开始。","As long as it doesn't rain, the match will start on time."],["你只要每天练习半个小时，汉语水平很快就能提高。","If you just practise half an hour a day, your Chinese will soon improve."]]},{"t":"因此 — therefore, for this reason","m":"因此 is a conjunction meaning 'so, therefore'. It starts the clause that gives the result of a reason stated before: (因为) reason，因此 result. It is more formal than 所以 and is common in writing. 因此 can also follow the subject (他因此……). In writing it often follows a full sentence that gives the reason.","ex":[["他每天都去跑步，因此身体一直很好。","He runs every day, so he has always been healthy."],["今天的会议很重要，因此请大家准时参加。","Today's meeting is important, so please all attend on time."],["她小时候在国外住过几年，英语因此说得很好。","She lived abroad for a few years as a child, and for that reason speaks good English."]]},{"t":"往往 vs 常常 — tends to, usually (general pattern)","m":"往往 describes what usually happens under certain conditions, summarising a regular pattern from experience; the sentence normally includes the condition (time, situation, kind of person). 常常 just means 'often' and can be used for the future or for wishes (以后常常来), but 往往 cannot. So: 周末他往往在家看书 (pattern), but 你以后要常常给我打电话 (not 往往).","ex":[["心情不好的时候，人往往不想说话。","When people are in a bad mood, they tend not to want to talk."],["越是简单的问题，往往越容易出错。","The simpler the question, the more likely people are to get it wrong."],["冬天的北方往往又冷又干。","Northern China in winter is usually cold and dry."]]}],"ex":{"judge":[{"s":"每年春节，我们家都会来很多亲戚，有叔叔、阿姨，还有他们的孩子。大家一起吃饭、聊天，非常开心。","st":"★ 春节的时候他们家很安静。","a":false,"en":"Every Spring Festival lots of relatives come to our home — uncles, aunts and their kids. Everyone eats and chats together; it's very lively. ★ Their home is quiet at Spring Festival."},{"s":"我的工作压力很大，每天都很累。周末的时候，我喜欢一个人去城外爬山，看看那里的景色，心情就会放松很多。","st":"★ 说话人周末去爬山是为了放松。","a":true,"en":"My job is stressful and I'm tired every day. At weekends I like to go hiking alone outside the city; looking at the scenery relaxes me a lot. ★ The speaker hikes at weekends to relax."},{"s":"从我家到公司的距离不远，开车只要十分钟。可是早上上班的时候经常堵车，有时候要开四十分钟。","st":"★ 早上开车上班有时要四十分钟。","a":true,"en":"My home isn't far from my office — ten minutes by car. But in the morning rush there are often traffic jams, and sometimes it takes forty minutes. ★ Driving to work sometimes takes forty minutes."},{"s":"李师傅修车已经修了二十多年了。他对每个顾客都很有耐心，不管问题多小，都会给你说得很清楚。","st":"★ 李师傅对顾客没有耐心。","a":false,"en":"Master Li has been fixing cars for over twenty years. He's patient with every customer and explains clearly no matter how small the problem. ★ He's impatient with customers."},{"s":"有科学研究证明，经常笑的人往往比不爱笑的人身体更好，因为笑能使人心情愉快，放松下来。","st":"★ 研究认为笑对身体有好处。","a":true,"en":"Scientific research has shown that people who laugh a lot tend to be healthier than those who don't, because laughing makes you cheerful and reduces stress. ★ Research finds laughing good for health."}],"listen":[{"dlg":["女：师傅，去大使馆要多长时间？","男：要是不堵车的话，二十分钟就到了。"],"q":"女的要去哪儿？","opts":["大使馆","机场","火车站"],"a":0,"en":"W: Driver, how long to the embassy? M: Twenty minutes if there's no traffic. Q: Where is she going?"},{"dlg":["男：你怎么了？看起来很伤心。","女：我养了十年的小狗死了。","男：别太难过了，它陪了你这么多年，你们一定有很多快乐的回忆。","女：是啊，我会一直记得它的。"],"q":"女的为什么伤心？","opts":["考试没考好","她的狗死了","跟朋友吵架了"],"a":1,"en":"M: What's wrong? You look sad. W: My dog of ten years died. M: Don't be too upset; with all those years together you must have many happy memories. W: Yes, I'll always remember him. Q: Why is she sad?"},{"dlg":["女：今天的会议怎么取消了？","男：听说公司发生了一件很重要的事，经理们都去解决了。"],"q":"会议为什么取消了？","opts":["经理生病了","下大雨了","公司发生了重要的事"],"a":2,"en":"W: Why was today's meeting cancelled? M: I heard something important happened at the company and the managers have all gone to sort it out. Q: Why was the meeting cancelled?"},{"dlg":["男：你喜欢吃巧克力吗？我从国外带回来的。","女：谢谢！我最爱吃巧克力了，尤其是黑色的。"],"q":"关于女的，可以知道什么？","opts":["她不吃甜的东西","她很喜欢巧克力","她刚从国外回来"],"a":1,"en":"M: Do you like chocolate? I brought it back from abroad. W: Thanks! I love chocolate, especially dark. Q: What do we know about her?"},{"dlg":["女：你觉得新来的小王怎么样？","男：他工作态度很积极，什么事都主动去做，就是经验少了一点儿。"],"q":"男的觉得小王怎么样？","opts":["经验很丰富","工作不认真","态度很积极"],"a":2,"en":"W: What do you think of the new guy, Xiao Wang? M: He's very positive about work and eager to do anything; he just lacks a bit of experience. Q: What does he think of Xiao Wang?"}],"match":[{"q":"你最近工作压力大吗？","r":"挺大的，所以周末我要好好儿放松一下。"},{"q":"这里的景色真美啊！","r":"是啊，我每次来都不想走。"},{"q":"你怎么这么晚才到？","r":"路上堵车，堵了快一个小时。"},{"q":"你还记得我们第一次见面的时候吗？","r":"当然记得，那是一个很美好的回忆。"},{"q":"我们学校离大使馆远吗？","r":"不远，坐地铁两站就到了。"}],"fill":[{"s":"这个周末我要去参加一个（  ）的生日聚会，她是我妈妈的妹妹的女儿。","a":"亲戚","en":"This weekend I'm going to a relative's birthday party — she's the daughter of my mum's younger sister."},{"s":"下班的时候路上车特别多，经常（  ）。","a":"堵车","en":"When people get off work the roads are packed and there are often traffic jams."},{"s":"听到这个好消息，大家的（  ）都很好。","a":"心情","en":"Hearing the good news put everyone in a good mood."},{"s":"这里的（  ）非常美，到处都是山和水。","a":"景色","en":"The scenery here is beautiful — mountains and water everywhere."},{"s":"他靠自己的努力，终于（  ）了一名医生。","a":"成为","en":"Through his own hard work, he finally became a doctor."},{"s":"A：你在这家公司工作得怎么样？  B：不太好，工作（  ）太大了，每天都很累。","a":"压力","en":"A: How's work at this company? B: Not great — too much pressure, I'm tired every day."},{"s":"A：从这儿到火车站的（  ）有多远？  B：差不多三千米，走路要半个小时。","a":"距离","en":"A: How far is it from here to the station? B: About three kilometres — half an hour on foot."},{"s":"A：昨天晚上那里（  ）了什么事？  B：好像是有人在那儿吵架。","a":"发生","en":"A: What happened there last night? B: Looks like some people were arguing there."},{"s":"A：教孩子学习一定要有（  ）。  B：是啊，生气是没有用的。","a":"耐心","en":"A: You have to be patient when teaching kids. B: Yes, getting angry is no use."},{"s":"A：你还记得小时候的事吗？  B：记得，那时候的生活现在（  ）起来还觉得很幸福。","a":"回忆","en":"A: Do you remember your childhood? B: Yes — looking back on life back then, I still feel very happy."}],"grammar":[{"q":"这个好消息（  ）大家都非常高兴。","opts":["使","只要","因此","往往"],"a":0,"exp":"A 使 B + adjective: the news made everyone happy.","g":0},{"q":"（  ）你有耐心，就一定能学好汉语。","opts":["因此","使","只要","往往"],"a":2,"exp":"只要……就…… gives a sufficient condition.","g":1},{"q":"他每天都学习到很晚，（  ）这次考试考得很好。","opts":["只要","因此","往往","使"],"a":1,"exp":"因此 introduces the result of the reason stated first.","g":2},{"q":"压力大的时候，人（  ）容易生病。","opts":["只要","使
