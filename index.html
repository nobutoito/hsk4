q":"这么多作业，我今天晚上肯定写（  ）。","opts":["没了","得了","不了","了不"],"a":2,"exp":"V + 不了 = can't manage to do it; 写不了 = can't get it written.","g":2},{"q":"外面热得让人（  ），我们还是在家里看电影吧。","opts":["受得了","受不了","不受了","受了不"],"a":1,"exp":"受不了 = can't stand it; Adj + 得 + 让人受不了.","g":2}],"order":[{"parts":["随着技术的发展，","人们联系的方式越来越多，","但是写信的人却越来越少了。"],"en":"With the development of technology, there are more and more ways to keep in touch, but fewer and fewer people write letters."},{"parts":["警察先问了我丢东西的时间和地点，","接着又让我写下了自己的电话号码，","说有消息就通知我。"],"en":"The police first asked when and where I lost my things, then had me write down my phone number, saying they'd let me know if there was news."},{"parts":["为了你的账户安全，","密码最好不要用生日，","而且要经常换。"],"en":"For the safety of your account, it's best not to use your birthday as a password, and you should change it often."},{"parts":["这个城市的交通特别乱，","早上上班的时候经常堵车，","很多人都说受不了。"],"en":"The traffic in this city is really chaotic; there are often jams in the morning rush hour, and many people say they can't stand it."}],"reading":[{"p":"很多人出门旅游都喜欢用手机地图。只要在手机上写好地址，它就会告诉你怎么走，就算到了一个完全不熟悉的城市也不容易迷路。但是手机没电的时候就麻烦了，所以出门以前最好检查一下手机是否有电。","q":"★ 这段话主要告诉我们：","opts":["手机地图用起来不方便","出门最好准备好手机的电","旅游时一定会迷路"],"a":1,"en":"Many people like using phone maps when travelling. Just enter the address and the phone tells you the way, so even in a totally unfamiliar city you won't easily get lost. But it's a problem when the phone runs out of battery, so before going out it's best to check whether your phone is charged."},{"p":"我爷爷以前在邮局工作了三十年。他说那时候人们每天都要寄很多信，过年的时候，邮局里的信封堆得像小山一样高。现在来寄信的人少了，但是因为网上购物，邮局要送的东西倒越来越多了。","q":"★ 关于邮局，可以知道：","opts":["现在没有人去邮局了","爷爷现在仍然在邮局工作","现在邮局要送的东西更多了"],"a":2,"en":"My grandpa worked at the post office for thirty years. He says back then people sent lots of letters every day, and at New Year the envelopes piled up like a small hill. Now fewer people send letters, but because of online shopping, the post office actually has more and more things to deliver."},{"p":"现在很多年轻人不写日记了，他们更喜欢把每天的生活发到网上。有人觉得这是一种新的日记方式，也有人认为，日记是写给自己看的，发到网上就不是真正的日记了。","q":"★ 关于在网上发生活信息，人们的看法：","opts":["不完全一样","都很支持","都很反对"],"a":0,"en":"Many young people no longer keep diaries; they prefer to post their daily lives online. Some think this is a new kind of diary; others think a diary is written for yourself, so once it's online it's no longer a real diary."},{"p":"这家超市新换了付款方式，顾客自己拿着东西到机器前，几秒就能付完款，不用再排队等售货员了。刚开始一些老人不会用，超市就专门安排了人在旁边帮忙。","q":"★ 根据这段话，超市的新方式：","opts":["只允许年轻人使用","让付款变得更快","需要更多售货员"],"a":1,"en":"This supermarket has a new way of paying: customers take their items to a machine and can pay in a few seconds, no longer queuing for a cashier. At first some elderly people couldn't use it, so the supermarket arranged for staff to help nearby."}],"write":[{"words":["这座桥","是","上个世纪","修的。"],"en":"This bridge was built last century."},{"words":["请","把","地址","写在","信封上。"],"en":"Please write the address on the envelope."},{"words":["这里","不允许","停车。"],"en":"Parking is not allowed here."},{"words":["那个骗人的男人","被","警察","抓住了。"],"en":"The con man was caught by the police."},{"words":["我","不知道","他","是否","同意。"],"en":"I don't know whether he agrees."}],"hanzi":[{"s":"我忘了电脑的密（  ），打不开了。","py":"mǎ","a":"码"},{"s":"这个菜太（  ）了，你放了多少盐？","py":"xián","a":"咸"},{"s":"过马路的时候要注意安（  ）。","py":"quán","a":"全"},{"s":"他每天晚上睡觉前都要写日（  ）。","py":"jì","a":"记"},{"s":"这本小说的作（  ）是一位年轻的女作家。","py":"zhě","a":"者"}]},"rv":{"judge":[{"s":"我们小区门口新开了一家超市，买东西可以用手机付款。不过有的老人不太会用，售货员就会耐心地教他们。","st":"★ 这家超市只收现金。","a":false,"en":"A new supermarket has opened at the gate of our housing estate, and you can pay by phone. Some elderly people aren't good at it, so the staff patiently teach them. / ★ This supermarket only accepts cash."},{"s":"小王第一次来这个城市，下了火车就迷路了。后来他问了一位警察，警察不仅告诉了他怎么走，而且还帮他叫了一辆出租车。","st":"★ 警察帮助了小王。","a":true,"en":"Xiao Wang came to this city for the first time and got lost as soon as he got off the train. Then he asked a police officer, who not only told him the way but also called a taxi for him. / ★ The police officer helped Xiao Wang."},{"s":"这本小说最近特别火，很多年轻人都在网上讨论。作者说，她写这本书只用了三个月，可是准备材料却用了两年。","st":"★ 作者准备材料的时间比写书的时间长。","a":true,"en":"This novel has been really popular lately, and lots of young people are discussing it online. The author says she wrote it in only three months, but spent two years preparing material. / ★ The author spent longer preparing than writing."},{"s":"为了大家的安全，这座桥晚上十点以后不允许大车通过。如果你开的是小汽车，就没有问题。","st":"★ 晚上十点以后小汽车不能过桥。","a":false,"en":"For everyone's safety, large vehicles may not cross this bridge after 10 p.m. If you're driving a car, there's no problem. / ★ Cars can't cross the bridge after 10 p.m."}],"listen":[{"dlg":["女：我给你寄的东西收到了吗？","男：还没有，你写的地址是否正确？我上个月搬家了。"],"q":"男的为什么还没收到东西？","opts":["地址可能写错了","邮局关门了","他不想要"],"a":0,"en":"W: Did you get the thing I sent you? M: Not yet — was the address you wrote correct? I moved last month. Q: Why hasn't he received it?"},{"dlg":["男：这儿的菜都太咸了，我受不了。","女：那我们去对面那家吧，听说那儿的菜放的盐少。"],"q":"男的觉得这儿的菜怎么样？","opts":["太甜","太咸","太贵"],"a":1,"en":"M: The food here is all too salty — I can't take it. W: Then let's go to the place opposite; I hear they use less salt there. Q: What does the man think of the food here?"},{"dlg":["女：你先去买票，接着在入口等我，我去买两瓶矿泉水。","男：好的，你快点儿，电影还有十分钟就开始了。"],"q":"女的要去做什么？","opts":["买票","在入口等","买水"],"a":2,"en":"W: You buy the tickets first, then wait for me at the entrance; I'll go and buy two bottles of mineral water. M: OK, be quick — the film starts in ten minutes. Q: What is the woman going to do?"},{"dlg":["男：这个网站要我设密码，怎么设比较安全？","女：最好又有数字又有英文，别用你的生日。","男：那我很容易忘啊。","女：你可以写在日记本里，放在家里。"],"q":"女的建议怎么设密码？","opts":["用生日","数字和英文都用","只用数字"],"a":1,"en":"M: This website wants me to set a password — what's a safe way? W: Best to use both numbers and English letters, and not your birthday. M: Then I'll easily forget it. W: You can write it in your diary and keep it at home. Q: What does she suggest?"}],"fill":[{"s":"这本书的（  ）是我们学校的一位老教授。","a":"作者","en":"The author of this book is an old professor at our school."},{"s":"在上个（  ），很多人家里还没有电话。","a":"世纪","en":"Last century, many homes still had no telephone."},{"s":"随着科学（  ）的发展，我们的生活越来越方便了。","a":"技术","en":"With the development of science and technology, our lives are becoming more and more convenient."},{"s":"这家饭馆最近特别（  ），每天晚上都要排队。","a":"火","en":"This restaurant has been really popular lately; you have to queue every evening."},{"s":"A：这件事你打算怎么告诉他？  B：我想换一种（  ），给他写封信。","a":"方式","en":"A: How do you plan to tell him about this? B: I'd like to try a different way — write him a letter."},{"s":"A：你怎么知道他今天不来上课？  B：我在学校网站上看到的（  ）。","a":"信息","en":"A: How do you know he isn't coming to class today? B: I saw the information on the school website."}],"grammar":[{"q":"经理想知道你明天（  ）有时间来公司一趟。","opts":["是否","只要","因为","或者"],"a":0,"exp":"是否 + V introduces 'whether' in an embedded question.","g":0},{"q":"这个问题我们今天先讨论到这儿，明天（  ）讨论。","opts":["是否","从来","接着","曾经"],"a":2,"exp":"接着 + V = continue doing it.","g":1},{"q":"她先洗了澡，（  ）就躺在床上看起了小说。","opts":["接着","否则","因此","是否"],"a":0,"exp":"接着 links an action that follows straight after another.","g":1},{"q":"这家饭馆的菜太辣了，我真（  ）。","opts":["受得了","受不了","不受了","受了不"],"a":1,"exp":"受不了 = can't stand it; the other forms are positive or ungrammatical.","g":2},{"q":"这个行李箱太重了，我一个人拿（  ）。","opts":["不了","得了","不起","完了"],"a":0,"exp":"V + 不了 = can't manage to do it.","g":2},{"q":"离开教室以前，请先看看窗户（  ）关好了。","opts":["接着","是否","已经","尤其"],"a":1,"exp":"看看 + 是否 + V = check whether.","g":0}],"order":[{"parts":["这座桥修好以后，","两个城市之间的交通方便多了，","开车只要二十分钟。"],"en":"After this bridge was finished, transport between the two cities became much more convenient — only twenty minutes by car."},{"parts":["如果你在外面迷路了，","不要着急，","可以找警察帮忙。"],"en":"If you get lost when you're out, don't panic — you can ask the police for help."},{"parts":["他先在网站上找到了房子的信息，","接着打电话问了价格，","第二天就去看房了。"],"en":"He first found information about the flat on a website, then phoned to ask the price, and went to see it the next day."}],"reading":[{"p":"以前出去旅游，人们都要带很多现金，很不安全。现在只要有一部手机，买票、住酒店、吃饭都能付款，非常方便。不过，有的小地方还是只收现金，所以最好还是带一点儿钱。","q":"★ 说话人建议：","opts":["出门只带手机","出门带很多现金","出门也带一点儿现金"],"a":2,"en":"People used to carry lots of cash when travelling, which wasn't safe. Now with a phone you can pay for tickets, hotels and meals — very convenient. But some small places still only take cash, so it's best to bring a bit of money."},{"p":"我女儿今年八岁，她每天都写日记。有一天，我不小心看到她写的一句话：“今天妈妈又玩儿手机了，没有陪我。”我心里很难受，从那以后，回家就把手机放在一边。","q":"★ 看了女儿的日记，妈妈：","opts":["批评了女儿","回家少玩儿手机了","给女儿买了手机"],"a":1,"en":"My daughter is eight and writes a diary every day. One day I accidentally saw a line she'd written: \"Mum was on her phone again today and didn't play with me.\" I felt terrible, and since then I put my phone aside when I get home."},{"p":"这个城市的地铁站里都有很大的地图，上面不仅有每个站的名字，而且还写着附近的公园、医院、邮局等地点。第一次来的人看了地图，也能很快找到要去的地方。","q":"★ 地铁站里的地图：","opts":["只写了站名","对第一次来的人很有用","很难看懂"],"a":1,"en":"The subway stations in this city have big maps showing not only every station's name but also nearby parks, hospitals, post offices and other places. Even first-time visitors can quickly find where they want to go."}],"write":[{"words":["飞机","还有","二十分钟","降落。"],"en":"The plane lands in twenty minutes."},{"words":["这家网站","的","信息","很","丰富。"],"en":"This website's information is very rich."},{"words":["我","收到了","一封","朋友的信。"],"en":"I received a letter from a friend."},{"words":["请","别","把","密码","告诉别人。"],"en":"Please don't tell anyone your password."}],"hanzi":[{"s":"这个城市的交（  ）越来越方便了。","py":"tōng","a":"通"},{"s":"警察很快就（  ）住了那个人。","py":"zhuā","a":"抓"},{"s":"他在路上走了很久，原来是迷（  ）了。","py":"lù","a":"路"},{"s":"请在这儿写上您家的地（  ）。","py":"zhǐ","a":"址"}]},"tx":[{"t":"新年的信 · A New Year letter","scene":"At the post office, Lin Xiaoyu tells Mark why she still sends paper letters.","g":[0,1],"lines":[{"sp":"马克","s":"m","zh":"小雨，现在发个短信几秒就到了，你为什么还要来邮局寄信？","py":"Xiǎoyǔ, xiànzài fā ge duǎnxìn jǐ miǎo jiù dào le, nǐ wèishénme hái yào lái yóujú jì xìn?","en":"Xiaoyu, a text message arrives in a few seconds these days — why do you still come to the post office to send letters?"},{"sp":"林小雨","s":"f","zh":"这是给我外婆的。她不会用手机，她说收到信的时候最开心。","py":"Zhè shì gěi wǒ wàipó de. Tā bú huì yòng shǒujī, tā shuō shōudào xìn de shíhou zuì kāixīn.","en":"This is for my grandma. She can't use a phone, and she says she's happiest when she gets a letter."},{"sp":"马克","s":"m","zh":"原来是这样。可是我不知道自己的地址是否也要写在信封上。","py":"Yuánlái shì zhèyàng. Kěshì wǒ bù zhīdào zìjǐ de dìzhǐ shìfǒu yě yào xiě zài xìnfēng shang.","en":"I see. But I don't know whether my own address also goes on the envelope."},{"sp":"林小雨","s":"f","zh":"要写的。你先写她的地址，接着写上她的名字，最后在左上角写你自己的地址和电话。","py":"Yào xiě de. Nǐ xiān xiě tā de dìzhǐ, jiēzhe xiěshang tā de míngzi, zuìhòu zài zuǒ shàng jiǎo xiě nǐ zìjǐ de dìzhǐ hé diànhuà.","en":"Yes. Write her address first, then her name, and finally your own address and phone number in the top-left corner."},{"sp":"马克","s":"m","zh":"上个世纪人们都是这样联系的吧？这种方式虽然慢，但是很浪漫。","py":"Shàng ge shìjì rénmen dōu shì zhèyàng liánxì de ba? Zhè zhǒng fāngshì suīrán màn, dànshì hěn làngmàn.","en":"That's how everyone kept in touch last century, right? This way is slow, but it's romantic."},{"sp":"林小雨","s":"f","zh":"对啊。我外婆把我写的信都留着，像日记一样。","py":"Duì a. Wǒ wàipó bǎ wǒ xiě de xìn dōu liúzhe, xiàng rìjì yíyàng.","en":"Right. My grandma keeps all my letters, like a diary."}]},{"t":"迷路以后 · Lost in a new city","scene":"Zhang Wei has lost his way on a business trip and asks a police officer for help.","g":[1,2],"lines":[{"sp":"张伟","s":"m","zh":"您好，我好像迷路了。手机没电了，我又不记得酒店的地址。","py":"Nín hǎo, wǒ hǎoxiàng mílù le. Shǒujī méi diàn le, wǒ yòu bú jìde jiǔdiàn de dìzhǐ.","en":"Hello, I seem to be lost. My phone's dead and I can't remember the hotel's address."},{"sp":"警察","s":"f","zh":"别着急。你还记得酒店附近有什么吗？","py":"Bié zháojí. Nǐ hái jìde jiǔdiàn fùjìn yǒu shénme ma?","en":"Don't worry. Do you remember what's near the hotel?"},{"sp":"张伟","s":"m","zh":"旁边有一座很长的桥，桥下有条河。我已经走了两个小时了，又累又渴，真受不了了。","py":"Pángbiān yǒu yí zuò hěn cháng de qiáo, qiáo xià yǒu tiáo hé. Wǒ yǐjīng zǒule liǎng ge xiǎoshí le, yòu lèi yòu kě, zhēn shòu bu liǎo le.","en":"Next to it there's a long bridge with a river under it. I've walked for two hours already — I'm tired and thirsty and can't take it any more."},{"sp":"警察","s":"f","zh":"先喝瓶矿泉水吧。我知道那个地点，离这儿不远，我开车送你过去。","py":"Xiān hē píng kuàngquánshuǐ ba. Wǒ zhīdào nàge dìdiǎn, lí zhèr bù yuǎn, wǒ kāi chē sòng nǐ guoqu.","en":"Have a bottle of mineral water first. I know that place — it's not far. I'll drive you there."},{"sp":"张伟","s":"m","zh":"太感谢了！你们警察每天除了抓坏人，还要帮我这样的人。","py":"Tài gǎnxiè le! Nǐmen jǐngchá měi tiān chúle zhuā huàirén, hái yào bāng wǒ zhèyàng de rén.","en":"Thank you so much! Besides catching bad guys, you police also have to help people like me every day."},{"sp":"警察","s":"f","zh":"这也是我们的工作。上车吧，晚上一个人在这儿走不安全。","py":"Zhè yě shì wǒmen de gōngzuò. Shàng chē ba, wǎnshang yí ge rén zài zhèr zǒu bù ānquán.","en":"This is part of our job too. Get in — it isn't safe to walk around here alone at night."}]},{"t":"科技让生活更方便吗？ · Does technology make life easier?","scene":"A journalist interviews Manager Wang, whose company runs a popular payment website.","g":[0,2],"lines":[{"sp":"记者","s":"f","zh":"王经理，您公司的网站最近特别火，能给我们举个例子说说它的作用吗？","py":"Wáng jīnglǐ, nín gōngsī de wǎngzhàn zuìjìn tèbié huǒ, néng gěi wǒmen jǔ ge lìzi shuōshuo tā de zuòyòng ma?","en":"Manager Wang, your company's website has been really popular lately. Could you give us an example of what it does?"},{"sp":"王经理","s":"m","zh":"比如交水电费，以前得去银行排队，现在在网上付款，不到一分钟就好了。","py":"Bǐrú jiāo shuǐdiànfèi, yǐqián děi qù yínháng páiduì, xiànzài zài wǎng shang fùkuǎn, bú dào yì fēnzhōng jiù hǎo le.","en":"Take paying water and electricity bills: you used to have to queue at the bank; now you pay online and it's done in under a minute."},{"sp":"记者","s":"f","zh":"可是很多人担心，网上付款是否安全？","py":"Kěshì hěn duō rén dānxīn, wǎng shang fùkuǎn shìfǒu ānquán?","en":"But many people worry whether paying online is safe."},{"sp":"王经理","s":"m","zh":"我们的技术越来越好了。另外，就算别人知道了你的密码，网站也不允许他付款，因为他收不到你手机上的短信。","py":"Wǒmen de jìshù yuè lái yuè hǎo le. Lìngwài, jiùsuàn biérén zhīdàole nǐ de mìmǎ, wǎngzhàn yě bù yǔnxǔ tā fùkuǎn, yīnwèi tā shōu bu dào nǐ shǒujī shang de duǎnxìn.","en":"Our technology keeps getting better. Also, even if someone knows your password, the site won't let them pay, because they can't receive the text sent to your phone."},{"sp":"记者","s":"f","zh":"有人说，现在离开手机就什么也干不了了，您怎么看？","py":"Yǒu rén shuō, xiànzài líkāi shǒujī jiù shénme yě gàn bu liǎo le, nín zěnme kàn?","en":"Some people say that nowadays you can't do anything without your phone. What do you think?"},{"sp":"王经理","s":"m","zh":"这确实是个问题。所以我自己周末常常把手机关了，去郊区走走。","py":"Zhè quèshí shì ge wèntí. Suǒyǐ wǒ zìjǐ zhōumò chángcháng bǎ shǒujī guān le, qù jiāoqū zǒuzou.","en":"That really is a problem. So at weekends I often switch my phone off and go for a walk outside the city."}]},{"t":"飞机上 · On the plane","scene":"Liu Fang and Chen Laoshi chat on a flight as it prepares to land.","g":[1,2],"lines":[{"sp":"刘芳","s":"f","zh":"陈老师，您看的是什么书？","py":"Chén lǎoshī, nín kàn de shì shénme shū?","en":"Teacher Chen, what book are you reading?"},{"sp":"陈老师","s":"f","zh":"是一本讲交通历史的书，作者说一百年前从北京到上海要走好多天呢。","py":"Shì yì běn jiǎng jiāotōng lìshǐ de shū, zuòzhě shuō yì bǎi nián qián cóng Běijīng dào Shànghǎi yào zǒu hǎo duō tiān ne.","en":"It's about the history of transport. The author says a hundred years ago it took many days to get from Beijing to Shanghai."},{"sp":"刘芳","s":"f","zh":"现在坐飞机两个小时就到了。对了，刚才的饭您吃了吗？我觉得太咸了。","py":"Xiànzài zuò fēijī liǎng ge xiǎoshí jiù dào le. Duì le, gāngcái de fàn nín chī le ma? Wǒ juéde tài xián le.","en":"Now it's two hours by plane. By the way, did you eat the meal just now? I thought it was too salty."},{"sp":"陈老师","s":"f","zh":"我也吃不了那么咸的，只吃了一点儿。","py":"Wǒ yě chī bu liǎo nàme xián de, zhǐ chīle yìdiǎnr.","en":"I can't eat things that salty either — I only had a little."},{"sp":"刘芳","s":"f","zh":"听，广播说飞机马上要降落了，让大家关掉手机。","py":"Tīng, guǎngbō shuō fēijī mǎshàng yào jiàngluò le, ràng dàjiā guāndiào shǒujī.","en":"Listen — the announcement says we're about to land and everyone should switch off their phones."},{"sp":"陈老师","s":"f","zh":"好。下了飞机我们先拿行李，接着去坐地铁，打车太贵了。","py":"Hǎo. Xiàle fēijī wǒmen xiān ná xíngli, jiēzhe qù zuò dìtiě, dǎ chē tài guì le.","en":"OK. After we get off, we'll collect our luggage first and then take the subway — a taxi's too expensive."}]}]},{"n":19,"cn":"生活的味道","en":"Taste of life","vocab":[{"w":"学期","p":"xuéqī","pos":"n.","d":"term, semester"},{"w":"出生","p":"chūshēng","pos":"v.","d":"to be born"},{"w":"性别","p":"xìngbié","pos":"n.","d":"sex, gender"},{"w":"道歉","p":"dàoqiàn","pos":"v.","d":"to apologize"},{"w":"打印","p":"dǎyìn","pos":"v.","d":"to print out"},{"w":"复印","p":"fùyìn","pos":"v.","d":"to photocopy, to xerox"},{"w":"饺子","p":"jiǎozi","pos":"n.","d":"jiaozi, dumpling"},{"w":"刀","p":"dāo","pos":"n.","d":"knife"},{"w":"破","p":"pò","pos":"adj.","d":"broken, torn"},{"w":"脱","p":"tuō","pos":"v.","d":"to take off"},{"w":"理发","p":"lǐfà","pos":"v.","d":"to get a haircut"},{"w":"包子","p":"bāozi","pos":"n.","d":"steamed stuffed bun"},{"w":"零钱","p":"língqián","pos":"n.","d":"small change"},{"w":"打招呼","p":"dǎzhāohu","pos":"v.","d":"greet somebody"},{"w":"戴","p":"dài","pos":"v.","d":"to wear (accessories)"},{"w":"眼镜","p":"yǎnjìng","pos":"n.","d":"glasses, spectacles"},{"w":"舞蹈","p":"wǔdǎo","pos":"n.","d":"dance"},{"w":"国籍","p":"guójí","pos":"n.","d":"nationality, citizenship"},{"w":"抬","p":"tái","pos":"v.","d":"to lift, to raise"},{"w":"胳膊","p":"gēbo","pos":"n.","d":"arm"},{"w":"转","p":"zhuǎn","pos":"v.","d":"to turn, to shift"},{"w":"租","p":"zū","pos":"v.","d":"to rent, to lease"},{"w":"吵","p":"chǎo","pos":"adj.","d":"noisy"},{"w":"厨房","p":"chúfáng","pos":"n.","d":"kitchen"},{"w":"房东","p":"fángdōng","pos":"n.","d":"landlord/landlady"},{"w":"占线","p":"zhànxiàn","pos":"v.","d":"(of a telephone line) to be busy, to be engaged"},{"w":"功夫","p":"gōngfu","pos":"n.","d":"kung fu"},{"w":"乒乓球","p":"pīngpāngqiú","pos":"n.","d":"table tennis, ping-pong"},{"w":"羽毛球","p":"yǔmáoqiú","pos":"n.","d":"badminton"},{"w":"场","p":"chǎng","pos":"m.","d":"used for sports or recreational events, etc."},{"w":"禁止","p":"jìnzhǐ","pos":"v.","d":"to prohibit, to forbid"},{"w":"座位","p":"zuòwèi","pos":"n.","d":"seat"}],"proper":"","grammar":[{"t":"禁止 — To prohibit, forbid (formal)","m":"禁止 (jìnzhǐ) is a formal verb used mainly on signs, in rules and announcements: 禁止 + V(O) = \"no …ing\" (禁止吸烟, 禁止停车). It can also take a person: 禁止 + someone + V. It is much stronger and more official than 不要 or 别; in normal conversation people usually say 不能 / 不允许 instead.","ex":[["图书馆里禁止大声打电话。","Loud phone calls are forbidden in the library."],["这条路上禁止停车，你把车开到前面去吧。","Parking is prohibited on this road; drive the car further ahead."],["学校禁止学生上课的时候玩儿手机。","The school forbids students from playing on their phones in class."]]},{"t":"戴 vs 穿 — Wearing accessories vs clothes","m":"Chinese uses different verbs for \"wear\". 穿 (chuān) is for clothes and shoes that the body goes into: 穿衣服、穿裤子、穿袜子、穿鞋. 戴 (dài) is for things put on or attached to the head, face, hands or body: 戴眼镜、戴帽子、戴手表、戴手套. Taking them off is 脱 for clothes (脱衣服、脱鞋) but 摘 or 拿下来 for accessories.","ex":[["他平时戴眼镜，今天没戴，我差点儿没认出他来。","He usually wears glasses but didn't today — I almost didn't recognise him."],["外面很冷，你多穿件衣服，再戴上帽子。","It's cold out — put on another layer, and wear a hat too."],["进门以前请先把鞋脱了。","Please take your shoes off before coming in."]]},{"t":"一场 + 比赛/电影/雨 — Measure word 场","m":"场 (chǎng) counts complete events or sessions that have a beginning and end and usually an audience or a place: 一场比赛、一场电影、一场演出、一场考试. It is also used for natural events that happen over a period, such as 一场雨、一场大雪, and for illnesses (一场病). Don't confuse it with 次, which simply counts occurrences.","ex":[["昨天晚上那场足球比赛你看了吗？","Did you watch that football match last night?"],["下了一场大雨，空气新鲜多了。","After a heavy downpour, the air is much fresher."],["我们看下午三点那场电影吧，晚上的票已经卖完了。","Let's see the 3 p.m. showing — the evening tickets are sold out."]]}],"ex":{"judge":[{"s":"新学期开始了，学校要求每个学生都填一张表，上面要写姓名、性别、出生日期和国籍。表格写好以后，交给班长就可以了。","st":"★ 表格要交给老师。","a":false,"en":"The new semester has started, and the school asks every student to fill in a form with name, gender, date of birth and nationality. When it's done, just hand it to the class monitor. / ★ The form must be handed to the teacher."},{"s":"我租的房子离公司很近，房东人也很好。只有一个问题：楼下有一家饭馆，每天晚上都很吵，我常常十二点以后才能睡着。","st":"★ 他觉得晚上太吵。","a":true,"en":"The flat I rent is close to the office and the landlord is nice. The only problem is a restaurant downstairs that's noisy every night; I often can't fall asleep until after midnight. / ★ He finds it too noisy at night."},{"s":"我给王经理打了好几次电话，一直占线。后来我只好给他发了个短信，他过了半个小时才回我。","st":"★ 王经理马上就回了短信。","a":false,"en":"I phoned Manager Wang several times but the line was always busy. In the end I had to text him, and he only replied half an hour later. / ★ Manager Wang replied to the text straight away."},{"s":"马克来中国以前就开始学功夫了。他说，练功夫不仅能让身体更健康，而且还能让人变得更有耐心。","st":"★ 马克认为练功夫对身体有好处。","a":true,"en":"Mark started learning kung fu before he came to China. He says practising kung fu not only makes your body healthier but also makes you more patient. / ★ Mark thinks kung fu is good for your health."},{"s":"我们班的同学来自十几个国家。每到过年，老师就会带大家一起包饺子。虽然很多同学包得不好看，但是大家都觉得特别有意思。","st":"★ 同学们都包得很好看。","a":false,"en":"Our classmates come from over ten countries. Every New Year, the teacher has us all make dumplings together. Although many of them don't look nice, everyone finds it great fun. / ★ All the students' dumplings look nice."}],"listen":[{"dlg":["男：你的胳膊怎么了？","女：昨天打羽毛球的时候不小心碰伤了，现在抬都抬不起来。"],"q":"女的胳膊为什么受伤了？","opts":["打羽毛球","做饭","搬家具"],"a":0,"en":"M: What happened to your arm? W: I hurt it by accident playing badminton yesterday; now I can't even lift it. Q: How did she hurt her arm?"},{"dlg":["女：师傅，我想理发，大概要等多长时间？","男：前面还有两个人，你先坐一会儿，二十分钟左右吧。"],"q":"女的要做什么？","opts":["买衣服","理发","修手机"],"a":1,"en":"W: Excuse me, I'd like a haircut — about how long is the wait? M: There are two people ahead of you; take a seat — about twenty minutes. Q: What does the woman want to do?"},{"dlg":["男：不好意思，我没有零钱，一百块的可以吗？","女：可以，我找您八十五。"],"q":"男的买的东西多少钱？","opts":["八十五块","一百块","十五块"],"a":2,"en":"M: Sorry, I don't have small change — is a hundred OK? W: Sure, here's eighty-five change. Q: How much did his purchase cost?"},{"dlg":["女：你上次借我的那本书，我不小心弄破了一页，真对不起。","男：没关系，你不用道歉，又不是故意的。"],"q":"女的为什么道歉？","opts":["忘了还书","把书弄破了","来晚了"],"a":1,"en":"W: I accidentally tore a page of the book you lent me — I'm so sorry. M: It's fine, no need to apologise; you didn't do it on purpose. Q: Why does the woman apologise?"},{"dlg":["男：这个材料需要复印几份？","女：复印十份吧，下午开会每人一份。","男：那这张表格呢？","女：表格不用复印，你打印两张就行。"],"q":"表格需要怎么做？","opts":["复印十份","不用准备","打印两张"],"a":2,"en":"M: How many copies of this material do we need? W: Ten, one each for the meeting this afternoon. M: And this form? W: No need to photocopy it — just print two. Q: What should be done with the form?"}],"match":[{"q":"你今天怎么没戴眼镜？","r":"今天要打乒乓球，戴着不方便。"},{"q":"厨房里什么味道？这么香！","r":"我妈妈在做包子呢，马上就好了。"},{"q":"你转过身来，让我看看这件衣服后面怎么样。","r":"好看吗？我觉得有点儿长。"},{"q":"今天晚上有一场舞蹈表演，你想去看吗？","r":"想去！票贵不贵？"},{"q":"这个座位有人吗？","r":"没有，你坐吧。"}],"fill":[{"s":"这把（  ）很快，切菜的时候小心一点儿。","a":"刀","en":"This knife is very sharp — be careful when you're cutting vegetables."},{"s":"公园门口写着“（  ）带狗进入”，所以我们只好把狗留在车里。","a":"禁止","en":"The park gate says \"Dogs forbidden\", so we had to leave the dog in the car."},{"s":"我的袜子（  ）了，得去买双新的了。","a":"破","en":"My socks are torn — I need to buy a new pair."},{"s":"他是十二月（  ）的，所以他的生日在冬天。","a":"出生","en":"He was born in December, so his birthday is in winter."},{"s":"这家饭馆的（  ）很大，有六七个人在做饭。","a":"厨房","en":"This restaurant's kitchen is very big — six or seven people are cooking in it."},{"s":"A：你见到邻居一般会（  ）吗？  B：会啊，我每次都说“早上好”。","a":"打招呼","en":"A: Do you usually greet your neighbours when you see them? B: Yes, I say \"good morning\" every time."},{"s":"A：房子里的空调坏了，怎么办？  B：给（  ）打个电话吧，让他找人来修。","a":"房东","en":"A: The air conditioner in the flat is broken — what do we do? B: Phone the landlord and get him to find someone to fix it."},{"s":"A：屋里这么热，你怎么还穿着外套？  B：刚进门，还没来得及（  ）呢。","a":"脱","en":"A: It's so warm in here — why are you still wearing your coat? B: I've only just come in and haven't had time to take it off."},{"s":"A：你喜欢什么运动？  B：我最喜欢打（  ），我们学校的球桌很多。","a":"乒乓球","en":"A: What sport do you like? B: Table tennis — our school has lots of tables."},{"s":"A：你在这个城市买房子了吗？  B：没有，我是（  ）的，一个月三千块。","a":"租","en":"A: Have you bought a home in this city? B: No, I rent — three thousand a month."}],"grammar":[{"q":"加油站附近（  ）抽烟，请大家注意。","opts":["反对","禁止","放弃","拒绝"],"a":1,"exp":"禁止 + V is the formal way to say something is not allowed.","g":0},{"q":"这个房间里（  ）使用手机，请把手机关掉。","opts":["禁止","千万","最好","只好"],"a":0,"exp":"禁止 + 使用 = use is prohibited; a rule, hence 'switch it off'.","g":0},{"q":"我奶奶看报纸的时候一定要（  ）眼镜。","opts":["穿","戴","脱","抬"],"a":1,"exp":"Glasses are accessories, so the verb is 戴.","g":1},{"q":"今天下雪了，你出门多（  ）一点儿衣服。","opts":["戴","拿","穿","放"],"a":2,"exp":"Clothes take 穿, not 戴.","g":1},{"q":"我们一起去看了一（  ）京剧演出，非常精彩。","opts":["次","场","趟","遍"],"a":1,"exp":"场 counts a performance/event with a start and end.","g":2},{"q":"上个月他生了一（  ）大病，瘦了很多。","opts":["个","趟","遍","场"],"a":3,"exp":"场 also counts an illness that lasts for a period.","g":2}],"order":[{"parts":["我昨天给你打了好几次电话，","可是一直占线，","你在跟谁聊天儿呢？"],"en":"I called you several times yesterday but the line was always busy — who were you chatting with?"},{"parts":["这家饭馆的饺子和包子都很有名，","每天中午都没有空座位，","你最好早点儿去。"],"en":"This restaurant's dumplings and buns are both famous; there are no free seats at lunchtime, so you'd better go early."},{"parts":["这本书是我从图书馆借的，","我想先复印几页，","再把它还回去。"],"en":"I borrowed this book from the library; I want to photocopy a few pages first and then return it."},{"parts":["他觉得自己说错了话，","第二天一见到我就向我道歉，","我们又成了好朋友。"],"en":"He felt he'd said the wrong thing, so the next day he apologised as soon as he saw me, and we became good friends again."}],"reading":[{"p":"我以前住在学校里，宿舍很小，也没有厨房。这个学期我和两个同学一起在学校附近租了一套房子。虽然每个月要多花一些钱，但是我们可以自己做饭，周末还能请朋友来家里包饺子。","q":"★ 关于说话人，可以知道：","opts":["这个学期住在宿舍","和同学一起租了房子","不会做饭"],"a":1,"en":"I used to live on campus; the dorm was small with no kitchen. This semester two classmates and I are renting a flat near the school. Although it costs a bit more each month, we can cook for ourselves and invite friends round to make dumplings at the weekend."},{"p":"在中国，很多老人早上都会去公园锻炼身体。有的跑步，有的跳舞蹈，还有的练功夫。见了面，大家都会互相打招呼，有时候还会一起聊天儿、唱歌，非常热闹。","q":"★ 这段话主要讲的是：","opts":["老人们在公园的生活","怎么学功夫","公园里禁止跳舞"],"a":0,"en":"In China many elderly people go to the park in the morning to exercise. Some jog, some dance, some practise kung fu. When they meet they greet each other, and sometimes they chat or sing together — it's very lively."},{"p":"我今天去理发，师傅问我想理成什么样子。我说随便，他就给我理得特别短。回到家，我妹妹看了半天才认出我。我想，下次还是应该说清楚自己想要什么。","q":"★ 说话人从这件事中明白了：","opts":["头发短一点儿好看","理发师傅不认真","应该说清楚自己的要求"],"a":2,"en":"I got a haircut today; the barber asked what style I wanted. I said anything, so he cut it really short. Back home my sister stared for ages before she recognised me. Next time I'd better say clearly what I want."},{"p":"现在很多地方都禁止在人多的地方抽烟，比如饭馆、医院、火车站等。开始有些人觉得不方便，但是时间长了，大家都习惯了，空气也比以前好多了。","q":"★ 根据这段话，可以知道：","opts":["饭馆里可以抽烟","人们慢慢习惯了这个规定","空气比以前差了"],"a":1,"en":"Many places now forbid smoking in public spaces such as restaurants, hospitals and train stations. At first some people found it inconvenient, but over time everyone got used to it, and the air is much better than before."}],"write":[{"words":["请","把","这份材料","打印","三份。"],"en":"Please print three copies of this document."},{"words":["他","戴着","黑色的","眼镜。"],"en":"He's wearing a pair of black glasses."},{"words":["这里","禁止","大声","说话。"],"en":"Talking loudly is forbidden here."},{"words":["我们","明天","去看","一场","羽毛球比赛。"],"en":"Tomorrow we're going to watch a badminton match."},{"words":["他的","国籍","是","法国。"],"en":"His nationality is French."}],"hanzi":[{"s":"你把胳膊（  ）起来，我看看哪儿疼。","py":"tái","a":"抬"},{"s":"这个包（  ）里有肉，也有菜。","py":"zi","a":"子"},{"s":"售货员问我有没有（  ）钱。","py":"líng","a":"零"},{"s":"她从小就学习舞（  ），跳得特别好。","py":"dǎo","a":"蹈"},{"s":"前面路口向左（  ），就到学校了。","py":"zhuǎn","a":"转"}]},"rv":{"judge":[{"s":"我的手机掉在地上摔破了。我拿到店里去修，师傅说修好要三百块，还不如买一个新的。","st":"★ 手机修一下很便宜。","a":false,"en":"I dropped my phone and it broke. I took it to a shop, and the repairman said it would cost 300 yuan, so I might as well buy a new one. / ★ It's cheap to repair the phone."},{"s":"这个体育馆每周六晚上都有一场乒乓球比赛，来看的人特别多。为了大家的安全，体育馆里禁止带饮料进去。","st":"★ 体育馆里不能带饮料。","a":true,"en":"This gym has a table tennis match every Saturday evening, and lots of people come to watch. For everyone's safety, drinks may not be brought inside. / ★ You can't bring drinks into the gym."},{"s":"小时候爸爸常常带我去楼下的小饭馆吃包子。那儿的包子又大又香，一块钱一个。现在那家饭馆早就没有了，可是我仍然记得包子的味道。","st":"★ 他现在还常常去那家饭馆。","a":false,"en":"When I was little, Dad often took me to the little restaurant downstairs for steamed buns. They were big and tasty, one yuan each. That restaurant is long gone now, but I still remember the taste. / ★ He still often goes to that restaurant."},{"s":"刘芳刚搬了家，新房子离地铁站只有五分钟，房东还给她留了很多家具。她说只有一点不太满意：厨房有点儿小。","st":"★ 刘芳觉得厨房不够大。","a":true,"en":"Liu Fang has just moved; her new flat is five minutes from the subway, and the landlord left her lots of furniture. She says there's just one thing she's not quite happy with: the kitchen is a bit small. / ★ Liu Fang thinks the kitchen isn't big enough."}],"listen":[{"dlg":["女：你认识那个戴眼镜的男孩儿吗？","男：认识，他是我们班新来的同学，国籍是韩国。"],"q":"关于那个男孩儿，可以知道什么？","opts":["是韩国人","不戴眼镜","是老师"],"a":0,"en":"W: Do you know that boy with glasses? M: Yes, he's a new student in our class; his nationality is Korean. Q: What do we know about the boy?"},{"dlg":["男：我的座位在哪儿？","女：您的票是十二排三号，从这边往前走，右边第三个就是。"],"q":"他们最可能在哪儿？","opts":["厨房","电影院","理发店"],"a":1,"en":"M: Where's my seat? W: Your ticket is row 12, seat 3 — go forward this way, it's the third on the right. Q: Where are they most likely?"},{"dlg":["女：饺子已经包好了，你去厨房拿把刀来，我们切点儿水果。","男：好的，再拿几个盘子吧？"],"q":"女的让男的拿什么？","opts":["饺子","盘子","刀"],"a":2,"en":"W: The dumplings are made — go and get a knife from the kitchen so we can cut some fruit. M: OK, shall I bring some plates too? Q: What does the woman ask for?"},{"dlg":["男：喂，你怎么一直占线？","女：刚才在跟房东打电话，他说下个月房租要提高。","男：提高多少？","女：每个月多五百，我打算换个地方租了。"],"q":"女的打算做什么？","opts":["继续住下去","换地方租房","跟房东吵架"],"a":1,"en":"M: Hello, why was your line busy all the time? W: I was on the phone with my landlord; he says rent goes up next month. M: By how much? W: Five hundred more a month — I plan to rent somewhere else. Q: What does the woman plan to do?"}],"fill":[{"s":"这个（  ）我选了五门课，每天都很忙。","a":"学期","en":"This semester I've chosen five courses, so I'm busy every day."},{"s":"填表的时候，别忘了写上你的（  ）和年龄。","a":"性别","en":"When filling in the form, don't forget to write your gender and age."},{"s":"他十岁就开始练（  ），现在已经是一名教练了。","a":"功夫","en":"He started practising kung fu at ten and is now a coach."},{"s":"你把我的书弄破了，应该向我（  ）。","a":"道歉","en":"You tore my book — you should apologise to me."},{"s":"A：周末你们一般去哪儿打（  ）？  B：去学校体育馆，那儿没有风。","a":"羽毛球","en":"A: Where do you usually play badminton at weekends? B: At the school gym — there's no wind there."},{"s":"A：你的头发太长了。  B：是啊，我明天就去（  ）。","a":"理发","en":"A: Your hair is too long. B: Yes, I'm going for a haircut tomorrow."}],"grammar":[{"q":"这条河里水很深，（  ）游泳。","opts":["禁止","允许","适合","可以"],"a":0,"exp":"Deep water → a prohibition: 禁止游泳.","g":0},{"q":"公共汽车上（  ）吃东西，你下车再吃吧。","opts":["禁止","随便","当然","应该"],"a":0,"exp":"禁止 + V for a rule; 'eat after getting off' signals the ban.","g":0},{"q":"冬天骑自行车最好（  ）个帽子，不然耳朵会很冷。","opts":["穿","戴","抬","脱"],"a":1,"exp":"Hats are accessories: 戴帽子.","g":1},{"q":"到了朋友家，他让我（  ）了鞋再进去。","opts":["脱","戴","抬","拿"],"a":0,"exp":"Taking off shoes is 脱鞋.","g":1},{"q":"昨天晚上下了一（  ）大雪，路上到处都是白的。","opts":["次","趟","场","块"],"a":2,"exp":"场 counts a weather event lasting a period.","g":2},{"q":"这（  ）比赛非常精彩，两个队一直到最后一分钟才决定输赢。","opts":["遍","趟","个","场"],"a":3,"exp":"场 is the measure word for a match.","g":2}],"order":[{"parts":["他每次见到邻居，","都会先跟他们打招呼，","所以大家都很喜欢他。"],"en":"Every time he sees his neighbours he greets them first, so everyone likes him."},{"parts":["那家店的饺子虽然有点儿贵，","但是味道特别好，","所以每天都有很多人去吃。"],"en":"Although that shop's dumplings are a bit pricey, they taste great, so lots of people go every day."},{"parts":["我的裤子在路上被弄破了，","只好先回家换一条，","所以今天迟到了。"],"en":"My trousers got torn on the way, so I had to go home and change first — that's why I was late today."}],"reading":[{"p":"我住的地方楼上是一个舞蹈学校，每天下午都很吵。刚搬来的时候我很生气，还去找过房东。后来我发现，学生们晚上七点就下课了，而我那时候才下班回家，所以其实没有什么影响。","q":"★ 说话人后来觉得：","opts":["必须马上搬家","楼上的声音对他影响不大","房东不太好"],"a":1,"en":"Upstairs from me is a dance school; it's noisy every afternoon. When I first moved in I was angry and even went to see the landlord. Later I found the students finish at seven in the evening, which is when I get home from work, so it actually has little effect."},{"p":"很多外国人来中国学功夫。他们觉得功夫不只是一种运动，还能让人了解中国文化。有些人练了几年以后，不仅身体好了，而且还学会了说流利的普通话。","q":"★ 外国人觉得功夫：","opts":["只是一种运动","能帮助了解中国文化","很难学"],"a":1,"en":"Many foreigners come to China to learn kung fu. They feel it isn't just a sport but also a way to understand Chinese culture. After a few years of practice, some not only become healthier but also learn to speak fluent Mandarin."},{"p":"去银行或者医院办事，常常需要带护照的复印件。我建议大家在家里准备几份，放在一个纸袋里，这样需要的时候就不用着急去外面找地方复印了。","q":"★ 说话人建议：","opts":["在家里准备好复印件","每次去外面复印","不带护照"],"a":0,"en":"Going to the bank or hospital often requires a photocopy of your passport. I suggest preparing a few at home in a folder, so when you need one you don't have to rush out to find somewhere to copy it."}],"write":[{"words":["我","出生","在","一个小城市。"],"en":"I was born in a small city."},{"words":["请","把","胳膊","抬","高一点儿。"],"en":"Please lift your arm a bit higher."},{"words":["她","转过身","跟我","打了个招呼。"],"en":"She turned around and said hello to me."},{"words":["这儿","太吵了","我们","换个地方吧。"],"en":"It's too noisy here — let's go somewhere else."}],"hanzi":[{"s":"他的电话一直（  ）线，我打不通。","py":"zhàn","a":"占"},{"s":"我在打（  ）店打印了二十份材料。","py":"yìn","a":"印"},{"s":"请问，这个座（  ）有人吗？","py":"wèi","a":"位"},{"s":"他今天戴了一副新眼（  ）。","py":"jìng","a":"镜"}]},"tx":[{"t":"新学期报名 · Registering for the new term","scene":"Mark registers at the international student office, where Teacher Chen helps him with the forms.","g":[1],"lines":[{"sp":"马克","s":"m","zh":"陈老师好！新学期的报名表我已经填好了，您帮我看看吧。","py":"Chén lǎoshī hǎo! Xīn xuéqī de bàomíngbiǎo wǒ yǐjīng tiánhǎo le, nín bāng wǒ kànkan ba.","en":"Hello, Teacher Chen! I've filled in the registration form for the new semester — could you check it for me?"},{"sp":"陈老师","s":"f","zh":"姓名、性别、国籍都没问题，可是出生日期你写成今年了。","py":"Xìngmíng, xìngbié, guójí dōu méi wèntí, kěshì chūshēng rìqī nǐ xiěchéng jīnnián le.","en":"Name, gender and nationality are all fine, but you wrote this year as your date of birth."},{"sp":"马克","s":"m","zh":"哎呀，真不好意思，我太粗心了。我重新打印一张吧。","py":"Āiyā, zhēn bù hǎoyìsi, wǒ tài cūxīn le. Wǒ chóngxīn dǎyìn yì zhāng ba.","en":"Oh dear, I'm so sorry, I was careless. I'll print a new one."},{"sp":"陈老师","s":"f","zh":"好的。另外还要交一张护照的复印件和两张照片，照片上不能戴眼镜。","py":"Hǎo de. Lìngwài hái yào jiāo yì zhāng hùzhào de fùyìnjiàn hé liǎng zhāng zhàopiàn, zhàopiàn shang bù néng dài yǎnjìng.","en":"OK. You also need to hand in a photocopy of your passport and two photos — no glasses in the photos."},{"sp":"马克","s":"m","zh":"那我得先去理发，再重新照一张。我的头发太长了，戴着眼镜也不好看。","py":"Nà wǒ děi xiān qù lǐfà, zài chóngxīn zhào yì zhāng. Wǒ de tóufa tài cháng le, dàizhe yǎnjìng yě bù hǎokàn.","en":"Then I'd better get a haircut first and take a new one. My hair's too long, and it doesn't look good with glasses either."},{"sp":"陈老师","s":"f","zh":"不着急，下个星期五以前交就可以。","py":"Bù zháojí, xià ge xīngqīwǔ yǐqián jiāo jiù kěyǐ.","en":"No rush — anytime before next Friday is fine."}]},{"t":"租房子 · Renting a flat","scene":"Liu Fang is shown a flat by its landlord.","g":[0],"lines":[{"sp":"房东","s":"m","zh":"这套房子离地铁站很近，厨房也很大，你看看怎么样。","py":"Zhè tào fángzi lí dìtiězhàn hěn jìn, chúfáng yě hěn dà, nǐ kànkan zěnmeyàng.","en":"This flat is close to the subway station and the kitchen is big — have a look and see what you think."},{"sp":"刘芳","s":"f","zh":"挺好的。不过我听见外面有点儿吵，晚上也这样吗？","py":"Tǐng hǎo de. Búguò wǒ tīngjiàn wàimian yǒudiǎnr chǎo, wǎnshang yě zhèyàng ma?","en":"It's nice. But I can hear it's a bit noisy outside — is it like this at night too?"},{"sp":"房东","s":"m","zh":"放心，小区规定晚上十点以后禁止大声放音乐，所以晚上很安静。","py":"Fàngxīn, xiǎoqū guīdìng wǎnshang shí diǎn yǐhòu jìnzhǐ dàshēng fàng yīnyuè, suǒyǐ wǎnshang hěn ānjìng.","en":"Don't worry — the estate's rules forbid loud music after 10 p.m., so it's quiet at night."},{"sp":"刘芳","s":"f","zh":"那可以养小狗吗？我有一只很小的狗。","py":"Nà kěyǐ yǎng xiǎo gǒu ma? Wǒ yǒu yì zhī hěn xiǎo de gǒu.","en":"Can I keep a dog, then? I have a very small one."},{"sp":"房东","s":"m","zh":"可以，只要它不弄坏家具就行。你要是想租，明天就可以搬进来。","py":"Kěyǐ, zhǐyào tā bú nònghuài jiājù jiù xíng. Nǐ yàoshi xiǎng zū, míngtiān jiù kěyǐ bān jinlai.","en":"Yes, as long as it doesn't damage the furniture. If you want to rent it, you can move in tomorrow."},{"sp":"刘芳","s":"f","zh":"好，我今天晚上考虑一下，明天给您打电话。","py":"Hǎo, wǒ jīntiān wǎnshang kǎolǜ yíxià, míngtiān gěi nín dǎ diànhuà.","en":"OK, I'll think it over tonight and call you tomorrow."}]},{"t":"体育馆里 · At the sports hall","scene":"Zhang Wei and Lin Xiaoyu go to watch a table tennis match and run into a few small problems.","g":[0,2],"lines":[{"sp":"张伟","s":"m","zh":"小雨，我给你打了三次电话，一直占线，还以为你不来了呢。","py":"Xiǎoyǔ, wǒ gěi nǐ dǎle sān cì diànhuà, yìzhí zhànxiàn, hái yǐwéi nǐ bù lái le ne.","en":"Xiaoyu, I called you three times and the line was always busy — I thought you weren't coming."},{"sp":"林小雨","s":"f","zh":"对不起，我妈妈刚才一直在跟我聊天儿。今天这场乒乓球比赛几点开始？","py":"Duìbuqǐ, wǒ māma gāngcái yìzhí zài gēn wǒ liáotiānr. Jīntiān zhè chǎng pīngpāngqiú bǐsài jǐ diǎn kāishǐ?","en":"Sorry, my mum was chatting with me the whole time. What time does today's table tennis match start?"},{"sp":"张伟","s":"m","zh":"七点半。我们的座位在二楼，从这儿往右转就是楼梯。","py":"Qī diǎn bàn. Wǒmen de zuòwèi zài èr lóu, cóng zhèr wǎng yòu zhuǎn jiù shì lóutī.","en":"Seven thirty. Our seats are on the first floor up — turn right from here and you'll find the stairs."},{"sp":"林小雨","s":"f","zh":"等一下，门口写着禁止带饮料进去，我这瓶水怎么办？","py":"Děng yíxià, ménkǒu xiězhe jìnzhǐ dài yǐnliào jìnqu, wǒ zhè píng shuǐ zěnme bàn?","en":"Wait — the sign at the door says no drinks inside. What do I do with this bottle of water?"},{"sp":"张伟","s":"m","zh":"那我们在这儿喝完再进去吧。下个星期还有一场羽毛球比赛，你想看吗？","py":"Nà wǒmen zài zhèr hēwán zài jìnqu ba. Xià ge xīngqī hái yǒu yì chǎng yǔmáoqiú bǐsài, nǐ xiǎng kàn ma?","en":"Then let's finish it here before going in. There's also a badminton match next week — do you want to watch?"},{"sp":"林小雨","s":"f","zh":"想看！不过这次我来买票，上次就是你买的。","py":"Xiǎng kàn! Búguò zhè cì wǒ lái mǎi piào, shàng cì jiù shì nǐ mǎi de.","en":"Yes! But I'll buy the tickets this time — you paid last time."}]},{"t":"过年包饺子 · Making dumplings at New Year","scene":"Mark spends New Year's Eve with Zhang Wei's family; Zhang Wei's mother teaches him to make dumplings.","g":[1],"lines":[{"sp":"妈妈","s":"f","zh":"马克，快进来！外边冷，先把外套脱了，坐下喝杯热茶。","py":"Mǎkè, kuài jìnlai! Wàibian lěng, xiān bǎ wàitào tuō le, zuòxia hē bēi rè chá.","en":"Mark, come in! It's cold out — take your coat off and sit down for a cup of hot tea."},{"sp":"马克","s":"m","zh":"阿姨好！张伟说今天晚上要包饺子，我也想学学。","py":"Āyí hǎo! Zhāng Wěi shuō jīntiān wǎnshang yào bāo jiǎozi, wǒ yě xiǎng xuéxue.","en":"Hello, auntie! Zhang Wei says we're making dumplings tonight — I'd like to learn too."},{"sp":"妈妈","s":"f","zh":"好啊。你看，先用刀把肉和菜切好，放一点儿在饺子皮上，再这样转一下，就包好了。","py":"Hǎo a. Nǐ kàn, xiān yòng dāo bǎ ròu hé cài qiēhǎo, fàng yìdiǎnr zài jiǎozi pí shang, zài zhèyàng zhuǎn yíxià, jiù bāohǎo le.","en":"Sure. Look: first chop the meat and vegetables with the knife, put a little on a wrapper, then turn it like this, and it's done."},{"sp":"马克","s":"m","zh":"哎呀，我包的这个破了，看起来倒像个包子。","py":"Āiyā, wǒ bāo de zhège pò le, kàn qilai dào xiàng ge bāozi.","en":"Oh no, mine has split — it actually looks more like a steamed bun."},{"sp":"妈妈","s":"f","zh":"没关系，第一次都这样。我在里面放了一块钱的零钱，谁吃到了，明年就有好运气。","py":"Méi guānxi, dì yī cì dōu zhèyàng. Wǒ zài lǐmiàn fàngle yí kuài qián de língqián, shéi chīdào le, míngnián jiù yǒu hǎo yùnqi.","en":"Don't worry, everyone's like that the first time. I've put a one-yuan coin inside one — whoever gets it will have good luck next year."},{"sp":"马克","s":"m","zh":"太有意思了！吃完饭我给大家表演一段功夫吧，算是谢谢你们。","py":"Tài yǒu yìsi le! Chīwán fàn wǒ gěi dàjiā biǎoyǎn yí duàn gōngfu ba, suàn shì xièxie nǐmen.","en":"How fun! After dinner I'll perform a bit of kung fu for everyone, as a thank-you."},{"sp":"妈妈","s":"f","zh":"好啊！我们家张伟只喜欢看舞蹈，从来没学过功夫。你先抬起胳膊让我看看，袖子上都是面，快去洗一洗。","py":"Hǎo a! Wǒmen jiā Zhāng Wěi zhǐ xǐhuan kàn wǔdǎo, cónglái méi xuéguo gōngfu. Nǐ xiān táiqǐ gēbo ràng wǒ kànkan, xiùzi shang dōu shì miàn, kuài qù xǐ yi xǐ.","en":"Great! Our Zhang Wei only likes watching dance — he's never learned kung fu. Lift up your arms and let me see… your sleeves are covered in flour, go and wash them."}]}]},{"n":20,"cn":"路上的风景","en":"The view along the way","vocab":[{"w":"加油站","p":"jiāyóuzhàn","pos":"n.","d":"gas station"},{"w":"航班","p":"hángbān","pos":"n.","d":"scheduled flight"},{"w":"推迟","p":"tuīchí","pos":"v.","d":"to postpone, to delay"},{"w":"高速公路","p":"gāosùgōnglù","pos":"n.","d":"expressway; motorway; freeway"},{"w":"登机牌","p":"dēngjīpái","pos":"n.","d":"boarding pass."},{"w":"首都","p":"shǒudū","pos":"n.","d":"capital (of a country)"},{"w":"旅行","p":"lǚxíng","pos":"v.","d":"to travel, to tour"},{"w":"怪","p":"guài","pos":"adv.","d":"rather, quite"},{"w":"可怜","p":"kělián","pos":"adj.","d":"pitiable, poor"},{"w":"对面","p":"duìmiàn","pos":"n.","d":"opposite, across"},{"w":"烤鸭","p":"kǎoyā","pos":"n.","d":"roast duck"},{"w":"祝贺","p":"zhùhè","pos":"v.","d":"to congratulate"},{"w":"合格","p":"hégé","pos":"adj.","d":"qualified, up to standard"},{"w":"干杯","p":"gānbēi","pos":"v.","d":"to drink a toast"},{"w":"民族","p":"mínzú","pos":"n.","d":"nationality, ethnic group"},{"w":"打扮","p":"dǎban","pos":"v.","d":"to dress up, to deck out"},{"w":"笑话","p":"xiàohuà","pos":"n.","d":"joke"},{"w":"存","p":"cún","pos":"v.","d":"to store, to keep"},{"w":"钥匙","p":"yàoshi","pos":"n.","d":"key"},{"w":"究竟","p":"jiūjìng","pos":"adv.","d":"(used in questions for emphasis) exactly"},{"w":"棵","p":"kē","pos":"m.","d":"used for plants"},{"w":"汤","p":"tāng","pos":"n.","d":"soup"},{"w":"对话","p":"duìhuà","pos":"v.","d":"to have a dialogue"},{"w":"普通话","p":"pǔtōnghuà","pos":"n.","d":"Mandarin Chinese"},{"w":"小吃","p":"xiǎochī","pos":"n.","d":"small and cheap dishes"},{"w":"收拾","p":"shōushi","pos":"v.","d":"to put in order, to pack"},{"w":"出发","p":"chūfā","pos":"v.","d":"to depart, to set off"},{"w":"辣","p":"là","pos":"adj.","d":"hot, spicy"},{"w":"香","p":"xiāng","pos":"adj.","d":"fragrant, scented"},{"w":"酸","p":"suān","pos":"adj.","d":"sour, tart"}],"proper":"长江 (ChángJiāng), 长江大桥 (ChángjiāngDàqiáo), 首都机场 (ShǒudūJīchǎng)","grammar":[{"t":"究竟 — (In questions) exactly, after all","m":"究竟 (jiūjìng) is used in questions to press for the real answer: 究竟 + question word / A不A. It shows impatience or a strong wish to know, like 到底 (lesson 16), but sounds more formal and written. It goes before the verb or question word, never after it, and cannot be used with 吗 questions.","ex":[["你究竟想去哪儿？已经商量了一个小时了。","Where exactly do you want to go? We've been discussing it for an hour."],["这件事究竟是谁做的，现在还不清楚。","Who exactly did this is still unclear."],["你究竟同意不同意？给我一个准确的回答。","Do you agree or not, after all? Give me a clear answer."]]},{"t":"怪 + Adj + 的 — Rather, quite (colloquial)","m":"怪 (guài) as an adverb means \"rather / quite\" in casual speech. It is usually followed by an adjective or psychological verb and the sentence often ends with 的: 怪冷的, 怪不好意思的, 怪想他的. It often expresses the speaker's feeling and is a little warmer and more colloquial than 挺 or 很.","ex":[["这只小狗一个人在门口等了一天，怪可怜的。","The little dog waited at the door alone all day — it's rather pitiful."],["好久没见他了，还怪想他的。","I haven't seen him for ages — I actually miss him quite a bit."],["让你帮我搬了一下午家，我怪不好意思的。","You spent the whole afternoon helping me move; I feel rather bad about it."]]},{"t":"推迟 vs 提前 — Postpone vs bring forward","m":"推迟 (tuīchí) means moving something to a later time: 推迟 + event/time, or Event + 推迟到 + new time, 推迟 + duration (推迟两个小时). Its opposite is 提前 (lesson 4), moving something earlier. Both are often used for flights, meetings, exams and trips. 推迟 is a planned or announced change, unlike 迟到 (to arrive late).","ex":[["因为下大雪，会议推迟到下个星期一了。","Because of the heavy snow, the meeting has been postponed to next Monday."],["我们的旅行计划不得不推迟半年。","We had to put our travel plans back by half a year."],["比赛不但没有推迟，反而提前了一天。","Far from being postponed, the match was actually brought forward by a day."]]}],"ex":{"judge":[{"s":"我们本来打算早上八点出发，可是张伟忘了带钥匙，又回家拿了一趟，所以九点多才上高速公路。","st":"★ 他们八点准时出发了。","a":false,"en":"We planned to set off at eight, but Zhang Wei forgot his keys and went home to get them, so we only got on the expressway after nine. / ★ They left on time at eight."},{"s":"中国有五十六个民族，各个民族都有自己的特点。虽然大家平时说的话不一样，但是现在很多人都会说普通话，互相对话没有问题。","st":"★ 很多人会说普通话。","a":true,"en":"China has 56 ethnic groups, each with its own features. Although people's everyday speech differs, many can now speak Mandarin, so talking to each other isn't a problem. / ★ Many people can speak Mandarin."},{"s":"首都机场离市中心大约三十公里。如果坐出租车，不堵车的话四十分钟就能到；如果坐地铁，只要二十分钟左右。","st":"★ 坐地铁比坐出租车快。","a":true,"en":"Capital Airport is about 30 km from the city centre. By taxi it's forty minutes without traffic; by subway it's only about twenty. / ★ The subway is faster than a taxi."},{"s":"四川菜很辣，很多外国人刚开始吃不了。马克第一次吃的时候，辣得一直喝水。不过现在他倒越来越喜欢了，每个星期都要去吃一次。","st":"★ 马克现在仍然吃不了辣的。","a":false,"en":"Sichuan food is very spicy, and many foreigners can't handle it at first. The first time Mark ate it, he kept drinking water. But now he actually likes it more and more and goes once a week. / ★ Mark still can't eat spicy food."},{"s":"我弟弟今年考上了大学，全家人都很高兴。晚上我们一起去饭馆吃饭，爸爸举起杯子说：“祝贺你！大家干杯！”","st":"★ 弟弟考上了大学。","a":true,"en":"My younger brother got into university this year and the whole family was delighted. In the evening we went to a restaurant, and Dad raised his glass and said, \"Congratulations! Cheers, everyone!\" / ★ The brother got into university."}],"listen":[{"dlg":["女：我们的航班推迟了，要等两个小时。","男：那我们先去吃点儿东西吧，我饿了。"],"q":"他们为什么要等两个小时？","opts":["航班推迟了","没买到票","路上堵车"],"a":0,"en":"W: Our flight's been delayed — we have to wait two hours. M: Then let's go and eat something first; I'm hungry. Q: Why do they have to wait two hours?"},{"dlg":["男：车快没油了，前面有加油站吗？","女：有，再开五公里就有一个。"],"q":"他们最可能在做什么？","opts":["坐飞机","开车","坐地铁"],"a":1,"en":"M: We're nearly out of petrol — is there a petrol station ahead? W: Yes, there's one in another five kilometres. Q: What are they most likely doing?"},{"dlg":["女：你今天打扮得这么漂亮，要去哪儿？","男：我们公司今天晚上有个活动，我得早点儿去。"],"q":"男的晚上要去哪儿？","opts":["朋友家","机场","公司的活动"],"a":2,"en":"W: You're dressed up so nicely today — where are you off to? M: My company has an event tonight; I need to get there early. Q: Where is the man going tonight?"},{"dlg":["男：你的钥匙找到了吗？","女：找到了，原来我早上存在楼下邻居家了，自己都忘了。"],"q":"女的的钥匙在哪儿？","opts":["在包里","在邻居家","在车里"],"a":1,"en":"M: Did you find your keys? W: Yes — it turns out I left them with the neighbours downstairs this morning and forgot. Q: Where were her keys?"},{"dlg":["女：你的开车考试合格了吗？","男：合格了！我考了三次才过。","女：太好了，祝贺你！周末我们开车去旅行吧？","男：好啊，不过我刚学会，你可别笑话我。"],"q":"男的为什么高兴？","opts":["去旅行了","买了新车","考试合格了"],"a":2,"en":"W: Did you pass your driving test? M: I passed! It took me three tries. W: Great, congratulations! Shall we drive somewhere this weekend? M: Sure, but I've only just learned — don't laugh at me. Q: Why is the man happy?"}],"match":[{"q":"这碗汤怎么这么酸？","r":"我放了太多西红柿，你别喝了，我再做一碗。"},{"q":"你给我讲个笑话吧，我今天心情不好。","r":"好，不过我讲的笑话可能一点儿也不好笑。"},{"q":"门口那棵树是什么时候种的？","r":"是我爷爷年轻的时候种的，已经五十多年了。"},{"q":"你家附近有超市吗？","r":"有，就在我家对面，很方便。"},{"q":"来北京一定要吃烤鸭！","r":"我知道，我已经找好了一家有名的店。"}],"fill":[{"s":"北京是中国的（  ），有很多有名的地方。","a":"首都","en":"Beijing is China's capital and has many famous places."},{"s":"银行就在马路（  ），过了马路就是。","a":"对面","en":"The bank is just across the road — cross the street and you're there."},{"s":"我们明天早上六点就要（  ），今天晚上早点儿睡吧。","a":"出发","en":"We leave at six tomorrow morning, so go to bed early tonight."},{"s":"这家店的炒饭特别（  ），我离很远就闻到了。","a":"香","en":"This shop's fried rice smells amazing — I could smell it from far away."},{"s":"这个城市的（  ）很有名，有很多外地人专门来吃。","a":"小吃","en":"This city's snacks are famous; many people from elsewhere come specially to eat them."},{"s":"A：飞机快起飞了吧？  B：别着急，你先把（  ）拿出来，一会儿上飞机要用。","a":"登机牌","en":"A: The plane's about to take off, right? B: Don't panic — take out your boarding pass first; you'll need it to board."},{"s":"A：这个菜（  ）不辣？  B：一点儿也不辣，孩子也可以吃。","a":"辣","en":"A: Is this dish spicy? B: Not at all — even kids can eat it."},{"s":"A：你们出去玩儿，行李（  ）好了吗？  B：早就准备好了，就等你了。","a":"收拾","en":"A: Have you packed your bags for the trip? B: Long ago — we're just waiting for you."},{"s":"A：那只小狗在雨里站了半天，真（  ）。  B：我们把它带回家吧。","a":"可怜","en":"A: That puppy has been standing in the rain for ages — poor thing. B: Let's take it home."},{"s":"A：你的行李太多了，拿得了吗？  B：拿不了，我想先（  ）在车站。","a":"存","en":"A: You have too much luggage — can you carry it? B: No, I want to leave it at the station first."}],"grammar":[{"q":"你（  ）喜欢哪一件？快点儿决定吧。","opts":["究竟","到处","尤其","终于"],"a":0,"exp":"究竟 in a question presses for the real answer.","g":0},{"q":"他昨天没来上班，（  ）发生了什么事？","opts":["果然","竟然","究竟","已经"],"a":2,"exp":"究竟 + question word: what exactly happened?","g":0},{"q":"这个房间很久没人住了，（  ）冷的，我们开空调吧。","opts":["太","怪","最","非常"],"a":1,"exp":"怪 + Adj + 的 is the colloquial 'rather …的' pattern.","g":1},{"q":"孩子们都去上学了，家里一下子安静下来，我还（  ）不习惯的。","opts":["怪","最","更","太"],"a":0,"exp":"怪 + Adj/V + 的 — only 怪 combines with the closing 的 here.","g":1},{"q":"因为天气不好，我们的航班（  ）了三个小时。","opts":["推迟","提前","准时","按时"],"a":0,"exp":"推迟 + duration = delayed by that amount of time.","g":2},{"q":"老师说考试（  ）了，从下个星期五改到了这个星期三。","opts":["推迟","提前","取消","结束"],"a":1,"exp":"Friday next week → Wednesday this week is earlier, so 提前.","g":2}],"order":[{"parts":["这次旅行我们不仅去了长江大桥，","还吃了很多当地的小吃，","大家都玩儿得很开心。"],"en":"On this trip we not only visited the Yangtze River Bridge but also ate lots of local snacks; everyone had a great time."},{"parts":["由于天气原因，","我们的航班推迟了一个小时，","请大家耐心地等一下。"],"en":"Due to weather conditions, our flight is delayed by one hour; please wait patiently."},{"parts":["高速公路上开车不能太累，","所以我们每开两个小时，","就在加油站休息一下。"],"en":"You shouldn't drive tired on the expressway, so every two hours we rest at a petrol station."},{"parts":["这碗汤又酸又辣，","虽然我第一次喝，","但是觉得味道特别好。"],"en":"This soup is sour and spicy; although it's my first time trying it, I think it tastes great."}],"reading":[{"p":"去机场以前，最好先在网上看看航班是否推迟了。如果航班推迟了，就可以晚点儿出发，不用在机场等那么久。另外，现在很多航空公司都可以在网上办登机牌，这样到了机场就不用排队了。","q":"★ 这段话主要告诉我们：","opts":["坐飞机前要做哪些准备","怎么买便宜的机票","机场里有什么吃的"],"a":0,"en":"Before going to the airport, it's best to check online whether your flight is delayed. If it is, you can leave later and not wait so long at the airport. Also, many airlines now let you get your boarding pass online, so you don't have to queue at the airport."},{"p":"我第一次去四川旅游的时候，一句四川话也听不懂。有一次我问路，那位老人说了半天，我还是不明白。后来他发现我是外地人，就换成了普通话，我才知道该怎么走。","q":"★ 后来说话人为什么听懂了？","opts":["他学会了四川话","老人说了普通话","他看了地图"],"a":1,"en":"The first time I travelled to Sichuan I couldn't understand a word of the local dialect. Once I asked for directions, and the old man talked for ages but I still didn't understand. Then he realised I wasn't local and switched to Mandarin, and only then did I know which way to go."},{"p":"我家对面有一棵很老的树，夏天的时候，邻居们都喜欢坐在树下聊天儿、讲笑话。孩子们在旁边跑来跑去，特别热闹。去年城市修路，本来要把这棵树去掉，后来大家都反对，就没有去掉。","q":"★ 关于这棵树，可以知道：","opts":["去年被去掉了","在说话人家后面","大家都很喜欢它"],"a":2,"en":"Opposite my home there's a very old tree. In summer the neighbours like to sit under it chatting and telling jokes, while the children run around — it's very lively. Last year when the city was building a road, they planned to remove the tree, but everyone objected, so it was kept."},{"p":"每个地方都有自己的小吃。北京有烤鸭，天津有包子，广州有早茶。旅行的时候，我最喜欢的就是去当地人常去的小店，那儿的东西往往又便宜又好吃。","q":"★ 说话人旅行时喜欢：","opts":["住很贵的酒店","去当地的小店吃东西","买很多礼物"],"a":1,"en":"Every place has its own snacks: Beijing has roast duck, Tianjin has steamed buns, Guangzhou has morning tea. When travelling, my favourite thing is to find the little shops the locals go to — the food there is often cheap and tasty."}],"write":[{"words":["我们的","航班","推迟","了。"],"en":"Our flight has been delayed."},{"words":["门口","有","两棵","很高的","树。"],"en":"There are two tall trees by the door."},{"words":["你","究竟","什么时候","回来？"],"en":"When exactly are you coming back?"},{"words":["这个孩子","一个人","在哭","怪可怜的。"],"en":"This child is crying all alone — it's rather pitiful."},{"words":["我","把","钥匙","放在","桌子上了。"],"en":"I put the keys on the table."}],"hanzi":[{"s":"这个苹果太（  ）了，我不想吃。","py":"suān","a":"酸"},{"s":"他的普通（  ）说得非常标准。","py":"huà","a":"话"},{"s":"今天是你的生日，我们干（  ）！","py":"bēi","a":"杯"},{"s":"这次考试他终于合（  ）了。","py":"gé","a":"格"},{"s":"我们去吃北京烤（  ）吧。","py":"yā","a":"鸭"}]},"rv":{"judge":[{"s":"这次去南方旅行，我们一路上看到了长江，还在长江大桥上照了很多照片。最让我难忘的是当地的小吃，又便宜又好吃。","st":"★ 说话人对当地的小吃印象很深。","a":true,"en":"On this trip south we saw the Yangtze along the way and took lots of photos on the Yangtze River Bridge. What I'll remember most is the local snacks — cheap and delicious. / ★ The local snacks made a deep impression on the speaker."},{"s":"小李每天早上出门都要打扮半个小时，所以经常迟到。今天她起晚了，没来得及打扮就出门了，结果第一个到了公司。","st":"★ 小李今天又迟到了。","a":false,"en":"Xiao Li spends half an hour getting ready every morning, so she's often late. Today she overslept and left without time to get ready — and was the first to arrive at the office. / ★ Xiao Li was late again today."},{"s":"这家饭馆的鸡汤很有名，用的是农村养的鸡，要做四五个小时。客人们都说，喝了这里的汤，就不想去别的饭馆了。","st":"★ 这家饭馆的鸡汤做起来很快。","a":false,"en":"This restaurant's chicken soup is famous; it uses farm-raised chickens and takes four or five hours to make. Customers say once you've had the soup here you won't want to go anywhere else. / ★ The chicken soup is quick to make."},{"s":"我的汉语老师说，学好普通话最好的办法就是多跟中国人对话。所以我每天都去学校旁边的小店买东西，跟老板聊一会儿天儿。","st":"★ 说话人常常跟小店老板聊天儿。","a":true,"en":"My Chinese teacher says the best way to learn Mandarin well is to talk with Chinese people a lot. So every day I go to the little shop next to school to buy something and chat with the owner for a bit. / ★ The speaker often chats with the shop owner."}],"listen":[{"dlg":["男：从这儿到首都机场要多长时间？","女：走高速公路的话，四十分钟左右。"],"q":"他们在谈什么？","opts":["去机场要多久","机票多少钱","航班几点起飞"],"a":0,"en":"M: How long does it take from here to Capital Airport? W: About forty minutes via the expressway. Q: What are they talking about?"},{"dlg":["女：这个菜又酸又辣，你吃得了吗？","男：没问题，我最喜欢吃辣的了，越辣越好。"],"q":"男的觉得这个菜怎么样？","opts":["太酸了","很喜欢","太辣了，吃不了"],"a":1,"en":"W: This dish is sour and spicy — can you handle it? M: No problem, I love spicy food — the hotter the better. Q: What does the man think of the dish?"},{"dlg":["男：你怎么还没收拾行李？我们一个小时以后就要出发了。","女：别急，我的东西不多，十分钟就收拾好了。"],"q":"他们多长时间以后出发？","opts":["十分钟","半个小时","一个小时"],"a":2,"en":"M: Why haven't you packed yet? We leave in an hour. W: Relax, I don't have much — I'll be packed in ten minutes. Q: When do they leave?"},{"dlg":["女：你究竟把钥匙放哪儿了？我们已经找了半天了。","男：我记得放在包里了，可是现在怎么也找不到。","女：会不会忘在饭馆了？","男：有可能，我给饭馆打个电话问问。"],"q":"男的要做什么？","opts":["回家拿钥匙","给饭馆打电话","再买一把钥匙"],"a":1,"en":"W: Where exactly did you put the keys? We've been looking for ages. M: I remember putting them in my bag, but now I just can't find them. W: Could you have left them at the restaurant? M: Possibly — I'll call the restaurant and ask. Q: What will the man do?"}],"fill":[{"s":"这条（  ）又宽又直，车开得特别快。","a":"高速公路","en":"This expressway is wide and straight, and cars drive very fast on it."},{"s":"我（  ）的那班飞机晚上十点才起飞。","a":"航班","en":"My flight doesn't take off until 10 p.m."},{"s":"明天上课的时候，我们要用汉语跟中国学生（  ），我有点儿紧张。","a":"对话","en":"In class tomorrow we have to hold a conversation in Chinese with Chinese students — I'm a bit nervous."},{"s":"听说你找到了新工作，（  ）你！","a":"祝贺","en":"I hear you've found a new job — congratulations!"},{"s":"A：今天晚上你给大家讲个（  ）吧？  B：好啊，我昨天在网上看到一个特别好笑的。","a":"笑话","en":"A: Tell everyone a joke tonight? B: Sure — I saw a really funny one online yesterday."},{"s":"A：中国一共有多少个（  ）？  B：五十六个，汉族的人最多。","a":"民族","en":"A: How many ethnic groups does China have? B: Fifty-six; the Han are the largest."}],"grammar":[{"q":"你（  ）是哪国人？我听你说话不像中国人。","opts":["是否","究竟","终于","曾经"],"a":1,"exp":"究竟 in a direct question asks for the real answer.","g":0},{"q":"她每天一个人吃饭，没人跟她说话，（  ）可怜的。","opts":["怪","非常","极","太"],"a":0,"exp":"怪 + Adj + 的; 非常/太 don't need 的 and 极 goes after the adjective.","g":1},{"q":"今天你帮了我这么大的忙，我真是怪不好意思（  ）。","opts":["了","的","呢","吧"],"a":1,"exp":"怪 … 的 is the fixed colloquial frame.","g":1},{"q":"因为高速公路上堵车，我们的出发时间（  ）到了下午。","opts":["推迟","提前","准时","迟到"],"a":0,"exp":"Moving departure to a later time = 推迟.","g":2},{"q":"他想早点儿回家，就（  ）了一个小时下班。","opts":["推迟","提前","放弃","停止"],"a":1,"exp":"Leaving work an hour early = 提前.","g":2},{"q":"大家讨论了这么久，（  ）谁去出差，经理还没决定。","opts":["究竟","仍然","否则","于是"],"a":0,"exp":"究竟 + question word inside an embedded question: who exactly will go.","g":0}],"order":[{"parts":["由于航班推迟了，","我们在机场等了三个多小时，","到家的时候已经半夜了。"],"en":"Because the flight was delayed, we waited over three hours at the airport, and it was midnight by the time we got home."},{"parts":["这家店的烤鸭特别香，","每天晚上都有很多人排队，","我们最好早点儿去。"],"en":"This shop's roast duck smells wonderful; there's a queue every night, so we'd better go early."},{"parts":["出发以前一定要检查一下，","钥匙、手机和钱包是否都带了，","否则到了外面就麻烦了。"],"en":"Before setting off, be sure to check whether you've got your keys, phone and wallet; otherwise you'll be in trouble once you're out."}],"reading":[{"p":"很多人开车去旅行，喜欢一口气开到目的地。其实这样很危险。专家建议，在高速公路上开车，每两个小时最好停下来休息一下，可以在加油站买杯咖啡，走一走，再继续开。","q":"★ 专家建议：","opts":["开车旅行时中间要休息","不要开车去旅行","在加油站多买点儿吃的"],"a":0,"en":"Many people driving on holiday like to go straight to their destination in one go. Actually that's dangerous. Experts suggest stopping to rest every two hours on the expressway — buy a coffee at a petrol s xt semester! I also want to travel to ethnic minority areas and see their festival dress."}]},{"t":"旅行回来 · Back from a trip","scene":"Zhang Wei comes home from a trip and finds his mother tidying up.","g":[0,1],"lines":[{"sp":"张伟","s":"m","zh":"妈，我回来了！哎，我的钥匙呢？我记得出发以前存在您这儿了。","py":"Mā, wǒ huílai le! Āi, wǒ de yàoshi ne? Wǒ jìde chūfā yǐqián cún zài nín zhèr le.","en":"Mum, I'm back! Hey, where are my keys? I remember leaving them with you before I set off."},{"sp":"妈妈","s":"f","zh":"在桌子上呢。你这次去了这么多天，究竟去了几个地方？","py":"Zài zhuōzi shang ne. Nǐ zhè cì qùle zhème duō tiān, jiūjìng qùle jǐ ge dìfang?","en":"On the table. You were away so many days this time — how many places did you actually go to?"},{"sp":"张伟","s":"m","zh":"五个城市。最难忘的是在一个小村子里，门口有一棵一千多年的老树。","py":"Wǔ ge chéngshì. Zuì nánwàng de shì zài yí ge xiǎo cūnzi lǐ, ménkǒu yǒu yì kē yì qiān duō nián de lǎo shù.","en":"Five cities. The most memorable was a little village with a tree over a thousand years old at its entrance."},{"sp":"妈妈","s":"f","zh":"你看你，晒得这么黑，人也瘦了，怪可怜的。快去洗个澡，行李我帮你收拾。","py":"Nǐ kàn nǐ, shài de zhème hēi, rén yě shòu le, guài kělián de. Kuài qù xǐ ge zǎo, xíngli wǒ bāng nǐ shōushi.","en":"Look at you — so sunburnt and thinner too, poor thing. Go and have a shower; I'll unpack your bags for you."},{"sp":"张伟","s":"m","zh":"谢谢妈！我还给您带了当地的辣酱，您不是最喜欢吃辣的吗？","py":"Xièxie mā! Wǒ hái gěi nín dàile dāngdì de làjiàng, nín bú shì zuì xǐhuan chī là de ma?","en":"Thanks, Mum! I brought you some local chilli sauce too — don't you love spicy food?"},{"sp":"妈妈","s":"f","zh":"还是我儿子了解我。路上的风景再美，也没有回家好吧？","py":"Háishi wǒ érzi liǎojiě wǒ. Lù shang de fēngjǐng zài měi, yě méiyǒu huí jiā hǎo ba?","en":"My son knows me best. However beautiful the scenery along the way, it's still not as good as coming home, is it?"}]}]}];

let VOICES = [];
function loadVoices(){ VOICES = (speechSynthesis.getVoices() || []).filter(v => /^zh(-|_)?(CN|Hans)?/i.test(v.lang) || /Chinese|中文|普通话/i.test(v.name)); }
if ('speechSynthesis' in window){ loadVoices(); speechSynthesis.onvoiceschanged = loadVoices; }
function pickVoice(g){
  if (!VOICES.length) return null;
  const cn = VOICES.filter(v => /CN|Hans/i.test(v.lang)); const pool = cn.length ? cn : VOICES;
  if (S.set.voice){ const v = pool.find(v => v.name === S.set.voice); if (v && !g) return v; }
  const male = pool.find(v => /Yunxi|Yunyang|Kangkang|Male|男|Yunjian|Li-mu|Tian-Tian(?!.)/i.test(v.name));
  const fem = pool.find(v => /Xiaoxiao|Huihui|Yaoyao|Ting-?Ting|Female|女|Xiaoyi|Mei-Jia/i.test(v.name));
  if (g === 'm') return male || pool[0];
  if (g === 'f') return fem || pool[0];
  return pool[0];
}
function say(text, opts = {}){
  if (!('speechSynthesis' in window)) { alert('Speech is not supported in this browser.'); return; }
  speechSynthesis.cancel();
  const lines = Array.isArray(text) ? text : [text];
  lines.forEach(line => {
    let g = null, t = line;
    const m = /^(男|女)[：:]/.exec(line); if (m){ g = m[1] === '男' ? 'm' : 'f'; t = line.slice(2); }
    t = t.replace(/[（(]\s*[）)]/g, '什么').replace(/★/g, '');
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'zh-CN'; u.rate = S.set.rate; const v = pickVoice(g); if (v) u.voice = v;
    if (g === 'm' && v && !/Yunxi|Yunyang|Kangkang|Male|Yunjian/i.test(v.name)) u.pitch = .7;
    if (g === 'f') u.pitch = 1.1;
    speechSynthesis.speak(u);
  });
}
const spk = (t, big) => `<button class="speak ${big ? 'big' : ''}" data-say='${esc(JSON.stringify(t))}' title="Play">🔊</button>`;
document.addEventListener('click', e => { const b = e.target.closest('[data-say]'); if (b){ e.preventDefault(); say(JSON.parse(b.dataset.say)); } });

/* ---------- progress ---------- */
function chapterProgress(n){
  const b = S.best[n] || {}; const keys = [...SECTIONS.map(s => s.k), 'vquiz'];
  const done = keys.reduce((a, k) => a + (b[k] ?? 0), 0);
  return Math.round(done / keys.length);
}
function setBest(n, k, pct){ S.best[n] ??= {}; S.best[n][k] = Math.max(S.best[n][k] ?? 0, pct); save(); updateProg(); }
function updateProg(){ const done = studiedChapters().length;
  const f = document.getElementById('progfill'); if (!f) return;
  f.style.width = (done / DATA.length * 100) + '%'; document.getElementById('progtxt').textContent = `${done} / ${DATA.length} 课`; }
function pill(p){ if (p == null) return '<span class="pill">未做</span>'; return `<span class="pill ${p >= 80 ? 'ok' : 'mid'}">${p}%</span>`; }
const srcOf = m => m.src || 'ex';
function addMistake(n, k, i, src = 'ex'){ if (!S.mistakes.some(m => m.n == n && m.k == k && m.i == i && srcOf(m) === src)){ S.mistakes.push(src === 'ex' ? {n, k, i} : {n, k, i, src}); save(); } }
function clearMistake(n, k, i, src = 'ex'){ S.mistakes = S.mistakes.filter(m => !(m.n == n && m.k == k && m.i == i && srcOf(m) === src)); save(); }

const BOX_DAYS = [0, 1, 2, 4, 8, 16, 32];

  const id = wid(n, w); const r = S.srs[id] || {b: 0, due: 0};

}

function dueWords(){ const now = Date.now(); return allWords().filter(v => { const r = S.srs[wid(v.n, v.w)]; return r && r.due <= now; }); }

function examDays(){

  return `<nav class="tabs">${t.map(([k, l]) => `<a class="${k === on ? 'on' : ''}" href="#/ch/${n}/${k}">${l}</a>`).join('')}</nav>`;
}
