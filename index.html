了一天，太困了。"],"q":"男的为什么躺在床上？","opts":["他很困","他生病了","他在看书"],"a":0,"en":"W: Why do you lie down on the bed as soon as you get home? M: I've been running around all day; I'm so sleepy. Q: Why is the man lying on the bed?"},{"dlg":["男：你觉得这个城市的经济发展得怎么样？","女：发展得很快，不过空气越来越差了。"],"q":"女的觉得这个城市怎么样？","opts":["经济发展很慢","空气越来越好","经济发展很快"],"a":2,"en":"M: How do you think this city's economy is developing? W: Very fast, though the air keeps getting worse. Q: What does the woman think of the city?"},{"dlg":["女：我的橡皮找不到了，你看见了吗？","男：是不是在你的书包里？","女：我找过了，没有。","男：那你先用我的吧。"],"q":"女的在找什么？","opts":["书包","橡皮","铅笔"],"a":1,"en":"W: I can't find my eraser — have you seen it? M: Is it in your schoolbag? W: I've looked; it's not there. M: Use mine for now. Q: What is the woman looking for?"},{"dlg":["男：你决定去哪家公司了吗？","女：还没有。一家工资高，一家离家近，我真不知道该怎么选。"],"q":"女的现在怎么样？","opts":["已经决定了","觉得两家都不好","还没决定去哪家"],"a":2,"en":"M: Have you decided which company to join? W: Not yet. One pays more, the other's near home; I really don't know how to choose. Q: What is the woman's situation?"}],"fill":[{"s":"她的英语很好，大学毕业以后当了一名（  ）。","a":"翻译","en":"Her English is very good; after university she became a translator."},{"s":"他太累了，回到家就（  ）在沙发上睡着了。","a":"躺","en":"He was so tired that he lay down on the sofa and fell asleep as soon as he got home."},{"s":"这个工作要求很高，必须有三年以上的工作经验，还要会说英语，很多人都不符合（  ）。","a":"条件","en":"This job is very demanding — at least three years' experience plus English — and many people don't meet the requirements."},{"s":"他读完大学，又读了三年（  ），现在在大学当老师。","a":"硕士","en":"After his bachelor's he did three more years for a master's, and now teaches at a university."},{"s":"A：今天的气温怎么这么（  ）？  B：听说北方来了冷空气，明天会更冷。","a":"低","en":"A: Why is the temperature so low today? B: I heard cold air has come down from the north; tomorrow will be even colder."},{"s":"A：这道题你做出来了吗？  B：做出来了，不过不知道（  ）对不对。","a":"答案","en":"A: Have you solved this question? B: Yes, but I don't know if my answer is right."}],"grammar":[{"q":"（  ）他平时很努力，所以这次考得特别好。","opts":["由于","确实","比如","不过"],"a":0,"exp":"由于…所以 gives cause and result.","g":0},{"q":"我很想帮你，（  ）我现在真的没有空儿。","opts":["比如","由于","不过","确实"],"a":2,"exp":"不过 introduces a gentle contrast/reservation.","g":1},{"q":"周末可以参加很多运动，（  ）踢足球、爬山、游泳等。","opts":["不过","比如","确实","由于"],"a":1,"exp":"比如…等 introduces a list of examples of outdoor activities.","g":2},{"q":"你上次说这家店的菜好吃，我尝了以后发现（  ）很好吃。","opts":["比如","由于","不过","确实"],"a":3,"exp":"确实 confirms the earlier claim.","g":3},{"q":"这个城市（  ）很美，我第一次来就喜欢上了。","opts":["确实","比如","不过","由于"],"a":0,"exp":"确实 + adjective: it truly is beautiful.","g":3},{"q":"（  ）天气太热，很多人都不愿意出门。","opts":["比如","不过","确实","由于"],"a":3,"exp":"由于 introduces the cause of people not going out.","g":0}],"order":[{"parts":["小孩子听说要去动物园，","兴奋地拉着爸爸的手，","一直问什么时候出门。"],"en":"Hearing they were going to the zoo, the child excitedly took his dad's hand and kept asking when they'd leave."},{"parts":["由于这几年经济发展得很快，","人们的生活条件越来越好，","很多家庭都买了车。"],"en":"Because the economy has grown fast in recent years, living conditions keep improving and many families have bought cars."},{"parts":["每个人对幸福的理解都不一样，","比如有的人喜欢安静，","有的人喜欢和朋友在一起。"],"en":"Everyone understands happiness differently; for example, some like quiet while others like being with friends."}],"reading":[{"p":"我奶奶今年八十岁了，身体还很好。有人问她健康的关键是什么，她说：少吃糖，少喝酒，每天走走路，心情要好。","q":"★ 根据这段话，奶奶认为：","opts":["老人应该多吃糖","心情好对健康很重要","每天都要跑步"],"a":1,"en":"My grandma is eighty and still in good health. When asked the key to her health, she said: less sugar, less alcohol, a walk every day and a good mood."},{"p":"有的人很富，却每天都不快乐；有的人很穷，却过得很快乐。所以说，钱多不一定就幸福。","q":"★ 这段话想说明：","opts":["钱多不一定幸福","穷人都很快乐","富人都不快乐"],"a":0,"en":"Some people are rich yet unhappy every day; some are poor yet live happily. So having more money doesn't necessarily mean being happier."},{"p":"王经理的女儿今年大学毕业，成绩非常优秀。很多公司都想请她去工作，可是她决定再读一个硕士。她说，现在多学一些东西，对将来的发展更有帮助。","q":"★ 关于王经理的女儿，可以知道：","opts":["她已经开始工作了","她打算读硕士","她的成绩不太好"],"a":1,"en":"Manager Wang's daughter graduates this year with excellent grades. Many companies want to hire her, but she's decided to go on to a master's. She says learning more now will help her future development more."}],"write":[{"words":["我","永远","不会忘记","那一天。"],"en":"I will never forget that day."},{"words":["这个","建议","确实","很好。"],"en":"This suggestion really is good."},{"words":["你","能不能","把门","拉开？"],"en":"Can you pull the door open?"},{"words":["她对","自己的职业","非常","满意。"],"en":"She is very satisfied with her career."}],"hanzi":[{"s":"小孩子不要吃太多（  ），对牙不好。","py":"táng","a":"糖"},{"s":"他是一名很有经验的翻（  ）。","py":"yì","a":"译"},{"s":"听到这个好消息，大家都很兴（  ）。","py":"fèn","a":"奋"},{"s":"这几年，他们家越来越（  ）了，买了新房子。","py":"fù","a":"富"}]},"tx":[{"t":"幸福是什么 · What is happiness?","scene":"On a Sunday afternoon Lin Xiaoyu and Liu Fang chat about what makes people happy.","g":[1,2],"lines":[{"sp":"林小雨","s":"f","zh":"刘芳，礼拜天你一般做什么？","py":"Liú Fāng, lǐbàitiān nǐ yìbān zuò shénme?","en":"Liu Fang, what do you usually do on Sundays?"},{"sp":"刘芳","s":"f","zh":"有空儿的话，我就回家陪母亲做做饭、聊聊天。","py":"Yǒu kòngr de huà, wǒ jiù huí jiā péi mǔqīn zuòzuo fàn, liáoliao tiān.","en":"If I have time, I go home to cook and chat with my mother."},{"sp":"林小雨","s":"f","zh":"真好。你觉得什么是幸福？","py":"Zhēn hǎo. Nǐ juéde shénme shì xìngfú?","en":"That's lovely. What do you think happiness is?"},{"sp":"刘芳","s":"f","zh":"我觉得幸福很简单，比如跟家人一起吃顿饭、在阳光下散散步等，都让我觉得很幸福。","py":"Wǒ juéde xìngfú hěn jiǎndān, bǐrú gēn jiārén yìqǐ chī dùn fàn, zài yángguāng xià sànsan bù děng, dōu ràng wǒ juéde hěn xìngfú.","en":"I think happiness is simple — things like having a meal with family or taking a walk in the sunshine all make me feel happy."},{"sp":"林小雨","s":"f","zh":"可是很多人说，没有钱就没有幸福。","py":"Kěshì hěn duō rén shuō, méiyǒu qián jiù méiyǒu xìngfú.","en":"But many people say that without money there's no happiness."},{"sp":"刘芳","s":"f","zh":"钱当然重要，不过富人不一定幸福，穷人也不一定不幸福。","py":"Qián dāngrán zhòngyào, búguò fùrén bù yídìng xìngfú, qióngrén yě bù yídìng bú xìngfú.","en":"Money matters of course, but rich people aren't necessarily happy and poor people aren't necessarily unhappy."},{"sp":"林小雨","s":"f","zh":"你说得对，幸福的标准在每个人自己心里。","py":"Nǐ shuō de duì, xìngfú de biāozhǔn zài měi gè rén zìjǐ xīnli.","en":"You're right. The standard of happiness lies in each person's own heart."}]},{"t":"找工作 · Job hunting","scene":"Ms Chen gives career advice to Mark, who is about to finish his master's degree.","g":[0,3],"lines":[{"sp":"马克","s":"m","zh":"陈老师，我明年就硕士毕业了，可是还不知道该选什么职业。","py":"Chén lǎoshī, wǒ míngnián jiù shuòshì bìyè le, kěshì hái bù zhīdào gāi xuǎn shénme zhíyè.","en":"Ms Chen, I finish my master's next year, but I still don't know what career to choose."},{"sp":"陈老师","s":"f","zh":"你的汉语这么好，可以考虑当翻译。","py":"Nǐ de Hànyǔ zhème hǎo, kěyǐ kǎolǜ dāng fānyì.","en":"Your Chinese is so good — you could think about becoming a translator."},{"sp":"马克","s":"m","zh":"我确实对翻译很感兴趣，但是也想去公司学学经济方面的东西。","py":"Wǒ quèshí duì fānyì hěn gǎn xìngqù, dànshì yě xiǎng qù gōngsī xuéxue jīngjì fāngmiàn de dōngxi.","en":"I really am interested in translation, but I'd also like to work in a company and learn about economics."},{"sp":"陈老师","s":"f","zh":"我的建议是，先想清楚自己将来想往哪个方向发展。","py":"Wǒ de jiànyì shì, xiān xiǎng qīngchu zìjǐ jiānglái xiǎng wǎng nǎge fāngxiàng fāzhǎn.","en":"My advice is to first work out which direction you want to develop in."},{"sp":"马克","s":"m","zh":"由于我对中国很熟悉，所以我很想做跟中外交流有关的工作。","py":"Yóuyú wǒ duì Zhōngguó hěn shúxī, suǒyǐ wǒ hěn xiǎng zuò gēn Zhōng-wài jiāoliú yǒuguān de gōngzuò.","en":"Since I know China well, I'd really like a job connected with exchanges between China and other countries."},{"sp":"陈老师","s":"f","zh":"那就对了。方向清楚是关键，你这么优秀，一定能找到适合你的工作。","py":"Nà jiù duì le. Fāngxiàng qīngchu shì guānjiàn, nǐ zhème yōuxiù, yídìng néng zhǎodào shìhé nǐ de gōngzuò.","en":"That's it, then. Having a clear direction is the key. You're so outstanding, you'll surely find a suitable job."}]},{"t":"爸爸和女儿 · Dad and daughter","scene":"At home, a sleepy dad and his excited little daughter argue about candy and homework.","g":[1],"lines":[{"sp":"女儿","s":"f","zh":"爸爸，你别躺着了，起来陪我玩儿吧！","py":"Bàba, nǐ bié tǎng zhe le, qǐlai péi wǒ wánr ba!","en":"Dad, stop lying there — get up and play with me!"},{"sp":"爸爸","s":"m","zh":"爸爸今天有点儿困，你怎么这么兴奋？","py":"Bàba jīntiān yǒudiǎnr kùn, nǐ zěnme zhème xīngfèn?","en":"Daddy's a bit sleepy today. Why are you so excited?"},{"sp":"女儿","s":"f","zh":"因为老师今天给了我两块糖，还送了我一块新橡皮！","py":"Yīnwèi lǎoshī jīntiān gěi le wǒ liǎng kuài táng, hái sòng le wǒ yí kuài xīn xiàngpí!","en":"Because my teacher gave me two sweets today and a new eraser too!"},{"sp":"爸爸","s":"m","zh":"太好了！不过糖要少吃，作业做完了吗？","py":"Tài hǎo le! Búguò táng yào shǎo chī, zuòyè zuò wán le ma?","en":"Great! But don't eat too many sweets. Have you finished your homework?"},{"sp":"女儿","s":"f","zh":"还差一道题，答案我不会写。","py":"Hái chà yí dào tí, dá'àn wǒ bú huì xiě.","en":"There's one question left — I can't write the answer."},{"sp":"爸爸","s":"m","zh":"来，拉着爸爸的手，我们一起去看看。","py":"Lái, lā zhe bàba de shǒu, wǒmen yìqǐ qù kànkan.","en":"Come on, hold Daddy's hand and let's go have a look together."}]},{"t":"电台节目 · On the radio","scene":"A radio journalist and Manager Wang talk about how standards of happiness change as living conditions improve.","g":[0,2,3],"lines":[{"sp":"记者","s":"f","zh":"王经理，您觉得这些年人们对幸福的理解有什么变化？","py":"Wáng jīnglǐ, nín juéde zhèxiē nián rénmen duì xìngfú de lǐjiě yǒu shénme biànhuà?","en":"Manager Wang, how do you think people's view of happiness has changed in recent years?"},{"sp":"王经理","s":"m","zh":"以前经济条件差，很多人很穷，能吃饱就觉得幸福了。","py":"Yǐqián jīngjì tiáojiàn chà, hěn duō rén hěn qióng, néng chī bǎo jiù juéde xìngfú le.","en":"In the past economic conditions were poor and many people were poor; being able to eat their fill made them happy."},{"sp":"记者","s":"f","zh":"现在呢？","py":"Xiànzài ne?","en":"And now?"},{"sp":"王经理","s":"m","zh":"由于生活水平提高了，人们的要求也高了，比如住大房子、开好车、出国旅游等。","py":"Yóuyú shēnghuó shuǐpíng tígāo le, rénmen de yāoqiú yě gāo le, bǐrú zhù dà fángzi, kāi hǎo chē, chū guó lǚyóu děng.","en":"Because living standards have risen, people expect more — a big house, a good car, holidays abroad and so on."},{"sp":"记者","s":"f","zh":"这样的话，幸福的标准是不是永远也不会低下来？","py":"Zhèyàng de huà, xìngfú de biāozhǔn shì bu shì yǒngyuǎn yě bú huì dī xiàlai?","en":"In that case, will the bar for happiness never come down again?"},{"sp":"王经理","s":"m","zh":"确实有这个可能。所以我觉得，对自己的生活满意才是幸福的关键。","py":"Quèshí yǒu zhège kěnéng. Suǒyǐ wǒ juéde, duì zìjǐ de shēnghuó mǎnyì cái shì xìngfú de guānjiàn.","en":"That really is possible. So I think being satisfied with your own life is the real key to happiness."}]}]},{"n":11,"cn":"读书好，读好书，好读书","en":"It's good to read; read good books and like reading","vocab":[{"w":"流利","p":"liúlì","pos":"adj.","d":"fluent"},{"w":"厉害","p":"lìhai","pos":"adj.","d":"awesome, serious"},{"w":"语法","p":"yǔfǎ","pos":"n.","d":"grammar"},{"w":"准确","p":"zhǔnquè","pos":"adj.","d":"accurate, precise"},{"w":"词语","p":"cíyǔ","pos":"n.","d":"word, expression"},{"w":"连","p":"lián","pos":"prep.","d":"even"},{"w":"阅读","p":"yuèdú","pos":"v.","d":"to read"},{"w":"来得及","p":"láidejí","pos":"v.","d":"there's still time (to do sth.)"},{"w":"复杂","p":"fùzá","pos":"adj.","d":"complicated"},{"w":"只好","p":"zhǐhǎo","pos":"adv.","d":"cannot but, to be forced to"},{"w":"填空","p":"tiánkòng","pos":"v.","d":"to fill in a blank"},{"w":"猜","p":"cāi","pos":"v.","d":"to guess"},{"w":"否则","p":"fǒuzé","pos":"conj.","d":"or, otherwise"},{"w":"客厅","p":"kètīng","pos":"n.","d":"living room"},{"w":"无论","p":"wúlùn","pos":"conj.","d":"regardless of, no matter (what, how, when, etc.)"},{"w":"杂志","p":"zázhì","pos":"n.","d":"magazine"},{"w":"著名","p":"zhùmíng","pos":"adj.","d":"famous, well-known"},{"w":"页","p":"yè","pos":"m.","d":"page"},{"w":"增加","p":"zēngjiā","pos":"v.","d":"to increase, to add"},{"w":"文章","p":"wénzhāng","pos":"n.","d":"essay, article"},{"w":"之","p":"zhī","pos":"part.","d":"connecting the modifier and the word modified"},{"w":"内容","p":"nèiróng","pos":"n.","d":"content"},{"w":"然而","p":"ránér","pos":"conj.","d":"but, however"},{"w":"看法","p":"kànfǎ","pos":"n.","d":"viewpoint, opinion"},{"w":"相同","p":"xiāngtóng","pos":"adj.","d":"same"},{"w":"顺序","p":"shùnxù","pos":"n.","d":"order, sequence"},{"w":"表示","p":"biǎoshì","pos":"v.","d":"to express, to indicate"},{"w":"养成","p":"yǎngchéng","pos":"v.","d":"to develop, to form"},{"w":"同时","p":"tóngshí","pos":"conj.","d":"at the same time, meanwhile"},{"w":"精彩","p":"jīngcǎi","pos":"adj.","d":"wonderful, splendid"}],"proper":"大卫 (Dàwèi)","grammar":[{"t":"连……也/都…… — even …","m":"连 marks an extreme or unexpected case, and 也 or 都 follows before the verb: 连 + noun/verb/clause + 也/都 + predicate. The idea is that if even this extreme case is true (or not true), then everything else certainly is. It is very often used with negatives: 连一句话都没说.","ex":[["这个字太难了，连我们老师也不认识。","This character is so hard that even our teacher doesn't know it."],["他忙得连午饭都没时间吃。","He's so busy he doesn't even have time to eat lunch."],["我刚来的时候，连“你好”都不会说。","When I first came, I couldn't even say \"hello\"."]]},{"t":"无论……都/也…… — no matter (what/how/who) …","m":"无论 introduces a set of conditions — with a question word (什么, 怎么, 谁, 多…) or with an A还是B / A不A choice — and the result after 都/也 stays the same under all of them. It means the same as 不管 but sounds more formal and written. You cannot use 无论 with a single fixed condition.","ex":[["无论多忙，他每天晚上都要阅读半个小时。","No matter how busy he is, he reads for half an hour every evening."],["无论你同意不同意，我都要去试一试。","Whether you agree or not, I'm going to give it a try."],["无论遇到什么问题，你都可以给我打电话。","Whatever problem you run into, you can call me."]]},{"t":"否则 — otherwise, or else","m":"否则 starts the second clause and states the (usually bad) consequence if the condition in the first clause is not met. It is more formal than 要不然/不然. The first clause often contains 必须, 得, 一定要 or 最好; 否则 can be followed by 就 or 的话.","ex":[["你得快点儿，否则就来不及坐火车了。","Hurry up, otherwise you'll miss the train."],["学语法一定要多练习，否则很快就会忘。","With grammar you have to practise a lot, or else you'll soon forget it."],["出门最好带把伞，否则下雨的话会很麻烦。","Better take an umbrella when you go out; otherwise it'll be a nuisance if it rains."]]},{"t":"只好 — have no choice but to","m":"只好 is an adverb placed before the verb: because of some situation (often stated in the first clause), the subject has no better option and is forced to do this. It expresses reluctant acceptance. Compare 不得不 (stronger, 'must against one's will'); 只好 is milder and more colloquial.","ex":[["书店里没有这本杂志，我只好在网上买。","The bookshop didn't have this magazine, so I had to buy it online."],["电梯坏了，我们只好走上十楼。","The lift was broken, so we had no choice but to walk up to the tenth floor."],["他的话太快了，我听不懂，只好请他说慢一点儿。","He spoke too fast for me to understand, so I had to ask him to speak more slowly."]]}],"ex":{"judge":[{"s":"大卫来中国才一年，汉语就说得非常流利了。他说，他的方法很简单：每天阅读一篇中文文章，遇到不认识的词语就查词典。","st":"★ 大卫每天都看中文文章。","a":true,"en":"David has been in China only a year, yet he already speaks Chinese very fluently. He says his method is simple: read one Chinese article a day and look up any words he doesn't know. / ★ David reads a Chinese article every day."},{"s":"这本杂志的内容很丰富，有新闻、有故事，还有不少著名作家写的文章，所以很受年轻人欢迎。","st":"★ 这本杂志只有新闻。","a":false,"en":"This magazine has rich content — news, stories and quite a few articles by famous writers — so it's popular with young people. / ★ This magazine contains only news."},{"s":"读书的时候，不要只看书里写了什么，还要想一想写书的人为什么这样写。同时，你也可以把自己的看法写下来。","st":"★ 说话人建议读书时要多想。","a":true,"en":"When reading, don't only look at what the book says; think about why the author wrote it that way. At the same time you can write down your own views. / ★ The speaker suggests thinking a lot while reading."},{"s":"考试还有五分钟就结束了，可是我还有三道填空题没做，我只好先猜一个答案写上。","st":"★ 说话人已经把所有的题都认真做完了。","a":false,"en":"The exam ends in five minutes, but I still have three fill-in-the-blank questions left, so I'll just have to guess an answer for now. / ★ The speaker has carefully finished all the questions."},{"s":"很多人觉得语法很复杂，其实只要多读多写，慢慢就能用准确了。","st":"★ 说话人认为语法很难学好。","a":false,"en":"Many people think grammar is complicated, but as long as you read and write a lot you'll gradually use it accurately. / ★ The speaker thinks grammar is very hard to master."}],"listen":[{"dlg":["女：你怎么在客厅里睡着了？","男：我看杂志看着看着就睡着了。"],"q":"男的刚才在哪儿？","opts":["卧室","客厅","书店"],"a":1,"en":"W: Why did you fall asleep in the living room? M: I nodded off while reading a magazine. Q: Where was the man just now?"},{"dlg":["男：电影七点开始，现在六点半，还来得及吗？","女：来得及，打车一刻钟就到了。"],"q":"女的是什么意思？","opts":["已经晚了","电影不好看","时间还够"],"a":2,"en":"M: The film starts at seven and it's six-thirty; can we still make it? W: Yes, it's only a quarter of an hour by taxi. Q: What does the woman mean?"},{"dlg":["女：这本书你看到第几页了？","男：才看到五十页，内容有点儿复杂。","女：要不要我给你讲讲？","男：好啊，太谢谢你了。"],"q":"男的觉得这本书怎么样？","opts":["内容有点儿复杂","非常精彩","太简单了"],"a":0,"en":"W: Which page are you up to? M: Only page fifty — the content's a bit complicated. W: Want me to explain it? M: Yes please, thanks so much. Q: What does the man think of the book?"},{"dlg":["男：你的汉语说得真厉害！","女：哪里，我的语法还不太准确。"],"q":"女的觉得自己哪方面不够好？","opts":["发音","语法","汉字"],"a":1,"en":"M: Your Chinese is amazing! W: Not really, my grammar still isn't very accurate. Q: Which area does the woman think is not good enough?"},{"dlg":["女：这两篇文章的看法相同吗？","男：不同，第一篇认为要多读书，第二篇认为要多运动。","女：你同意哪一篇？","男：我觉得两个都对。"],"q":"男的认为哪篇文章对？","opts":["第一篇","第二篇","两篇都对"],"a":2,"en":"W: Do these two articles share the same view? M: No — the first says read more, the second says exercise more. W: Which one do you agree with? M: I think both are right. Q: Which article does the man think is right?"}],"match":[{"q":"你能猜到我买了什么吗？","r":"是不是我一直想要的那本小说？"},{"q":"这个电影怎么样？","r":"非常精彩，我已经看了两次了。"},{"q":"你怎么知道这么多历史故事？","r":"我从小就养成了每天读书的习惯。"},{"q":"我们还来得及吃早饭吗？","r":"来不及了，我们路上买个面包吧。"},{"q":"这几个词的顺序对不对？","r":"不对，“昨天”应该放在前面。"}],"fill":[{"s":"马克的汉语说得很（  ），很多人以为他是中国人。","a":"流利","en":"Mark speaks Chinese so fluently that many people think he's Chinese."},{"s":"这个问题太（  ）了，我们得好好想一想。","a":"复杂","en":"This problem is too complicated; we need to think it over properly."},{"s":"他每天晚上都要（  ）一个小时，已经坚持了十年。","a":"阅读","en":"He reads for an hour every evening and has kept it up for ten years."},{"s":"这位作家非常（  ），他的小说被翻译成了二十多种外语。","a":"著名","en":"This writer is very famous; his novels have been translated into more than twenty languages."},{"s":"最近来这家饭馆吃饭的人越来越多，所以老板又（  ）了五张桌子。","a":"增加","en":"More and more people eat at this restaurant, so the owner added five more tables."},{"s":"A：你觉得这次考试难吗？  B：别的还好，就是（  ）题有点儿难。","a":"填空","en":"A: Was the exam hard? B: The rest was fine; only the fill-in-the-blank questions were a bit hard."},{"s":"A：他点头是什么意思？  B：点头一般（  ）同意。","a":"表示","en":"A: What does it mean when he nods? B: Nodding usually means agreement."},{"s":"A：这本书一共多少（  ）？  B：三百多，我一个星期就能看完。","a":"页","en":"A: How many pages does this book have? B: Over three hundred; I can finish it in a week."},{"s":"A：你们俩的爱好一样吗？  B：不太一样，不过我们对很多事情的看法是（  ）的。","a":"相同","en":"A: Do you two have the same hobbies? B: Not really, but we see many things the same way."},{"s":"A：你打网球打得真（  ）！  B：哪里哪里，我只是练得比较多。","a":"厉害","en":"A: You're really good at tennis! B: Not at all, I just practise a lot."}],"grammar":[{"q":"这道题太简单了，（  ）小孩子都会做。","opts":["无论","否则","连","只好"],"a":2,"exp":"连…都 marks the extreme case: even children can do it.","g":0},{"q":"（  ）刮风还是下雨，他每天都坚持跑步。","opts":["连","无论","否则","只好"],"a":1,"exp":"无论 A还是B…都: the result holds under either condition.","g":1},{"q":"你最好现在就去买票，（  ）就买不到了。","opts":["否则","无论","连","只好"],"a":0,"exp":"否则 gives the bad consequence if you don't buy now.","g":2},{"q":"最后一班车已经走了，我们（  ）打车回家。","opts":["连","否则","无论","只好"],"a":3,"exp":"只好 = have no choice but to.","g":3},{"q":"他太紧张了，（  ）自己的名字都写错了。","opts":["只好","连","无论","否则"],"a":1,"exp":"连…都 highlights something surprising: even his own name.","g":0},{"q":"（  ）你什么时候来，我都欢迎。","opts":["否则","只好","无论","连"],"a":2,"exp":"无论 + question word (什么时候) … 都.","g":1}],"order":[{"parts":["无论学哪种外语，","都要养成多读多写的习惯，","否则很难真正学好。"],"en":"Whatever foreign language you learn, you need the habit of reading and writing a lot, otherwise it's hard to really master it."},{"parts":["这篇文章的词语不太难，","然而内容却很深，","我看了好几次才看懂。"],"en":"The words in this article aren't hard, yet the content is deep; I only understood it after reading it several times."},{"parts":["他一边听音乐，","一边阅读杂志，","同时还在吃东西。"],"en":"He was listening to music and reading a magazine, while eating at the same time."},{"parts":["由于书店已经关门了，","我没买到那本书，","只好明天再去。"],"en":"Because the bookshop had closed, I didn't get the book and have to go again tomorrow."}],"reading":[{"p":"读书有很多好处。它不但能让我们了解更多知识，而且能让我们认识自己。然而，读书也要选择好书。一本好书，就像一位好老师，能给我们很大的帮助。","q":"★ 这段话主要谈的是：","opts":["读书和选书","怎样当好老师","怎样写书"],"a":0,"en":"Reading has many benefits. It not only lets us learn more but also helps us know ourselves. However, you must choose good books; a good book is like a good teacher and can help us greatly."},{"p":"我家的客厅里没有电视，只有一个大书架，上面放满了书和杂志。父母说，他们希望我从小养成读书的好习惯。现在，连我五岁的妹妹每天都要看一会儿书。","q":"★ 关于说话人的家，可以知道：","opts":["客厅里有一台大电视","妹妹也喜欢看书","父母不喜欢读书"],"a":1,"en":"There's no TV in our living room, only a big bookcase full of books and magazines. My parents say they hope I develop a good reading habit from childhood. Now even my five-year-old sister reads for a while every day."},{"p":"学汉语的时候，很多人觉得词语的顺序很难。比如，“我昨天去了图书馆”不能说成“我去了图书馆昨天”。只有多听多读，才能慢慢习惯汉语的说法。","q":"★ 根据这段话，学好汉语词语顺序的方法是：","opts":["多听多读","多记语法","多查词典"],"a":0,"en":"When learning Chinese, many people find word order hard. For example, 'I went to the library yesterday' can't be said with 'yesterday' at the end. Only by listening and reading a lot can you get used to how Chinese says things."},{"p":"这个故事非常精彩，我看了第一页就不想放下了。无论吃饭还是坐车，我都在看。三天以后，我终于看完了，可是心里还一直想着故事里的人。","q":"★ 根据这段话，说话人：","opts":["觉得故事很无聊","三天看完了这本书","只看了第一页"],"a":1,"en":"This story was so gripping that after the first page I couldn't stop. Whether eating or on the bus, I kept reading. Three days later I finally finished it, but I'm still thinking about the characters."}],"write":[{"words":["他的","看法","跟我的","完全相同。"],"en":"His view is exactly the same as mine."},{"words":["这本","杂志的内容","非常","丰富。"],"en":"This magazine's content is very rich."},{"words":["请","按照","正确的顺序","写句子。"],"en":"Please write the sentences in the correct order."},{"words":["你","猜猜","他今年","多大了？"],"en":"Guess how old he is this year?"},{"words":["他","连一个字","都没有","写。"],"en":"He didn't write a single character."}],"hanzi":[{"s":"他的汉语说得很流（  ）。","py":"lì","a":"利"},{"s":"这本杂（  ）每个月出一本。","py":"zhì","a":"志"},{"s":"你（  ）一下，我的包里有什么？","py":"cāi","a":"猜"},{"s":"这本书我已经看了一百多（  ）了。","py":"yè","a":"页"},{"s":"这场比赛非常精（  ），观看的人特别多。","py":"cǎi","a":"彩"}]},"rv":{"judge":[{"s":"林小雨每次去图书馆都会借一本杂志、一本小说。她说，杂志可以让她知道新的消息，小说可以让她放松。","st":"★ 林小雨去图书馆只借小说。","a":false,"en":"Every time Lin Xiaoyu goes to the library she borrows a magazine and a novel. She says magazines keep her up to date and novels help her relax. / ★ Lin Xiaoyu only borrows novels at the library."},{"s":"这次的阅读考试特别难，文章很长，词语也很复杂，连班里成绩最好的学生都没做完。","st":"★ 这次阅读考试很难。","a":true,"en":"This reading exam was especially hard: the articles were long and the vocabulary complicated; even the best student in the class didn't finish. / ★ This reading exam was difficult."},{"s":"写文章的时候，要先想好写什么内容，然后再决定先写什么、后写什么，否则读的人很容易看不明白。","st":"★ 写文章时，顺序不重要。","a":false,"en":"When writing an article, first decide what to write about, then decide what comes first and what comes later; otherwise readers easily get confused. / ★ Order doesn't matter when writing an article."},{"s":"张伟每天早上一边吃早饭，一边看新闻。他说这样做可以少花时间，同时也能了解世界上发生的事。","st":"★ 张伟早上吃饭的时候看新闻。","a":true,"en":"Every morning Zhang Wei reads the news while eating breakfast. He says it saves time and at the same time lets him know what's happening in the world. / ★ Zhang Wei reads the news while eating in the morning."}],"listen":[{"dlg":["男：你的汉语怎么进步得这么快？","女：我每天都看中文杂志，不认识的字就猜一猜。"],"q":"女的是怎么学汉语的？","opts":["上汉语课","看中文杂志","看中国电影"],"a":1,"en":"M: How has your Chinese improved so fast? W: I read Chinese magazines every day and guess the characters I don't know. Q: How does the woman learn Chinese?"},{"dlg":["女：还有十五分钟火车就开了，我们来得及吗？","男：可能来不及了，我们只好坐下一班吧。"],"q":"男的认为应该怎么办？","opts":["坐下一班火车","跑着去车站","不去了"],"a":0,"en":"W: The train leaves in fifteen minutes — can we make it? M: I'm afraid not; we'll have to take the next one. Q: What does the man think they should do?"},{"dlg":["男：这本书我看了一半就不想看了。","女：为什么？大家都说很精彩。","男：内容太复杂了，我看不懂。","女：那你先看看简单一点儿的吧。"],"q":"男的为什么不想看那本书了？","opts":["书太旧了","已经看完了","内容太复杂"],"a":2,"en":"M: I gave up halfway through this book. W: Why? Everyone says it's great. M: The content's too complicated; I don't understand it. W: Then read something simpler first. Q: Why did the man stop reading?"},{"dlg":["女：你在客厅里干什么呢？","男：我在给你的新书架放书，按作家的名字排顺序。"],"q":"男的在做什么？","opts":["买书","看书","放书"],"a":2,"en":"W: What are you doing in the living room? M: Putting books on your new shelf, ordered by author's name. Q: What is the man doing?"}],"fill":[{"s":"你的发音很好，不过有些（  ）用得不太对。","a":"词语","en":"Your pronunciation is good, but some of the words you use aren't quite right."},{"s":"电影七点半才开始，现在去还（  ）。","a":"来得及","en":"The film doesn't start until 7:30; there's still time if we go now."},{"s":"你最好每天早点儿睡，（  ）第二天上课会很困。","a":"否则","en":"You'd better go to bed early every day, otherwise you'll be sleepy in class the next day."},{"s":"这些照片我想按时间的（  ）放在一起。","a":"顺序","en":"I want to put these photos together in time order."},{"s":"A：你觉得这本书怎么样？  B：故事很有意思，（  ）最后的结果我不太喜欢。","a":"然而","en":"A: What do you think of the book? B: The story is interesting; the ending, however, I didn't really like."},{"s":"A：你是怎么记住这么多汉字的？  B：我从小就（  ）了每天写汉字的习惯。","a":"养成","en":"A: How did you remember so many characters? B: I got into the habit of writing characters every day as a child."}],"grammar":[{"q":"他太累了，（  ）衣服都没换就睡着了。","opts":["无论","连","否则","只好"],"a":1,"exp":"连…都 marks the extreme: he didn't even change his clothes.","g":0},{"q":"（  ）多难的题，他都能很快做出来。","opts":["只好","否则","无论","连"],"a":2,"exp":"无论 + 多 + adjective … 都: however hard.","g":1},{"q":"过马路的时候要小心，（  ）很容易出事。","opts":["否则","连","无论","只好"],"a":0,"exp":"否则 states the consequence of not being careful.","g":2},{"q":"我忘了带门卡，家里又没人，（  ）在门口等妈妈回来。","opts":["否则","无论","连","只好"],"a":3,"exp":"只好: no better option, so he waits outside.","g":3},{"q":"（  ）谁来劝，他都不改变自己的决定。","opts":["否则","无论","只好","连"],"a":1,"exp":"无论 + 谁 … 都: no matter who.","g":1},{"q":"下雨了，比赛（  ）改到下周。","opts":["连","无论","只好","否则"],"a":2,"exp":"只好 shows the forced change because of the rain.","g":3}],"order":[{"parts":["这家书店不但书很多，","而且环境像客厅一样舒服，","很多人周末来这里阅读。"],"en":"This bookshop not only has many books but is as comfortable as a living room; many people come here to read at weekends."},{"parts":["这本杂志我以前每期都买，","然而最近它的内容越来越少，","我就不买了。"],"en":"I used to buy every issue of this magazine, but recently its content has become thinner and thinner, so I stopped buying it."},{"parts":["老师让我们读完文章后，","先猜一猜生词的意思，","然后再查词典。"],"en":"The teacher asked us, after reading the article, first to guess the meaning of new words and then look them up."}],"reading":[{"p":"有人说，读书要“读好书，好读书”。“读好书”的意思是要选择有用的、精彩的书；“好读书”的意思是要喜欢读书。只有既会选书，又爱读书，才能从书里学到更多东西。","q":"★ “好读书”的意思是：","opts":["喜欢读书","读书很容易","读很好的书"],"a":0,"en":"Some say reading should be 'read good books, love reading'. 'Read good books' means choose useful, brilliant books; 'love reading' means enjoy reading. Only by both choosing well and loving to read can you learn more from books."},{"p":"马克刚开始学汉语的时候，觉得语法特别难。后来，他每天阅读一篇小短文，把好的句子写在本子上。半年以后，他发现自己说汉语的时候，语法比以前准确多了。","q":"★ 马克的语法为什么进步了？","opts":["他请了一位老师","他每天读短文、写句子","他常常看中国电影"],"a":1,"en":"When Mark started learning Chinese, he found grammar especially hard. Later he read a short text every day and copied good sentences into a notebook. Six months later he noticed his grammar was much more accurate when speaking."},{"p":"现在很多人喜欢在手机上看书，觉得又方便又便宜。然而，也有很多人还是喜欢纸书。他们说，拿着书一页一页地读，感觉完全不一样。","q":"★ 根据这段话，可以知道：","opts":["大家都不看纸书了","手机上的书很贵","有人还是喜欢纸书"],"a":2,"en":"Many people now like reading on their phones, finding it convenient and cheap. However, many still prefer paper books: holding a book and reading page by page feels completely different, they say."}],"write":[{"words":["这篇文章","表示了","作家对家乡的","感情。"],"en":"This article expresses the writer's feelings for his hometown."},{"words":["我们的","答案","完全","相同。"],"en":"Our answers are exactly the same."},{"words":["她","说汉语","说得","很流利。"],"en":"She speaks Chinese very fluently."},{"words":["你","最好","先做","填空题。"],"en":"You'd better do the fill-in-the-blank questions first."}],"hanzi":[{"s":"这个句子的语（  ）有问题。","py":"fǎ","a":"法"},{"s":"这篇文（  ）写得非常好。","py":"zhāng","a":"章"},{"s":"你的发音很准（  ）。","py":"què","a":"确"},{"s":"这个问题比我想的复（  ）多了。","py":"zá","a":"杂"}]},"tx":[{"t":"汉语角 · At the Chinese corner","scene":"Lin Xiaoyu chats with Mark, whose Chinese has suddenly become very fluent, about how he studies.","g":[0,1],"lines":[{"sp":"林小雨","s":"f","zh":"马克，你的汉语越来越流利了，真厉害！","py":"Mǎkè, nǐ de Hànyǔ yuè lái yuè liúlì le, zhēn lìhai!","en":"Mark, your Chinese is getting more and more fluent — amazing!"},{"sp":"马克","s":"m","zh":"谢谢！不过我的语法还不够准确，有些词语也常常用错。","py":"Xièxie! Búguò wǒ de yǔfǎ hái bú gòu zhǔnquè, yǒuxiē cíyǔ yě chángcháng yòng cuò.","en":"Thanks! But my grammar still isn't accurate enough, and I often misuse some words."},{"sp":"林小雨","s":"f","zh":"你刚来的时候连菜单都看不懂，现在怎么进步得这么快？","py":"Nǐ gāng lái de shíhou lián càidān dōu kàn bu dǒng, xiànzài zěnme jìnbù de zhème kuài?","en":"When you first came you couldn't even read a menu. How have you improved so fast?"},{"sp":"马克","s":"m","zh":"我每天都阅读中文，无论多累，至少读十页。","py":"Wǒ měi tiān dōu yuèdú Zhōngwén, wúlùn duō lèi, zhìshǎo dú shí yè.","en":"I read in Chinese every day — however tired I am, at least ten pages."},{"sp":"林小雨","s":"f","zh":"遇到不认识的字怎么办？","py":"Yùdào bú rènshi de zì zěnme bàn?","en":"What do you do when you meet characters you don't know?"},{"sp":"马克","s":"m","zh":"先猜一猜它的意思，然后再查词典，这样记得更清楚。","py":"Xiān cāi yi cāi tā de yìsi, ránhòu zài chá cídiǎn, zhèyàng jì de gèng qīngchu.","en":"First I guess the meaning, then look it up — that way I remember it better."}]},{"t":"客厅里的书架 · The bookcase in the living room","scene":"Zhang Wei visits Liu Fang and is surprised that her living room has bookshelves instead of a TV.","g":[3],"lines":[{"sp":"张伟","s":"m","zh":"你家客厅里怎么没有电视，全是书和杂志？","py":"Nǐ jiā kètīng li zěnme méiyǒu diànshì, quán shì shū hé zázhì?","en":"Why is there no TV in your living room — just books and magazines?"},{"sp":"刘芳","s":"f","zh":"以前有，可是孩子每天都看电视，作业也不写，我只好把电视送人了。","py":"Yǐqián yǒu, kěshì háizi měi tiān dōu kàn diànshì, zuòyè yě bù xiě, wǒ zhǐhǎo bǎ diànshì sòng rén le.","en":"There used to be one, but my child watched TV every day and didn't do homework, so I had no choice but to give it away."},{"sp":"张伟","s":"m","zh":"那孩子不生气吗？","py":"Nà háizi bù shēngqì ma?","en":"Wasn't your child angry?"},{"sp":"刘芳","s":"f","zh":"刚开始很生气，后来慢慢养成了读书的习惯。他最喜欢那几本著名作家写的故事。","py":"Gāng kāishǐ hěn shēngqì, hòulái mànmàn yǎngchéng le dúshū de xíguàn. Tā zuì xǐhuan nà jǐ běn zhùmíng zuòjiā xiě de gùshi.","en":"Very angry at first, but gradually he got into the habit of reading. His favourites are those stories by famous writers."},{"sp":"张伟","s":"m","zh":"真是个好办法。读书能增加知识，同时也能让孩子安静下来。","py":"Zhēn shì gè hǎo bànfǎ. Dúshū néng zēngjiā zhīshi, tóngshí yě néng ràng háizi ānjìng xiàlai.","en":"What a good idea. Reading increases knowledge and at the same time helps children calm down."},{"sp":"刘芳","s":"f","zh":"是啊，现在他每天看的书比我还多呢。","py":"Shì a, xiànzài tā měi tiān kàn de shū bǐ wǒ hái duō ne.","en":"Yes — now he reads more every day than I do."}]},{"t":"考试以后 · After the exam","scene":"Two classmates compare answers after a Chinese reading exam.","g":[2,3],"lines":[{"sp":"马克","s":"m","zh":"今天的考试你觉得怎么样？","py":"Jīntiān de kǎoshì nǐ juéde zěnmeyàng?","en":"How did you find today's exam?"},{"sp":"林小雨","s":"f","zh":"前面的填空题还好，最后一篇文章太长了，内容也很复杂。","py":"Qiánmiàn de tiánkòng tí hái hǎo, zuìhòu yì piān wénzhāng tài cháng le, nèiróng yě hěn fùzá.","en":"The fill-in-the-blanks at the start were OK, but the last article was too long and the content complicated."},{"sp":"马克","s":"m","zh":"我也是，时间快到了还没看完，只好随便选了一个。","py":"Wǒ yě shì, shíjiān kuài dào le hái méi kàn wán, zhǐhǎo suíbiàn xuǎn le yí gè.","en":"Same here. Time was almost up and I hadn't finished reading, so I had to pick one at random."},{"sp":"林小雨","s":"f","zh":"那道排顺序的题，你的答案跟我的相同吗？","py":"Nà dào pái shùnxù de tí, nǐ de dá'àn gēn wǒ de xiāngtóng ma?","en":"For that sentence-ordering question, was your answer the same as mine?"},{"sp":"马克","s":"m","zh":"不一样。我觉得以后得多练习阅读，否则下次还会来不及。","py":"Bù yíyàng. Wǒ juéde yǐhòu děi duō liànxí yuèdú, fǒuzé xià cì hái huì lái bu jí.","en":"No. I think I need to practise reading more, or else I'll run out of time again next time."},{"sp":"林小雨","s":"f","zh":"现在开始还来得及，我们一起每天读一篇吧。","py":"Xiànzài kāishǐ hái láidejí, wǒmen yìqǐ měi tiān dú yì piān ba.","en":"There's still time if we start now. Let's read one article a day together."}]},{"t":"读书节目 · A book programme","scene":"On a radio book programme, a journalist interviews Ms Chen about why reading matters.","g":[0,1],"lines":[{"sp":"记者","s":"m","zh":"陈老师，很多人说现在工作太忙，连看书的时间都没有，您怎么看？","py":"Chén lǎoshī, hěn duō rén shuō xiànzài gōngzuò tài máng, lián kàn shū de shíjiān dōu méiyǒu, nín zěnme kàn?","en":"Ms Chen, many people say work is so busy they don't even have time to read. What's your view?"},{"sp":"陈老师","s":"f","zh":"我的看法是，无论多忙，每天读几页书总是可以的。","py":"Wǒ de kànfǎ shì, wúlùn duō máng, měi tiān dú jǐ yè shū zǒngshì kěyǐ de.","en":"My view is that however busy you are, you can always read a few pages a day."},{"sp":"记者","s":"m","zh":"您觉得读书最大的好处是什么？","py":"Nín juéde dúshū zuì dà de hǎochù shì shénme?","en":"What do you think is the biggest benefit of reading?"},{"sp":"陈老师","s":"f","zh":"书能让我们看到一个更大的世界。然而，读书也要会选，精彩的书才值得花时间。","py":"Shū néng ràng wǒmen kàndào yí gè gèng dà de shìjiè. Rán'ér, dúshū yě yào huì xuǎn, jīngcǎi de shū cái zhíde huā shíjiān.","en":"Books let us see a bigger world. However, you also have to choose well; only excellent books are worth the time."},{"sp":"记者","s":"m","zh":"所以“读书好，读好书，好读书”，这三句话的意思都不一样。","py":"Suǒyǐ “dúshū hǎo, dú hǎo shū, hào dúshū”, zhè sān jù huà de yìsi dōu bù yíyàng.","en":"So 'reading is good, read good books, love reading' — the three phrases each mean something different."},{"sp":"陈老师","s":"f","zh":"对，它们表示的是读书的三个方面：为什么读、读什么、怎么爱上读书。","py":"Duì, tāmen biǎoshì de shì dúshū de sān gè fāngmiàn: wèi shénme dú, dú shénme, zěnme ài shang dúshū.","en":"Right — they express three aspects of reading: why to read, what to read, and how to come to love it."}]}]},{"n":12,"cn":"用心发现世界","en":"Discover the world with your heart","vocab":[{"w":"规定","p":"guīdìng","pos":"n.","d":"rule, regulation"},{"w":"死","p":"sǐ","pos":"adj.","d":"rigid, inflexible"},{"w":"可惜","p":"kěxī","pos":"adj.","d":"pitiful, regretful"},{"w":"全部","p":"quánbù","pos":"n.","d":"all, whole"},{"w":"也许","p":"yěxǔ","pos":"adv.","d":"maybe, perhaps"},{"w":"商量","p":"shāngliang","pos":"v.","d":"to discuss, to consult"},{"w":"并且","p":"bìngqiě","pos":"conj.","d":"and"},{"w":"盐","p":"yán","pos":"n.","d":"salt"},{"w":"勺子","p":"sháozi","pos":"n.","d":"Spoon"},{"w":"保护","p":"bǎohù","pos":"v.","d":"to protect"},{"w":"作用","p":"zuòyòng","pos":"n.","d":"function"},{"w":"无法","p":"wúfǎ","pos":"v.","d":"cannot, to be unable (to do sth.)"},{"w":"节","p":"jié","pos":"m.","d":"section, length"},{"w":"详细","p":"xiángxì","pos":"adj.","d":"detailed"},{"w":"解释","p":"jiěshì","pos":"v.","d":"to explain"},{"w":"对于","p":"duìyú","pos":"prep.","d":"for, to, with regard to"},{"w":"叶子","p":"yèzi","pos":"n.","d":"leaf"},{"w":"教育","p":"jiàoyù","pos":"v.","d":"to educate"},{"w":"使用","p":"shǐyòng","pos":"v.","d":"to use"},{"w":"语言","p":"yǔyán","pos":"n.","d":"language"},{"w":"直接","p":"zhíjiē","pos":"adj.","d":"direct, straight"},{"w":"引起","p":"yǐnqǐ","pos":"v.","d":"to cause, to lead to"},{"w":"误会","p":"wùhuì","pos":"n.","d":"misunderstanding"},{"w":"友好","p":"yǒuhǎo","pos":"adj.","d":"friendly"},{"w":"事半功倍","p":"shìbàngōngbèi","pos":"idiom","d":"to achieve twice the result with half the effort"},{"w":"节约","p":"jiéyuē","pos":"v.","d":"to economize, to save"},{"w":"力气","p":"lìqi","pos":"n.","d":"physical strength, effort"},{"w":"相反","p":"xiāngfǎn","pos":"conj.","d":"on the contrary"},{"w":"任务","p":"rènwu","pos":"n.","d":"task, mission"},{"w":"意见","p":"yìjiàn","pos":"n.","d":"opinion, suggestion"},{"w":"仔细","p":"zǐxì","pos":"adj.","d":"careful, meticulous"},{"w":"达到","p":"dádào","pos":"v.","d":"to reach, to attain"}],"proper":"","grammar":[{"t":"对于…… — as for, with regard to","m":"对于 introduces the person, thing or matter that a statement or attitude concerns: 对于 + noun phrase，+ comment. It usually stands at the start of the sentence (or after the subject). It overlaps with 对, but 对 can also mean 'towards (a person)' in the sense of treating someone (他对我很好), where 对于 cannot be used.","ex":[["对于这个问题，大家的意见不太一样。","Regarding this question, people's opinions differ somewhat."],["对于刚来中国的留学生来说，最难的是适应这里的气候。","For international students who have just arrived in China, the hardest thing is adapting to the climate."],["对于孩子的教育，父母应该多花一些时间。","When it comes to children's education, parents should spend more time."]]},{"t":"并且 — and, moreover","m":"并且 links two verbs/adjectives or two clauses, adding a further action or a step forward in meaning ('and also, furthermore'). It is more formal than 而且 and is common in writing. It can pair with 不但/不仅: 不但……并且……. It does not join two plain nouns — use 和 for that.","ex":[["他通过了考试，并且拿到了很高的分数。","He passed the exam and got a very high score too."],["请大家仔细阅读规定，并且在下面写上自己的名字。","Please read the regulations carefully and sign your name below."],["这种方法不但简单，并且很有效果。","This method is not only simple but also very effective."]]},{"t":"相反 — on the contrary, the opposite","m":"相反 states that the facts are the reverse of what was expected or of what was just said. As a connective it usually starts a clause (相反，…), often after a negative clause. It can also be an adjective: 相反的方向 ('the opposite direction'), 跟…相反 ('the opposite of …').","ex":[["那次失败没有让他放弃，相反，他比以前更努力了。","That failure didn't make him give up; on the contrary, he worked harder than before."],["我们俩的性格完全相反，他很安静，我很活跃。","Our personalities are complete opposites: he's quiet and I'm lively."],["你走错了，银行在相反的方向。","You've gone the wrong way — the bank is in the opposite direction."]]},{"t":"也许 — perhaps, maybe","m":"也许 is an adverb of possibility placed before the verb or at the start of a clause. It expresses an uncertain guess, a bit softer than 可能. Unlike 可能, 也许 cannot be used as a noun or adjective (有这个可能 is fine, but not *有这个也许).","ex":[["他今天没来上课，也许是生病了。","He didn't come to class today; maybe he's ill."],["也许你说得对，我们应该换一种方法。","Perhaps you're right; we should try another method."],["别着急，也许过一会儿雨就小了。","Don't worry, maybe the rain will ease off in a little while."]]}],"ex":{"judge":[{"s":"我们公司规定，每个人离开办公室的时候都要关灯、关电脑。这样做既能节约用电，也能保护环境。","st":"★ 公司规定下班后可以不关电脑。","a":false,"en":"Our company rules that everyone must turn off the lights and computer when leaving the office. This saves electricity and protects the environment. / ★ The company allows computers to be left on after work."},{"s":"做菜的时候，盐不能放得太多，一般用小勺子放半勺就够了，否则菜就不好吃了，对身体也不好。","st":"★ 说话人认为做菜要少放盐。","a":true,"en":"When cooking, don't add too much salt; usually half a small spoonful is enough, otherwise the dish won't taste good and it's bad for your health. / ★ The speaker thinks you should use little salt when cooking."},{"s":"说话太直接有时候会引起误会。比如，别人请你提意见的时候，你可以先说优点，再说缺点。","st":"★ 说话直接从来不会让人误会。","a":false,"en":"Speaking too directly can sometimes cause misunderstandings. For example, when someone asks for your opinion you can mention the good points first, then the weaknesses. / ★ Speaking directly never causes misunderstandings."},{"s":"这节课老师给我们详细地解释了这几个词的区别，并且让我们每个人都用它们说了一个句子。","st":"★ 老师在课上解释了词语的区别。","a":true,"en":"In this lesson the teacher explained the differences between these words in detail and had each of us make a sentence with them. / ★ The teacher explained the differences between words in class."},{"s":"太可惜了！我们准备了一个月的活动，由于下大雨，只好取消了。也许下个月还有机会再举办。","st":"★ 活动已经顺利举行了。","a":false,"en":"What a pity! The event we'd prepared for a month had to be cancelled because of heavy rain. Maybe there'll be a chance to hold it next month. / ★ The event went ahead smoothly."}],"listen":[{"dlg":["女：你帮我把那个勺子拿过来，好吗？","男：好，你要大的还是小的？"],"q":"女的让男的拿什么？","opts":["盐","勺子","盘子"],"a":1,"en":"W: Could you pass me that spoon? M: Sure — big one or small one? Q: What does the woman ask the man to bring?"},{"dlg":["男：这件事我们得跟经理商量一下。","女：对，没有他的意见，我们无法决定。"],"q":"他们打算怎么做？","opts":["马上决定","放弃这件事","先问问经理"],"a":2,"en":"M: We need to discuss this with the manager. W: Right — without his opinion we can't decide. Q: What do they plan to do?"},{"dlg":["女：你怎么不高兴？","男：我只是开了个玩笑，没想到引起了误会。","女：那你去跟她解释一下吧。","男：嗯，我现在就去。"],"q":"男的接下来要做什么？","opts":["去解释","去开玩笑","去睡觉"],"a":0,"en":"W: Why are you unhappy? M: I was only joking — I didn't expect it to cause a misunderstanding. W: Then go and explain to her. M: Yes, I'll go now. Q: What will the man do next?"},{"dlg":["男：这个任务很难，一个星期能完成吗？","女：如果方法对了，也许五天就能完成。"],"q":"女的觉得怎么样？","opts":["一定完成不了","五天也许就够了","至少要两个星期"],"a":1,"en":"M: This task is hard — can we finish it in a week? W: If the method is right, maybe five days will do. Q: What does the woman think?"},{"dlg":["女：这本书怎么样？","男：写得很好，可惜最后几页没有了。","女：太可惜了，你能再去买一本吗？","男：书店里已经卖完了。"],"q":"男的觉得哪儿可惜？","opts":["书写得不好","书太贵了","书少了几页"],"a":2,"en":"W: How's the book? M: It's well written, but sadly the last few pages are missing. W: What a pity — can you buy another? M: The bookshop has sold out. Q: What does the man find a pity?"}],"match":[{"q":"你对我们的计划有什么意见？","r":"总的来说很好，不过有几个地方还得再改改。"},{"q":"这些树叶子怎么都黄了？","r":"秋天到了，叶子当然会变黄。"},{"q":"你们俩的看法一样吗？","r":"不一样，可以说是完全相反。"},{"q":"老师这节课讲了什么？","r":"讲了怎样使用词典，讲得很详细。"},{"q":"你一个人能搬得动这个箱子吗？","r":"没问题，我力气大着呢。"}],"fill":[{"s":"图书馆（  ），每个人一次最多可以借五本书。","a":"规定","en":"The library's rule is that each person can borrow at most five books at a time."},{"s":"你做事一定要（  ），不能太随便。","a":"仔细","en":"You must be careful in what you do; you can't be too casual about it."},{"s":"这件事你能再（  ）地说一说吗？我还是不太明白。","a":"详细","en":"Could you explain this in more detail? I still don't quite understand."},{"s":"多喝水对身体有很好的（  ）。","a":"作用","en":"Drinking plenty of water has a very good effect on the body."},{"s":"为了（  ）用水，我们洗完手要马上关水。","a":"节约","en":"To save water, we should turn off the tap right after washing our hands."},{"s":"A：我们应该怎样（  ）小动物？  B：首先要做的是不去打扰它们的生活。","a":"保护","en":"A: How should we protect small animals? B: The first thing is not to disturb their lives."},{"s":"A：他是怎么学会这么多种（  ）的？  B：他父母都是翻译，他从小就听。","a":"语言","en":"A: How did he learn so many languages? B: His parents are both translators; he's heard them since childhood."},{"s":"A：你觉得他这个人怎么样？  B：他对每个人都很（  ），大家都喜欢他。","a":"友好","en":"A: What do you think of him? B: He's friendly to everyone, and everybody likes him."},{"s":"A：今天的工作完成了吗？  B：还没有，经理给的（  ）太多了。","a":"任务","en":"A: Is today's work done? B: Not yet — the manager gave us too many tasks."},{"s":"A：你觉得这次能（  ）公司的要求吗？  B：只要大家努力，一定没问题。","a":"达到","en":"A: Do you think we can meet the company's requirements this time? B: As long as everyone works hard, definitely."}],"grammar":[{"q":"（  ）这件事，你有什么看法？","opts":["相反","也许","对于","并且"],"a":2,"exp":"对于 introduces the matter being commented on.","g":0},{"q":"他每天早上跑步，（  ）已经坚持了五年。","opts":["对于","并且","也许","相反"],"a":1,"exp":"并且 adds a further fact to the first clause.","g":1},{"q":"这次考试没让他难过，（  ），他觉得自己学到了很多。","opts":["相反","并且","对于","也许"],"a":0,"exp":"相反 introduces the opposite of what one might expect.","g":2},{"q":"天这么黑，（  ）要下雨了。","opts":["对于","相反","并且","也许"],"a":3,"exp":"也许 expresses an uncertain guess.","g":3},{"q":"（  ）这次的任务，大家都非常认真。","opts":["也许","对于","相反","并且"],"a":1,"exp":"对于 + noun phrase: regarding this task.","g":0},{"q":"请你写清楚自己的名字，（  ）留下手机号。","opts":["相反","也许","并且","对于"],"a":2,"exp":"并且 links a second required action.","g":1}],"order":[{"parts":["对于孩子来说，","父母的教育非常重要，","它会影响孩子的一生。"],"en":"For children, their parents' upbringing is very important; it affects their whole life."},{"parts":["这种方法不但能节约时间，","并且能节约力气，","真是事半功倍。"],"en":"This method not only saves time but also saves effort — twice the result with half the work."},{"parts":["他不但没有生气，","相反还笑着对我说，","这只是一个小误会。"],"en":"Far from being angry, he smiled and told me it was just a small misunderstanding."},{"parts":["这些规定也许有点儿死，","可是为了不出问题，","我们还是要按照规定去做。"],"en":"These rules may be a bit rigid, but to avoid problems we still have to follow them."}],"reading":[{"p":"学习时如果能找到好方法，就能事半功倍。比如背生词，一个一个地死记效果不好，最好把它们放在句子里记。这样既容易记住，又知道怎么使用。","q":"★ 说话人认为背生词应该：","opts":["一个一个地记","放在句子里记","多写几次"],"a":1,"en":"If you find a good method when studying you get twice the result with half the effort. For example, memorising new words one by one doesn't work well; it's best to remember them in sentences. That way they're easy to remember and you know how to use them."},{"p":"树叶子对树有很大的作用。树通过叶子得到阳光和空气，没有叶子，树就无法长大。所以，我们应该保护树，不要随便拿走树上的叶子。","q":"★ 这段话主要谈的是：","opts":["叶子的作用","怎样种树","秋天的景色"],"a":0,"en":"Leaves play a very important role for trees. Trees get sunlight and air through their leaves; without leaves a tree cannot grow. So we should protect trees and not take leaves off them carelessly."},{"p":"在不同的国家，同一个动作可能表示不同的意思。比如在有些国家，点头表示“是”，可是在另一些国家，意思却正好相反。所以出国以前，最好先了解一下那个国家的文化，否则很容易引起误会。","q":"★ 根据这段话，出国以前最好：","opts":["多学几个动作","了解那个国家的文化","少跟别人说话"],"a":1,"en":"In different countries the same gesture may mean different things. In some countries nodding means 'yes', but in others the meaning is exactly the opposite. So before going abroad it's best to learn about that country's culture, otherwise misunderstandings arise easily."},{"p":"王经理开会的时候，很喜欢听大家的意见。无论是谁提的建议，只要是好的，他都会接受。他说，一个人的想法总是不够多的，大家一起商量，才能把任务完成得更好。","q":"★ 关于王经理，可以知道：","opts":["他不喜欢听别人的意见","他只接受自己的想法","他愿意和大家商量"],"a":2,"en":"In meetings Manager Wang likes to hear everyone's opinions. Whoever makes a suggestion, if it's good he accepts it. He says one person's ideas are always limited; only by discussing together can the task be done better."}],"write":[{"words":["这种","勺子","是专门","给孩子用的。"],"en":"This kind of spoon is made specially for children."},{"words":["请你","把","这个问题","解释一下。"],"en":"Please explain this question."},{"words":["我们","已经","完成了","全部任务。"],"en":"We have already completed all the tasks."},{"words":["他的","回答","引起了","大家的注意。"],"en":"His answer attracted everyone's attention."},{"words":["这节课","老师","讲得","非常详细。"],"en":"The teacher explained things in great detail in this lesson."}],"hanzi":[{"s":"这个菜太淡了，再放点儿（  ）吧。","py":"yán","a":"盐"},{"s":"秋天到了，树上的叶（  ）都黄了。","py":"zi","a":"子"},{"s":"你误（  ）我的意思了。","py":"huì","a":"会"},{"s":"我们要节（  ）用水。","py":"yuē","a":"约"},{"s":"这段话的意思很直（  ），大家都听懂了。","py":"jiē","a":"接"}]},"rv":{"judge":[{"s":"张伟做饭的时候从来不用勺子放盐，都是随便放。结果有时候菜没有味道，有时候又放多了盐，没法吃。","st":"★ 张伟做菜每次都做得很好。","a":false,"en":"When Zhang Wei cooks he never uses a spoon for the salt; he just adds it at random. As a result his food is sometimes tasteless and sometimes too salty to eat. / ★ Zhang Wei's cooking always turns out well."},{"s":"这个公园有一条规定：不能带狗进来，不能在草地上打球。由于大家都很注意保护环境，所以公园一直很干净、很漂亮。","st":"★ 这个公园的环境很好。","a":true,"en":"This park has a rule: no dogs and no ball games on the grass. Because everyone takes care to protect the environment, the park has always been clean and beautiful. / ★ This park's environment is good."},{"s":"马克第一次去中国朋友家吃饭，主人一直往他碗里放菜。他以为必须把菜全部吃完，结果吃得太饱了。后来他才知道，这只是表示热情。","st":"★ 主人一定要马克把菜全部吃完。","a":false,"en":"The first time Mark ate at a Chinese friend's home, the host kept putting food in his bowl. He thought he had to finish it all and ended up far too full. Later he learned it was just a way of showing warmth. / ★ The host insisted Mark finish all the food."},{"s":"跟别人意见不同的时候，最好先听完对方的话，然后再友好地说出自己的看法，这样能少很多误会。","st":"★ 说话人建议先听别人说完。","a":true,"en":"When you disagree with someone, it's best to first hear them out, then give your view in a friendly way; that avoids many misunderstandings. / ★ The speaker suggests listening until the other person finishes."}],"listen":[{"dlg":["男：这么多工作，我们今天做得完吗？","女：别担心，我们俩分开做，也许下午就能完成。"],"q":"女的是什么意思？","opts":["工作做不完","两个人分开做会快一些","明天再做"],"a":1,"en":"M: With so much work, can we finish today? W: Don't worry — if we split it, maybe we'll be done this afternoon. Q: What does the woman mean?"},{"dlg":["女：你看，地上全是叶子。","男：是啊，秋天到了，天也越来越冷了。"],"q":"现在可能是什么季节？","opts":["秋天","春天","夏天"],"a":0,"en":"W: Look, the ground is covered in leaves. M: Yes, autumn's here and it's getting colder. Q: What season is it probably?"},{"dlg":["男：你把这个词的意思给我详细解释一下，好吗？","女：好，不过我们先吃饭吧，吃完再说。","男：行，我也有点儿饿了。","女：那走吧。"],"q":"他们现在要去做什么？","opts":["解释词语","去上课","去吃饭"],"a":2,"en":"M: Could you explain this word to me in detail? W: Sure, but let's eat first and talk after. M: OK, I'm a bit hungry too. W: Let's go then. Q: What are they going to do now?"},{"dlg":["女：昨天的比赛你怎么没来？太可惜了！","男：我突然有个任务，实在走不开。"],"q":"男的为什么没去看比赛？","opts":["他生病了","他有工作要做","他不喜欢看比赛"],"a":1,"en":"W: Why didn't you come to yesterday's match? What a shame! M: I had a last-minute task and really couldn't get away. Q: Why didn't the man go to the match?"}],"fill":[{"s":"这次失败的经历对我是一次很好的（  ），让我明白了很多事情。","a":"教育","en":"This experience of failure was a good lesson for me and taught me a lot."},{"s":"他把一个月的工资（  ）都花在买书上了。","a":"全部","en":"He spent his entire month's salary on books."},{"s":"这么好的电影你没看，真是太（  ）了。","a":"可惜","en":"It's such a pity you didn't see such a good film."},{"s":"我现在很忙，（  ）回答你的问题，等会儿再说吧。","a":"无法","en":"I'm very busy right now and can't answer your question; let's talk later."},{"s":"A：这个箱子太重了，你搬得动吗？  B：搬不动，我没有那么大的（  ）。","a":"力气","en":"A: This box is so heavy — can you lift it? B: No, I'm not that strong."},{"s":"A：你打算怎么办？  B：我想先跟家里人（  ）一下再决定。","a":"商量","en":"A: What are you going to do? B: I want to talk it over with my family first, then decide."}],"grammar":[{"q":"（  ）年轻人来说，找到自己喜欢的工作很重要。","opts":["并且","对于","也许","相反"],"a":1,"exp":"对于……来说 = for (someone).","g":0},{"q":"她学会了做饭，（  ）做得比妈妈还好。","opts":["对于","相反","并且","也许"],"a":2,"exp":"并且 adds a further, stronger point.","g":1},{"q":"大家都以为他会很难过，（  ），他看起来很轻松。","opts":["相反","对于","并且","也许"],"a":0,"exp":"相反 shows reality is the opposite of expectation.","g":2},{"q":"我给他打了好几次电话都没人接，他（  ）在开会。","opts":["对于","并且","相反","也许"],"a":3,"exp":"也许 makes a guess about why he isn't answering.","g":3},{"q":"这两个词的意思正好（  ），一个是“高”，一个是“低”。","opts":["也许","并且","相反","对于"],"a":2,"exp":"相反 as an adjective: the meanings are opposite.","g":2},{"q":"（  ）明天会下雨，你还是带把伞吧。","opts":["也许","对于","相反","并且"],"a":0,"exp":"也许 introduces a possibility.","g":3}],"order":[{"parts":["学习一门新的语言，","最好的方法是多听多说，","并且要勇敢地开口。"],"en":"To learn a new language the best method is to listen and speak a lot, and you must dare to open your mouth."},{"parts":["对于他提出的意见，","我们会认真考虑，","然后再给他回答。"],"en":"We will carefully consider the opinion he raised and then give him an answer."},{"parts":["说话的时候太直接，","有时候会让别人不舒服，","甚至引起误会。"],"en":"Being too direct when speaking sometimes makes others uncomfortable and can even cause misunderstandings."}],"reading":[{"p":"有的人做事很死，只知道按照老办法做，不会根据情况改变。其实，遇到新问题的时候，换个方法想一想，也许就能事半功倍。","q":"★ 说话人认为：","opts":["老办法最好","做事要会根据情况改变","遇到问题应该放弃"],"a":1,"en":"Some people are rigid: they only know the old way and can't adapt to circumstances. Actually, when facing a new problem, thinking about it differently may get you twice the result with half the effort."},{"p":"陈老师教育孩子的方法很特别。孩子做错了事，她不直接说孩子错了，而是让孩子自己想一想错在哪儿。她说，这样孩子会记得更清楚。","q":"★ 孩子做错事的时候，陈老师会：","opts":["马上说孩子不对","让孩子自己想","让孩子去睡觉"],"a":1,"en":"Ms Chen has a special way of bringing up children. When a child does something wrong, she doesn't criticise directly but has the child think about what went wrong. She says children remember it better that way."},{"p":"每天下班前，我会仔细看一下第二天的任务，并且把重要的事写下来。这样第二天一到办公室，就知道先做什么、后做什么了。","q":"★ 说话人下班前会做什么？","opts":["看第二天的任务","跟同事吃饭","给经理打电话"],"a":0,"en":"Every day before leaving work I carefully look over the next day's tasks and write down the important things. That way, as soon as I get to the office the next day, I know what to do first and what to do later."}],"write":[{"words":["他们俩的","意见","完全","相反。"],"en":"Their opinions are completely opposite."},{"words":["我们","应该","节约","每一张纸。"],"en":"We should save every sheet of paper."},{"words":["她","对人","一直","很友好。"],"en":"She has always been friendly to people."},{"words":["这个","问题","我无法","回答。"],"en":"I can't answer this question."}],"hanzi":[{"s":"请大家按照学校的规（  ）做。","py":"dìng","a":"定"},{"s":"我们要保（  ）好身边的环境。","py":"hù","a":"护"},{"s":"这个方法很有作（  ）。","py":"yòng","a":"用"},{"s":"考试的时候一定要仔（  ）。","py":"xì","a":"细"}]},"tx":[{"t":"做中国菜 · Cooking Chinese food","scene":"Liu Fang teaches Mark to cook a Chinese dish, but he takes the recipe too literally.","g":[3],"lines":[{"sp":"马克","s":"m","zh":"刘芳，书上写“放一点儿盐”，“一点儿”是多少？","py":"Liú Fāng, shū shang xiě “fàng yìdiǎnr yán”, “yìdiǎnr” shì duōshao?","en":"Liu Fang, the book says 'add a little salt' — how much is 'a little'?"},{"sp":"刘芳","s":"f","zh":"没有规定，你可以先放半勺子，尝一尝再说。","py":"Méiyǒu guīdìng, nǐ kěyǐ xiān fàng bàn sháozi, cháng yi cháng zài shuō.","en":"There's no rule. Put in half a spoonful first, taste it and see."},{"sp":"马克","s":"m","zh":"可是我想做得跟书上写的完全一样。","py":"Kěshì wǒ xiǎng zuò de gēn shū shang xiě de wánquán yíyàng.","en":"But I want to make it exactly like the book says."},{"sp":"刘芳","s":"f","zh":"做饭不能太死，每个人喜欢的味道不一样，也许你喜欢少放一点儿盐呢。","py":"Zuòfàn bù néng tài sǐ, měi gè rén xǐhuan de wèidao bù yíyàng, yěxǔ nǐ xǐhuan shǎo fàng yìdiǎnr yán ne.","en":"You can't be too rigid with cooking. Everyone likes different flavours — maybe you prefer less salt."},{"sp":"马克","s":"m","zh":"你说得对。我还以为中国菜的做法很复杂呢。","py":"Nǐ shuō de duì. Wǒ hái yǐwéi Zhōngguó cài de zuòfǎ hěn fùzá ne.","en":"You're right. I thought Chinese cooking was really complicated."},{"sp":"刘芳","s":"f","zh":"其实很简单，认真去做就行了。","py":"Qíshí hěn jiǎndān, rènzhēn qù zuò jiù xíng le.","en":"It's actually simple — just do it carefully."}]},{"t":"一场误会 · A misunderstanding","scene":"Zhang Wei asks Lin Xiaoyu why a new colleague seems upset with him.","g":[0,2],"lines":[{"sp":"张伟","s":"m","zh":"小雨，新来的同事好像对我有意见，见了我也不说话。","py":"Xiǎoyǔ, xīn lái de tóngshì hǎoxiàng duì wǒ yǒu yìjiàn, jiàn le wǒ yě bù shuōhuà.","en":"Xiaoyu, the new colleague seems to have something against me — she doesn't even speak to me."},{"sp":"林小雨","s":"f","zh":"是不是你上次开会时说话太直接，引起误会了？","py":"Shì bu shì nǐ shàng cì kāihuì shí shuōhuà tài zhíjiē, yǐnqǐ wùhuì le?","en":"Maybe you spoke too bluntly at the last meeting and caused a misunderstanding?"},{"sp":"张伟","s":"m","zh":"我只是说她的计划不够详细，并没有别的意思。","py":"Wǒ zhǐshì shuō tā de jìhuà bú gòu xiángxì, bìng méiyǒu bié de yìsi.","en":"I only said her plan wasn't detailed enough — I didn't mean anything else."},{"sp":"林小雨","s":"f","zh":"对于刚来的人来说，在那么多人面前听到这种话，心里肯定不舒服。","py":"Duìyú gāng lái de rén lái shuō, zài nàme duō rén miànqián tīngdào zhè zhǒng huà, xīnli kěndìng bù shūfu.","en":"For someone who's just arrived, hearing that in front of so many people is bound to feel bad."},{"sp":"张伟","s":"m","zh":"那我是不是应该找她解释一下？","py":"Nà wǒ shì bu shì yīnggāi zhǎo tā jiěshì yíxià?","en":"So should I go and explain things to her?"},{"sp":"林小雨","s":"f","zh":"当然。你友好一点儿，她不但不会生气，相反还会觉得你很诚实。","py":"Dāngrán. Nǐ yǒuhǎo yìdiǎnr, tā búdàn bú huì shēngqì, xiāngfǎn hái huì juéde nǐ hěn chéngshí.","en":"Of course. If you're a bit friendlier, far from being angry she'll actually find you honest."}]},{"t":"公园里 · In the park","scene":"On a walk, Ms Chen explains to a curious child why trees need their leaves.","g":[1,3],"lines":[{"sp":"孩子","s":"m","zh":"陈老师，为什么不能拿走这些叶子？","py":"Chén lǎoshī, wèi shénme bù néng ná zǒu zhèxiē yèzi?","en":"Ms Chen, why can't we take these leaves away?"},{"sp":"陈老师","s":"f","zh":"因为叶子对树的作用非常大，树要通过叶子得到阳光。","py":"Yīnwèi yèzi duì shù de zuòyòng fēicháng dà, shù yào tōngguò yèzi dédào yángguāng.","en":"Because leaves are very important to the tree — it takes in sunlight through its leaves."},{"sp":"孩子","s":"m","zh":"要是叶子全部没有了，会怎么样？","py":"Yàoshi yèzi quánbù méiyǒu le, huì zěnmeyàng?","en":"What would happen if all the leaves were gone?"},{"sp":"陈老师","s":"f","zh":"那树就无法长大了，也许还会死。","py":"Nà shù jiù wúfǎ zhǎng dà le, yěxǔ hái huì sǐ.","en":"Then the tree couldn't grow, and it might even die."},{"sp":"孩子","s":"m","zh":"我明白了！以后我要保护小树，并且告诉同学们也别拿树上的叶子。","py":"Wǒ míngbai le! Yǐhòu wǒ yào bǎohù xiǎo shù, bìngqiě gàosu tóngxuémen yě bié ná shù shang de yèzi.","en":"I get it! From now on I'll protect young trees, and I'll tell my classmates not to take leaves off trees either."},{"sp":"陈老师","s":"f","zh":"真棒，这比我在课上讲一节课的效果还好。","py":"Zhēn bàng, zhè bǐ wǒ zài kè shang jiǎng yì jié kè de xiàoguǒ hái hǎo.","en":"Wonderful — that works even better than me teaching a whole lesson in class."}]},{"t":"工作会议 · A work meeting","scene":"Manager Wang and a colleague discuss how to finish a big task with less effort.","g":[0,1],"lines":[{"sp":"王经理","s":"m","zh":"这次的任务很重，大家有什么意见可以直接说。","py":"Zhè cì de rènwu hěn zhòng, dàjiā yǒu shénme yìjiàn kěyǐ zhíjiē shuō.","en":"This task is heavy. If anyone has opinions, just say them directly."},{"sp":"同事","s":"f","zh":"我觉得我们应该先仔细商量一下每个人做什么，否则会浪费很多力气。","py":"Wǒ juéde wǒmen yīnggāi xiān zǐxì shāngliang yíxià měi gè rén zuò shénme, fǒuzé huì làngfèi hěn duō lìqi.","en":"I think we should first carefully discuss who does what, otherwise we'll waste a lot of effort."},{"sp":"王经理","s":"m","zh":"说得对。对于每个人负责的工作，我们要写清楚。","py":"Shuō de duì. Duìyú měi gè rén fùzé de gōngzuò, wǒmen yào xiě qīngchu.","en":"Right. We need to write down clearly which part each person is responsible for."},{"sp":"同事","s":"f","zh":"另外，使用新的电脑，可以节约不少时间，并且不容易出错。","py":"Lìngwài, shǐyòng xīn de diànnǎo, kěyǐ jiéyuē bù shǎo shíjiān, bìngqiě bù róngyì chū cuò.","en":"Also, using the new computers would save a lot of time and make mistakes less likely."},{"sp":"王经理","s":"m","zh":"好主意！方法对了，就能事半功倍，下个月一定能达到公司的要求。","py":"Hǎo zhǔyi! Fāngfǎ duì le, jiù néng shìbàngōngbèi, xià gè yuè yídìng néng dádào gōngsī de yāoqiú.","en":"Good idea! With the right method we'll get twice the result for half the effort and definitely meet the company's requirements next month."},{"sp":"同事","s":"f","zh":"那我先去跟大家说明一下这个方法。","py":"Nà wǒ xiān qù gēn dàjiā shuōmíng yíxià zhège fāngfǎ.","en":"Then I'll go and explain this method to everyone first."}]}]},{"n":13,"cn":"喝着茶看京剧","en":"Drink tea while watching Beijing opera","vocab":[{"w":"京剧","p":"jīngjù","pos":"n.","d":"Beijing opera"},{"w":"演员","p":"yǎnyuán","pos":"n.","d":"actor/actress"},{"w":"观众","p":"guānzhòng","pos":"n.","d":"audience"},{"w":"厚","p":"hòu","pos":"adj.","d":"deep, profound"},{"w":"演出","p":"yǎnchū","pos":"v.","d":"to perform, to put on (a show)"},{"w":"大概","p":"dàgài","pos":"adv.","d":"roughly, approximately"},{"w":"来自","p":"láizì","pos":"v.","d":"to be from"},{"w":"遍","p":"biàn","pos":"m.","d":"(denoting an action from beginning to end) time"},{"w":"偶尔","p":"ǒuěr","pos":"adv.","d":"occasionally, once in a while"},{"w":"吃惊","p":"chījīng","pos":"v.","d":"to be surprised, to be shocked"},{"w":"基础","p":"jīchǔ","pos":"n.","d":"basis, foundation"},{"w":"表演","p":"biǎoyǎn","pos":"v.","d":"to act, to perform"},{"w":"正常","p":"zhèngcháng","pos":"adj.","d":"normal, regular"},{"w":"申请","p":"shēnqǐng","pos":"v.","d":"to apply for"},{"w":"有趣","p":"yǒuqù","pos":"adj.","d":"interesting, fun"},{"w":"开心","p":"kāixīn","pos":"adj.","d":"happy, glad"},{"w":"继续","p":"jìxù","pos":"v.","d":"to go on, to continue"},{"w":"由","p":"yóu","pos":"prep.","d":"by (sb.)"},{"w":"讨论","p":"tǎolùn","pos":"v.","d":"to discuss, to talk over"},{"w":"大约","p":"dàyuē","pos":"adv.","d":"approximately, about"},{"w":"餐厅","p":"cāntīng","pos":"n.","d":"restaurant"},{"w":"纸袋","p":"zhǐdài","pos":"n.","d":"paper bag"},{"w":"袋","p":"dài","pos":"n.","d":"bag, sack"},{"w":"互联网","p":"hùliánwǎng","pos":"n.","d":"Internet"},{"w":"进行","p":"jìnxíng","pos":"v.","d":"to conduct, to carry out"},{"w":"错误","p":"cuòwù","pos":"adj.","d":"wrong"},{"w":"随着","p":"suízhe","pos":"prep.","d":"along with, as"},{"w":"十分","p":"shífēn","pos":"adv.","d":"very, extremely"},{"w":"普遍","p":"pǔbiàn","pos":"adj.","d":"universal, common"},{"w":"部分","p":"bùfen","pos":"n.","d":"part"},{"w":"稍微","p":"shāowēi","pos":"adv.","d":"a little, slightly"},{"w":"苦","p":"kǔ","pos":"adj.","d":"bitter"},{"w":"省","p":"shěng","pos":"n.","d":"province"}],"proper":"广东省 (GuǎngdōngShěng)","grammar":[{"t":"随着…… — Along with / As (something changes)","m":"随着 + noun phrase (often 发展, 增加, 变化, or 'time') introduces a changing background; the main clause describes a second change that follows from it. The 随着 phrase usually stands at the start of the sentence, followed by a comma. It expresses gradual, parallel change, so the main clause often contains 越来越, 也 or 开始.","ex":[["随着年龄的增加，爷爷对京剧越来越感兴趣了。","As he got older, Grandpa became more and more interested in Beijing opera."],["随着互联网的发展，在网上买火车票的人越来越多。","With the development of the Internet, more and more people buy train tickets online."],["随着天气变冷，来公园散步的人少了一些。","As the weather turned cold, fewer people came to walk in the park."]]},{"t":"由 — By (marks who does / is responsible for something)","m":"由 + person/organisation + verb marks the agent who carries out or is in charge of an action, usually in formal statements about duties and arrangements (由他负责, 由学校安排). Unlike 被, it does not imply that something unfortunate happened; it simply tells you whose job it is. 由 can also mean 'from' in fixed phrases (由此, 由……组成).","ex":[["这次晚会的节目由学生们自己准备。","The programme for this evening party is prepared by the students themselves."],["这次会议由王经理负责，有问题可以直接问他。","Manager Wang is in charge of this meeting; if you have questions, you can ask him directly."],["孩子的教育问题应该由父母一起商量。","Questions about a child's education should be discussed by both parents together."]]},{"t":"稍微……一点儿 / 一些 / 一下 — Slightly, a little","m":"稍微 is placed before a verb or adjective to soften it and mean 'a little, slightly'. It usually needs a quantity word after the verb/adjective: 一点儿, 一些, 一下 or a reduplicated verb (稍微等等). Used with adjectives it often appears in comparisons: 比……稍微 + adj + 一点儿. It is more polite and tentative than plain 有点儿, and, unlike 有点儿, it is not limited to negative feelings.","ex":[["这件衬衫稍微大了一点儿，有没有小一号的？","This shirt is a little too big; do you have one a size smaller?"],["请您稍微等一下，经理马上就到。","Please wait a moment; the manager will be here right away."],["今天比昨天稍微热一些，可以少穿一件衣服。","Today is slightly hotter than yesterday, so you can wear one less layer."]]},{"t":"遍 — Verbal measure word: once through, from start to finish","m":"遍 counts how many times an action is done completely, from beginning to end: 看一遍, 读两遍, 再说一遍. It goes after the verb (and after 了 if present). 次 just counts occurrences, while 遍 stresses that the whole process was gone through. So 这本书我看了三遍 means 'I read the whole book three times'. 一遍又一遍 means 'over and over again'.","ex":[["这个电影太好看了，我已经看了三遍。","This film is so good that I've already watched it three times."],["老师，我没听清楚，您能再说一遍吗？","Teacher, I didn't catch that clearly; could you say it once more?"],["他把那封信一遍又一遍地读，还是不明白是什么意思。","He read the letter over and over again but still didn't understand what it meant."]]}],"ex":{"judge":[{"s":"我爷爷是个京剧迷，每个周末都要去看京剧演出。他说，京剧的音乐和动作都很有意思，越看越喜欢。","st":"★ 爷爷偶尔才看一次京剧。","a":false,"en":"My grandpa is a Beijing opera fan and goes to an opera show every weekend. He says the music and movements are fascinating, and the more he watches the more he likes it. / ★ Grandpa only watches Beijing opera once in a while."},{"s":"这家餐厅的菜味道不错，价格也很正常，所以每天中午都有很多人来吃饭。不过，晚上来的人比较少。","st":"★ 这家餐厅中午的客人比晚上多。","a":true,"en":"This restaurant's food tastes good and the prices are normal, so lots of people come for lunch every day. In the evening, though, fewer people come. / ★ The restaurant has more customers at noon than in the evening."},{"s":"现在很多商店不再免费提供袋子，顾客如果需要纸袋，得另外付一块钱。所以越来越多的人购物时会自己带包。","st":"★ 在这些商店，纸袋是免费的。","a":false,"en":"Many shops no longer provide free bags; if customers want a paper bag they must pay one extra yuan. So more and more people bring their own bag when shopping. / ★ Paper bags are free in these shops."},{"s":"小林三个月前申请了去国外读硕士，昨天学校终于给她发来了通知，告诉她已经被接受了。她开心得一晚上都没睡着。","st":"★ 小林的申请成功了。","a":true,"en":"Three months ago Xiao Lin applied to do a master's abroad. Yesterday the university finally sent her a notice saying she had been accepted. She was so happy she couldn't sleep all night. / ★ Xiao Lin's application succeeded."},{"s":"随着互联网越来越普遍，很多人不再去书店买书，而是在网上买。虽然这样很方便，但是我还是喜欢在书店里慢慢地看。","st":"★ 说话人更喜欢在网上买书。","a":false,"en":"As the Internet becomes more common, many people no longer buy books in bookshops but online. Although that's convenient, I still like browsing slowly in a bookshop. / ★ The speaker prefers buying books online."}],"listen":[{"dlg":["女：你看过京剧吗？","男：看过一次，不过大部分内容我都没听懂。"],"q":"男的觉得京剧怎么样？","opts":["很容易懂","不太好懂","非常无聊"],"a":1,"en":"W: Have you ever seen Beijing opera? M: Once, but I didn't understand most of it. Q: What does the man think of Beijing opera?"},{"dlg":["男：这杯咖啡怎么这么苦？","女：不好意思，我忘了放糖了，你稍微等一下，我去拿。"],"q":"女的接下来要做什么？","opts":["去拿糖","重新做一杯","去买咖啡"],"a":0,"en":"M: Why is this coffee so bitter? W: Sorry, I forgot the sugar. Wait a moment, I'll go and get it. Q: What will the woman do next?"},{"dlg":["女：听说下个月的晚会由你们班来表演节目？","男：对，我们正在讨论表演什么呢，大家的意见还不一样。"],"q":"他们班现在在做什么？","opts":["练习节目","讨论节目","看演出"],"a":1,"en":"W: I hear your class will perform at next month's party? M: Yes, we're discussing what to perform; people still have different opinions. Q: What is his class doing now?"},{"dlg":["男：从这儿到机场大约要多长时间？","女：如果不堵车，大概四十分钟；要是堵车，就说不准了。"],"q":"不堵车的话，到机场要多久？","opts":["一个小时","四个小时","四十分钟"],"a":2,"en":"M: About how long does it take from here to the airport? W: If there's no traffic jam, roughly forty minutes; with a jam, hard to say. Q: Without traffic, how long to the airport?"},{"dlg":["女：你们公司的同事都来自哪儿？","男：大部分是广东省的，也有一些是从北方来的。"],"q":"关于男的公司，可以知道什么？","opts":["同事都是北方人","很多同事来自广东","公司在北方"],"a":1,"en":"W: Where are your colleagues from? M: Most are from Guangdong Province; some come from the north. Q: What do we know about the man's
