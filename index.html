ad alone for the first time—do you dare?"},{"s":"A：你这次去北京参观了哪些地方？  B：我们的（  ）带我们去了长城和故宫。","a":"导游","en":"A: What places did you visit in Beijing? B: Our tour guide took us to the Great Wall and the Forbidden City."},{"s":"A：明天的课你准备好了吗？  B：还没有，我今天晚上要先（  ）一下。","a":"预习","en":"A: Are you ready for tomorrow's class? B: Not yet; I need to preview tonight."}],"grammar":[{"q":"你一会儿说去，一会儿说不去，（  ）怎么想的？","opts":["恐怕","到底","敢","故意"],"a":1,"exp":"到底 presses for the real answer after confusing behaviour.","g":0},{"q":"这件事太复杂了，（  ）一两天解决不了。","opts":["恐怕","到底","千万","敢"],"a":0,"exp":"恐怕 gives a worried estimate.","g":1},{"q":"小时候我很怕狗，看到狗就不（  ）往前走了。","opts":["会","能","敢","可以"],"a":2,"exp":"不敢 expresses lack of courage caused by fear.","g":2},{"q":"学校非常（  ）学生的身体健康，每个月都会检查一次。","opts":["尊重","原谅","重视","同情"],"a":2,"exp":"重视 = treat as important.","g":3},{"q":"经过三年的努力，他（  ）还是读完了博士。","opts":["恐怕","到底","敢","千万"],"a":1,"exp":"In statements 到底 means 'finally, in the end'.","g":0},{"q":"他非常害羞，在很多人面前不（  ）说话。","opts":["敢","到底","代表","恐怕"],"a":0,"exp":"不敢说话 = too shy to speak.","g":2}],"order":[{"parts":["我知道你不是故意的，","所以已经原谅你了，","你别再难过了。"],"en":"I know you didn't mean it, so I've already forgiven you; don't be sad any more."},{"parts":["看到这么多人来参观我们的学校，","校长非常激动，","说这是学校最好的一天。"],"en":"Seeing so many people visiting our school, the headmaster was very moved and said it was the school's best day."},{"parts":["既然你已经报了名，","就要好好准备，","千万别马马虎虎的。"],"en":"Since you've signed up, prepare well; whatever you do, don't be sloppy."}],"reading":[{"p":"很多人以为输了比赛就是失败，其实不是这样。输了以后冷静地想一想自己哪里做得不好，下次不再错，也是一种进步。真正的失败是输了就放弃。","q":"★ 说话人认为真正的失败是：","opts":["输了比赛","输了就放弃","没有进步"],"a":1,"en":"Many think losing a match is failure, but not so. Calmly thinking afterwards about what went wrong and fixing it is progress too. Real failure is giving up after losing."},{"p":"上个月我去大使馆办签证。工作人员让我先填两张表格，又让我留下电话号码，说办好了会打电话通知我。没想到三天以后就接到了电话，比我想的快多了。","q":"★ 说话人的签证：","opts":["办得很快","还没办好","被拒绝了"],"a":0,"en":"Last month I went to the embassy for a visa. Staff had me fill in two forms and leave my number, saying they'd call. To my surprise they called three days later, much faster than I expected."},{"p":"小张在一家公司当导游已经五年了。他说，当导游最重要的不是知道多少知识，而是要尊重每一位游客。有的游客走得慢，有的问题多，导游都要有耐心。","q":"★ 小张认为当导游最重要的是：","opts":["知识多","走得快","尊重游客"],"a":2,"en":"Xiao Zhang has been a tour guide for five years. He says the most important thing isn't knowledge but respecting every tourist. Some walk slowly, some ask many questions; a guide must be patient."}],"write":[{"words":["你","到底","喜欢","哪一个？"],"en":"Which one do you actually like?"},{"words":["他","把","照片","挂在了墙上。"],"en":"He hung the photo on the wall."},{"words":["这件事","让","大家","非常失望。"],"en":"This matter disappointed everyone greatly."},{"words":["我们","都很","同情","这个小伙子。"],"en":"We all feel sorry for this young man."}],"hanzi":[{"s":"请把你的手机号（  ）告诉我。","py":"mǎ","a":"码"},{"s":"考试的时候一定要冷（  ）。","py":"jìng","a":"静"},{"s":"他是一个很有礼（  ）的孩子。","py":"mào","a":"貌"},{"s":"这次比赛我们又（  ）了。","py":"shū","a":"输"}]},"tx":[{"t":"办签证 · Applying for a visa","scene":"Mark, who wants to stay in China for a PhD, talks with Teacher Chen about his visa application.","g":[0,1],"lines":[{"sp":"马克","s":"m","zh":"陈老师，我想留在中国读博士，可是签证下个月就不能用了，我到底该怎么办呀？","py":"Chén lǎoshī, wǒ xiǎng liú zài Zhōngguó dú bóshì, kěshì qiānzhèng xià gè yuè jiù bù néng yòng le, wǒ dàodǐ gāi zěnme bàn ya?","en":"Ms Chen, I want to stay in China for a PhD, but my visa will no longer be valid next month. What on earth should I do?"},{"sp":"陈老师","s":"f","zh":"别着急，先去学校的留学生办公室报名，他们会给你一张表格。","py":"Bié zháojí, xiān qù xuéxiào de liúxuéshēng bàngōngshì bàomíng, tāmen huì gěi nǐ yì zhāng biǎogé.","en":"Don't worry. First sign up at the international students' office; they'll give you a form."},{"sp":"马克","s":"m","zh":"表格填好以后交给谁？我可以传真过去吗？","py":"Biǎogé tiánhǎo yǐhòu jiāo gěi shéi? Wǒ kěyǐ chuánzhēn guòqu ma?","en":"Who do I give the completed form to? Can I fax it over?"},{"sp":"陈老师","s":"f","zh":"恐怕不行，得你自己拿过去。记得在上面写清楚你的护照号码和手机号码。","py":"Kǒngpà bù xíng, děi nǐ zìjǐ ná guòqu. Jìde zài shàngmian xiě qīngchu nǐ de hùzhào hàomǎ hé shǒujī hàomǎ.","en":"I'm afraid not; you have to take it yourself. Remember to write your passport number and phone number clearly on it."},{"sp":"马克","s":"m","zh":"好的。我这个人有点儿马虎，填完一定再检查两遍。","py":"Hǎo de. Wǒ zhège rén yǒudiǎnr mǎhu, tiánwán yídìng zài jiǎnchá liǎng biàn.","en":"OK. I'm a bit careless, so I'll definitely check it twice after filling it in."},{"sp":"陈老师","s":"f","zh":"这样最好。要是有问题，什么时候都可以给我打电话。","py":"Zhèyàng zuì hǎo. Yàoshi yǒu wèntí, shénme shíhou dōu kěyǐ gěi wǒ dǎ diànhuà.","en":"That's best. If there's any problem, call me anytime."}]},{"t":"去郊区参观 · A visit to the suburbs","scene":"Lin Xiaoyu and Zhang Wei join a company trip to a farm in the suburbs, led by a young tour guide.","g":[2],"lines":[{"sp":"林小雨","s":"f","zh":"这个导游真不错，虽然是个小伙子，可是讲得很清楚，对大家也很有礼貌。","py":"Zhège dǎoyóu zhēn búcuò, suīrán shì gè xiǎohuǒzi, kěshì jiǎng de hěn qīngchu, duì dàjiā yě hěn yǒu lǐmào.","en":"This tour guide is great. He's only a young man, but he explains clearly and is very polite to everyone."},{"sp":"张伟","s":"m","zh":"是啊，来郊区参观的人这么多，他一点儿也不紧张，说话很自信。","py":"Shì a, lái jiāoqū cānguān de rén zhème duō, tā yìdiǎnr yě bù jǐnzhāng, shuōhuà hěn zìxìn.","en":"Yes, so many people visiting the suburbs, and he's not nervous at all; he speaks with real confidence."},{"sp":"林小雨","s":"f","zh":"听说他下午还要带我们去骑马，你敢不敢骑？","py":"Tīngshuō tā xiàwǔ hái yào dài wǒmen qù qí mǎ, nǐ gǎn bu gǎn qí?","en":"I hear he's taking us horse riding this afternoon. Do you dare ride?"},{"sp":"张伟","s":"m","zh":"我小时候从马上掉下来过，到现在还不敢。","py":"Wǒ xiǎoshíhou cóng mǎ shang diào xiàlai guo, dào xiànzài hái bù gǎn.","en":"I fell off a horse as a kid; I still don't dare."},{"sp":"林小雨","s":"f","zh":"别怕，导游说那些马都很听话，我陪你一起骑。","py":"Bié pà, dǎoyóu shuō nàxiē mǎ dōu hěn tīnghuà, wǒ péi nǐ yìqǐ qí.","en":"Don't be scared; the guide says the horses are very well behaved. I'll ride with you."},{"sp":"张伟","s":"m","zh":"那好吧，既然你这么说，我就试一试。","py":"Nà hǎo ba, jìrán nǐ zhème shuō, wǒ jiù shì yi shì.","en":"All right then, since you say so, I'll give it a try."}]},{"t":"输了比赛以后 · After losing the match","scene":"After their basketball team loses, Liu Fang comforts her disappointed classmate Mark.","g":[1,3],"lines":[{"sp":"刘芳","s":"f","zh":"马克，别这么失望了，输一场比赛没什么。","py":"Mǎkè, bié zhème shīwàng le, shū yì chǎng bǐsài méi shénme.","en":"Mark, don't be so disappointed; losing one match is nothing."},{"sp":"马克","s":"m","zh":"可是我代表班里打的最后一个球没进，大家都在等着我呀。","py":"Kěshì wǒ dàibiǎo bān li dǎ de zuìhòu yí gè qiú méi jìn, dàjiā dōu zài děngzhe wǒ ya.","en":"But I took the last shot for the class and missed, and everyone was counting on me."},{"sp":"刘芳","s":"f","zh":"大家都很同情你，没有人觉得是你的错。再说，那个时候谁都很难冷静。","py":"Dàjiā dōu hěn tóngqíng nǐ, méiyǒu rén juéde shì nǐ de cuò. Zàishuō, nàge shíhou shéi dōu hěn nán lěngjìng.","en":"Everyone feels for you; nobody blames you. Besides, anyone would find it hard to stay calm at that moment."},{"sp":"马克","s":"m","zh":"我还是觉得对不起大家，恐怕他们不会原谅我了。","py":"Wǒ háishi juéde duìbuqǐ dàjiā, kǒngpà tāmen bú huì yuánliàng wǒ le.","en":"I still feel I've let everyone down; I'm afraid they won't forgive me."},{"sp":"刘芳","s":"f","zh":"怎么会呢？大家都尊重你，因为你是练习最认真的一个。","py":"Zěnme huì ne? Dàjiā dōu zūnzhòng nǐ, yīnwèi nǐ shì liànxí zuì rènzhēn de yí gè.","en":"How could that be? Everyone respects you, because you're the one who trains hardest."},{"sp":"马克","s":"m","zh":"谢谢你，听你这么说，我心里好受多了。下次比赛我一定要赢回来！","py":"Xièxie nǐ, tīng nǐ zhème shuō, wǒ xīnli hǎoshòu duō le. Xià cì bǐsài wǒ yídìng yào yíng huílai!","en":"Thanks; hearing that makes me feel much better. I'll win it back next match!"}]},{"t":"记者采访：怎么学好汉语 · Interview: learning Chinese well","scene":"A reporter interviews Teacher Chen about how her students prepare for classes.","g":[3],"lines":[{"sp":"记者","s":"m","zh":"陈老师，您的学生汉语都说得这么好，您有什么方法吗？","py":"Chén lǎoshī, nín de xuésheng Hànyǔ dōu shuō de zhème hǎo, nín yǒu shénme fāngfǎ ma?","en":"Ms Chen, your students all speak Chinese so well. Do you have any special methods?"},{"sp":"陈老师","s":"f","zh":"我很重视预习。上课前，学生要先把课文读两遍，找到这一课的重点。","py":"Wǒ hěn zhòngshì yùxí. Shàngkè qián, xuésheng yào xiān bǎ kèwén dú liǎng biàn, zhǎodào zhè yí kè de zhòngdiǎn.","en":"I put great emphasis on previewing. Before class, students read the text twice and find the key points of the lesson."},{"sp":"记者","s":"m","zh":"我看到教室墙上挂着很多照片，那是什么？","py":"Wǒ kàndào jiàoshì qiáng shang guàzhe hěn duō zhàopiàn, nà shì shénme?","en":"I see lots of photos hanging on the classroom wall. What are they?"},{"sp":"陈老师","s":"f","zh":"那是学生们去参观的时候照的。每次回来，大家都要用汉语介绍自己看到了什么。","py":"Nà shì xuéshengmen qù cānguān de shíhou zhào de. Měi cì huílai, dàjiā dōu yào yòng Hànyǔ jièshào zìjǐ kàndàole shénme.","en":"They were taken on student visits. Each time we come back, everyone describes what they saw in Chinese."},{"sp":"记者","s":"m","zh":"听起来学生们一定很激动吧！","py":"Tīng qǐlai xuéshengmen yídìng hěn jīdòng ba!","en":"Sounds like the students must get very excited!"},{"sp":"陈老师","s":"f","zh":"是的。我们原来打算这个月去看京剧，不过因为下雨推到了下个月，大家都很想快点儿去。","py":"Shì de. Wǒmen yuánlái dǎsuàn zhège yuè qù kàn jīngjù, búguò yīnwèi xià yǔ tuīdàole xià gè yuè, dàjiā dōu hěn xiǎng kuài diǎnr qù.","en":"Yes. We'd planned to see Beijing opera this month, but rain pushed it to next month, and everyone can't wait to go."}]}]},{"n":17,"cn":"人与自然","en":"Humans and nature","vocab":[{"w":"凉快","p":"liángkuai","pos":"adj.","d":"pleasantly cool"},{"w":"热闹","p":"rènao","pos":"adj.","d":"busy, bustling"},{"w":"云","p":"yún","pos":"n.","d":"cloud"},{"w":"广播","p":"guǎngbō","pos":"n.","d":"broadcast, radio program"},{"w":"照","p":"zhào","pos":"v.","d":"to take a picture, to photograph"},{"w":"倒","p":"dào","pos":"adv.","d":"(used to indicate contrast) yet, actually"},{"w":"毛","p":"máo","pos":"n.","d":"hair, fur"},{"w":"抱","p":"bào","pos":"v.","d":"to hold in the arms, to hug"},{"w":"干","p":"gàn","pos":"v.","d":"to do, to act"},{"w":"严格","p":"yángé","pos":"adj.","d":"strict, rigorous"},{"w":"难受","p":"nánshòu","pos":"adj.","d":"sad, unhappy"},{"w":"趟","p":"tàng","pos":"m.","d":"(used for a round trip) time"},{"w":"放暑假","p":"fàngshǔjià","pos":"v.","d":"to be on summer vacation"},{"w":"老虎","p":"lǎohǔ","pos":"n.","d":"tiger"},{"w":"入口","p":"rùkǒu","pos":"n.","d":"entrance"},{"w":"排队","p":"páiduì","pos":"v.","d":"to form a line, to line up"},{"w":"活泼","p":"huópo","pos":"adj.","d":"lively, Vivacious"},{"w":"社会","p":"shèhuì","pos":"n.","d":"society"},{"w":"竞争","p":"jìngzhēng","pos":"v.","d":"to compete"},{"w":"森林","p":"sēnlín","pos":"n.","d":"forest"},{"w":"剩","p":"shèng","pos":"v.","d":"to be left over, to remain"},{"w":"暖和","p":"nuǎnhuo","pos":"adj.","d":"warm"},{"w":"海洋","p":"hǎiyáng","pos":"n.","d":"sea, ocean"},{"w":"底","p":"dǐ","pos":"n.","d":"bottom, base"},{"w":"美人鱼","p":"Měirényú","pos":"n.","d":"mermaid"},{"w":"公里","p":"gōnglǐ","pos":"m.","d":"kilometer"},{"w":"仍然","p":"réngrán","pos":"adv.","d":"still, yet"},{"w":"排列","p":"páiliè","pos":"v.","d":"to put in order, to arrange"},{"w":"梦","p":"mèng","pos":"n.","d":"dream"}],"proper":"安娜 (Ānnà), 长城 (Chángchéng), 六一儿童节 (LiùyīÉrtóngjié), 香山 (XiāngShān), 亚洲 (Yàzhōu)","grammar":[{"t":"倒 — Contrary to expectation (\"actually, rather\")","m":"The adverb 倒 (dào) goes before the verb or adjective and marks a result that is the opposite of what the speaker or listener expected: \"X isn't …, but it is actually …\". It often follows a clause with 以为 / 没想到 / 不大 etc. It is softer than 却 and often sounds a bit surprised. In 说得倒容易 it means \"that's easy to say (but hard to do)\".","ex":[["这家饭馆不大，菜倒挺好吃的。","This restaurant isn't big, but the food is actually pretty good."],["我以为山上会很冷，没想到倒挺暖和的。","I thought it would be cold on the mountain, but it was actually quite warm."],["你说得倒容易，你自己来试试！","That's easy for you to say — you try it yourself!"]]},{"t":"仍然 — Still, as before","m":"仍然 (réngrán) is a fairly formal adverb meaning \"still / as before\": a situation continues unchanged, often despite time passing or despite something that should have changed it. It goes before the verb phrase and is often paired with 虽然 / 尽管 … 但是 / 可是. In speech 还 is more common; 仍然 sounds more written.","ex":[["已经十点了，他仍然在办公室加班。","It's already ten o'clock and he's still working overtime in the office."],["虽然医生让他少喝咖啡，他仍然每天喝三杯。","Although the doctor told him to drink less coffee, he still drinks three cups a day."],["毕业十年了，我们俩仍然经常联系。","It's been ten years since graduation, and the two of us are still often in touch."]]},{"t":"动词 + 一趟 — Measure word for a trip","m":"趟 (tàng) counts trips that go somewhere and come back: 去/来/跑 + number + 趟 (+ place). 去一趟银行 = make a trip to the bank. Unlike 次, which counts any occurrence, 趟 stresses the journey there and back. It also counts runs of a train or bus: 这趟火车.","ex":[["我下午得去一趟银行，你在家等我吧。","I have to make a trip to the bank this afternoon; wait for me at home."],["为了这件事，他专门跑了两趟。","He made two special trips just for this matter."],["这趟火车是开往上海的，你坐错了。","This train goes to Shanghai — you're on the wrong one."]]},{"t":"剩（下） — To be left over, remain","m":"剩 (shèng) means something remains after the rest has been used up, sold or gone: (place/time) + (只/还) + 剩(下) + amount. It is often used with 只 or 就 to stress how little is left, and can also be used for time remaining (离考试只剩三天).","ex":[["冰箱里只剩两个鸡蛋了，我去买点儿吧。","There are only two eggs left in the fridge — I'll go and buy some."],["离考试只剩三天了，你还不复习？","There are only three days left before the exam and you still aren't reviewing?"],["大家都走了，办公室里就剩下我一个人。","Everyone has left; I'm the only one left in the office."]]}],"ex":{"judge":[{"s":"今天早上广播里说，下午会有大雨。可是到了下午，天上一片云都没有，太阳倒越来越大了。","st":"★ 下午下了大雨。","a":false,"en":"This morning the radio said there would be heavy rain in the afternoon. But in the afternoon there wasn't a single cloud in the sky — the sun actually got stronger and stronger. / ★ It rained heavily in the afternoon."},{"s":"我们公司的王经理对工作要求很严格，每份材料他都要仔细看好几遍。不过他对大家很有礼貌，从来不乱发脾气。","st":"★ 王经理对工作要求很高。","a":true,"en":"Manager Wang at our company is very strict about work; he reads every document carefully several times. But he is polite to everyone and never loses his temper. / ★ Manager Wang has high standards for work."},{"s":"我家离海边只有两公里。每年放暑假，我都会和朋友骑自行车去海边游泳，那里夏天比城里凉快多了。","st":"★ 他家离海边很远。","a":false,"en":"My home is only two kilometres from the sea. Every summer holiday I cycle there with friends to swim; in summer it's much cooler there than in the city. / ★ His home is far from the sea."},{"s":"现在的社会竞争很大，很多年轻人压力都不小。我觉得，压力大的时候，最好去森林里走走，放松一下心情。","st":"★ 说话人建议压力大时去森林里放松。","a":true,"en":"Society today is very competitive and many young people are under a lot of pressure. I think when you're stressed, it's best to go for a walk in the forest and relax. / ★ The speaker suggests relaxing in the forest when stressed."},{"s":"妹妹小时候特别活泼，一分钟也坐不住。现在她已经上大学了，性格仍然跟以前一样，有她在的地方总是很热闹。","st":"★ 妹妹现在变得很安静。","a":false,"en":"My younger sister was very lively as a child and couldn't sit still for a minute. She's at university now, but her personality is still the same — wherever she is, it's always lively. / ★ The sister has become very quiet now."}],"listen":[{"dlg":["女：这个动物园的入口在哪儿？我找了半天也没找到。","男：就在前面，你看那么多人排队的地方就是。"],"q":"男的是什么意思？","opts":["入口就在前面","动物园今天不开门","他也不知道入口在哪儿"],"a":0,"en":"W: Where's the entrance to this zoo? I've been looking for ages. M: Just ahead — where all those people are lining up. Q: What does the man mean?"},{"dlg":["男：你昨天去看老虎了吗？","女：去了，可是它一直躺着睡觉，我等了一个小时，它仍然没动。"],"q":"关于老虎，可以知道什么？","opts":["非常活泼","一直在睡觉","被人抱着"],"a":1,"en":"M: Did you go to see the tiger yesterday? W: I did, but it was lying there asleep the whole time; I waited an hour and it still didn't move. Q: What do we learn about the tiger?"},{"dlg":["女：你怎么了？脸色这么难看。","男：昨天晚上做了一个梦，梦见自己掉进了海底，醒了以后半天都很难受。"],"q":"男的为什么不舒服？","opts":["感冒了","没吃早饭","做了个不好的梦"],"a":2,"en":"W: What's wrong? You look awful. M: Last night I dreamt I fell to the bottom of the sea, and I felt bad for ages after waking up. Q: Why does the man feel unwell?"},{"dlg":["男：你这件毛衣 ay — I feel awful."},{"s":"A：你女儿真（  ），一点儿都不害羞。  B：是啊，她见了谁都喜欢聊天。","a":"活泼","en":"A: Your daughter is so lively — not shy at all. B: Yes, she likes chatting with anyone she meets."}],"grammar":[{"q":"这个房间不大，住起来（  ）挺舒服的。","opts":["倒","才","就","又"],"a":0,"exp":"倒 marks a result contrary to expectation: the room is small, but actually comfortable.","g":0},{"q":"我本来以为考试会很难，没想到题目（  ）很简单。","opts":["仍然","倒","刚","才"],"a":1,"exp":"以为…没想到…倒… — the outcome is the opposite of what was expected.","g":0},{"q":"虽然已经吃过药了，他的病（  ）没有好。","opts":["刚才","已经","仍然","倒"],"a":2,"exp":"仍然 = still; the situation hasn't changed despite taking medicine.","g":1},{"q":"我昨天去了两（  ）商店，都没买到那种饮料。","opts":["遍","趟","页","件"],"a":1,"exp":"趟 counts trips to a place and back.","g":2},{"q":"这（  ）开往北京的火车晚点了。","opts":["趟","条","把","张"],"a":0,"exp":"趟 is also the measure word for a scheduled run of a train or bus.","g":2},{"q":"大家都吃饱了，桌子上还（  ）了很多菜。","opts":["够","饱","满","剩"],"a":3,"exp":"剩 = to be left over: a lot of food remained on the table.","g":3}],"order":[{"parts":["虽然已经放暑假了，","他仍然每天早上七点起床，","去公园跑步。"],"en":"Although it's already the summer holiday, he still gets up at seven every morning to run in the park."},{"parts":["因为入口处排队的人太多，","我们等了一个多小时，","才进了动物园。"],"en":"Because so many people were queuing at the entrance, we waited over an hour before getting into the zoo."},{"parts":["人们的生活离不开自然，","所以我们不仅要保护森林，","而且要保护海洋。"],"en":"People's lives depend on nature, so we must protect not only forests but also the oceans."},{"parts":["我以为孩子见了老虎会害怕，","没想到他倒一点儿也不怕，","还想走近看看。"],"en":"I thought the child would be scared of the tiger, but actually he wasn't scared at all and even wanted to get closer."}],"reading":[{"p":"很多人以为海底又黑又冷，什么也没有。其实，海洋里生活着很多种动物和植物，有些地方甚至比森林还热闹。科学家估计，人们对海洋的了解还远远不够。","q":"★ 根据这段话，可以知道：","opts":["海底什么也没有","人们对海洋了解得还很少","海洋里的动物比森林里少"],"a":1,"en":"Many people think the sea floor is dark, cold and empty. In fact many kinds of animals and plants live in the ocean, and some places are even livelier than a forest. Scientists estimate that our knowledge of the ocean is still far from enough."},{"p":"我小时候最喜欢听妈妈讲美人鱼的故事。那时候我常常梦见自己也变成了一条鱼，在海里游来游去。长大以后，我选择了研究海洋的专业，也算是没有忘记小时候的梦。","q":"★ 关于说话人，可以知道：","opts":["他小时候常梦见自己变成鱼","他现在是一名作家","他不喜欢听故事"],"a":0,"en":"As a child I loved hearing my mother tell mermaid stories. I often dreamt I'd turned into a fish swimming around in the sea. When I grew up I chose to study marine science — I suppose I never forgot my childhood dream."},{"p":"现在社会竞争很大，很多父母从孩子三四岁起就让他们学这学那。可是我觉得，对小孩子来说，最重要的是健康、快乐。周末带他们去郊区看看云，抱抱小动物，比多上一节课更有用。","q":"★ 说话人的看法是：","opts":["孩子应该多上几节课","孩子应该多去大自然里玩儿","孩子应该住在郊区"],"a":1,"en":"Society is very competitive now, and many parents have their children learning all sorts of things from age three or four. But I think for small children health and happiness matter most. Taking them to the countryside at the weekend to watch the clouds and hold small animals is more useful than an extra class."},{"p":"冬天的时候，很多北方的老人会去南方住几个月，因为南方暖和，空气也好。等到春天北方的天气变暖了，他们再回家。这样过冬的老人越来越多。","q":"★ 关于北方的老人，可以知道：","opts":["老人们一直住在南方","北方的冬天比南方暖和","有些老人冬天去南方住"],"a":2,"en":"In winter many elderly people from the north go and live in the south for a few months, because it's warm there and the air is good. When the weather in the north warms up in spring, they go home. More and more old people spend the winter this way."}],"write":[{"words":["这只小猫","的","性格","非常","活泼。"],"en":"This kitten has a very lively personality."},{"words":["很多人","在","入口","排队。"],"en":"Lots of people are lining up at the entrance."},{"words":["他","把","孩子","抱","了","起来。"],"en":"He picked the child up in his arms."},{"words":["我们老师","对学生","要求","很严格。"],"en":"Our teacher is very strict with the students."},{"words":["盒子里","只","剩下","两块","巧克力了。"],"en":"There are only two pieces of chocolate left in the box."}],"hanzi":[{"s":"今天天气很（  ）和，我们出去走走吧。","py":"nuǎn","a":"暖"},{"s":"请大家在门口排（  ），一个一个进去。","py":"duì","a":"队"},{"s":"动物园里的老（  ）正在睡觉。","py":"hǔ","a":"虎"},{"s":"我昨天晚上做了一个奇怪的（  ）。","py":"mèng","a":" 概要多长时间？","opts":["二十分钟","两个小时","半个小时"],"a":2,"en":"M: How far is it from here to the airport? W: About twenty-odd kilometres left; if there's no traffic jam we'll be there in half an hour. Q: About how long will it take?"},{"dlg":["女：你们公司竞争这么大，你受得了吗？","男：刚开始觉得压力很大，现在倒习惯了。","女：那你周末一般干什么？","男：去郊区爬爬山，放松一下。"],"q":"男的现在觉得怎么样？","opts":["已经习惯了","压力越来越大","想换工作"],"a":0,"en":"W: Your company is so competitive — can you stand it? M: At first I felt a lot of pressure, but now I've actually got used to it. W: So what do you usually do at weekends? M: Go hiking outside the city to relax. Q: How does the man feel now?"}],"fill":[{"s":"每天早上七点，爷爷都会打开收音机听新闻（  ）。","a":"广播","en":"Every morning at seven Grandpa turns on the radio to listen to the news broadcast."},{"s":"这只老虎刚出生的时候很小，叔叔一只手就能把它（  ）起来。","a":"抱","en":"When this tiger was born it was so small that a man could pick it up with one hand."},{"s":"奶奶家门口有一条小河，河水很清，能看见河（  ）的石头。","a":"底","en":"There's a little river by Grandma's door; the water is so clear you can see the stones on the bottom."},{"s":"孩子们在公园里跑来跑去，非常（  ）。","a":"热闹","en":"The children are running around the park — it's very lively."},{"s":"A：你去过亚洲哪些国家？  B：去过不少，我最喜欢在（  ）边的城市住。","a":"海洋","en":"A: Which Asian countries have you been to? B: Quite a few; I like living in cities by the ocean best."},{"s":"A：今天穿一件毛衣够吗？  B：够了，今天比昨天（  ）多了。","a":"暖和","en":"A: Is one sweater enough today? B: Yes, today's much warmer than yesterday."}],"grammar":[{"q":"这件衣服看起来很普通，穿在你身上（  ）挺好看的。","opts":["倒","都","只","才"],"a":0,"exp":"倒 introduces an unexpected positive result: plain-looking, but actually looks good on you.","g":0},{"q":"我们已经五年没见面了，可是她（  ）记得我的名字。","opts":["倒","刚","仍然","从来"],"a":2,"exp":"仍然 = still: despite five years, she still remembers.","g":1},{"q":"雨已经下了一天了，到现在（  ）没停。","opts":["仍然","曾经","终于","马上"],"a":0,"exp":"仍然 shows the rain continues unchanged up to now.","g":1},{"q":"妈妈让我去一（  ）超市，买点儿盐回来。","opts":["遍","回","场","趟"],"a":3,"exp":"去一趟 + place = make a trip there (and back).","g":2},{"q":"离飞机起飞只（  ）四十分钟了，你快点儿！","opts":["留","剩","差","够"],"a":1,"exp":"只剩 + time = only … left.","g":3},{"q":"天气预报说今天会很冷，可是外面（  ）很暖和。","opts":["才","倒","刚","再"],"a":1,"exp":"倒 marks a result opposite to what was predicted: forecast cold, but actually warm.","g":0}],"order":[{"parts":["这趟旅行虽然很累，","但是我们看到了很多美丽的景色，","所以大家都觉得很值得。"],"en":"Although this trip was tiring, we saw lots of beautiful scenery, so everyone felt it was worth it."},{"parts":["我的钱包里只剩下二十块钱了，","恐怕不够打车，","我们还是坐地铁吧。"],"en":"There's only twenty yuan left in my wallet — probably not enough for a taxi, so let's take the subway."},{"parts":["尽管医生让他多休息，","他仍然每天去公司，","大家都很担心他的身体。"],"en":"Although the doctor told him to rest more, he still goes to the office every day, and everyone is worried about his health."}],"reading":[{"p":"我住的地方离公司有十五公里。以前我每天开车上班，路上经常堵车，心情很不好。后来我改坐地铁了，虽然要早起二十分钟，但是在地铁上可以看看书，倒觉得轻松多了。","q":"★ 根据这段话，他现在：","opts":["每天开车上班","坐地铁上班","住在公司附近"],"a":1,"en":"I live fifteen kilometres from the office. I used to drive and often got stuck in traffic, which put me in a bad mood. Later I switched to the subway; although I have to get up twenty minutes earlier, I can read on the train and actually feel much more relaxed."},{"p":"动物园里新来了一只小老虎。它出生才三个月，身上的毛软软的，特别活泼，见了人就跑过来。每天都有很多孩子排队来看它，入口那儿比以前热闹多了。","q":"★ 关于这只小老虎，可以知道：","opts":["已经三岁了","很害怕见人","很受孩子们欢迎"],"a":2,"en":"A baby tiger has just arrived at the zoo. It's only three months old, its fur is soft, and it's very lively, running over whenever it sees people. Every day lots of children queue to see it, and the entrance is much busier than before."},{"p":"有人说，人只有在自然中才能真正地放松。我同意这个看法。每次工作累了，我都会去海边住几天，听听海的声音，看看天上的云，回来以后又有了精神。","q":"★ 说话人累的时候会：","opts":["去海边住几天","在家睡觉","去森林里照相"],"a":0,"en":"Some say people can only truly relax in nature. I agree. Every time I'm tired from work, I go and stay by the sea for a few days, listen to the waves and watch the clouds, and come back full of energy again."}],"write":[{"words":["那片森林","离这儿","大约","五公里。"],"en":"That forest is about five kilometres from here."},{"words":["我","明天","要去","一趟","邮局。"],"en":"I need to make a trip to the post office tomorrow."},{"words":["他","仍然","不","同意","我的看法。"],"en":"He still doesn't agree with my view."},{"words":["广播里","说","明天","会下雪。"],"en":"The radio said it would snow tomorrow."}],"hanzi":[{"s":"现在社会竞（  ）越来越大了。","py":"zhēng","a":"争"},{"s":"夏天的晚上，河边特别（  ）快。","py":"liáng","a":"凉"},{"s":"这些照片是按时间排（  ）的。","py":"liè","a":"列"},{"s":"孩子们都喜欢听美人（  ）的故事。","py":"yú","a":"鱼"}]},"tx":[{"t":"在动物园 · At the zoo","scene":"Mark and Lin Xiaoyu spend a busy Saturday at the zoo.","g":[0,3],"lines":[{"sp":"马克","s":"m","zh":"小雨，入口那儿排队的人真多，我们得等多久？","py":"Xiǎoyǔ, rùkǒu nàr páiduì de rén zhēn duō, wǒmen děi děng duō jiǔ?","en":"Xiaoyu, there are so many people queuing at the entrance — how long will we have to wait?"},{"sp":"林小雨","s":"f","zh":"今天是星期六，又是好天气，热闹一点儿也正常。我们先去看老虎吧。","py":"Jīntiān shì xīngqīliù, yòu shì hǎo tiānqì, rènao yìdiǎnr yě zhèngcháng. Wǒmen xiān qù kàn lǎohǔ ba.","en":"It's Saturday and the weather's nice, so it's normal for it to be a bit busy. Let's go and see the tigers first."},{"sp":"马克","s":"m","zh":"我以为老虎都很可怕，没想到这只小老虎倒挺活泼的，一直在跟妈妈玩儿。","py":"Wǒ yǐwéi lǎohǔ dōu hěn kěpà, méi xiǎngdào zhè zhī xiǎo lǎohǔ dào tǐng huópo de, yìzhí zài gēn māma wánr.","en":"I thought tigers were all scary, but this little one is actually really lively — it keeps playing with its mother."},{"sp":"林小雨","s":"f","zh":"你看它身上的毛，多漂亮！快给我照一张照片。","py":"Nǐ kàn tā shēnshang de máo, duō piàoliang! Kuài gěi wǒ zhào yì zhāng zhàopiàn.","en":"Look at its fur — how beautiful! Quick, take a photo for me."},{"sp":"马克","s":"m","zh":"好了。哎呀，相机的电只剩百分之五了。","py":"Hǎo le. Āiyā, xiàngjī de diàn zhǐ shèng bǎi fēn zhī wǔ le.","en":"Done. Oh no, the camera only has five percent battery left."},{"sp":"林小雨","s":"f","zh":"没关系，用我的手机吧。照完了我们去吃点儿东西。","py":"Méi guānxi, yòng wǒ de shǒujī ba. Zhàowánle wǒmen qù chī diǎnr dōngxi.","en":"Never mind, use my phone. When we're done with photos, let's get something to eat."}]},{"t":"广播节目 · On the radio","scene":"A radio host talks with Teacher Chen about why city people need nature.","g":[0,1],"lines":[{"sp":"记者","s":"m","zh":"大家好，这里是《周末早上好》节目。今天我们请到了陈老师，跟大家聊聊人与自然。","py":"Dàjiā hǎo, zhèlǐ shì 《Zhōumò Zǎoshang Hǎo》 jiémù. Jīntiān wǒmen qǐngdàole Chén lǎoshī, gēn dàjiā liáoliao rén yǔ zìrán.","en":"Hello everyone, this is \"Weekend Morning\". Today we've invited Teacher Chen to chat with us about people and nature."},{"sp":"陈老师","s":"f","zh":"现在社会竞争越来越大，很多人每天忙着工作，已经很久没有去过森林、海边了。","py":"Xiànzài shèhuì jìngzhēng yuè lái yuè dà, hěn duō rén měi tiān mángzhe gōngzuò, yǐjīng hěn jiǔ méiyǒu qùguo sēnlín, hǎibiān le.","en":"Society is getting more and more competitive. Many people are busy working every day and haven't been to a forest or the seaside in ages."},{"sp":"记者","s":"m","zh":"可是城市里的人想去森林，至少也得开几十公里的车吧？","py":"Kěshì chéngshì lǐ de rén xiǎng qù sēnlín, zhìshǎo yě děi kāi jǐ shí gōnglǐ de chē ba?","en":"But if city people want to go to a forest, they have to drive at least several dozen kilometres, right?"},{"sp":"陈老师","s":"f","zh":"是的。不过很多人告诉我，虽然路上很累，回来以后心情倒好多了。","py":"Shì de. Búguò hěn duō rén gàosu wǒ, suīrán lù shang hěn lèi, huílai yǐhòu xīnqíng dào hǎo duō le.","en":"Yes. But many people tell me that although the journey is tiring, they actually feel much better when they come back."},{"sp":"记者","s":"m","zh":"我小时候常梦见自己在海洋里游泳，现在仍然很喜欢大海。","py":"Wǒ xiǎoshíhou cháng mèngjiàn zìjǐ zài hǎiyáng lǐ yóuyǒng, xiànzài réngrán hěn xǐhuan dàhǎi.","en":"As a child I often dreamt I was swimming in the ocean, and I still love the sea now."},{"sp":"陈老师","s":"f","zh":"那您一定要带孩子去海洋馆看看。人只有了解自然，才会真正地保护自然。","py":"Nà nín yídìng yào dài háizi qù hǎiyángguǎn kànkan. Rén zhǐyǒu liǎojiě zìrán, cái huì zhēnzhèng de bǎohù zìrán.","en":"Then you must take your children to an aquarium. Only when people understand nature will they truly protect it."}]},{"t":"放暑假的计划 · Summer holiday plans","scene":"Zhang Wei invites Liu Fang to escape the Beijing heat at his hometown.","g":[2],"lines":[{"sp":"刘芳","s":"f","zh":"马上就要放暑假了，你打算干什么？","py":"Mǎshàng jiù yào fàng shǔjià le, nǐ dǎsuan gàn shénme?","en":"The summer holiday is about to start — what are you planning to do?"},{"sp":"张伟","s":"m","zh":"我想回一趟老家。我家那儿夏天特别凉快，晚上出去还得穿毛衣呢。","py":"Wǒ xiǎng huí yí tàng lǎojiā. Wǒ jiā nàr xiàtiān tèbié liángkuai, wǎnshang chūqu hái děi chuān máoyī ne.","en":"I want to make a trip back to my hometown. Summers there are really cool — you even need a sweater to go out at night."},{"sp":"刘芳","s":"f","zh":"真羡慕你！北京这几天太热了，我难受得晚上都睡不着。","py":"Zhēn xiànmù nǐ! Běijīng zhè jǐ tiān tài rè le, wǒ nánshòu de wǎnshang dōu shuì bu zháo.","en":"I'm so jealous! Beijing has been so hot these days — I feel so awful I can't sleep at night."},{"sp":"张伟","s":"m","zh":"那你跟我一起去吧。我家门口有一条小河，河水干净得能看见底。","py":"Nà nǐ gēn wǒ yìqǐ qù ba. Wǒ jiā ménkǒu yǒu yì tiáo xiǎo hé, héshuǐ gānjìng de néng kànjiàn dǐ.","en":"Then come with me. There's a little river by my front door, and the water is so clean you can see the bottom."},{"sp":"刘芳","s":"f","zh":"好啊！不过我爸妈对我要求很严格，我得先问问他们。","py":"Hǎo a! Búguò wǒ bàmā duì wǒ yāoqiú hěn yángé, wǒ děi xiān wènwen tāmen.","en":"Great! But my parents are very strict with me, so I'll have to ask them first."},{"sp":"张伟","s":"m","zh":"没问题，我让我妈妈给你妈妈打个电话。","py":"Méi wèntí, wǒ ràng wǒ māma gěi nǐ māma dǎ ge diànhuà.","en":"No problem — I'll get my mum to phone your mum."}]},{"t":"在海洋馆 · At the aquarium","scene":"On a cold winter day, Liu Fang and Manager Wang take their families to the aquarium.","g":[0,1,3],"lines":[{"sp":"刘芳","s":"f","zh":"王经理，外面那么冷，海洋馆里倒挺暖和的。","py":"Wáng jīnglǐ, wàimian nàme lěng, hǎiyángguǎn lǐ dào tǐng nuǎnhuo de.","en":"Manager Wang, it's so cold outside, but it's actually quite warm in the aquarium."},{"sp":"王经理","s":"m","zh":"是啊。你看，那边的鱼是按颜色排列的，红的、黄的、蓝的，像天上的云一样。","py":"Shì a. Nǐ kàn, nàbiān de yú shì àn yánsè páiliè de, hóng de, huáng de, lán de, xiàng tiān shang de yún yíyàng.","en":"Yes. Look, the fish over there are arranged by colour — red, yellow, blue — like clouds in the sky."},{"sp":"刘芳","s":"f","zh":"我女儿最喜欢美人鱼表演了，可惜今天的票已经卖完了，一张也没剩。","py":"Wǒ nǚ'ér zuì xǐhuan Měirényú biǎoyǎn le, kěxī jīntiān de piào yǐjīng màiwán le, yì zhāng yě méi shèng.","en":"My daughter loves the mermaid show most of all, but unfortunately today's tickets are sold out — not a single one left."},{"sp":"王经理","s":"m","zh":"别着急，刚才广播里说下午四点还有一次表演，我去问问。","py":"Bié zháojí, gāngcái guǎngbō lǐ shuō xiàwǔ sì diǎn hái yǒu yí cì biǎoyǎn, wǒ qù wènwen.","en":"Don't worry — the announcement just said there's another show at four this afternoon. I'll go and ask."},{"sp":"刘芳","s":"f","zh":"太好了！我先去把她抱过来，她在那边已经看了半个小时了，仍然不想走。","py":"Tài hǎo le! Wǒ xiān qù bǎ tā bào guolai, tā zài nàbiān yǐjīng kànle bàn ge xiǎoshí le, réngrán bù xiǎng zǒu.","en":"Great! I'll go and carry her over first — she's been watching over there for half an hour and still doesn't want to leave."},{"sp":"王经理","s":"m","zh":"孩子喜欢海洋是好事，以后可以多带她来。","py":"Háizi xǐhuan hǎiyáng shì hǎoshì, yǐhòu kěyǐ duō dài tā lái.","en":"It's a good thing for a child to love the ocean — you can bring her more often."}]}]},{"n":18,"cn":"科技与世界","en":"Science, technology and the world","vocab":[{"w":"降落","p":"jiàngluò","pos":"v.","d":"to descend, to land"},{"w":"火","p":"huǒ","pos":"adj.","d":"hot, popular"},{"w":"作者","p":"zuòzhě","pos":"n.","d":"author"},{"w":"交通","p":"jiāotōng","pos":"n.","d":"traffic, communication"},{"w":"技术","p":"jìshù","pos":"n.","d":"technology"},{"w":"是否","p":"shìfǒu","pos":"adv.","d":"if, whether"},{"w":"秒","p":"miǎo","pos":"m.","d":"second, 1/60 minute"},{"w":"方式","p":"fāngshì","pos":"n.","d":"way, mode"},{"w":"受不了","p":"shòubùliǎo","pos":"v.","d":"cannot bear it"},{"w":"日记","p":"rìjì","pos":"n.","d":"diary, journal"},{"w":"安全","p":"ānquán","pos":"adj.","d":"safe, secure"},{"w":"密码","p":"mìmǎ","pos":"n.","d":"password"},{"w":"允许","p":"yǔnxǔ","pos":"v.","d":"allow; permit"},{"w":"座","p":"zuò","pos":"m.","d":"used for bridges, mountains, buildings, etc."},{"w":"桥","p":"qiáo","pos":"n.","d":"bridge"},{"w":"危险","p":"wēixiǎn","pos":"adj.","d":"dangerous"},{"w":"接着","p":"jiēzhe","pos":"adv.","d":"then, immediately after that"},{"w":"警察","p":"jǐngchá","pos":"n.","d":"police"},{"w":"抓","p":"zhuā","pos":"v.","d":"to catch, to arrest"},{"w":"咸","p":"xián","pos":"adj.","d":"salty"},{"w":"矿泉水","p":"kuàngquánshuǐ","pos":"n.","d":"mineral water"},{"w":"付款","p":"fùkuǎn","pos":"v.","d":"to pay a sum of money"},{"w":"举","p":"jǔ","pos":"v.","d":"to give, to enumerate"},{"w":"迷路","p":"mílù","pos":"v.","d":"to lose one's way"},{"w":"地址","p":"dìzhǐ","pos":"n.","d":"address"},{"w":"地点","p":"dìdiǎn","pos":"n.","d":"place, site"},{"w":"世纪","p":"shìjì","pos":"n.","d":"century"},{"w":"邮局","p":"yóujú","pos":"n.","d":"post office"},{"w":"收","p":"shōu","pos":"v.","d":"to receive"},{"w":"信封","p":"xìnfēng","pos":"n.","d":"envelope"},{"w":"网站","p":"wǎngzhàn","pos":"n.","d":"website"},{"w":"信息","p":"xìnxī","pos":"n.","d":"news, information"}],"proper":"","grammar":[{"t":"是否 — Whether (or not)","m":"是否 (shìfǒu) is a formal, written equivalent of 是不是 / 有没有 / 能不能. It goes before the verb or adjective: 是否 + V/Adj. It is common in notices, news and questions embedded in a sentence (不知道他是否同意). Do not add 吗 after a 是否 question, and do not use it before a noun alone.","ex":[["请告诉我们您是否参加明天的会议。","Please let us know whether you will attend tomorrow's meeting."],["我不知道这个办法是否有用，但是可以试一试。","I don't know whether this method works, but we can give it a try."],["进入网站以前，请先确认这个地址是否正确。","Before going to the website, please first check whether the address is correct."]]},{"t":"接着 — Then, next; to continue","m":"接着 (jiēzhe) as an adverb links actions in a sequence: 先 A，接着 B = first A, then (straight after) B. It can also be a verb meaning \"to continue / carry on\": 接着说、接着看. Compared with 然后, 接着 stresses that the second action follows immediately or continues without a break.","ex":[["他先给经理打了个电话，接着又发了一封电子邮件。","He first phoned the manager, and then straight away sent an email."],["休息十分钟，我们接着讨论。","Let's rest for ten minutes, then carry on with the discussion."],["你别停，接着说，后来发生了什么？","Don't stop — go on. What happened after that?"]]},{"t":"受不了 / V不了 — Can't stand; can't (manage to)","m":"受不了 (shòu bu liǎo) means \"can't bear / can't stand\": 我受不了这么热的天气, or Adj + 得 + 受不了 (热得受不了). It is a potential complement: V + 不了 means the action can't be done or completed (吃不了 = can't finish eating, 去不了 = can't go); the positive form is V + 得了 (受得了).","ex":[["这儿的夏天太热了，我真受不了。","Summers here are too hot — I really can't stand it."],["菜点得太多了，我们两个人吃不了。","We ordered too many dishes; the two of us can't finish them."],["他每天加班到很晚，你说他受得了吗？","He works overtime till late every day — do you think he can take it?"]]}],"ex":{"judge":[{"s":"现在用手机付款非常方便，买一瓶矿泉水也不用带现金。不过我奶奶仍然习惯用现金，她说手机付款不够安全。","st":"★ 奶奶喜欢用手机付款。","a":false,"en":"Paying by phone is very convenient now; you don't need cash even for a bottle of mineral water. But my grandma is still used to cash — she says phone payment isn't safe enough. / ★ Grandma likes paying by phone."},{"s":"这家网站上的信息很多，但是有些不一定正确。所以在网上看到一个消息以后，最好先判断一下它是否可信，再告诉别人。","st":"★ 网上的信息不一定都是对的。","a":true,"en":"This website has lots of information, but some of it isn't necessarily correct. So after seeing news online, it's best to judge whether it's trustworthy before telling others. / ★ Information online isn't always right."},{"s":"上个世纪，人们和远方的亲戚联系主要靠写信。一封信从北京寄到广州，常常要一个星期才能收到。现在发个电子邮件，几秒就到了。","st":"★ 以前寄信比现在发电子邮件快。","a":false,"en":"Last century, people kept in touch with distant relatives mainly by letter. A letter from Beijing to Guangzhou often took a week to arrive. Now an email arrives in a few seconds. / ★ Sending letters used to be faster than email is now."},{"s":"飞机马上就要降落了，请大家坐好，不要再站起来走动。在飞机停稳以前，不允许打开手机。","st":"★ 飞机快要降落了。","a":true,"en":"The plane is about to land; please sit properly and stop walking around. Mobile phones may not be switched on until the plane has come to a complete stop. / ★ The plane is about to land."},{"s":"我们城市新修了一座桥，桥修好以后，从城东到城西只要十分钟。以前交通很不方便，开车得一个小时。","st":"★ 新桥让交通更方便了。","a":true,"en":"Our city has built a new bridge; now it takes only ten minutes to get from the east side to the west. Before, transport was very inconvenient — driving took an hour. / ★ The new bridge has made transport more convenient."}],"listen":[{"dlg":["男：我的电脑打不开了，是不是密码错了？","女：你是不是又换密码了？好好儿想想。"],"q":"男的遇到了什么问题？","opts":["电脑打不开","手机丢了","找不到网站"],"a":0,"en":"M: My computer won't open — is the password wrong? W: Did you change your password again? Think carefully. Q: What problem does the man have?"},{"dlg":["女：这个汤怎么这么咸？","男：对不起，我可能放了两次盐，我给你倒杯水吧。"],"q":"这个汤怎么了？","opts":["太辣了","太咸了","太凉了"],"a":1,"en":"W: Why is this soup so salty? M: Sorry, I may have put salt in twice. Let me pour you a glass of water. Q: What's wrong with the soup?"},{"dlg":["男：喂，我好像迷路了，你家到底在哪儿？","女：你别动，把你那儿的地址发给我，我去接你。"],"q":"女的让男的做什么？","opts":["坐出租车","问警察","发地址给她"],"a":2,"en":"M: Hello, I seem to be lost — where exactly is your home? W: Stay put, send me your address and I'll come and get you. Q: What does the woman ask him to do?"},{"dlg":["女：昨天那个骗老人钱的人被抓住了吗？","男：抓住了，警察来得特别快，他还没跑出银行就被抓了。"],"q":"关于那个人，可以知道什么？","opts":["跑出了银行","被警察抓住了","还没找到"],"a":1,"en":"W: Was the man who cheated old people out of money yesterday caught? M: Yes, the police came really fast — he was caught before he even got out of the bank. Q: What do we know about him?"},{"dlg":["男：你写的这本书真火，网上到处都在说它。","女：我也没想到会这么受欢迎。","男：作者本人感觉怎么样？","女：很高兴，不过压力也很大，大家都在问我下一本什么时候写完。"],"q":"女的是做什么的？","opts":["警察","记者","作者"],"a":2,"en":"M: Your book is so popular — people are talking about it all over the internet. W: I didn't expect it to be so well received either. M: How does the author herself feel? W: Happy, but under pressure too; everyone asks when I'll finish the next one. Q: What is the woman?"}],"match":[{"q":"你给我举个例子吧，我还是不太明白。","r":"好，比如在超市买东西，不用带钱，用手机就能付款。"},{"q":"这里允许拍照吗？","r":"对不起，博物馆里不能拍照。"},{"q":"你每天都写日记吗？","r":"是的，从上小学起就开始写了，一天也没停过。"},{"q":"这么晚了，路上安全吗？","r":"放心吧，我打车回去，到家给你发短
