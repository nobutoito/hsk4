. Don't worry, let's look everywhere."}],"grammar":[{"q":"这本书（  ）我明白了很多做人的道理。","opts":["只要","使","往往","因此"],"a":1,"exp":"A 使 B + verb: the book made me understand a lot.","g":0},{"q":"（  ）明天天气好，我们就去海边玩儿。","opts":["只要","使","因此","往往"],"a":0,"exp":"只要……就…… — as long as the weather is good.","g":1},{"q":"你只要按时吃药，病（  ）会很快好起来。","opts":["才","就","都","也"],"a":1,"exp":"只要 pairs with 就 for the result.","g":1},{"q":"今天路上堵车，他（  ）迟到了半个小时。","opts":["只要","使","因此","往往"],"a":2,"exp":"因此 links reason and result.","g":2},{"q":"一个人在外面生活的时候，（  ）会特别想家。","opts":["使","只要","因此","往往"],"a":3,"exp":"往往 states a general tendency under a condition.","g":3},{"q":"她的笑总是（  ）身边的人觉得很愉快。","opts":["往往","因此","使","只要"],"a":2,"exp":"使 + person + feel: her smile makes people feel cheerful.","g":0}],"order":[{"parts":["这里离市中心有一段距离，","因此房子比较便宜，","很多年轻人都住在这儿。"],"en":"This area is some distance from the city centre, so housing is cheaper and lots of young people live here."},{"parts":["只要大家一起努力，","再大的困难","也能解决。"],"en":"As long as we work together, even the biggest difficulty can be solved."},{"parts":["每次回忆起小时候的生活，","他往往会想起奶奶做的饭，","那是他吃过的最好吃的饭。"],"en":"Whenever he recalls his childhood, he tends to think of his grandma's cooking — the best food he's ever had."}],"reading":[{"p":"王经理的女儿今年要去国外读书。离开家的前一天，她把家里所有的亲戚都请来吃饭。大家一起回忆了很多以前的事，既高兴又有点儿伤心。","q":"★ 关于王经理的女儿，可以知道：","opts":["她要出国读书","她刚从国外回来","她不喜欢亲戚"],"a":0,"en":"Manager Wang's daughter is going abroad to study this year. The day before leaving, she invited all the relatives to dinner. Everyone recalled old times, happy and a little sad. ★ She's going abroad to study."},{"p":"有的人觉得生活中没有什么美的东西，每天都一样无聊。其实只要你有一颗愉快的心，就会发现，路边的一朵小花、早上的阳光，都很美。","q":"★ 这段话主要想告诉我们：","opts":["生活很无聊","只有花是美的","美在于用心去发现"],"a":2,"en":"Some feel life has nothing beautiful and each day is equally dull. In fact, with a cheerful heart you'll find a small roadside flower or the morning sunshine beautiful. ★ Beauty is found by paying attention."},{"p":"现在很多人工作压力大，常常觉得很累。有医生说，每天抽出一点儿时间做自己喜欢的事，例如画画儿、唱歌、养花，这样能使人放松，心情也会变好。","q":"★ 医生认为做喜欢的事可以：","opts":["使人放松","提高收入","认识朋友"],"a":0,"en":"Many people are stressed and tired. Doctors suggest setting aside a little time each day for something you enjoy, like painting, singing or growing flowers; it relaxes you and lifts your mood. ★ It relaxes people."}],"write":[{"words":["他","成为了","一名","受欢迎的老师。"],"en":"He became an excellent teacher."},{"words":["这个","问题","缺少","科学的说明。"],"en":"This problem lacks a scientific explanation."},{"words":["我们","要","对生活","有积极的态度。"],"en":"We should have a positive attitude towards life."},{"words":["那个","师傅","的态度","非常好。"],"en":"That master/driver has a very good attitude."}],"hanzi":[{"s":"过年的时候，很多（  ）戚都来我家。","py":"qīn","a":"亲"},{"s":"下班的时候路上经常（  ）车。","py":"dǔ","a":"堵"},{"s":"他给我留下了很美好的回（  ）。","py":"yì","a":"忆"},{"s":"做这件事需要很大的耐（  ）。","py":"xīn","a":"心"}]},"tx":[{"t":"出租车上 · In a taxi","scene":"Mark takes a taxi to the embassy and chats with the driver during a traffic jam.","g":[1,3],"lines":[{"sp":"马克","s":"m","zh":"师傅，去大使馆。我十点要到，时间够吗？","py":"Shīfu, qù dàshǐguǎn. Wǒ shí diǎn yào dào, shíjiān gòu ma?","en":"To the embassy, please. I need to be there by ten — is there enough time?"},{"sp":"师傅","s":"m","zh":"放心吧，距离不远。只要前面那条路不堵车，二十分钟就到了。","py":"Fàngxīn ba, jùlí bù yuǎn. Zhǐyào qiánmiàn nà tiáo lù bù dǔchē, èrshí fēnzhōng jiù dào le.","en":"Don't worry, it's not far. As long as the road ahead isn't jammed, we'll be there in twenty minutes."},{"sp":"马克","s":"m","zh":"可是前面好像已经堵上了，车都不动了。","py":"Kěshì qiánmiàn hǎoxiàng yǐjīng dǔ shàng le, chē dōu bú dòng le.","en":"But it looks like it's jammed up ahead already — the cars aren't moving."},{"sp":"师傅","s":"m","zh":"这个时候往往是这样，大家都在上班的路上。别着急，我换一条小路走。","py":"Zhège shíhou wǎngwǎng shì zhèyàng, dàjiā dōu zài shàngbān de lù shang. Bié zháojí, wǒ huàn yì tiáo xiǎo lù zǒu.","en":"It's usually like this at this hour — everyone's on their way to work. Don't worry, I'll take a side street."},{"sp":"马克","s":"m","zh":"谢谢您！您开车这么多年，每天都堵车，不觉得烦吗？","py":"Xièxie nín! Nín kāichē zhème duō nián, měi tiān dōu dǔchē, bù juéde fán ma?","en":"Thank you! You've driven for so many years with jams every day — doesn't it drive you crazy?"},{"sp":"师傅","s":"m","zh":"生气也没用。堵车的时候我就听听音乐，跟客人聊聊天，心情就好了。","py":"Shēngqì yě méi yòng. Dǔchē de shíhou wǒ jiù tīngting yīnyuè, gēn kèrén liáoliao tiān, xīnqíng jiù hǎo le.","en":"Getting angry doesn't help. In traffic I listen to music and chat with passengers, and then I feel fine."}]},{"t":"压力太大了 · Too much pressure","scene":"Liu Fang is stressed about work; Lin Xiaoyu cheers her up.","g":[0,2],"lines":[{"sp":"林小雨","s":"f","zh":"刘芳，你最近怎么总是不太高兴？发生什么事了？","py":"Liú Fāng, nǐ zuìjìn zěnme zǒngshì bú tài gāoxìng? Fāshēng shénme shì le?","en":"Liu Fang, why have you seemed so down lately? What happened?"},{"sp":"刘芳","s":"f","zh":"公司的工作越来越多，经理要求又高，压力太大了，我每天晚上都睡不好。","py":"Gōngsī de gōngzuò yuè lái yuè duō, jīnglǐ yāoqiú yòu gāo, yālì tài dà le, wǒ měi tiān wǎnshang dōu shuì bu hǎo.","en":"There's more and more work at the company and the manager's demands are high. The pressure is too much; I can't sleep well any night."},{"sp":"林小雨","s":"f","zh":"你别太着急了。给，吃块巧克力，甜的东西能使人心情好一点儿。","py":"Nǐ bié tài zháojí le. Gěi, chī kuài qiǎokèlì, tián de dōngxi néng shǐ rén xīnqíng hǎo yìdiǎnr.","en":"Don't get too worked up. Here, have some chocolate — sweet things can put you in a slightly better mood."},{"sp":"刘芳","s":"f","zh":"谢谢。我也知道这样不行，可是不知道怎么放松。","py":"Xièxie. Wǒ yě zhīdào zhèyàng bùxíng, kěshì bù zhīdào zěnme fàngsōng.","en":"Thanks. I know this isn't OK, but I don't know how to relax."},{"sp":"林小雨","s":"f","zh":"这个周末我们去山上走走吧。那里景色很美，空气也好，因此每次去我都觉得特别愉快。","py":"Zhège zhōumò wǒmen qù shān shang zǒuzou ba. Nàlǐ jǐngsè hěn měi, kōngqì yě hǎo, yīncǐ měi cì qù wǒ dōu juéde tèbié yúkuài.","en":"Let's go walking in the hills this weekend. The scenery is beautiful and the air is good there, so I always feel really cheerful when I go."},{"sp":"刘芳","s":"f","zh":"好啊！我已经很久没出去玩儿了。","py":"Hǎo a! Wǒ yǐjīng hěn jiǔ méi chūqu wánr le.","en":"Sounds great! I haven't been out for fun in ages."}]},{"t":"家里的亲戚 · Visiting relatives","scene":"Zhang Wei tells his mother about memories while helping her prepare for relatives coming at New Year.","g":[1,3],"lines":[{"sp":"妈妈","s":"f","zh":"小伟，明天亲戚们都要来，你帮我把客人的房间打扫一下。","py":"Xiǎo Wěi, míngtiān qīnqimen dōu yào lái, nǐ bāng wǒ bǎ kèrén de fángjiān dǎsǎo yíxià.","en":"Xiao Wei, all the relatives are coming tomorrow — help me clean the guest room."},{"sp":"张伟","s":"m","zh":"好。妈，我刚才找到了一张旧照片，是我小时候跟姐姐在河边玩儿的。","py":"Hǎo. Mā, wǒ gāngcái zhǎodàole yì zhāng jiù zhàopiàn, shì wǒ xiǎoshíhou gēn jiějie zài hé biān wánr de.","en":"OK. Mum, I just found an old photo of me playing by the river with my sister as a kid."},{"sp":"妈妈","s":"f","zh":"我记得那天你掉到了水里，回家以后哭了一个晚上。","py":"Wǒ jìde nà tiān nǐ diào dàole shuǐ li, huí jiā yǐhòu kūle yí gè wǎnshang.","en":"I remember that day you fell into the water and cried all evening after we got home."},{"sp":"张伟","s":"m","zh":"现在回忆起来，那些伤心的事也变成了很有意思的故事。","py":"Xiànzài huíyì qǐlai, nàxiē shāngxīn de shì yě biànchéngle hěn yǒu yìsi de gùshi.","en":"Looking back now, even those sad moments have become fun stories."},{"sp":"妈妈","s":"f","zh":"是啊，人老了往往特别爱想过去的事。只要一家人能在一起，就是最幸福的。","py":"Shì a, rén lǎole wǎngwǎng tèbié ài xiǎng guòqù de shì. Zhǐyào yìjiā rén néng zài yìqǐ, jiù shì zuì xìngfú de.","en":"Yes, as people get older they tend to love thinking about the past. As long as the family can be together, that's the greatest happiness."},{"sp":"张伟","s":"m","zh":"那明天我把这张照片给姐姐看，她肯定会笑。","py":"Nà míngtiān wǒ bǎ zhè zhāng zhàopiàn gěi jiějie kàn, tā kěndìng huì xiào.","en":"Then tomorrow I'll show this photo to my sister — she's bound to laugh."}]},{"t":"电视节目：发现美 · TV show: finding beauty","scene":"A TV reporter talks with Teacher Chen about finding beauty in daily life.","g":[0,2,3],"lines":[{"sp":"记者","s":"m","zh":"陈老师，很多人说现在的生活太忙了，到处都是高楼和车，一点儿也不美。您怎么看？","py":"Chén lǎoshī, hěn duō rén shuō xiànzài de shēnghuó tài máng le, dàochù dōu shì gāo lóu hé chē, yìdiǎnr yě bù měi. Nín zěnme kàn?","en":"Ms Chen, many people say life today is too busy — tall buildings and cars everywhere, nothing beautiful. What do you think?"},{"sp":"陈老师","s":"f","zh":"我觉得生活中从来不缺少美，缺少的是发现美的耐心。","py":"Wǒ juéde shēnghuó zhōng cónglái bù quēshǎo měi, quēshǎo de shì fāxiàn měi de nàixīn.","en":"I think life never lacks beauty; what's missing is the patience to discover it."},{"sp":"记者","s":"m","zh":"那您觉得美在哪儿呢？","py":"Nà nín juéde měi zài nǎr ne?","en":"So where do you think the beauty is?"},{"sp":"陈老师","s":"f","zh":"例如每天早上的阳光、路边的小花，还有邻居的一句问好，都能使我们的一天变得不一样。","py":"Lìrú měi tiān zǎoshang de yángguāng, lù biān de xiǎo huā, háiyǒu línjū de yí jù wènhǎo, dōu néng shǐ wǒmen de yì tiān biàn de bù yíyàng.","en":"For instance the morning sunshine, little flowers by the road, a neighbour's greeting — all of these can make our day different."},{"sp":"记者","s":"m","zh":"有科学研究证明，态度积极的人往往更健康，是这样吗？","py":"Yǒu kēxué yánjiū zhèngmíng, tàidù jījí de rén wǎngwǎng gèng jiànkāng, shì zhèyàng ma?","en":"Scientific research has shown that people with a positive attitude tend to be healthier — is that right?"},{"sp":"陈老师","s":"f","zh":"对。我们每个人的生命都只有一次，因此要做一个阳光的人，愉快地过好每一天。","py":"Duì. Wǒmen měi gè rén de shēngmìng dōu zhǐ yǒu yí cì, yīncǐ yào zuò yí gè yángguāng de rén, yúkuài de guòhǎo měi yì tiān.","en":"Yes. Each of us has only one life, so we should be sunny people and live every day happily."},{"sp":"记者","s":"m","zh":"谢谢陈老师。希望大家都能成为生活中发现美的人。","py":"Xièxie Chén lǎoshī. Xīwàng dàjiā dōu néng chéngwéi shēnghuó zhōng fāxiàn měi de rén.","en":"Thank you, Ms Chen. We hope everyone can become people who find beauty in life."}]}]},{"n":9,"cn":"阳光总在风雨后","en":"The sun will shine again after the storm","vocab":[{"w":"饼干","p":"bǐnggān","pos":"n.","d":"biscuit"},{"w":"难道","p":"nándào","pos":"adv.","d":"used in a rhetorical question for emphasis"},{"w":"得","p":"děi","pos":"mod.","d":"must, have to"},{"w":"坚持","p":"jiānchí","pos":"v.","d":"to insist, to persist"},{"w":"放弃","p":"fàngqì","pos":"v.","d":"to give up"},{"w":"主意","p":"zhǔyi","pos":"n.","d":"idea, plan"},{"w":"网球","p":"wǎngqiú","pos":"n.","d":"tennis"},{"w":"国际","p":"guójì","pos":"n.","d":"international"},{"w":"轻松","p":"qīngsōng","pos":"adj.","d":"relaxed, effortless"},{"w":"赢","p":"yíng","pos":"v.","d":"to win"},{"w":"随便","p":"suíbiàn","pos":"adj.","d":"casual, at random"},{"w":"汗","p":"hàn","pos":"n.","d":"sweat, perspiration"},{"w":"通过","p":"tōngguò","pos":"prep.","d":"through, by means of"},{"w":"篇","p":"piān","pos":"m.","d":"used for writings, papers or articles"},{"w":"作家","p":"zuòjiā","pos":"n.","d":"writer"},{"w":"当时","p":"dāngshí","pos":"n.","d":"then, at that time"},{"w":"可是","p":"kěshì","pos":"conj.","d":"but, however"},{"w":"正确","p":"zhèngquè","pos":"adj.","d":"right, correct"},{"w":"理想","p":"lǐxiǎng","pos":"n.","d":"ideal"},{"w":"勇敢","p":"yǒnggǎn","pos":"adj.","d":"brave, courageous"},{"w":"结果","p":"jiéguǒ","pos":"n.","d":"result"},{"w":"失败","p":"shībài","pos":"v.","d":"to fail"},{"w":"过程","p":"guòchéng","pos":"n.","d":"course, process"},{"w":"至少","p":"zhìshǎo","pos":"adv.","d":"at least"},{"w":"总结","p":"zǒngjié","pos":"v.","d":"to sum up"},{"w":"取","p":"qǔ","pos":"v.","d":"to gain, to seek"},{"w":"经历","p":"jīnglì","pos":"v.","d":"to go through, to experience"},{"w":"许多","p":"xǔduō","pos":"num.","d":"many, plenty of"},{"w":"区别","p":"qūbié","pos":"n.","d":"difference, distinction"},{"w":"暂时","p":"zànshí","pos":"n.","d":"temporary, for the time being"},{"w":"面对","p":"miànduì","pos":"v.","d":"to face, to confront"}],"proper":"爱迪生 (Àidíshēng), 王红 (WángHóng)","grammar":[{"t":"难道……（吗） — Rhetorical question: \"Surely … / Don't tell me …\"","m":"难道 turns a question into a rhetorical one: the speaker already believes the opposite of what is literally asked and uses it to show surprise, doubt or reproach. It stands before or after the subject and the sentence usually ends with 吗. 难道你不知道吗？ really means 'Surely you know!'.","ex":[["你已经练了三年网球了，难道还怕比不过他吗？","You've practised tennis for three years — surely you're not afraid you can't beat him?"],["这么简单的问题，难道你也不会回答吗？","Don't tell me you can't even answer such an easy question?"],["难道我们就这样放弃吗？","Are we really just going to give up like this?"]]},{"t":"得（děi）+ V — must, have to","m":"In spoken Chinese 得, pronounced děi, is a modal verb meaning 'must / need to' and goes directly before the verb (phrase). Its negative is not 不得 but 不用 or 不必 ('don't need to'). Do not confuse it with the structural particle 得 (de) that follows a verb, as in 跑得很快.","ex":[["比赛下午两点开始，我们得早点儿出门。","The match starts at two in the afternoon, so we have to set off a bit early."],["你感冒了，得多喝水，多休息。","You've caught a cold — you need to drink more water and rest more."],["这篇小说下个星期就要给大家看，我这几天得写完。","This story is to be shown to everyone next week, so I have to finish it in the next few days."]]},{"t":"至少 — at least","m":"至少 is an adverb meaning 'at least / at the minimum'. It comes before a number phrase, before the verb, or at the start of a clause. It can also introduce a minimum comfort: even if things went badly, 'at least' something good remains.","ex":[["从这儿到机场至少要一个小时。","It takes at least an hour to get from here to the airport."],["学汉语，每天至少要练习半个小时。","When learning Chinese you should practise for at least half an hour a day."],["虽然这次比赛没赢，但至少我们努力过了。","Although we didn't win the match this time, at least we tried our best."]]},{"t":"通过 + method — through, by means of","m":"As a preposition, 通过 introduces the means, method, person or experience through which a result is reached: 通过 + noun phrase，+ result. The 通过 phrase usually stands at the start of the sentence or before the verb. As a verb, 通过 also means 'to pass' (an exam, a test).","ex":[["通过这次比赛，我认识了许多新朋友。","Through this competition I got to know lots of new friends."],["他是通过朋友介绍找到这份工作的。","He found this job through a friend's introduction."],["通过一年的努力，她终于通过了考试。","After a year of hard work she finally passed the exam."]]}],"ex":{"judge":[{"s":"王红小时候身体不太好，父母让她多运动。她选择了网球，每天放学后都去练习，常常打得满头大汗。现在她已经参加过好几次国际比赛了。","st":"★ 王红参加过国际网球比赛。","a":true,"en":"As a child Wang Hong was not very healthy, so her parents told her to exercise more. She chose tennis and practised every day after school, often until she was dripping with sweat. She has now taken part in several international competitions. / ★ Wang Hong has played in international tennis competitions."},{"s":"我觉得失败并不可怕，可怕的是失败以后就放弃。每个成功的人都经历过许多失败。","st":"★ 说话人认为成功的人很少失败。","a":false,"en":"I don't think failure is frightening; what's frightening is giving up after failing. Every successful person has been through many failures. / ★ The speaker thinks successful people rarely fail."},{"s":"这本小说的作家当时只有十九岁，可是他写得非常好，很多人都不相信这是一个年轻人写的。","st":"★ 作家写这本小说时年纪已经很大了。","a":false,"en":"The author of this novel was only nineteen at the time, but he wrote extremely well; many people couldn't believe a young person had written it. / ★ The author was already old when he wrote the novel."},{"s":"考试结果虽然很重要，但是我觉得学习的过程更重要。通过学习，我知道了自己哪些地方还不够好，这比成绩更有用。","st":"★ 说话人觉得学习过程比考试结果更重要。","a":true,"en":"Exam results are important, but I think the learning process matters more. Through studying I find out where I'm still not good enough, which is more useful than the grade. / ★ The speaker thinks the learning process matters more than the exam result."},{"s":"这只是一个暂时的办法，等王经理下个星期回来，我们再一起想一个更好的主意。","st":"★ 他们已经想到了最好的办法。","a":false,"en":"This is only a temporary solution; when Manager Wang is back next week we'll come up with a better idea together. / ★ They have already found the best solution."}],"listen":[{"dlg":["女：你怎么出了这么多汗？","男：我刚跟张伟打了两个小时网球，累死了。"],"q":"男的刚才做什么了？","opts":["打网球","跑步","游泳"],"a":0,"en":"W: Why are you so sweaty? M: I just played tennis with Zhang Wei for two hours — I'm exhausted. Q: What did the man just do?"},{"dlg":["男：这次比赛又没赢，我真想放弃。","女：你忘了自己最开始的理想了吗？再坚持一下吧。"],"q":"女的是什么意思？","opts":["应该放弃","应该再努力一下","比赛很轻松"],"a":1,"en":"M: We didn't win the match again; I really want to give up. W: Have you forgotten the dream  sum up the lessons and then keep working hard."}],"reading":[{"p":"很多人只关心结果，觉得赢了就是成功，没赢就是失败。其实，过程也很重要。在过程中，我们会经历许多事情，学到许多东西。即使最后没有赢，这段经历也是很有用的。","q":"★ 根据这段话，可以知道：","opts":["结果比过程重要","过程也很重要","没赢就应该放弃"],"a":1,"en":"Many people only care about results: winning is success, losing is failure. In fact the process matters too. Along the way we experience and learn many things. Even if we don't win in the end, the experience is still useful."},{"p":"王红是一名网球运动员。刚开始打国际比赛的时候，她总是赢不了，心里非常难过。可是她没有放弃，每天都比别人多练两个小时。三年以后，她终于赢了一场重要的国际比赛。","q":"★ 关于王红，可以知道：","opts":["王红一开始就赢了很多比赛","王红后来放弃了网球","王红练得比别人多"],"a":2,"en":"Wang Hong is a tennis player. When she first played international matches she always lost and felt very sad. But she didn't give up and practised two hours more than others every day. Three years later she finally won an important international match."},{"p":"我是一个很随便的人，吃饭随便，穿衣服也随便。可是在工作上，我从来不随便。我觉得工作的时候一定要认真，因为一个小错就可能带来很大的麻烦。","q":"★ 关于说话人，可以知道：","opts":["说话人工作很认真","说话人对什么都很随便","说话人每天都穿得很正式"],"a":0,"en":"I'm a very easy-going person about food and clothes. But at work I'm never casual. I think you must be careful at work, because one small mistake can cause big trouble."},{"p":"暂时的困难并不可怕。我刚来中国的时候，一句汉语也不会说，当时生活很不方便。可是通过一年的学习，现在我已经能跟中国朋友轻松地聊天了。","q":"★ 这段话主要想告诉我们：","opts":["说话人现在还不会说汉语","说话人刚来中国时生活很方便","说话人的汉语进步了很多"],"a":2,"en":"Temporary difficulties aren't scary. When I first came to China I couldn't say a sentence of Chinese and life was inconvenient. But after a year of study I can now chat easily with Chinese friends."}],"write":[{"words":["我们","至少","得","等他","半个小时。"],"en":"We have to wait for him for at least half an hour."},{"words":["难道","你","不想","赢吗？"],"en":"Don't you want to win?"},{"words":["这篇小说","是","一位年轻作家","写的。"],"en":"This novel was written by a young writer."},{"words":["他通过","努力","考上了","理想的大学。"],"en":"Through hard work he got into the university of his dreams."},{"words":["你","不应该","这么容易","就放弃。"],"en":"You shouldn't give up so easily."}],"hanzi":[{"s":"我们必须坚（  ）到最后。","py":"chí","a":"持"},{"s":"他打完球，出了一身（  ）。","py":"hàn","a":"汗"},{"s":"这次比赛我们一定要（  ）！","py":"yíng","a":"赢"},{"s":"她写了一（  ）关于爸爸的小说。","py":"piān","a":"篇"},{"s":"他是一个很勇（  ）的孩子。","py":"gǎn","a":"敢"}]},"rv":{"judge":[{"s":"刘芳以前很怕在很多人面前说话。为了改变自己，她每天都对着镜子练习。虽然第一次在大家面前讲话时她紧张得出了很多汗，但是她坚持了下来。","st":"★ 刘芳一直都不敢在别人面前说话。","a":false,"en":"Liu Fang used to be scared of speaking in front of many people. To change herself she practised in front of a mirror every day. The first time she spoke in front of everyone she sweated from nerves, but she kept at it. / ★ Liu Fang never dared to speak in front of others."},{"s":"这家饼干店是两个年轻人开的。刚开始的时候，生意不太好，可是他们一直没放弃，现在店里每天都有许多客人。","st":"★ 饼干店现在生意很好。","a":true,"en":"This biscuit shop was opened by two young people. At first business was poor, but they never gave up, and now the shop has lots of customers every day. / ★ The biscuit shop is doing well now."},{"s":"马克说，刚开始学汉语的时候，他觉得汉字特别难，好几次都想放弃。可是现在他已经能看懂中文报纸了。","st":"★ 马克现在还看不懂中文报纸。","a":false,"en":"Mark says that when he started learning Chinese he found characters especially hard and nearly gave up several times. But now he can read Chinese newspapers. / ★ Mark still can't read Chinese newspapers."},{"s":"下个月我们公司要开一个国际会议，到时候会有许多外国客人来参加，所以大家这个月都得加班。","st":"★ 这个月公司的人工作会比较忙。","a":true,"en":"Next month our company is holding an international conference with many foreign guests, so everyone has to work overtime this month. / ★ The staff will be fairly busy this month."}],"listen":[{"dlg":["男：你觉得这个主意怎么样？","女：我觉得不太好，至少得先看看经理怎么说吧。"],"q":"女的觉得应该怎么做？","opts":["马上去做","先问问经理","放弃这个主意"],"a":1,"en":"M: What do you think of this idea? W: Not great — at least we should first see what the manager says. Q: What does the woman think they should do?"},{"dlg":["女：你怎么不吃了？","男：我刚吃了很多饼干，现在一点儿也不饿。"],"q":"男的为什么不吃了？","opts":["他吃过饼干了","饭不好吃","他身体不舒服"],"a":0,"en":"W: Why have you stopped eating? M: I just ate lots of biscuits; I'm not hungry at all. Q: Why did the man stop eating?"},{"dlg":["男：听说你们昨天的网球比赛赢了？","女：赢了，可是赢得一点儿也不轻松。","男：比赛时间长吗？","女：很长，我们打了三个多小时。"],"q":"关于比赛，可以知道什么？","opts":["她们没赢","比赛很轻松","比赛时间很长"],"a":2,"en":"M: I heard you won yesterday's tennis match? W: We did, but it wasn't easy at all. M: Was it long? W: Very — over three hours. Q: What do we know about the match?"},{"dlg":["女：你当时为什么选择当作家？","男：因为我从小就喜欢看书，也喜欢写东西。"],"q":"男的是做什么的？","opts":["老师","作家","记者"],"a":1,"en":"W: Why did you choose to become a writer back then? M: Because I've loved reading and writing since I was little. Q: What is the man's job?"}],"fill":[{"s":"只要还有一点儿希望，我们就不能（  ）。","a":"放弃","en":"As long as there's still a little hope, we can't give up."},{"s":"这次的题很简单，他很（  ）地拿到了第一名。","a":"轻松","en":"The questions were easy this time; he took first place effortlessly."},{"s":"这个城市有（  ）有名的老房子，每年都有很多人来这儿玩。","a":"许多","en":"This city has many famous old houses, and lots of people come to visit every year."},{"s":"我还记得，（  ）我们都只有十岁，每天一起去上学。","a":"当时","en":"I still remember — back then we were both only ten and went to school together every day."},{"s":"A：你的电脑什么时候能修好？  B：要等几天，你（  ）先用我的吧。","a":"暂时","en":"A: When will your computer be fixed? B: It'll take a few days; use mine for the time being."},{"s":"A：要是遇到解决不了的问题怎么办？  B：不要怕，要勇敢地（  ）它。","a":"面对","en":"A: What if I meet a problem I can't solve? B: Don't be afraid; face it bravely."}],"grammar":[{"q":"你已经三十岁了，（  ）还要让父母帮你做饭吗？","opts":["至少","通过","难道","当时"],"a":2,"exp":"难道…吗 is a rhetorical question showing disapproval.","g":0},{"q":"飞机八点起飞，我们六点（  ）出门。","opts":["得","地","的","了"],"a":0,"exp":"得 (děi) + verb = must, have to.","g":1},{"q":"这本书很好，你（  ）应该看两次。","opts":["难道","通过","至少","可是"],"a":2,"exp":"至少 = at least, placed before the verb phrase.","g":2},{"q":"（  ）老师的介绍，我认识了现在的女朋友。","opts":["关于","除了","对","通过"],"a":3,"exp":"通过 introduces the channel (the teacher's introduction) that led to the result.","g":3},{"q":"比赛虽然没赢，但是我们（  ）学到了很多东西。","opts":["难道","至少","通过","随便"],"a":1,"exp":"至少 introduces a minimum comfort: at least we learned a lot.","g":2},{"q":"这件事太重要了，我（  ）自己去一次。","opts":["地","得","的","着"],"a":1,"exp":"得 (děi) before the verb phrase means 'have to'.","g":1}],"order":[{"parts":["我第一次参加国际比赛的时候，","紧张得一直出汗，","结果很快就失败了。"],"en":"The first time I took part in an international competition I was so nervous I kept sweating, and I lost very quickly."},{"parts":["这道题看起来很简单，","可是要真正做对，","并不容易。"],"en":"This question looks simple, but getting it truly right isn't easy."},{"parts":["学外语没有什么特别的好办法，","只有每天坚持练习，","才能慢慢进步。"],"en":"There's no special trick to learning a foreign language; only by practising every day can you slowly improve."}],"reading":[{"p":"很多人以为当作家很轻松，每天在家写写东西就行了。其实，写一篇好小说需要花很多时间。一位作家告诉我，他写一本小说至少要两三年，有时候写了一半，觉得不满意，就得从头再写。","q":"★ 根据这段话，可以知道：","opts":["当作家很轻松","写好小说很不容易","作家一年能写好几本小说"],"a":1,"en":"Many people think being a writer is easy — just write a bit at home every day. In fact a good story takes a long time. A writer told me a novel takes him at least two or three years, and sometimes, halfway through, he's unhappy with it and has to start again."},{"p":"有人说选择比努力更重要。我觉得这两者都很重要。如果选错了路，再努力也很难成功；可是如果选对了路却不努力，也不会有好的结果。","q":"★ 说话人认为：","opts":["选择比努力重要","努力比选择重要","选择和努力都很重要"],"a":2,"en":"Some say choice matters more than effort. I think both matter. If you choose the wrong road, no amount of effort will easily bring success; but if you choose the right road and don't work hard, you won't get a good result either."},{"p":"张伟以前只要遇到一点儿困难就想放弃。去年他开始跑步，第一次只跑了五分钟就累得不行。可是他坚持了下来，现在他每天能跑一个小时，人也变得更勇敢了。","q":"★ 根据这段话，可以知道：","opts":["张伟现在每天能跑一个小时","张伟去年已经能跑一个小时","张伟跑了一次就放弃了"],"a":0,"en":"Zhang Wei used to want to quit at the first difficulty. Last year he started running; the first time he was exhausted after five minutes. But he kept going, and now he can run for an hour every day and has become braver too."}],"write":[{"words":["这次","失败","对他","的影响很大。"],"en":"This failure had a big influence on him."},{"words":["你","得","把这件事","告诉她。"],"en":"You have to tell her about this."},{"words":["她","已经","坚持","跑步","五年了。"],"en":"She has kept up running for five years."},{"words":["我们","暂时","还不能","回答这个问题。"],"en":"We can't answer this question for the time being."}],"hanzi":[{"s":"这个周末我们去打网（  ）吧。","py":"qiú","a":"球"},{"s":"他是一个国（  ）有名的作家。","py":"jì","a":"际"},{"s":"你还记得当（  ）的情况吗？","py":"shí","a":"时"},{"s":"我想先总（  ）一下今年的工作。","py":"jié","a":"结"}]},"tx":[{"t":"网球场边 · Beside the tennis court","scene":"Zhang Wei finds Mark exhausted after losing two tennis matches and cheers him up.","g":[0,1],"lines":[{"sp":"张伟","s":"m","zh":"马克，你怎么满头大汗？刚打完网球吗？","py":"Mǎkè, nǐ zěnme mǎn tóu dà hàn? Gāng dǎ wán wǎngqiú ma?","en":"Mark, why are you dripping with sweat? Did you just finish playing tennis?"},{"sp":"马克","s":"m","zh":"是啊，我跟一个朋友打了两场，一场也没赢。","py":"Shì a, wǒ gēn yí gè péngyou dǎ le liǎng chǎng, yì chǎng yě méi yíng.","en":"Yes, I played two matches against a friend and didn't win a single one."},{"sp":"张伟","s":"m","zh":"别难过，你才学了三个月，能坚持下来已经很不错了。","py":"Bié nánguò, nǐ cái xué le sān gè yuè, néng jiānchí xiàlai yǐjīng hěn búcuò le.","en":"Don't be upset. You've only been learning for three months; sticking with it is already pretty good."},{"sp":"马克","s":"m","zh":"可是我总是赢不了，有时候真想放弃。","py":"Kěshì wǒ zǒngshì shū, yǒu shíhou zhēn xiǎng fàngqì.","en":"But I can never win. Sometimes I really want to give up."},{"sp":"张伟","s":"m","zh":"难道你忘了当时为什么要学网球吗？你说想参加学校的国际学生比赛。","py":"Nándào nǐ wàng le dāngshí wèi shénme yào xué wǎngqiú ma? Nǐ shuō xiǎng cānjiā xuéxiào de guójì xuésheng bǐsài.","en":"Have you forgotten why you wanted to learn tennis in the first place? You said you wanted to enter the school's international students' tournament."},{"sp":"马克","s":"m","zh":"没忘。好吧，那我得再练半年，到时候再说。","py":"Méi wàng. Hǎo ba, nà wǒ děi zài liàn bàn nián, dào shíhou zài shuō.","en":"I haven't forgotten. All right, then I'll have to practise another six months and see how it goes."},{"sp":"张伟","s":"m","zh":"这就对了。来，先吃块饼干，休息一下。","py":"Zhè jiù duì le. Lái, xiān chī kuài bǐnggān, xiūxi yíxià.","en":"That's the spirit. Here, have a biscuit first and take a rest."}]},{"t":"电台访问 · A radio interview","scene":"A radio journalist interviews a writer about the failures behind his success.","g":[2,3],"lines":[{"sp":"记者","s":"f","zh":"听说您的第一篇小说失败过许多次，是真的吗？","py":"Tīngshuō nín de dì-yī piān xiǎoshuō shībài guo xǔduō cì, shì zhēn de ma?","en":"I hear your first story failed many times — is that true?"},{"sp":"作家","s":"m","zh":"是真的。当时我写的东西没有人愿意看，我自己也觉得写得不好。","py":"Shì zhēn de. Dāngshí wǒ xiě de dōngxi méiyǒu rén yuànyì kàn, wǒ zìjǐ yě juéde xiě de bù hǎo.","en":"It's true. Back then nobody wanted to read what I wrote, and I didn't think it was any good either."},{"sp":"记者","s":"f","zh":"那您是怎么面对这些失败的？","py":"Nà nín shì zěnme miànduì zhèxiē shībài de?","en":"So how did you face those failures?"},{"sp":"作家","s":"m","zh":"我觉得失败只是暂时的。每次失败以后，我都会认真总结，看看问题在哪儿。","py":"Wǒ juéde shībài zhǐ shì zànshí de. Měi cì shībài yǐhòu, wǒ dōu huì rènzhēn zǒngjié, kànkan wèntí zài nǎr.","en":"I think failure is only temporary. After each failure I carefully took stock and looked for where the problem was."},{"sp":"记者","s":"f","zh":"您觉得成功的作家和普通人有什么区别？","py":"Nín juéde chénggōng de zuòjiā hé pǔtōng rén yǒu shénme qūbié?","en":"What do you think is the difference between a successful writer and an ordinary person?"},{"sp":"作家","s":"m","zh":"区别不大。我只是至少多坚持了几年，通过每天写一点儿，才取得了今天的成绩。","py":"Qūbié bú dà. Wǒ zhǐ shì zhìshǎo duō jiānchí le jǐ nián, tōngguò měi tiān xiě yìdiǎnr, cái qǔdé le jīntiān de chéngjì.","en":"Not much. I just held on for at least a few more years, and by writing a little every day I eventually got where I am today."}]},{"t":"宿舍里 · In the dorm","scene":"Lin Xiaoyu comforts Liu Fang after a disappointing exam and suggests a study plan.","g":[1],"lines":[{"sp":"林小雨","s":"f","zh":"刘芳，这次考试的结果出来了吗？","py":"Liú Fāng, zhè cì kǎoshì de jiéguǒ chūlai le ma?","en":"Liu Fang, are this exam's results out yet?"},{"sp":"刘芳","s":"f","zh":"出来了，我考得不太好，好几道题都没写正确。","py":"Chūlai le, wǒ kǎo de bú tài hǎo, hǎo jǐ dào tí dōu méi xiě zhèngquè.","en":"Yes. I didn't do very well — I got quite a few questions wrong."},{"sp":"林小雨","s":"f","zh":"别担心，一次考试说明不了什么，学习的过程更重要。","py":"Bié dānxīn, yí cì kǎoshì shuōmíng bù liǎo shénme, xuéxí de guòchéng gèng zhòngyào.","en":"Don't worry. One exam doesn't prove anything; the learning process matters more."},{"sp":"刘芳","s":"f","zh":"可是我的理想是去国外读书，成绩不好可不行。","py":"Kěshì wǒ de lǐxiǎng shì qù guówài dúshū, chéngjì bù hǎo kě bù xíng.","en":"But my dream is to study abroad. Bad grades just won't do."},{"sp":"林小雨","s":"f","zh":"那我们得想个好主意：以后每天晚上一起复习两个小时，怎么样？","py":"Nà wǒmen děi xiǎng gè hǎo zhǔyi: yǐhòu měi tiān wǎnshang yìqǐ fùxí liǎng gè xiǎoshí, zěnmeyàng?","en":"Then we need a good plan: from now on we review together for two hours every evening. How about it?"},{"sp":"刘芳","s":"f","zh":"好啊！有你帮忙，学习一定会轻松许多。","py":"Hǎo a! Yǒu nǐ bāngmáng, xuéxí yídìng huì qīngsōng xǔduō.","en":"Great! With your help, studying will be much easier."}]},{"t":"下班以后 · After work","scene":"A colleague asks Manager Wang about dinner plans after the team's project fell through.","g":[0],"lines":[{"sp":"同事","s":"f","zh":"王经理，晚上大家一起吃饭，您想吃什么？","py":"Wáng jīnglǐ, wǎnshang dàjiā yìqǐ chīfàn, nín xiǎng chī shénme?","en":"Manager Wang, we're all having dinner together tonight — what would you like to eat?"},{"sp":"王经理","s":"m","zh":"随便，你们定吧。这次的计划没有成功，大家心里一定都不太舒服。","py":"Suíbiàn, nǐmen dìng ba. Zhè cì de jìhuà méiyǒu chénggōng, dàjiā xīnli yídìng dōu bú tài shūfu.","en":"Anything, you decide. Our plan didn't work out this time; everyone must be feeling a bit down."},{"sp":"同事","s":"f","zh":"是啊，大家都有点儿难过。","py":"Shì a, dàjiā dōu yǒudiǎnr nánguò.","en":"Yes, everyone is a little sad."},{"sp":"王经理","s":"m","zh":"这样的经历谁都会有。失败了不要紧，重要的是要勇敢地面对。","py":"Zhèyàng de jīnglì shéi dōu huì yǒu. Shībài le bú yàojǐn, zhòngyào de shì yào yǒnggǎn de miànduì.","en":"Everyone goes through something like this. Failing doesn't matter; what matters is facing it bravely."},{"sp":"同事","s":"f","zh":"您说得对。难道我们会因为一次失败就放弃吗？","py":"Nín shuō de duì. Nándào wǒmen huì yīnwèi yí cì shībài jiù fàngqì ma?","en":"You're right. Are we really going to give up because of one failure?"},{"sp":"王经理","s":"m","zh":"当然不会。晚上吃饭的时候，我也想跟大家说说这些话。","py":"Dāngrán bú huì. Wǎnshang chīfàn de shíhou, wǒ yě xiǎng gēn dàjiā shuōshuo zhèxiē huà.","en":"Of course not. At dinner tonight I'd like to say a few words about this to everyone too."}]}]},{"n":10,"cn":"幸福的标准","en":"Standards of happiness","vocab":[{"w":"礼拜天","p":"lǐbàitiān","pos":"n.","d":"Sunday"},{"w":"空儿","p":"kònger","pos":"n.","d":"free time, spare time"},{"w":"母亲","p":"mǔqīn","pos":"n.","d":"mother"},{"w":"不过","p":"búguò","pos":"conj.","d":"but, yet"},{"w":"永远","p":"yǒngyuǎn","pos":"adv.","d":"forever"},{"w":"方向","p":"fāngxiàng","pos":"n.","d":"direction, orientation"},{"w":"优秀","p":"yōuxiù","pos":"adj.","d":"excellent, outstanding"},{"w":"硕士","p":"shuòshì","pos":"n.","d":"master, person who has a master's degree"},{"w":"翻译","p":"fānyì","pos":"n.","d":"translator, interpreter"},{"w":"确实","p":"quèshí","pos":"adv.","d":"truly, indeed"},{"w":"兴奋","p":"xīngfèn","pos":"adj.","d":"excited"},{"w":"拉","p":"lā","pos":"v.","d":"to pull, to drag"},{"w":"建议","p":"jiànyì","pos":"n.","d":"suggestion, advice"},{"w":"职业","p":"zhíyè","pos":"n.","d":"occupation, profession"},{"w":"关键","p":"guānjiàn","pos":"n.","d":"hinge, crux"},{"w":"将来","p":"jiānglái","pos":"n.","d":"future"},{"w":"发展","p":"fāzhǎn","pos":"v.","d":"to develop, to promote"},{"w":"躺","p":"tǎng","pos":"v.","d":"to lie (on one's back)"},{"w":"困","p":"kùn","pos":"adj.","d":"sleepy"},{"w":"经济","p":"jīngjì","pos":"n.","d":"economy"},{"w":"条件","p":"tiáojiàn","pos":"n.","d":"condition"},{"w":"富","p":"fù","pos":"adj.","d":"rich, wealthy"},{"w":"穷","p":"qióng","pos":"adj.","d":"poor, impoverished"},{"w":"等","p":"děng","pos":"part.","d":"etc., and so on"},{"w":"由于","p":"yóuyú","pos":"conj.","d":"because, since"},{"w":"比如","p":"bǐrú","pos":"v.","d":"for example, such as"},{"w":"橡皮","p":"xiàngpí","pos":"n.","d":"eraser, rubber"},{"w":"糖","p":"táng","pos":"n.","d":"sugar, candy"},{"w":"低","p":"dī","pos":"adj.","d":"low"},{"w":"答案","p":"dáàn","pos":"n.","d":"answer, key"}],"proper":"","grammar":[{"t":"由于……（所以/因此）…… — Because of / owing to …","m":"由于 introduces a cause and is more formal and written than 因为. The result clause often begins with 所以 or 因此, but note that 由于 can pair with 因此 while 因为 normally cannot. 由于 can also take a noun phrase: 由于天气的原因.","ex":[["由于经济条件不好，他高中毕业以后就去工作了。","Because his family's financial situation was poor, he went to work after finishing high school."],["由于大家的努力，这个计划提前完成了。","Thanks to everyone's efforts, the plan was completed ahead of schedule."],["由于天气的原因，今天的网球比赛改到明天了。","Owing to the weather, today's tennis match has been moved to tomorrow."]]},{"t":"不过 — but, however (softer than 但是)","m":"As a conjunction 不过 starts a second clause that adds a contrast, limitation or small reservation. It is milder and more colloquial than 但是/可是, often used to soften criticism. 不过 cannot be paired with 虽然 as tightly as 但是 is, and it usually follows a comma or starts a new sentence.","ex":[["这家饭馆的菜很好吃，不过价格有点儿高。","The food in this restaurant is very good, though the prices are a bit high."],["我很想跟你们去，不过礼拜天我得陪母亲去医院。","I'd really like to go with you, but on Sunday I have to take my mother to the hospital."],["你的办法不错，不过我们还得问问经理的建议。","Your idea is good, but we still need to ask the manager for his advice."]]},{"t":"比如……等 — for example …, etc.","m":"比如 (also 比如说) introduces one or more examples of something just mentioned. When several examples are listed, 等 (or 等等) is often added at the end to show the list is not complete. The examples usually follow a general statement, separated by a comma or colon.","ex":[["我喜欢运动，比如打网球、游泳、跑步等。","I like sport — for example tennis, swimming, running and so on."],["选择职业的时候要考虑很多方面，比如收入、兴趣和发展机会等。","When choosing a career you have to consider many aspects, such as income, interests and development opportunities."],["有些东西小孩子不能多吃，比如说糖。","There are some things small children shouldn't eat much of — sugar, for example."]]},{"t":"确实 — truly, indeed","m":"确实 is an adverb used before a verb or adjective to confirm that something really is the case, often agreeing with what was just said or admitting a fact. It is stronger than 真的 in tone and sounds slightly more formal; 确实如此 / 确实是这样 means 'that's really so'.","ex":[["你说得对，这道题确实很难。","You're right, this question really is hard."],["他确实很优秀，大学还没毕业就有好几家公司想要他。","He truly is outstanding — several companies wanted him before he even graduated."],["我确实忘了这件事，真对不起。","I really did forget about it. I'm very sorry."]]}],"ex":{"judge":[{"s":"很多人觉得钱越多越幸福。其实，富人不一定比穷人快乐。对我来说，幸福的关键是每天能做自己喜欢的事，和家人在一起。","st":"★ 说话人认为有钱就一定幸福。","a":false,"en":"Many people think the more money, the happier. Actually the rich aren't necessarily happier than the poor. For me the key to happiness is doing what I like every day and being with my family. / ★ The speaker thinks having money definitely brings happiness."},{"s":"刘芳是学翻译的，她是翻译专业的硕士，毕业以后在一家国际公司工作。","st":"★ 刘芳有硕士学位。","a":true,"en":"Liu Fang studied translation. She holds a master's in translation and after graduating went to work for an international company. / ★ Liu Fang has a master's degree."},{"s":"昨天晚上我看比赛看到两点，今天上课的时候特别困，老师讲的东西我一点儿也没听进去。","st":"★ 说话人今天上课很认真。","a":false,"en":"Last night I watched the match until two, so in class today I was terribly sleepy and didn't take in anything the teacher said. / ★ The speaker paid close attention in class today."},{"s":"听说下个月要去北京工作，张伟兴奋得一晚上都没睡着，一直在想到了北京以后要做什么。","st":"★ 张伟因为太兴奋了，没睡好觉。","a":true,"en":"Having heard he would go to work in Beijing next month, Zhang Wei was so excited he couldn't sleep all night, thinking about what he'd do once he got there. / ★ Zhang Wei didn't sleep well because he was too excited."},{"s":"选择职业的时候，不能只看收入高低，还要考虑自己的兴趣和将来的发展。","st":"★ 选择职业时，只需要考虑收入。","a":false,"en":"When choosing a career you can't look only at how high or low the income is; you must also consider your interests and future development. / ★ When choosing a career, you only need to consider income."}],"listen":[{"dlg":["男：这个礼拜天你有空儿吗？我们去看电影吧。","女：不行，礼拜天我得陪母亲去买东西。"],"q":"女的礼拜天要做什么？","opts":["看电影","陪母亲买东西","在家休息"],"a":1,"en":"M: Are you free this Sunday? Let's go to a film. W: Can't — on Sunday I have to go shopping with my mother. Q: What will the woman do on Sunday?"},{"dlg":["女：你怎么躺在沙发上？不舒服吗？","男：没有，我就是有点儿困，想休息一会儿。"],"q":"男的怎么了？","opts":["他生病了","他很饿","他有点儿困"],"a":2,"en":"W: Why are you lying on the sofa? Are you unwell? M: No, I'm just a bit sleepy and want to rest a while. Q: What's wrong with the man?"},{"dlg":["男：这道题的答案是什么？","女：我也不确定，你还是问问陈老师吧。","男：陈老师在办公室吗？","女：在，我刚才还看见她了。"],"q":"女的建议男的怎么做？","opts":["去问陈老师","自己再想想","上网找答案"],"a":0,"en":"M: What's the answer to this question? W: I'm not sure either; better ask Ms Chen. M: Is she in her office? W: Yes, I saw her just now. Q: What does the woman suggest?"},{"dlg":["女：小孩子吃太多糖对牙不好。","男：我知道，所以我每天只给他吃一块。"],"q":"他们在谈什么？","opts":["孩子的学习","孩子吃糖","孩子的衣服"],"a":1,"en":"W: Eating too much candy is bad for children's teeth. M: I know, so I only give him one piece a day. Q: What are they talking about?"},{"dlg":["男：你找到工作了吗？","女：找到了，在一家公司当翻译。","男：工资怎么样？","女：不太高，不过发展的机会很多。"],"q":"关于女的的工作，可以知道什么？","opts":["工资很高","她是老师","发展机会很多"],"a":2,"en":"M: Have you found a job? W: Yes, as a translator at a company. M: How's the pay? W: Not very high, but there are lots of chances to develop. Q: What do we know about the woman's job?"}],"match":[{"q":"你的橡皮能借我用一下吗？","r":"可以，你用吧，用完放在桌子上就行。"},{"q":"这个月的工资怎么这么低？","r":"由于你请了好几天假，所以少了一些。"},{"q":"你觉得什么样的人才算优秀？","r":"我觉得不仅要学习好，还要能帮助别人。"},{"q":"孩子拉着我的手不让我走。","r":"他太喜欢你了，你就多陪他玩一会儿吧。"},{"q":"你将来想做什么工作？","r":"我还没想好，不过我对经济方面挺感兴趣的。"}],"fill":[{"s":"她是我们班最（  ）的学生，每次考试都是第一名。","a":"优秀","en":"She is the most outstanding student in our class, first in every exam."},{"s":"看到多年没见的老朋友，他（  ）得说不出话来。","a":"兴奋","en":"Seeing his old friend after so many years, he was so excited he couldn't speak."},{"s":"在很多父母看来，医生和律师都是很好的（  ）。","a":"职业","en":"In many parents' e
