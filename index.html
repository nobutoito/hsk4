 charge; 被 would wrongly suggest a passive event.","g":1},{"q":"你说得太快了，能不能（  ）慢一点儿？","opts":["十分","非常","稍微","特别"],"a":2,"exp":"Only 稍微 combines with 一点儿 after the adjective to mean 'a little'.","g":2},{"q":"这本小说太有意思了，我从头到尾看了两（  ）。","opts":["趟","遍","口","件"],"a":1,"exp":"遍 counts an action done completely from beginning to end, e.g. reading a whole novel.","g":3},{"q":"请大家先把课文读一（  ），然后回答问题。","opts":["遍","张","双","条"],"a":0,"exp":"读一遍 = read once through; the others are noun measure words.","g":3},{"q":"（  ）手机越来越普遍，现在很少有人写信了。","opts":["对于","关于","随着","为了"],"a":2,"exp":"随着 links the spread of mobile phones with the gradual decline in letter writing.","g":0}],"order":[{"parts":["随着年龄越来越大，","爸爸也越来越喜欢京剧了，","几乎每个周末都去看演出。"],"en":"As he got older, Dad came to like Beijing opera more and more, and now goes to a show almost every weekend."},{"parts":["这次比赛由学校负责安排，","参加的同学只要按时到就可以了，","不用担心别的事情。"],"en":"The school is in charge of arranging this competition; participants just need to arrive on time and needn't worry about anything else."},{"parts":["虽然我学汉语的时间不长，","但是基础打得比较好，","所以现在已经能看懂一部分新闻了。"],"en":"Although I haven't studied Chinese long, my foundation is fairly solid, so I can already understand some of the news."},{"parts":["如果你觉得这个菜有点儿苦，","可以稍微加一点儿糖，","味道就会好很多。"],"en":"If you think this dish is a bit bitter, you can add a little sugar and it will taste much better."}],"reading":[{"p":"京剧已经有两百多年的历史了。它的表演有唱、有说、有动作，所以很多外国观众虽然听不懂，也会觉得很有趣。现在，不少年轻人也开始学习京剧，希望它能继续发展下去。","q":"★ 根据这段话，可以知道：","opts":["外国观众都听得懂京剧","京剧的表演内容很丰富","年轻人对京剧没有兴趣"],"a":1,"en":"Beijing opera has a history of over 200 years. Its performance includes singing, speaking and movement, so many foreign audience members find it fun even if they can't understand. Now many young people are learning it, hoping it will keep developing."},{"p":"很多人以为喝茶一定要用很热的水，其实这是一个错误的看法。比如绿茶，如果水太热，茶就会变苦，味道也不好。一般来说，用八十度上下的水就可以了。","q":"★ 关于喝绿茶，下面哪个正确？","opts":["水太热绿茶会变苦","水越热越好","绿茶本来就很苦"],"a":0,"en":"Many people think tea must be made with very hot water, but that's a mistaken idea. Green tea, for example, turns bitter if the water is too hot. Generally, water around 80 degrees is fine."},{"p":"我们学校每年都会进行一次调查，了解学生对学校餐厅的看法。今年的调查结果让学校有些吃惊：大部分学生觉得餐厅的饭菜还不错，但是希望晚上能开得稍微晚一点儿。","q":"★ 调查结果说明：","opts":["学生对餐厅很不满意","调查每年进行两次","学生希望餐厅晚上晚点儿关门"],"a":2,"en":"Our school surveys students' views of the school restaurant every year. This year's result surprised the school a little: most students think the food is fine but want it to stay open a bit later in the evening."},{"p":"在互联网上买东西已经十分普遍了。不管是衣服、书，还是家具，在网上都能买到，而且价格往往比商店里便宜。不过，网上购物也有缺点：你看不到真的东西，所以有时候买回来的和照片上的不一样。","q":"★ 这段话提到了网上购物的什么缺点？","opts":["东西可能和照片上的不一样","价格比商店里贵","买不到家具"],"a":0,"en":"Buying things online is very common now. Clothes, books or furniture can all be bought online, often cheaper than in shops. But online shopping has a drawback: you can't see the real thing, so sometimes what arrives differs from the photo."}],"write":[{"words":["这次演出","由","一位著名的京剧演员","表演。"],"en":"This show is performed by a famous Beijing opera actor."},{"words":["他","偶尔","会去餐厅","吃一顿好的。"],"en":"He occasionally goes to a restaurant for a good meal."},{"words":["我","已经","把这本书","看了两遍。"],"en":"I've already read this book twice."},{"words":["随着","互联网的发展，","网上购物","越来越普遍了。"],"en":"With the development of the Internet, online shopping is more and more common."},{"words":["这个消息","让","大家","十分吃惊。"],"en":"This news surprised everyone greatly."}],"hanzi":[{"s":"京剧演（  ）们正在准备晚上的表演。","py":"yuán","a":"员"},{"s":"这本书很（  ），我看了一个月才看完。","py":"hòu","a":"厚"},{"s":"他是来（  ）广东省的学生。","py":"zì","a":"自"},{"s":"这个问题我们下次再讨（  ）吧。","py":"lùn","a":"论"},{"s":"我的中文基（  ）不太好，还要多练习。","py":"chǔ","a":"础"}]},"rv":{"judge":[{"s":"弟弟学唱歌已经两年了，基础打得不错。最近他开始在周末去一家咖啡馆表演，每次都有不少人听。","st":"★ 弟弟刚开始学吉他。","a":false,"en":"My younger brother has been learning to sing for two years and has a good foundation. Recently he started singing at a café on weekends, and lots of people listen each time. / ★ He has just started learning to sing."},{"s":"医生说，人在晚上十一点以前睡觉是比较正常的。如果经常很晚才睡，身体会越来越差，工作的时候也没有精神。","st":"★ 医生建议早点儿睡觉。","a":true,"en":"The doctor says going to bed before 11 p.m. is fairly normal. If you often sleep very late, your health gets worse and you lack energy at work. / ★ The doctor advises sleeping earlier."},{"s":"这次会议由马经理负责安排。会议大约进行了三个小时，大家讨论了明年的计划，最后决定明年再招聘一些人。","st":"★ 会议进行了不到一个小时。","a":false,"en":"Manager Ma arranged this meeting. It lasted about three hours; everyone discussed next year's plan and decided to hire more people next year. / ★ The meeting lasted less than an hour."},{"s":"我第一次去广东省的时候，对那儿的早茶十分吃惊：一张桌子上能放二三十种好吃的，大家一边喝茶一边聊天，一坐就是一上午。","st":"★ 说话人觉得广东的早茶很让人吃惊。","a":true,"en":"The first time I went to Guangdong, I was amazed by morning tea: twenty or thirty kinds of snacks on one table, and people chat over tea for a whole morning. / ★ The speaker found Guangdong's morning tea surprising."}],"listen":[{"dlg":["男：你这次考试怎么错了这么多？","女：我太着急了，好几个问题都看错了。"],"q":"女的为什么错了很多？","opts":["没复习","题太难","看错了题"],"a":2,"en":"M: How did you get so many wrong on this exam? W: I was careless and misread several questions. Q: Why did she get many wrong?"},{"dlg":["女：你最近看起来很开心啊。","男：是啊，我申请的工作终于有消息了，下个星期就去上班。"],"q":"男的为什么开心？","opts":["找到工作了","考试通过了","要去旅游了"],"a":0,"en":"W: You look happy lately. M: Yes, I finally heard back about the job I applied for; I start next week. Q: Why is he happy?"},{"dlg":["男：这次表演的演员都是学生吗？","女：大部分是，只有两位是请来的老师。","男：那他们演得真不错！","女：是啊，他们已经练习了大概半年了。"],"q":"关于这次表演，可以知道什么？","opts":["演员都是老师","学生练了很长时间","只练习了一个月"],"a":1,"en":"M: Are all the performers students? W: Most are; only two are invited teachers. M: They performed really well! W: Yes, they've practised for about half a year. Q: What do we know about the show?"},{"dlg":["女：你的电脑又坏了？","男：不是，上网太慢了，看个新闻都要等好几分钟。"],"q":"男的电脑怎么了？","opts":["电脑坏了","上网很慢","没有电了"],"a":1,"en":"W: Is your computer broken again? M: No, the connection is too slow; one web page takes several minutes to open. Q: What's wrong?"}],"fill":[{"s":"休息十分钟以后，我们（  ）上课。","a":"继续","en":"After a ten-minute break we'll continue the class."},{"s":"现在用手机付钱已经非常（  ）了，连路边的小店也可以。","a":"普遍","en":"Paying by phone is very common now; even small roadside shops accept it."},{"s":"她从小就想当一名电影（  ），现在终于实现了理想。","a":"演员","en":"She wanted to be a film actress since childhood and has finally realised her dream."},{"s":"你别担心，刚开始学开车的时候紧张是很（  ）的。","a":"正常","en":"Don't worry; it's normal to be nervous when you start learning to drive."},{"s":"A：你们在会议室干什么呢？  B：我们在（  ）下个月去哪儿旅游。","a":"讨论","en":"A: What are you doing in the meeting room? B: We're discussing where to travel next month."},{"s":"A：这句话哪儿不对？  B：这里有一个语法（  ），“了”应该放在后面。","a":"错误","en":"A: What's wrong with this sentence? B: There's a grammar mistake here: 了 should go at the end."}],"grammar":[{"q":"（  ）天气越来越热，来游泳的人也多了起来。","opts":["为了","随着","关于","按照"],"a":1,"exp":"随着 introduces gradual change (warming weather) accompanied by another change.","g":0},{"q":"新同学的宿舍（  ）学校来安排。","opts":["由","被","让","向"],"a":0,"exp":"由 + organisation + verb shows who is responsible for arranging.","g":1},{"q":"这个箱子太重了，你能（  ）帮我一下吗？","opts":["十分","稍微","非常","偶尔"],"a":1,"exp":"稍微 + V + 一下 is a polite 'just a little'.","g":2},{"q":"这首歌我听了好几（  ），还是没学会怎么唱。","opts":["个","本","遍","双"],"a":2,"exp":"遍 counts complete runs through the song.","g":3},{"q":"这个房间比那个（  ）小一点儿，不过更安静。","opts":["稍微","十分","很","太"],"a":0,"exp":"In 比 comparisons only 稍微 can go with 一点儿; 很/十分/太 cannot.","g":2},{"q":"（  ）经济的发展，人们的收入也提高了。","opts":["随着","由","根据","通过"],"a":0,"exp":"随着 links economic development with the parallel rise in income.","g":0}],"order":[{"parts":["这个节目由三个年轻演员表演，","虽然他们的经验不多，","但是观众都很喜欢。"],"en":"This act is performed by three young actors; though inexperienced, the audience loves them."},{"parts":["老师让我们把这篇文章读三遍，","第一遍了解大概意思，","第二遍和第三遍再注意词语和语法。"],"en":"The teacher had us read the article three times: first for the general idea, then for words and grammar."},{"parts":["随着来中国学习的人越来越多，","学校的留学生也增加了不少，","现在大约有两千人。"],"en":"As more people come to study in China, the school's international students have increased a lot, to about 2,000 now."}],"reading":[{"p":"很多外国人第一次看京剧，最吃惊的是演员的脸。京剧演员会在脸上画上不同的颜色，不同的颜色表示不同的性格：比如红色常常表示这个人很勇敢、诚实。","q":"★ 京剧演员脸上的颜色：","opts":["只是为了好看","能告诉观众这个人的性格","都是红色的"],"a":1,"en":"Many foreigners watching Beijing opera are most surprised by the actors' faces. Actors paint different colours, which show different personalities; red often shows bravery and honesty."},{"p":"我家附近新开了一家餐厅，菜做得十分好吃，价格也不贵。不过，它有一个特别的规定：每张桌子最多只能坐两个小时。老板说，这样能让更多的客人吃上饭。","q":"★ 这家餐厅有什么规定？","opts":["吃饭不能超过两个小时","只能两个人一起吃","晚上不开门"],"a":0,"en":"A new restaurant opened near me; the food is delicious and not expensive. But it has a special rule: each table can only stay two hours at most, so more guests can eat."},{"p":"有人认为，小孩子玩儿手机是完全错误的。其实这个看法不完全对。如果父母能安排好时间，比如每天只玩儿半小时，让孩子用手机学一些有趣的知识，也是有好处的。","q":"★ 说话人认为：","opts":["孩子不能用手机","孩子用手机要管好时间","手机对孩子没有好处"],"a":1,"en":"Some think letting children use phones is completely wrong. That view is a bit extreme. If parents manage time, e.g. half an hour daily, and let kids learn fun things, it can be beneficial."}],"write":[{"words":["请你","把","刚才的话","再说一遍。"],"en":"Please say what you just said once more."},{"words":["这家餐厅的菜","比那家","稍微","便宜一点儿。"],"en":"This restaurant's dishes are a little cheaper than that one's."},{"words":["大部分观众","都","来自","外国。"],"en":"Most of the audience come from abroad."},{"words":["我们","明天","继续","讨论这个问题吧。"],"en":"Let's continue discussing this question tomorrow."}],"hanzi":[{"s":"这个周末的演（  ）票已经卖完了。","py":"chū","a":"出"},{"s":"他的汉语说得十（  ）流利。","py":"fēn","a":"分"},{"s":"买东西的时候，请自己带购物（  ）。","py":"dài","a":"袋"},{"s":"小时候，我偶（  ）会跟奶奶去看京剧。","py":"ěr","a":"尔"}]},"tx":[{"t":"在茶馆看京剧 · Beijing opera at a teahouse","scene":"Lin Xiaoyu takes Mark, a foreign student, to a teahouse where Beijing opera is performed every evening.","g":[0,2,3],"lines":[{"sp":"林小雨","s":"f","zh":"马克，这家茶馆每天晚上都有京剧演出，今天的演员大部分来自北京。","py":"Mǎkè, zhè jiā cháguǎn měi tiān wǎnshang dōu yǒu jīngjù yǎnchū, jīntiān de yǎnyuán dà bùfen láizì Běijīng.","en":"Mark, this teahouse has Beijing opera every evening; most of tonight's actors are from Beijing."},{"sp":"马克","s":"m","zh":"太好了！我在互联网上看过好几遍京剧，可是还没有坐在观众中间看过真的表演。","py":"Tài hǎo le! Wǒ zài hùliánwǎng shang kànguo hǎo jǐ biàn jīngjù, kěshì hái méiyǒu zuò zài guānzhòng zhōngjiān kànguo zhēn de biǎoyǎn.","en":"Great! I've watched Beijing opera online several times, but I've never sat in an audience to see a real performance."},{"sp":"林小雨","s":"f","zh":"在这儿可以一边喝茶一边看。你尝尝这杯茶，稍微有点儿苦，不过越喝越香。","py":"Zài zhèr kěyǐ yìbiān hē chá yìbiān kàn. Nǐ chángchang zhè bēi chá, shāowēi yǒudiǎnr kǔ, búguò yuè hē yuè xiāng.","en":"Here you can watch while drinking tea. Try this tea: it's a little bitter, but the more you drink the better it tastes."},{"sp":"马克","s":"m","zh":"嗯，味道真不错。咦，观众怎么这么多？我以为年轻人不喜欢京剧呢。","py":"Ng, wèidao zhēn búcuò. Yí, guānzhòng zěnme zhème duō? Wǒ yǐwéi niánqīng rén bù xǐhuan jīngjù ne.","en":"Mm, it tastes great. Oh, why is the audience so big? I thought young people didn't like Beijing opera."},{"sp":"林小雨","s":"f","zh":"以前确实是这样，不过随着京剧走进学校，喜欢它的年轻人越来越多了。","py":"Yǐqián quèshí shì zhèyàng, búguò suízhe jīngjù zǒujìn xuéxiào, xǐhuan tā de niánqīng rén yuè lái yuè duō le.","en":"That used to be true, but as Beijing opera has entered schools, more and more young people like it."},{"sp":"马克","s":"m","zh":"真让人吃惊！我也想学几句，学京剧需要什么基础吗？","py":"Zhēn ràng rén chījīng! Wǒ yě xiǎng xué jǐ jù, xué jīngjù xūyào shénme jīchǔ ma?","en":"How surprising! I'd like to learn a few lines too. Do you need any foundation to learn Beijing opera?"},{"sp":"林小雨","s":"f","zh":"不需要，有兴趣就行。我家有一本很厚的京剧书，明天借给你看看。","py":"Bù xūyào, yǒu xìngqù jiù xíng. Wǒ jiā yǒu yì běn hěn hòu de jīngjù shū, míngtiān jiè gěi nǐ kànkan.","en":"No, interest is enough. I have a very thick book on Beijing opera at home; I'll lend it to you tomorrow."}]},{"t":"申请去广东学习 · Applying to study in Guangdong","scene":"Liu Fang asks Teacher Chen for advice about applying for an exchange semester.","g":[1,2],"lines":[{"sp":"刘芳","s":"f","zh":"陈老师，我想申请去广东省的一所大学交流半年，您觉得我的水平够吗？","py":"Chén lǎoshī, wǒ xiǎng shēnqǐng qù Guǎngdōng Shěng de yì suǒ dàxué jiāoliú bàn nián, nín juéde wǒ de shuǐpíng gòu ma?","en":"Ms Chen, I'd like to apply for a half-year exchange at a university in Guangdong Province. Do you think my level is good enough?"},{"sp":"陈老师","s":"f","zh":"我觉得没问题。你的基础很好，说汉语十分流利，只是汉字写得稍微慢一些。","py":"Wǒ juéde méi wèntí. Nǐ de jīchǔ hěn hǎo, shuō Hànyǔ shífēn liúlì, zhǐshì Hànzì xiě de shāowēi màn yìxiē.","en":"I think it's fine. Your foundation is good and you speak Chinese very fluently; you just write characters a little slowly."},{"sp":"刘芳","s":"f","zh":"那申请材料由谁来准备呢？都需要我自己写吗？","py":"Nà shēnqǐng cáiliào yóu shéi lái zhǔnbèi ne? Dōu xūyào wǒ zìjǐ xiě ma?","en":"Then who prepares the application materials? Do I need to write them all myself?"},{"sp":"陈老师","s":"f","zh":"给学校的信由我来写，别的你自己准备。另外，学校还会跟你进行一次电话交流。","py":"Gěi xuéxiào de xìn yóu wǒ lái xiě, bié de nǐ zìjǐ zhǔnbèi. Lìngwài, xuéxiào hái huì gēn nǐ jìnxíng yí cì diànhuà jiāoliú.","en":"I'll write the letter to the university; you prepare the rest. Also, the university will have a phone conversation with you."},{"sp":"刘芳","s":"f","zh":"电话交流大概要多长时间？我有点儿紧张。","py":"Diànhuà jiāoliú dàgài yào duō cháng shíjiān? Wǒ yǒudiǎnr jǐnzhāng.","en":"Roughly how long does the phone conversation take? I'm a bit nervous."},{"sp":"陈老师","s":"f","zh":"大约二十分钟。紧张是正常的，你把想说的说清楚就行，别太担心语法错误。","py":"Dàyuē èrshí fēnzhōng. Jǐnzhāng shì zhèngcháng de, nǐ bǎ xiǎng shuō de shuō qīngchu jiù xíng, bié tài dānxīn yǔfǎ cuòwù.","en":"About twenty minutes. Being nervous is normal; just say what you want to say clearly and don't worry too much about grammar mistakes."},{"sp":"刘芳","s":"f","zh":"谢谢老师！听您这么说，我开心多了。","py":"Xièxie lǎoshī! Tīng nín zhème shuō, wǒ kāixīn duō le.","en":"Thank you! Hearing you say that makes me feel much happier."}]},{"t":"在餐厅 · At a restaurant","scene":"Zhang Wei finishes dinner at a new restaurant and chats with the waitress about bags.","g":[0],"lines":[{"sp":"服务员","s":"f","zh":"先生，今天的菜您觉得怎么样？","py":"Xiānsheng, jīntiān de cài nín juéde zěnmeyàng?","en":"Sir, what did you think of today's dishes?"},{"sp":"张伟","s":"m","zh":"十分好吃！特别是这个鱼，又甜又有一点儿苦，很有趣。","py":"Shífēn hǎochī! Tèbié shì zhège yú, yòu tián yòu yǒu yìdiǎnr kǔ, hěn yǒuqù.","en":"Very tasty! Especially this fish: sweet with a slightly bitter note, really interesting."},{"sp":"服务员","s":"f","zh":"谢谢！这是我们餐厅的新菜，几个师傅讨论了很久才做出来的。","py":"Xièxie! Zhè shì wǒmen cāntīng de xīn cài, jǐ gè shīfu tǎolùnle hěn jiǔ cái zuò chūlai de.","en":"Thanks! It's our restaurant's new dish; the chefs discussed it for a long time before creating it."},{"sp":"张伟","s":"m","zh":"没吃完的我想带走，能给我一个袋子吗？","py":"Méi chīwán de wǒ xiǎng dàizǒu, néng gěi wǒ yí gè dàizi ma?","en":"I'd like to take the leftovers; could you give me a bag?"},{"sp":"服务员","s":"f","zh":"好的。我们现在只用纸袋，一个纸袋一块钱，可以吗？","py":"Hǎo de. Wǒmen xiànzài zhǐ yòng zhǐdài, yí gè zhǐdài yí kuài qián, kěyǐ ma?","en":"Sure. We only use paper bags now, one yuan each. Is that OK?"},{"sp":"张伟","s":"m","zh":"没问题。现在很多餐厅都这么做，已经很普遍了。","py":"Méi wèntí. Xiànzài hěn duō cāntīng dōu zhème zuò, yǐjīng hěn pǔbiàn le.","en":"No problem. Lots of restaurants do this now; it's very common."},{"sp":"服务员","s":"f","zh":"是啊，随着大家越来越关心环境，自己带购物袋的客人也多了。","py":"Shì a, suízhe dàjiā yuè lái yuè guānxīn huánjìng, zìjǐ dài gòuwùdài de kèrén yě duō le.","en":"Yes, as people care more about the environment, more customers bring their own shopping bags."}]},{"t":"节目：网上的京剧 · Radio: Beijing opera online","scene":"A radio reporter interviews Manager Wang, whose company runs Beijing opera programmes on the Internet.","g":[1,3],"lines":[{"sp":"记者","s":"f","zh":"王经理，听说你们公司最近在互联网上进行了一次调查，结果怎么样？","py":"Wáng jīnglǐ, tīngshuō nǐmen gōngsī zuìjìn zài hùliánwǎng shang jìnxíngle yí cì diàochá, jiéguǒ zěnmeyàng?","en":"Manager Wang, I hear your company recently ran a survey online. What were the results?"},{"sp":"王经理","s":"m","zh":"我们问了大约五千人，他们来自全国各个省。结果让我们有点儿吃惊：一半以上的人偶尔会在网上看京剧。","py":"Wǒmen wènle dàyuē wǔqiān rén, tāmen láizì quánguó gè gè shěng. Jiéguǒ ràng wǒmen yǒudiǎnr chījīng: yíbàn yǐshàng de rén ǒu'ěr huì zài wǎng shang kàn jīngjù.","en":"We asked about 5,000 people from every province. The result surprised us a bit: over half sometimes watch Beijing opera online."},{"sp":"记者","s":"f","zh":"这么多！那他们最喜欢看什么样的节目？","py":"Zhème duō! Nà tāmen zuì xǐhuan kàn shénme yàng de jiémù?","en":"That many! So what kind of programmes do they like most?"},{"sp":"王经理","s":"m","zh":"大部分人喜欢短一点儿的表演。他们说，看完一遍，如果觉得有趣，就会继续找别的来看。","py":"Dà bùfen rén xǐhuan duǎn yìdiǎnr de biǎoyǎn. Tāmen shuō, kànwán yí biàn, rúguǒ juéde yǒuqù, jiù huì jìxù zhǎo bié de lái kàn.","en":"Most prefer shorter performances. They say if they watch one through and find it fun, they'll go on to look for others."},{"sp":"记者","s":"f","zh":"那你们下个月有什么新节目？","py":"Nà nǐmen xià gè yuè yǒu shénme xīn jiémù?","en":"So what new programmes do you have next month?"},{"sp":"王经理","s":"m","zh":"下个月的节目由几位年轻演员表演，我们希望让更多观众开开心心地了解京剧。","py":"Xià gè yuè de jiémù yóu jǐ wèi niánqīng yǎnyuán biǎoyǎn, wǒmen xīwàng ràng gèng duō guānzhòng kāikāixīnxīn de liǎojiě jīngjù.","en":"Next month's programme will be performed by some young actors; we hope more viewers can get to know Beijing opera in a fun way."}]}]},{"n":14,"cn":"保护地球母亲","en":"Protect our Mother Earth","vocab":[{"w":"出差","p":"chūchāi","pos":"v.","d":"to go on a business trip"},{"w":"毛巾","p":"máojīn","pos":"n.","d":"towel"},{"w":"牙膏","p":"yágāo","pos":"n.","d":"toothpaste"},{"w":"重","p":"zhòng","pos":"adj.","d":"heavy, weighty"},{"w":"行","p":"xíng","pos":"v.","d":"to be OK, to be all right"},{"w":"省","p":"shěng","pos":"v.","d":"to save, to economize"},{"w":"污染","p":"wūrǎn","pos":"v.","d":"to pollute"},{"w":"卫生间","p":"wèishēngjiān","pos":"n.","d":"restroom, bathroom"},{"w":"脏","p":"zāng","pos":"adj.","d":"dirty"},{"w":"抱歉","p":"bàoqiàn","pos":"v.","d":"to be sorry"},{"w":"空","p":"kōng","pos":"adj.","d":"empty"},{"w":"盒子","p":"hézi","pos":"n.","d":"box, case"},{"w":"扔","p":"rēng","pos":"v.","d":"to throw away"},{"w":"以","p":"yǐ","pos":"prep.","d":"via, by means of"},{"w":"速度","p":"sùdù","pos":"n.","d":"speed"},{"w":"地球","p":"dìqiú","pos":"n.","d":"earth, globe"},{"w":"既然","p":"jìrán","pos":"conj.","d":"since, as, now that"},{"w":"停","p":"tíng","pos":"v.","d":"to stop, to cease"},{"w":"得意","p":"déyì","pos":"adj.","d":"complacent, gloating"},{"w":"目的","p":"mùdì","pos":"n.","d":"aim, purpose"},{"w":"暖","p":"nuǎn","pos":"adj.","d":"warm"},{"w":"塑料袋","p":"sùliàodài","pos":"n.","d":"plastic bag"},{"w":"于是","p":"yúshì","pos":"conj.","d":"hence, therefore"},{"w":"鼓励","p":"gǔlì","pos":"v.","d":"to encourage"},{"w":"拒绝","p":"jùjué","pos":"v.","d":"to refuse, to reject"},{"w":"减少","p":"jiǎnshǎo","pos":"v.","d":"to reduce, to decrease"},{"w":"数量","p":"shùliàng","pos":"n.","d":"quantity, amount"},{"w":"温度","p":"wēndù","pos":"n.","d":"temperature"},{"w":"乘坐","p":"chéngzuò","pos":"v.","d":"to take (a vehicle), to ride (in a vehicle)"},{"w":"丢","p":"diū","pos":"v.","d":"to throw, to cast"},{"w":"垃圾桶","p":"lājītǒng","pos":"n.","d":"dustbin, trash can"},{"w":"美丽","p":"měilì","pos":"adj.","d":"beautiful"}],"proper":"","grammar":[{"t":"既然……就…… — Since / Now that …, then …","m":"既然 states a fact that both speakers already accept (something that has already happened or is known to be true). The second clause, usually with 就, 也 or 还, draws a conclusion, suggestion or question from it. Unlike 因为, which simply gives a reason, 既然 stresses 'given that this is the case, it follows that …', and it can't introduce new or uncertain information.","ex":[["既然你已经决定了，我就不再说什么了。","Since you've already decided, I won't say anything more."],["既然外面下雨，我们就在家里看电影吧。","Now that it's raining outside, let's watch a film at home."],["既然你不喜欢这份工作，为什么还不换一个？","Since you don't like this job, why haven't you changed it yet?"]]},{"t":"于是 — So, thereupon (one event leads to the next)","m":"于是 links two events in time: because of the situation in the first clause, the subject then did something. It connects actions that really happened (usually in the past, in narration), and stands at the start of the second clause, often after a comma. It cannot be used for suggestions or commands; use 所以 for general cause-and-effect and 那么/那 for 'then let's …'.","ex":[["他等了半个小时公共汽车还没来，于是决定走路回家。","After waiting half an hour with no bus, he decided to walk home."],["妈妈发现孩子对画画很感兴趣，于是给他报了一个画画班。","Mum noticed the child was interested in drawing, so she signed him up for an art class."],["房间里太热了，于是我打开了窗户。","The room was too hot, so I opened the window."]]},{"t":"以 — By means of, with, at (formal 'using')","m":"以 is a formal preposition meaning 'with / by means of / at (a rate)'. Common patterns: 以 + speed/rate (以很快的速度), 以 + method (以发短信的办法通知), and 以……为…… 'take … as …' (以学生为主). It sits before the verb, like 用, but sounds more written; it often appears in news, notices and descriptions of numbers.","ex":[["这列火车以很快的速度从我们身边开了过去。","The train went past us at great speed."],["公司以发短信的办法通知了所有顾客。","The company informed all customers by text message."],["这家饭馆的客人以年轻人为主。","The customers of this restaurant are mainly young people."]]},{"t":"省 — To save, to economise (省钱 / 省时间 / 省电)","m":"As a verb, 省 means to use less of something so it is not wasted: 省钱 'save money', 省时间 'save time', 省电 'save electricity', 省力气 'save effort'. It can take a result or complement (省下来, 省了不少钱). It is the opposite of 浪费. (Don't confuse it with the noun 省 'province', which appears in names like 广东省.)","ex":[["坐地铁上班比开车省时间，也更省钱。","Taking the subway to work saves time and money compared with driving."],["出门的时候关上空调，能省不少电。","Turning off the air conditioner when you go out saves quite a lot of electricity."],["他每个月都省下一部分工资，打算明年去旅游。","He saves part of his salary every month, planning to travel next year."]]}],"ex":{"judge":[{"s":"张伟下个星期要去上海出差三天。他不喜欢用宾馆的毛巾和牙膏，所以每次出差都自己带。","st":"★ 张伟出差时会自己带毛巾。","a":true,"en":"Zhang Wei is going to Shanghai on a three-day business trip next week. He doesn't like using hotel towels and toothpaste, so he brings his own every time. / ★ Zhang Wei brings his own towel on business trips."},{"s":"现在很多超市不再免费提供塑料袋了，目的是减少污染。刚开始有些顾客不习惯，但现在大部分人都会自己带购物袋。","st":"★ 超市不提供塑料袋是为了赚钱。","a":false,"en":"Many supermarkets no longer give free plastic bags; the aim is to reduce pollution. Some customers weren't used to it at first, but now most bring their own shopping bags. / ★ Supermarkets stopped giving plastic bags to make money."},{"s":"这个城市冬天的温度很低，不过房间里都很暖，所以在家穿一件衬衫就行。","st":"★ 这个城市冬天房间里很冷。","a":false,"en":"Winter temperatures in this city are low, but rooms are warm, so a shirt is enough at home. / ★ Rooms in this city are cold in winter."},{"s":"弟弟考了第一名，每天都很得意地给别人看他的成绩。爸爸说：“考得好当然值得高兴，但是别忘了还要继续努力。”","st":"★ 爸爸提醒弟弟不要太得意。","a":true,"en":"My younger brother came first in the exam and proudly shows his results to everyone. Dad said, 'Doing well is worth being happy about, but don't forget to keep working hard.' / ★ Dad reminds him not to be too pleased with himself."},{"s":"我们小区每个楼下都放了好几个垃圾桶，有放纸的，有放塑料的，还有放其他东西的。大家扔垃圾的时候要先分好。","st":"★ 小区里的垃圾桶只有一种。","a":false,"en":"Our community has several bins downstairs: for paper, for plastic, and for other things. Everyone must sort rubbish before throwing it out. / ★ There's only one kind of bin in the community."}],"listen":[{"dlg":["女：你的箱子怎么这么重？","男：里面放了好几本书，都是出差要用的材料。"],"q":"箱子为什么很重？","opts":["放了很多衣服","放了书和材料","放了水果"],"a":1,"en":"W: Why is your suitcase so heavy? M: There are several books in it, materials I need for my business trip. Q: Why is the suitcase heavy?"},{"dlg":["男：真抱歉，我来晚了，路上堵车堵得太厉害了。","女：没关系，会议还没开始呢。"],"q":"男的为什么来晚了？","opts":["起晚了","路上堵车","走错路了"],"a":1,"en":"M: Sorry I'm late, the traffic was terrible. W: It's fine, the meeting hasn't started. Q: Why was he late?"},{"dlg":["女：这个空盒子你还要吗？","男：不要了，不过别扔，留着放点儿小东西挺好的。"],"q":"男的想把盒子怎么样？","opts":["扔进垃圾桶","送给别人","留着放东西"],"a":2,"en":"W: Do you still want this empty box? M: No, but don't throw it out; it's good for keeping small things. Q: What does the man want to do with the box?"},{"dlg":["男：你们怎么不坐飞机去？","女：乘坐火车虽然慢一点儿，但是能看到路上美丽的景色。"],"q":"女的为什么坐火车？","opts":["火车票便宜","可以看风景","不敢坐飞机"],"a":1,"en":"M: Why aren't you flying? W: Taking the train is slower, but you can see beautiful scenery on the way. Q: Why does she take the train?"},{"dlg":["女：小王请你帮他写报告，你同意了？","男：没有，我拒绝了。这是他自己的工作，我觉得他应该自己做。"],"q":"男的为什么拒绝了小王？","opts":["他自己太忙","报告太难写","这是小王自己的事"],"a":2,"en":"W: Xiao Wang asked you to write his report; did you agree? M: No, I refused. It's his own work; he should do it himself. Q: Why did he refuse?"}],"match":[{"q":"既然你明天要出差，那今天早点儿回家准备吧。","r":"好的，谢谢经理，我把这份报告写完就走。"},{"q":"不好意思，请问卫生间在哪儿？","r":"一直往前走，在电梯的右边。"},{"q":"这些塑料瓶你打算扔了吗？","r":"别扔，洗干净以后还可以用来养花。"},{"q":"我这次又没考好，真不想学了。","r":"别放弃，老师鼓励你再试一次，下次一定能行。"},{"q":"这件衣服怎么这么脏？","r":"刚才踢足球的时候坐在地上了。"}],"fill":[{"s":"有人把脏水直接倒进河里，（  ）了附近的环境。","a":"污染","en":"Someone dumped dirty water straight into the river, polluting the nearby environment."},{"s":"为了保护（  ），我们应该从身边的小事做起。","a":"地球","en":"To protect the Earth we should start with small things around us."},{"s":"他请我帮忙搬家，可是我那天要加班，只好（  ）了他。","a":"拒绝","en":"He asked me to help him move, but I had to work overtime that day, so I had to turn him down."},{"s":"老师常常（  ）我们多说汉语，不要怕说错。","a":"鼓励","en":"The teacher often encourages us to speak more Chinese and not be afraid of mistakes."},{"s":"这几年来这个小城旅游的人（  ）越来越多。","a":"数量","en":"In recent years the number of tourists to this small town has grown and grown."},{"s":"A：我们走路去还是打车去？  B：（  ）时间来得及，我们就走过去吧。","a":"既然","en":"A: Shall we walk or take a taxi? B: Since we have enough time, let's walk."},{"s":"A：你怎么知道外面在下雨？  B：你看，路上的人都（  ）下来打开伞了。","a":"停","en":"A: How do you know it's raining outside? B: Look, people on the street have all stopped to open their umbrellas."},{"s":"A：你在超市买什么了？  B：只买了一支（  ），家里的快用完了。","a":"牙膏","en":"A: What did you buy at the supermarket? B: Just a tube of toothpaste; we've almost run out at home."},{"s":"A：今天外面多少度？  B：最高（  ）只有五度，你多穿点儿。","a":"温度","en":"A: What's the temperature today? B: The high is only five degrees, so wear more."},{"s":"A：你一个人能搬得动这张桌子吗？  B：（  ），不太重，我自己来就可以。","a":"行","en":"A: Can you move this table by yourself? B: Sure, it's not too heavy, I can do it myself."}],"grammar":[{"q":"（  ）大家都同意，我们就这么决定吧。","opts":["虽然","既然","即使","只要是"],"a":1,"exp":"既然 presents an accepted fact (everyone agrees) from which a conclusion with 就 follows.","g":0},{"q":"外面下起了大雨，（  ）我们只好在咖啡馆多坐了一会儿。","opts":["于是","既然","不过","而且"],"a":0,"exp":"于是 shows that one real past event led to the next action.","g":1},{"q":"那辆车（  ）很快的速度从我们旁边开了过去。","opts":["对","以","给","向"],"a":1,"exp":"以 + 速度 is the fixed formal pattern 'at a speed of'.","g":2},{"q":"每天骑自行车上班，既能锻炼身体，又能（  ）钱。","opts":["省","花","用","赚"],"a":0,"exp":"省钱 = save money by spending less, the benefit of cycling rather than paying for transport.","g":3},{"q":"（  ）你身体不舒服，今天就别去上课了。","opts":["既然","尽管","不管","如果说"],"a":0,"exp":"既然 + accepted fact + 就 + suggestion.","g":0},{"q":"这次活动的参加者（  ）大学生为主。","opts":["把","被","以","用"],"a":2,"exp":"以……为主 means 'mainly consist of'.","g":2}],"order":[{"parts":["既然塑料袋会污染环境，","我们就应该少用，","去超市的时候最好自己带购物袋。"],"en":"Since plastic bags pollute the environment, we should use fewer and bring our own bag to the supermarket."},{"parts":["他发现房间里的灯一直开着，","可是一个人也没有，","于是就走过去把灯关了。"],"en":"He noticed the light in the room was on but nobody was there, so he went over and turned it off."},{"parts":["为了省电，","我们公司规定下班以后","一定要关掉所有的电脑。"],"en":"To save electricity, our company requires all computers to be turned off after work."},{"parts":["这次出差的目的","是跟顾客讨论新的计划，","所以一定要提前准备好材料。"],"en":"The purpose of this trip is to discuss the new plan with clients, so the materials must be prepared in advance."}],"reading":[{"p":"很多人住宾馆的时候，每天都要换新的毛巾。其实，毛巾用一次就洗，要浪费很多水和电。现在有的宾馆鼓励客人把还想用的毛巾放回原来的地方，只有放在地上的才会被拿去洗。","q":"★ 宾馆这样做的目的是：","opts":["让客人多花钱","节约水和电","减少客人的数量"],"a":1,"en":"Many hotel guests change towels daily, but washing them after one use wastes much water and power. Some hotels now encourage guests to put towels they'll reuse back in place; only those on the floor are washed."},{"p":"上个月，小林开始骑自行车上班。她说，骑车虽然比开车慢一点儿，可是不会堵车，所以到公司的时间差不多。而且她每个月还能省下不少钱，身体也比以前好了。","q":"★ 小林骑车上班后：","opts":["每天都迟到","花的钱更多了","身体变好了"],"a":2,"en":"Last month Xiao Lin started cycling to work. It's a bit slower than driving but there are no jams, so she arrives at about the same time. She also saves money each month and is healthier."},{"p":"地球的温度正在慢慢地变高，这和人们的生活习惯有很大的关系。比如，开车、用空调都会让空气变暖。科学家认为，如果我们不减少开车和用空调的时间，以后夏天会越来越热。","q":"★ 这段话主要说的是：","opts":["人们的习惯让地球变暖","夏天应该多开空调","科学家喜欢热天"],"a":0,"en":"The Earth's temperature is slowly rising, closely related to people's habits. Driving and air-conditioning warm the air. Scientists think that if we don't cut back, summers will get hotter."},{"p":"我的邻居是一位七十多岁的老人。每天早上，他都会拿着一个大袋子在小区里走一圈，把别人乱扔的瓶子和纸放进袋子里，再丢进垃圾桶。有人问他累不累，他笑着说：“看到小区这么干净，我心里高兴。”","q":"★ 关于这位老人，可以知道什么？","opts":["他每天都帮小区扔垃圾","他觉得很累","他住在小区外面"],"a":0,"en":"My neighbour is a man in his seventies. Every morning he walks around the community with a big bag, collects bottles and paper others dropped in his bag and puts them in the bin. Asked if he's tired, he smiles: 'Seeing the community so clean makes me happy.'"}],"write":[{"words":["请把","空瓶子","丢进","垃圾桶里。"],"en":"Please put the empty bottles in the bin."},{"words":["他","得意地","笑了","起来。"],"en":"He began to laugh smugly."},{"words":["我们","应该","减少","使用塑料袋。"],"en":"We should reduce our use of plastic bags."},{"words":["这里的风景","比照片上的","还要","美丽。"],"en":"The scenery here is even more beautiful than in the photos."},{"words":["乘坐","地铁","比开车","省时间。"],"en":"Taking the subway saves more time than driving."}],"hanzi":[{"s":"对不起，我把你的书弄（  ）了。","py":"zāng","a":"脏"},{"s":"这个盒（  ）是空的，你拿去用吧。","py":"zi","a":"子"},{"s":"别把垃圾（  ）在地上。","py":"rēng","a":"扔"},{"s":"今天天气很（  ），我们去公园走走吧。","py":"nuǎn","a":"暖"},{"s":"真抱（  ），让你等了这么久。","py":"qiàn","a":"歉"}]},"rv":{"judge":[{"s":"我们公司规定，开会的时候手机要关掉，每个人说话不能超过五分钟。这样大家开会的速度快了很多。","st":"★ 开会时可以随便打电话。","a":false,"en":"Our company rules say phones must be off in meetings and nobody may speak for more than five minutes. Meetings have become much faster. / ★ You can make calls freely in meetings."},{"s":"这家宾馆的卫生间很干净，毛巾和牙膏都是新的。不过房间里的温度有点儿低，晚上睡觉时我多穿了一件衣服。","st":"★ 说话人觉得房间有点儿冷。","a":true,"en":"This hotel's bathroom is very clean; the towels and toothpaste are new. But the room temperature was a bit low, so I put on an extra layer at night. / ★ The speaker found the room a bit cold."},{"s":"以前这条河的水很脏，没有人愿意来这儿散步。后来这个城市花了五年时间减少污染，现在河水又变清了，很多人周末都来这儿。","st":"★ 这条河现在还是很脏。","a":false,"en":"This river used to be dirty and nobody wanted to walk here. Then the city spent five years reducing pollution; now the water is clear again and many people come on weekends. / ★ The river is still dirty."},{"s":"出差的时候我一般乘坐火车，因为火车站离市中心近，而且很少晚点。只有特别远的地方，我才会坐飞机。","st":"★ 说话人出差时一般坐火车。","a":true,"en":"On business trips I usually take the train, since stations are near city centres and it's rarely late. Only for very distant places do I fly. / ★ The speaker usually takes the train."}],"listen":[{"dlg":["男：你怎么把这么多盒子都留着？","女：搬家的时候可以用来放东西，省得再去买了。"],"q":"女的为什么留着盒子？","opts":["搬家时用","送给朋友","准备扔掉"],"a":0,"en":"M: Why are you keeping so many boxes? W: I can pack things in them when I move, so I don't have to buy any. Q: Why does she keep the boxes?"},{"dlg":["女：你的手机怎么一直没人接？","男：真抱歉，开会的时候我把声音关了，忘了打开。"],"q":"男的为什么没接电话？","opts":["手机丢了","手机没电了","手机没有声音"],"a":2,"en":"W: Why didn't you answer your phone? M: Sorry, I muted it in the meeting and forgot to turn the sound back on. Q: Why didn't he answer?"},{"dlg":["男：这次比赛你得了第一，是不是很得意？","女：高兴是高兴，不过我知道还有很多地方需要提高。","男：你能这么想真好。","女：是啊，以后我还要继续练习。"],"q":"女的是什么态度？","opts":["非常得意","想放弃","不满足，还要努力"],"a":2,"en":"M: You won first place; are you pleased with yourself? W: I'm happy, but there's lots to improve. M: Good attitude. W: I'll keep practising. Q: What's her attitude?"},{"dlg":["女：你看，那只小狗把塑料袋都弄破了。","男：肯定是有人把吃的丢在里面了。"],"q":"塑料袋里可能有什么？","opts":["吃的东西","衣服","书"],"a":0,"en":"W: Look, that dog tore the plastic bag. M: Someone must have thrown food in it. Q: What's probably in the bag?"}],"fill":[{"s":"这个箱子太（  ）了，我一个人搬不动。","a":"重","en":"This box is too heavy; I can't move it alone."},{"s":"他发现自己说错了话，赶紧向朋友（  ）。","a":"抱歉","en":"Realising he'd said the wrong thing, he quickly apologised to his friend."},{"s":"我们的（  ）不是赢得比赛，而是让大家一起锻炼身体。","a":"目的","en":"Our goal isn't winning the match but getting everyone to exercise together."},{"s":"这里的冬天不太冷，房间里总是很（  ）。","a":"暖","en":"Winters here aren't too cold; rooms are always warm."},{"s":"A：你下周在不在北京？  B：不在，我要去广州（  ），周五才回来。","a":"出差","en":"A: Will you be in Beijing next week? B: No, I'm going on a business trip to Guangzhou and won't be back until Friday."},{"s":"A：请问，附近有（  ）吗？  B：有，就在那个咖啡馆旁边。","a":"卫生间","en":"A: Excuse me, is there a restroom nearby? B: Yes, right next to that café."}],"grammar":[{"q":"（  ）你对这个城市这么熟悉，就带我们到处逛逛吧。","opts":["既然","虽然","即使","尽管"],"a":0,"exp":"既然 + accepted fact + 就 + suggestion.","g":0},{"q":"他觉得这份工作太无聊了，（  ）不干了，去开了一家咖啡馆。","opts":["既然","于是","即使","但是"],"a":1,"exp":"于是 narrates the action that followed from his feeling.","g":1},{"q":"这次调查（  ）在网上回答问题的办法进行。","opts":["以","对","往","给"],"a":0,"exp":"以 + method + 进行 = carried out by means of.","g":2},{"q":"把旧报纸卖掉，不仅能（  ）下一点儿钱，还能保护环境。","opts":["赢","省","借","输"],"a":1,"exp":"省下钱 = save money; the other verbs don't fit with 下 and the meaning.","g":3},{"q":"我到了车站，发现最后一班车已经走了，（  ）只好打车回家。","opts":["于是","既然","不管","如果"],"a":0,"exp":"于是 marks the resulting action in a past narrative.","g":1},{"q":"（  ）明天要早起，今天晚上就别看电视了。","opts":["只要","既然","因此","于是"],"a":1,"exp":"既然 introduces a known fact; the advice with 就 follows.","g":0}],"order":[{"parts":["我看他一个人拿着很多东西，","走得很慢，","于是就过去帮了他一下。"],"en":"I saw him carrying many things alone and walking slowly, so I went over to help."},{"parts":["既然你已经到了机场，","就先找个地方坐一下，","我马上就到。"],"en":"Since you've already reached the airport, find somewhere to sit; I'll be right there."},{"parts":["为了减少污染，","这个城市鼓励大家乘坐公共汽车，","少开自己的车。"],"en":"To reduce pollution, this city encourages people to take buses and drive less."}],"reading":[{"p":"有一次，我在公园里看到一个小男孩把喝完的饮料瓶扔在了草地上。他的妈妈没有大声说他，而是拉着他的手走到垃圾桶旁边，让他自己把瓶子丢进去。小男孩开始有点儿不高兴，后来却很得意地说：“我做得对吧！”","q":"★ 妈妈是怎么做的？","opts":["大声说孩子","帮孩子扔瓶子","让孩子自己扔进垃圾桶"],"a":2,"en":"Once in a park I saw a boy toss his empty bottle on the grass. His mother didn't scold him but led him to the bin to throw it in himself. He was unhappy at first, then said proudly, 'I did it right!'"},{"p":"很多人出门旅游喜欢带很多东西，箱子又大又重。其实，大部分宾馆都提供毛巾和牙膏，有的还有雨伞。所以出门前最好先问清楚，这样可以少带不少东西。","q":"★ 说话人建议：","opts":["出门前问清楚宾馆提供什么","去旅游要多带东西","不要住宾馆"],"a":0,"en":"Many people pack a lot when travelling. Most hotels provide towels and toothpaste, some even umbrellas. So it's best to ask beforehand and pack less."},{"p":"我们小区最近进行了一次活动：大家把不用的旧衣服、旧书拿出来，放在一起，需要的人可以免费拿走。活动的目的是让这些东西继续有用，而不是被扔掉。参加的人数量比我们想的多得多。","q":"★ 这次活动：","opts":["东西要花钱买","参加的人很少","让旧东西继续被使用"],"a":2,"en":"Our community recently held an event: people brought old clothes and books they didn't need; anyone could take them free. The goal was to keep things useful instead of throwing them away. Far more people joined than expected."}],"write":[{"words":["他","拒绝了","朋友的","邀请。"],"en":"He turned down his friend's invitation."},{"words":["这个城市的","空气","污染","很严重。"],"en":"Air pollution in this city is serious."},{"words":["火车","以很快的速度","向前","开去。"],"en":"The train sped forward."},{"words":["请","不要","把","垃圾扔在地上。"],"en":"Please don't throw rubbish on the ground."}],"hanzi":[{"s":"我们只有一个地（  ），一定要保护好它。","py":"qiú","a":"球"},{"s":"老师的鼓（  ）让我有了信心。","py":"lì","a":"励"},{"s":"你出门的时候别忘了带毛（  ）。","py":"jīn","a":"巾"},{"s":"这里的景色真美（  ）啊！","py":"lì","a":"丽"}]},"tx":[{"t":"出差前准备行李 · Packing for a business trip","scene":"Zhang Wei is packing for a business trip; Lin Xiaoyu helps and comments on what he takes.","g":[0,3],"lines":[{"sp":"林小雨","s":"f","zh":"你的箱子怎么这么重？里面都放了什么？","py":"Nǐ de xiāngzi zěnme zhème zhòng? Lǐmiàn dōu fàngle shénme?","en":"Why is your suitcase so heavy? What have you put in it?"},{"sp":"张伟","s":"m","zh":"这次出差要一个星期，我带了毛巾、牙膏，还有几盒茶。","py":"Zhè cì chūchāi yào yí gè xīngqī, wǒ dàile máojīn, yágāo, hái yǒu jǐ hé chá.","en":"This business trip is a week, so I've packed towels, toothpaste and a few boxes of tea."},{"sp":"林小雨","s":"f","zh":"宾馆里都有毛巾和牙膏，既然人家提供，你就别带了，能省不少地方。","py":"Bīnguǎn li dōu yǒu máojīn hé yágāo, jìrán rénjia tígōng, nǐ jiù bié dài le, néng shěng bù shǎo dìfang.","en":"Hotels have towels and toothpaste. Since they provide them, don't bring yours; you'll save a lot of space."},{"sp":"张伟","s":"m","zh":"可是宾馆的这些东西用一次就扔，我觉得太浪费了。","py":"Kěshì bīnguǎn de zhèxiē dōngxi yòng yí cì jiù rēng, wǒ juéde tài làngfèi le.","en":"But the hotel throws these things away after one use; I think that's too wasteful."},{"sp":"林小雨","s":"f","zh":"你说得也对。那这几个空盒子呢？也要带吗？","py":"Nǐ shuō de yě duì. Nà zhè jǐ gè kōng hézi ne? Yě yào dài ma?","en":"You have a point. What about these empty boxes? Are you taking them too?"},{"sp":"张伟","s":"m","zh":"那是用来放开会材料的，这样路上就不会弄乱了。","py":"Nà shì yònglái fàng kāihuì cáiliào de, zhèyàng lù shang jiù bú huì nòngluàn le.","en":"They're for my meeting materials, so they won't get messed up on the way."},{"sp":"林小雨","s":"f","zh":"行，你想得真多。路上小心，到了给我打电话。","py":"Xíng, nǐ xiǎng de zhēn duō. Lù shang xiǎoxīn, dàole gěi wǒ dǎ diànhuà.","en":"OK, you really think of everything. Take care on the way and call me when you arrive."}]},{"t":"在宾馆 · At the hotel","scene":"Wang the manager, on a business trip, calls the front desk because something in his room isn't working.","g":[1],"lines":[{"sp":"王经理","s":"m","zh":"你好，我是五〇八房间的客人。卫生间里的水一直不停地流，关不上。","py":"Nǐ hǎo, wǒ shì wǔ líng bā fángjiān de kèrén. Wèishēngjiān li de shuǐ yìzhí bù tíng de liú, guān bu shàng.","en":"Hello, I'm the guest in room 508. The water in the bathroom keeps running and won't turn off."},{"sp":"服务员","s":"f","zh":"真抱歉，先生，我马上让师傅上去看看。","py":"Zhēn bàoqiàn, xiānsheng, wǒ mǎshàng ràng shīfu shàngqu kànkan.","en":"I'm very sorry, sir; I'll send the repairman up right away."},{"sp":"王经理","s":"m","zh":"另外，房间里有点儿冷，空调温度我已经开到二十八度了，还是不暖。","py":"Lìngwài, fángjiān li yǒudiǎnr lěng, kōngtiáo wēndù wǒ yǐjīng kāidào èrshíbā dù le, háishi bù nuǎn.","en":"Also, the room's a bit cold; I've set the air conditioner to 28 degrees and it's still not warm."},{"sp":"服务员","s":"f","zh":"可能是空调坏了。我们刚才也接到了别的客人的电话，于是检查了一下，发现有几个房间都有这个问题。","py":"Kěnéng shì kōngtiáo huài le. Wǒmen gāngcái yě jiēdàole biéde kèrén de diànhuà, yúshì jiǎnchále yíxià, fāxiàn yǒu jǐ gè fángjiān dōu yǒu zhège wèntí.","en":"The air conditioner may be broken. We had calls from other guests just now, so we checked and found several rooms have this problem."},{"sp":"王经理","s":"m","zh":"那能不能给我换一个房间？我明天一早还要开会。","py":"Nà néng bu néng gěi wǒ huàn yí gè fángjiān? Wǒ míngtiān yìzǎo hái yào kāihuì.","en":"Then could you change my room? I have a meeting early tomorrow."},{"sp":"服务员","s":"f","zh":"当然可以。我们给您换到十楼，那儿的房间又安静又暖，请您稍等。","py":"Dāngrán kěyǐ. Wǒmen gěi nín huàndào shí lóu, nàr de fángjiān yòu ānjìng yòu nuǎn, qǐng nín shāo děng.","en":"Of course. We'll move you to the tenth floor; the rooms there are quiet and warm. Please wait a moment."}]},{"t":"减少塑料袋 · Fewer plastic bags","scene":"Liu Fang and Mark talk at the supermarket checkout about plastic bags.","g":[0,1],"lines":[{"sp":"马克","s":"m","zh":"你怎么不要塑料袋？这么多东西怎么拿？","py":"Nǐ zěnme bú yào sùliàodài? Zhème duō dōngxi zěnme ná?","en":"Why don't you want a plastic bag? How will you carry so many things?"},{"sp":"刘芳","s":"f","zh":"我自己带了购物袋。塑料袋用完就扔，会污染环境。","py":"Wǒ zìjǐ dàile gòuwùdài. Sùliàodài yòngwán jiù rēng, huì wūrǎn huánjìng.","en":"I brought my own shopping bag. Plastic bags get thrown away after use and pollute the environment."},{"sp":"马克","s":"m","zh":"可是一个袋子很小，扔一个也没什么吧？","py":"Kěshì yí gè dàizi hěn xiǎo, rēng yí gè yě méi shénme ba?","en":"But one bag is small; throwing away one doesn't matter much, does it?"},{"sp":"刘芳","s":"f","zh":"每个人都这么想，数量就大了。我以前也常常拒绝不了，后来看了一个关于地球污染的节目，于是决定改变自己的习惯。","py":"Měi gè rén dōu zhème xiǎng, shùliàng jiù dà le. Wǒ yǐqián yě chángcháng jùjué bù liǎo, hòulái kànle yí gè guānyú dìqiú wūrǎn de jiémù, yúshì juédìng gǎibiàn zìjǐ de xíguàn.","en":"If everyone thinks that, the numbers get huge. I often couldn't say no before, but then I watched a programme on pollution of the Earth and decided to change my habits."},{"sp":"马克","s":"m","zh":"你说得对。既然你都这么做了，我也试试吧。","py":"Nǐ shuō de duì. Jìrán nǐ dōu zhème zuò le, wǒ yě shìshi ba.","en":"You're right. Since you're doing it, I'll give it a try too."},{"sp":"刘芳","s":"f","zh":"太好了！这个袋子送给你，我家还有好几个呢。","py":"Tài hǎo le! Zhège dàizi sòng gěi nǐ, wǒ jiā hái yǒu hǎo jǐ gè ne.","en":"Great! Have this bag; I've got several more at home."}]},{"t":"学校活动 · A talk on protecting the Earth","scene":"At a school event, a reporter interviews Teacher Chen, who leads a student environmental group.","g":[2,3],"lines":[{"sp":"记者","s":"m","zh":"陈老师，您为什么让学生们参加保护环境的活动？","py":"Chén lǎoshī, nín wèi shénme ràng xuéshengmen cānjiā bǎohù huánjìng de huódòng?","en":"Ms Chen, why do you get students to take part in environmental activities?"},{"sp":"陈老师","s":"f","zh":"现在地球的温度以很快的速度变高，我们的目的是让孩子从小就关心我们美丽的地球。","py":"Xiànzài dìqiú de wēndù yǐ hěn kuài de sùdù biàn gāo, wǒmen de mùdì shì ràng háizi cóngxiǎo jiù guānxīn wǒmen měilì de dìqiú.","en":"The Earth's temperature is rising fast; our aim is for children to care about our beautiful planet from a young age."},{"sp":"记者","s":"m","zh":"学生们都做些什么呢？","py":"Xuéshengmen dōu zuò xiē shénme ne?","en":"What exactly do the students do?"},{"sp":"陈老师","s":"f","zh":"比如把瓶子丢进不同的垃圾桶，离开教室时关灯省电，还鼓励家长少开车，多乘坐公共汽车。","py":"Bǐrú bǎ píngzi diūjìn bù tóng de lājītǒng, líkāi jiàoshì shí guān dēng shěng diàn, hái gǔlì jiāzhǎng shǎo kāichē, duō chéngzuò gōnggòng qìchē.","en":"For example, sorting bottles into different bins, turning off lights to save power when leaving class, and encouraging parents to drive less and take the bus more."},{"sp":"记者","s":"m","zh":"效果怎么样？","py":"Xiàoguǒ zěnmeyàng?","en":"How effective has it been?"},{"sp":"陈老师","s":"f","zh":"挺好的。学校的垃圾减少了一半，孩子们都很得意，说自己是“地球的好朋友”。","py":"Tǐng hǎo de. Xuéxiào de lājī jiǎnshǎole yíbàn, háizimen dōu hěn déyì, shuō zìjǐ shì “dìqiú de hǎo péngyou”.","en":"Very good. The school's rubbish has halved, and the kids are very proud, calling themselves 'good friends of the Earth'."}]}]},{"n":15,"cn":"教育孩子的艺术","en":"The art of educating children","vocab":[{"w":"弹钢琴","p":"tángāngqín","pos":"v.","d":"to play the piano"},{"w":"棒","p":"bàng","pos":"adj.","d":"excellent, amazing"},{"w":"孙子","p":"sūnzi","pos":"n.","d":"grandson"},{"w":"寒假","p":"hánjià","pos":"n.","d":"winter vacation"},{"w":"父亲","p":"fùqīn","pos":"n.","d":"father"},{"w":"闹钟","p":"nàozhōng","pos":"n.","d":"alarm clock"},{"w":"响","p":"xiǎng","pos":"v.","d":"to sound, to ring"},{"w":"醒","p":"xǐng","pos":"v.","d":"to wake up, to be awake"},{"w":"赶","p":"gǎn","pos":"v.","d":"to rush for, to hurry"},{"w":"厕所","p":"cèsuǒ","pos":"n.","d":"lavatory, toilet"},{"w":"批评","p":"pīpíng","pos":"v.","d":"to criticize"},{"w":"弄","p":"nòng","pos":"v.","d":"to do, to make"},{"w":"管理","p":"guǎnlǐ","pos":"v.","d":"to manage, to administer"},{"w":"打针","p":"dǎzhēn","pos":"v.","d":"to give or have an injection"},{"w":"护士","p":"hùshi","pos":"n.","d":"nurse"},{"w":"表扬","p":"biǎoyáng","pos":"v.","d":"to praise, to commend"},{"w":"千万","p":"qiānwàn","pos":"adv.","d":"must, to be sure to"},{"w":"怀疑","p":"huáiyí","pos":"v.","d":"to suspect, to doubt"},{"w":"故意","p":"gùyì","pos":"adv.","d":"intentionally, on purpose"},{"w":"敲","p":"qiāo","pos":"v.","d":"to knock, to beat, to strike"},{"w":"整理","p":"zhěnglǐ","pos":"v.","d":"to tidy up, to arrange"},{"w":"合适","p":"héshì","pos":"adj.","d":"fit, suitable"},{"w":"骗","p":"piàn","pos":"v.","d":"to cheat, to deceive"},{"w":"儿童","p":"értóng","pos":"n.","d":"children"},{"w":"假","p":"jiǎ","pos":"adj.","d":"false, fake"},{"w":"左右","p":"zuǒyòu","pos":"n.","d":"around, or so"},{"w":"懒","p":"lǎn","pos":"adj.","d":"lazy"},{"w":"笨","p":"bèn","pos":"adj.","d":"stupid, foolish"},{"w":"粗心","p":"cūxīn","pos":"adj.","d":"careless, thoughtless"},{"w":"骄傲","p":"jiāoào","pos":"adj.","d":"arrogant, conceited"},{"w":"害羞","p":"hàixiū","pos":"v.","d":"to be shy, to be timid"}],"proper":"","grammar":[{"t":"千万（要 / 别 / 不要）…… — Be sure to … / Whatever you do, don't …","m":"千万 is an adverb used in advice, warnings and requests to make them much stronger. It is almost always followed by 要 ('be sure to') or, more often, by 别 / 不要 / 不能 ('by no means, whatever you do, don't'). It is used when talking to someone (or to oneself) about what should happen, not to describe facts. Compare 一定: 一定 can describe certainty (他一定来了), but 千万 cannot.","ex":[["这件事你千万别告诉妈妈，她会担心的。","Whatever you do, don't tell Mum about this; she'll worry."],["出门的时候千万要记得关窗户。","Be sure to remember to close the windows when you go out."],["吃药的时候千万不能喝酒。","You must never drink alcohol while taking this medicine."]]},{"t":"弄 — A general-purpose verb: to do, make, handle, get","m":"弄 stands in for a more specific verb when the exact action is unclear, unimportant, or would take too many words. It is very common in spoken Chinese and usually takes a result complement: 弄坏 (break), 弄脏 (make dirty), 弄丢 (lose), 弄清楚 (figure out), 弄好 (get it done). It can also mean 'get, obtain' (弄点儿吃的). Often appears in 把 sentences: 把……弄 + result.","ex":[["对不起，我不小心把你的书弄脏了。","Sorry, I accidentally got your book dirty."],["这个问题我还没弄明白，你能再讲一下吗？","I still haven't figured out this problem; can you explain it again?"],["你先坐一会儿，我去给你弄点儿吃的。","Sit down for a bit; I'll go and fix you something to eat."]]},{"t":"数量 + 左右 — About, around (an approximate number)","m":"左右 is placed AFTER a number + measure word (or a time / age / price) to show the figure is approximate: 十个人左右, 三点左右, 五十岁左右. It is close in meaning to 大约/大概, which go BEFORE the number; the two can be combined (大概二十分钟左右) in speech. Don't use 左右 after a vague word like 几 or 多; it needs a specific figure.","ex":[["我们班有三十个学生左右，大部分是留学生。","Our class has about thirty students, most of them international students."],["他每天晚上十一点左右睡觉。","He goes to bed around eleven every night."],["这件衣服打折以后五百块左右，不算贵。","This piece of clothing is about five hundred yuan after the discount, not expensive."]]},{"t":"故意 vs. 不小心 — On purpose vs. by accident","m":"故意 is an adverb placed before the verb meaning the action was done deliberately, often something bad or annoying (故意迟到, 故意不接电话). Its opposite is 不小心 (accidentally). In apologies and arguments, 我不是故意的 'I didn't mean to' is a very common set phrase. 故意 describes the subject's intention; it cannot be used for natural events.","ex":[["他故意把电视的声音开得很大，想让邻居听见。","He deliberately turned the TV up loud, wanting the neighbours to hear."],["对不起，我不是故意的，我以为那是我的杯子。","Sorry, I didn't do it on purpose; I thought that was my cup."],["弟弟怕考不好，故意说自己肚子疼，不想去学校。","Afraid of doing badly in the exam, my brother pretended to have a stomach ache so he wouldn't have to go to school."]]}],"ex":{"judge":[{"s":"孙子放寒假了，来爷爷奶奶家住了半个月。他每天早上都要练习弹钢琴，爷爷听了总说：“弹得真棒！”","st":"★ 孙子是暑假来爷爷家的。","a":false,"en":"The grandson, on winter holiday, stayed at his grandparents' for half a month. He practised piano every morning, and Grandpa always said, 'You play brilliantly!' / ★ The grandson came during the summer holiday."},{"s":"我的闹钟响了三次，我都没醒。等我起床的时候已经八点了，只好打车去赶火车。","st":"★ 说话人起晚了。","a":true,"en":"My alarm rang three times and I didn't wake up. When I got up it was already eight, so I had to take a taxi to catch the train. / ★ The speaker overslept."},{"s":"有的父母孩子做得不好就批评，做得好却从来不表扬。其实，孩子更需要的是鼓励，合适的表扬能让他们更有信心。","st":"★ 说话人认为应该多表扬孩子。","a":true,"en":"Some parents criticise children when they do badly but never praise them when they do well. In fact children need encouragement more; suitable praise makes them more confident. / ★ The speaker thinks children should be praised more."},{"s":"我女儿五岁，特别怕打针。每次去医院，看到护士她就哭。上次护士送了她一块巧克力，她才不哭了。","st":"★ 女儿不怕打针。","a":false,"en":"My daughter is five and terrified of injections. Every time at the hospital she cries when she sees a nurse. Last time the nurse gave her a piece of chocolate and only then did she stop crying. / ★ The daughter isn't afraid of injections."},{"s":"弟弟做作业很粗心，常常把数字看错。妈妈说他不笨，就是不认真，以后做完一定要再检查一遍。","st":"★ 妈妈觉得弟弟很笨。","a":false,"en":"My brother is careless with homework, often misreading numbers. Mum says he isn't stupid, just not careful, and must check everything once more in future. / ★ Mum thinks the brother is stupid."}],"listen":[{"dlg":["女：你的房间怎么这么乱？","男：我正准备整理呢，一会儿就弄好。"],"q":"男的要做什么？","opts":["打扫客厅","整理房间","去买东西"],"a":1,"en":"W: Why is your room so messy? M: I'm about to tidy it; it'll be done soon. Q: What's he going to do?"},{"dlg":["男：这个孩子见了人就不说话。","女：他不是不喜欢别人，就是有点儿害羞。"],"q":"关于这个孩子，可以知道什么？","opts":["很害羞","很骄傲","很懒"],"a":0,"en":"M: This kid stops talking whenever he meets people. W: It's not that he dislikes people, he's just a bit shy. Q: What do we know about the child?"},{"dlg":["女：听说你上周去打针了？","男：是啊，医生说一共要打三次。","女：疼不疼？","男：那个护士很有经验，一点儿都不疼。"],"q":"男的觉得打针怎么样？","opts":["很疼","不疼","打了五次"],"a":1,"en":"W: I heard you had an injection last week? M: Yes, the doctor says three in all. W: Did it hurt? M: The nurse was very experienced; it didn't hurt at all. Q: How was the injection?"},{"dlg":["男：有人敲门，你去看看是谁。","女：是楼下的邻居，说咱们家的水流到他家了。"],"q":"谁敲的门？","opts":["送报纸的人","楼下的邻居","女的父亲"],"a":1,"en":"M: Someone's knocking; go and see who. W: It's the downstairs neighbour, saying our water is leaking into his flat. Q: Who knocked?"},{"dlg":["女：你怎么不相信他说的话？","男：他已经骗过我两次了，我现在很怀疑他。"],"q":"男的为什么不相信他？","opts":["他很笨","他被骗过","他不认识他"],"a":1,"en":"W: Why don't you believe what he says? M: He's lied to me twice already; I'm very suspicious of him now. Q: Why doesn't he believe him?"}],"match":[{"q":"明天的考试很重要，你千万别迟到。","r":"放心吧，我已经定好闹钟了。"},{"q":"你是故意不接我电话的吧？","r":"真不是，我的手机没电了。"},{"q":"这次比赛你得了第一，真棒！","r":"谢谢，不过我还要继续努力，不能骄傲。"},{"q":"你觉得这件衣服适合我吗？","r":"颜色挺合适的，就是稍微大了一点儿。"},{"q":"老师今天又表扬你了？","r":"是啊，因为我这次作业一个错误都没有。"}],"fill":[{"s":"老师说我作文写得好，在全班同学面前（  ）了我。","a":"表扬","en":"The teacher said my essay was good and praised me in front of the whole class."},{"s":"这家医院的（  ）对病人都很耐心。","a":"护士","en":"The nurses at this hospital are all very patient with patients."},{"s":"他是新来的，还有点儿（  ），不太敢跟大家说话。","a":"害羞","en":"He's new and a bit shy, not quite daring to talk to everyone."},{"s":"这个超市卖的东西都是（  ）的，千万别去那儿买。","a":"假","en":"Everything that supermarket sells is fake; don't buy there whatever you do."},{"s":"他做事太（  ），把妹妹的作业本也放进了自己的书包。","a":"粗心","en":"He is so careless that he even put his sister's exercise book into his own schoolbag."},{"s":"A：你怎么又迟到了？  B：今天早上我的（  ）没响。","a":"闹钟","en":"A: Why are you late again? B: My alarm clock didn't go off this morning."},{"s":"A：你下午去哪儿了？  B：我去帮经理（  ）了一下办公室里的东西。","a":"整理","en":"A: Where were you this afternoon? B: I helped the manager sort out the things in the office."},{"s":"A：刚才有人在门外吗？  B：好像有人（  ）了几下门，我开门的时候没看到人。","a":"敲","en":"A: Was someone outside just now? B: Someone seemed to knock a few times, but when I opened the door no one was there."},{"s":"A：你父亲多大了？  B：六十岁（  ），身体还很好。","a":"左右","en":"A: How old is your father? B: Around sixty; still in very good health."},{"s":"A：他怎么还在睡？  B：他太（  ）了，周末不到中午不起床。","a":"懒","en":"A: Why is he still asleep? B: He's so lazy; on weekends he doesn't get up before noon."}],"grammar":[{"q":"路上车多，你开车（  ）要小心。","opts":["千万","故意","左右","从来"],"a":0,"exp":"千万 strengthens advice: 千万要小心 'be sure to be careful'.","g":0},{"q":"我不小心把电脑（  ）坏了，现在打不开了。","opts":["做","弄","干","办"],"a":1,"exp":"弄 + result complement 坏 = broke it (exact action unspecified).","g":1},{"q":"从我家到学校，走路要二十分钟（  ）。","opts":["多少","大概","左右","大约"],"a":2,"exp":"左右 follows the number; 大概/大约 would go before it.","g":2},{"q":"他听见了我叫他，却（  ）不回头。","opts":["故意","千万","粗心","十分"],"a":0,"exp":"故意 = deliberately; he deliberately didn't turn round.","g":3},{"q":"这件事你（  ）不能告诉别人，这是我们两个人的事。","opts":["一共","千万","左右","互相"],"a":1,"exp":"千万 + 不能 = must by no means.","g":0},{"q":"这个题太难了，我想了半天也没（  ）明白。","opts":["弄","放","拿","打"],"a":0,"exp":"弄明白 = figure out; 弄 takes the result complement 明白.","g":1}],"order":[{"parts":["孩子做得好的时候应该表扬，","做错了也不要只是批评，","要告诉他怎样做才对。"],"en":"Praise children when they do well; when they make mistakes, don't just criticise but tell them how to do it right."},{"parts":["我不是故意弄坏你的自行车的，","真对不起，","我明天就拿去修。"],"en":"I didn't break your bike on purpose, I'm really sorry; I'll take it to be fixed tomorrow."},{"parts":["寒假的时候，","爷爷每天都陪孙子去公园","玩儿一个小时左右。"],"en":"During the winter holiday, Grandpa takes his grandson to the park every day to play for about an hour."},{"parts":["出国以前，","千万要把护照和机票放好，","丢了就麻烦了。"],"en":"Before going abroad, be sure to put your passport and plane ticket somewhere safe; losing them would be a real hassle."}],"reading":[{"p":"小孩子都喜欢听表扬，但是表扬也要有方法。如果孩子做什么都说“你真棒”，他可能会觉得表扬没什么意思，甚至变得骄傲。最好的办法是清楚地告诉他哪里做得好，比如“你今天自己整理了书包，很认真”。","q":"★ 说话人认为表扬孩子应该：","opts":["每次都说“你真棒”","说清楚他哪里做得好","越少越好"],"a":1,"en":"Children like praise, but it needs method. If you say 'you're great' about everything, they may find praise meaningless or become proud. Best is to tell them specifically what they did well, e.g. 'You packed your schoolbag yourself today, very conscientious.'"},{"p":"我父亲是一位老护士，他在医院工作了三十年左右。很多人吃惊地问：“男的也能当护士吗？”父亲总是笑着说：“当然能，照顾病人，男的女的都可以。”","q":"★ 关于说话人的父亲，可以知道：","opts":["他是医生","他工作了十年","他是男护士"],"a":2,"en":"My father is a veteran nurse who worked in a hospital for about thirty years. Many people ask in surprise, 'Can men be nurses?' He always smiles: 'Of course; both men and women can care for patients.'"},{"p":"现在很多儿童每天的时间都安排得满满的：上午学英语，下午学弹钢琴，晚上还要做作业。有的父母觉得这样孩子以后才能成功，可是孩子们却越来越不快乐。教育孩子，不能只看成绩。","q":"★ 这段话主要想告诉我们：","opts":["孩子应该多学点儿东西","教育孩子不能只看成绩","学钢琴很有用"],"a":1,"en":"Many children have every day packed: English in the morning, piano in the afternoon, homework at night. Some parents think this ensures success, but children are increasingly unhappy. Educating children isn't only about grades."},{"p":"小王最近总觉得有人在骗他。朋友请他吃饭，他怀疑朋友想让他帮忙；同事说他做得好，他怀疑同事在开玩笑。后来他才明白，问题不在别人，而在他自己。","q":"★ 小王后来明白了什么？","opts":["朋友都在骗他","问题出在自己身上","同事在开玩笑"],"a":1,"en":"Xiao Wang mself, which amazed his parents."}],"write":[{"words":["他","故意","不","接我的电话。"],"en":"He deliberately won't answer my calls."},{"words":["这双鞋","你穿着","合适","吗？"],"en":"Do these shoes fit you?"},{"words":["你","千万","别","被他骗了。"],"en":"Whatever you do, don't get fooled by him."},{"words":["孩子们","受到了","老师的","表扬。"],"en":"The children were praised by the teacher."}],"hanzi":[{"s":"这个男孩儿打球打得真（  ）！","py":"bàng","a":"棒"},{"s":"我对他的话有点儿怀（  ）。","py":"yí","a":"疑"},{"s":"他父（  ）是一位大学老师。","py":"qīn","a":"亲"},{"s":"你的作业又写错了，真粗（  ）！","py":"xīn","a":"心"}]},"tx":[{"t":"爷爷和孙子 · Grandpa and grandson","scene":"During the winter holiday, a father asks his own father (the boy's grandfather) how his son has been doing.","g":[2,3],"lines":[{"sp":"爸爸","s":"m","zh":"爸，寒假这些天孙子在您这儿怎么样？没给您找麻烦吧？","py":"Bà, hánjià zhèxiē tiān sūnzi zài nín zhèr zěnmeyàng? Méi gěi nín zhǎo máfan ba?","en":"Dad, how has your grandson been here these winter-holiday days? He hasn't been trouble, has he?"},{"sp":"爷爷","s":"m","zh":"挺好的。每天早上闹钟一响他就醒了，然后弹一个小时左右的钢琴。","py":"Tǐng hǎo de. Měi tiān zǎoshang nàozhōng yì xiǎng tā jiù xǐng le, ránhòu tán yí gè xiǎoshí zuǒyòu de gāngqín.","en":"Very good. Every morning he wakes as soon as the alarm rings, then plays the piano for about an hour."},{"sp":"爸爸","s":"m","zh":"真的？在家里他可懒了，我叫好几遍都不起床。","py":"Zhēn de? Zài jiā li tā kě lǎn le, wǒ jiào hǎo jǐ biàn dōu bù qǐchuáng.","en":"Really? At home he's really lazy; I call him several times and he still won't get up."},{"sp":"爷爷","s":"m","zh":"我每天都表扬他：“弹得真棒！”他听了高兴，就越弹越认真了。","py":"Wǒ měi tiān dōu biǎoyáng tā: “Tán de zhēn bàng!” Tā tīngle gāoxìng, jiù yuè tán yuè rènzhēn le.","en":"I praise him every day: 'You play brilliantly!' He's pleased and plays more and more seriously."},{"sp":"爸爸","s":"m","zh":"看来我平时批评得太多了。不过他弹错的时候，您也说他吗？","py":"Kànlái wǒ píngshí pīpíng de tài duō le. Búguò tā tán cuò de shíhou, nín yě shuō tā ma?","en":"Seems I criticise him too much. But when he plays wrong notes, do you tell him off too?"},{"sp":"爷爷","s":"m","zh":"弹错了很正常，他又不是故意的。我只告诉他哪儿要注意，让他再弹一遍。","py":"Tán cuò le hěn zhèngcháng, tā yòu bú shì gùyì de. Wǒ zhǐ gàosu tā nǎr yào zhùyì, ràng tā zài tán yí biàn.","en":"Wrong notes are normal; it's not as if he does it on purpose. I just tell him what to watch and have him play it again."}]},{"t":"在医院打针 · An injection at the clinic","scene":"Liu Fang brings her young son to the clinic; a nurse reassures him.","g":[0,1],"lines":[{"sp":"护士","s":"f","zh":"小朋友，别怕，打针一点儿都不疼，很快就好。","py":"Xiǎo péngyou, bié pà, dǎzhēn yìdiǎnr dōu bù téng, hěn kuài jiù hǎo.","en":"Little one, don't be scared; the injection doesn't hurt at all, it'll be over quickly."},{"sp":"刘芳","s":"f","zh":"他从小就害怕打针，一看到护士就哭，真不好意思。","py":"Tā cóngxiǎo jiù hàipà dǎzhēn, yí kàndào hùshi jiù kū, zhēn bù hǎoyìsi.","en":"He's been afraid of injections since he was little; he cries as soon as he sees a nurse. I'm so sorry."},{"sp":"护士","s":"f","zh":"没关系，很多儿童都这样。你看，阿姨已经弄好了，是不是很快？","py":"Méi guānxi, hěn duō értóng dōu zhèyàng. Nǐ kàn, āyí yǐjīng nòng hǎo le, shì bu shì hěn kuài?","en":"No problem, lots of children are like this. Look, I've already finished; wasn't that quick?"},{"sp":"刘芳","s":"f","zh":"真的打完了？你真勇敢！回家妈妈给你买巧克力。","py":"Zhēn de dǎwán le? Nǐ zhēn yǒnggǎn! Huí jiā māma gěi nǐ mǎi qiǎokèlì.","en":"Really finished? You're so brave! I'll buy you chocolate on the way home."},{"sp":"护士","s":"f","zh":"今天晚上千万别让他洗澡，也别让他吃太凉的东西。","py":"Jīntiān wǎnshang qiānwàn bié ràng tā xǐzǎo, yě bié ràng tā chī tài liáng de dōngxi.","en":"Whatever you do, don't let him have a bath tonight, and don't let him eat anything too cold."},{"sp":"刘芳","s":"f","zh":"好的，我记住了。谢谢您这么有耐心！","py":"Hǎo de, wǒ jìzhù le. Xièxie nín zhème yǒu nàixīn!","en":"OK, I'll remember. Thank you for being so patient!"}]},{"t":"谁弄坏的？ · Who broke it?","scene":"Zhang Wei finds his watch broken and asks his roommate Mark about it.","g":[1,3],"lines":[{"sp":"张伟","s":"m","zh":"马克，我放在桌子上的手表怎么坏了？是不是你弄的？","py":"Mǎkè, wǒ fàng zài zhuōzi shang de shǒubiǎo zěnme huài le? Shì bu shì nǐ nòng de?","en":"Mark, why is the watch I left on the table broken? Did you do it?"},{"sp":"马克","s":"m","zh":"对不起，早上我赶时间去厕所，不小心把它弄到地上了。","py":"Duìbuqǐ, zǎoshang wǒ gǎn shíjiān qù cèsuǒ, bù xiǎoxīn bǎ tā nòngdào dì shang le.","en":"Sorry, this morning I was rushing to the toilet and accidentally knocked it onto the floor."},{"sp":"张伟","s":"m","zh":"那你为什么不早说？我还以为是你故意不告诉我呢。","py":"Nà nǐ wèi shénme bù zǎo shuō? Wǒ hái yǐwéi shì nǐ gùyì bú gàosu wǒ ne.","en":"Then why didn't you say so earlier? I thought you were deliberately not telling me."},{"sp":"马克","s":"m","zh":"我怕你生气，想先修好再还给你。我真不是想骗你。","py":"Wǒ pà nǐ shēngqì, xiǎng xiān xiūhǎo zài huán gěi nǐ. Wǒ zhēn bú shì xiǎng piàn nǐ.","en":"I was afraid you'd be angry and wanted to fix it before giving it back. I really didn't mean to deceive you."},{"sp":"张伟","s":"m","zh":"算了，我不怀疑你。以后东西坏了直接告诉我就行。","py":"Suàn le, wǒ bù huáiyí nǐ. Yǐhòu dōngxi huài le zhíjiē gàosu wǒ jiù xíng.","en":"Forget it, I don't doubt you. Next time something breaks, just tell me directly."},{"sp":"马克","s":"m","zh":"好，我也太粗心了，以后会注意的。","py":"Hǎo, wǒ yě tài cūxīn le, yǐhòu huì zhùyì de.","en":"OK. I was too careless; I'll be more careful."}]},{"t":"教育孩子的方法 · Ways of raising children","scene":"On a radio programme, a reporter interviews Teacher Chen about praising and criticising children.","g":[0],"lines":[{"sp":"记者","s":"m","zh":"陈老师，很多父母问：孩子做错了事，是应该批评还是表扬？","py":"Chén lǎoshī, hěn duō fùmǔ wèn: háizi zuò cuòle shì, shì yīnggāi pīpíng háishi biǎoyáng?","en":"Ms Chen, many parents ask: when a child does something wrong, should they criticise or praise?"},{"sp":"陈老师","s":"f","zh":"首先要找到合适的方法。父亲母亲千万不要说孩子“笨”，这会让孩子没有信心。","py":"Shǒuxiān yào zhǎodào héshì de fāngfǎ. Fùqīn mǔqīn qiānwàn búyào shuō háizi “bèn”, zhè huì ràng háizi méiyǒu xìnxīn.","en":"First find a suitable method. Fathers and mothers must never call a child 'stupid'; it makes them lose confidence."},{"sp":"记者","s":"m","zh":"可是有的孩子被表扬多了，会不会变得骄傲？","py":"Kěshì yǒude háizi bèi biǎoyáng duō le, huì bu huì biàndé jiāo'ào?","en":"But if some children are praised too much, won't they become conceited?"},{"sp":"陈老师","s":"f","zh":"会的，所以表扬要说清楚原因。比如孩子自己整理了房间，就表扬他做事认真。","py":"Huì de, suǒyǐ biǎoyáng yào shuō qīngchu yuányīn. Bǐrú háizi zìjǐ zhěnglǐle fángjiān, jiù biǎoyáng tā zuòshì rènzhēn.","en":"They might, so praise should give the reason. If a child tidies his room himself, praise him for being conscientious."},{"sp":"记者","s":"m","zh":"那害羞的孩子呢？","py":"Nà hàixiū de háizi ne?","en":"And shy children?"},{"sp":"陈老师","s":"f","zh":"要多鼓励。我班上有个孩子，刚来的时候一天也说不了几句话，现在敢在大家面前表演了。","py":"Yào duō gǔlì. Wǒ bān shang yǒu gè háizi, gāng lái de shíhou yì tiān yě shuō bu liǎo jǐ jù huà, xiànzài gǎn zài dàjiā miànqián biǎoyǎn le.","en":"Encourage them more. A child in my class hardly said a few sentences a day at first; now he dares to perform in front of everyone."}]}]},{"n":16,"cn":"生活可以更美好","en":"Life can be better","vocab":[{"w":"博士","p":"bóshì","pos":"n.","d":"doctor (academic degree)"},{"w":"签证","p":"qiānzhèng","pos":"n.","d":"visa"},{"w":"报名","p":"bàomíng","pos":"v.","d":"to apply, to sign up"},{"w":"表格","p":"biǎogé","pos":"n.","d":"form, table"},{"w":"传真","p":"chuánzhēn","pos":"v.","d":"to send by fax"},{"w":"号码","p":"hàomǎ","pos":"n.","d":"number"},{"w":"参观","p":"cānguān","pos":"v.","d":"to visit, to look around"},{"w":"激动","p":"jīdòng","pos":"adj.","d":"excited, emotional"},{"w":"小伙子","p":"xiǎohuǒzi","pos":"n.","d":"young man"},{"w":"记者","p":"jìzhě","pos":"n.","d":"journalist, reporter"},{"w":"代表","p":"dàibiǎo","pos":"v.","d":"to represent, to stand for"},{"w":"恐怕","p":"kǒngpà","pos":"adv.","d":"(indicating an estimation) Iguess..."},{"w":"失望","p":"shīwàng","pos":"v.","d":"disappointed"},{"w":"郊区","p":"jiāoqū","pos":"n.","d":"suburb, outskirts"},{"w":"到底","p":"dàodǐ","pos":"adv.","d":"(used in questions for emphasis)... on earth"},{"w":"呀","p":"ya","pos":"part.","d":"modal particle used at the end of a question to soften the tone"},{"w":"导游","p":"dǎoyóu","pos":"n.","d":"tour guide"},{"w":"礼貌","p":"lǐmào","pos":"n.","d":"polite"},{"w":"原谅","p":"yuánliàng","pos":"v.","d":"to forgive"},{"w":"挂","p":"guà","pos":"v.","d":"to hang, to put up"},{"w":"同情","p":"tóngqíng","pos":"v.","d":"to show sympathy for"},{"w":"推","p":"tuī","pos":"v.","d":"to put off, to postpone"},{"w":"预习","p":"yùxí","pos":"v.","d":"to prepare lessons before class"},{"w":"重点","p":"zhòngdiǎn","pos":"n.","d":"focal point, emphasis"},{"w":"马虎","p":"mǎhu","pos":"adj.","d":"careless, slipshod"},{"w":"自信","p":"zìxìn","pos":"adj.","d":"self-confident"},{"w":"冷静","p":"lěngjìng","pos":"adj.","d":"calm, composed"},{"w":"输","p":"shū","pos":"v.","d":"to lose, to suffer defeat"},{"w":"重视","p":"zhòngshì","pos":"v.","d":"to attach importance to"},{"w":"敢","p":"gǎn","pos":"v.","d":"to dare"},{"w":"尊重","p":"zūnzhòng","pos":"v.","d":"to respect"}],"proper":"","grammar":[{"t":"到底 — (in questions) … on earth / exactly; finally, after all","m":"In questions, 到底 presses for a clear, final answer, often showing impatience: 你到底去不去？ 'Are you going or not?'. It goes before the verb or question word (到底是谁, 到底怎么了) and cannot be used with 吗 questions. In statements, 到底 means 'in the end, finally' after a long process (他到底还是成功了) or 'after all' (他到底是孩子).","ex":[["你说了半天，到底想让我做什么？","You've been talking for ages—what exactly do you want me to do?"],["这两件衣服到底哪件更好看？我真不知道选哪件。","Which of these two outfits really looks better? I honestly can't choose."],["试了很多次以后，他到底还是通过了考试。","After many attempts, he finally passed the exam."]]},{"t":"恐怕 — I'm afraid (that) …, probably","m":"恐怕 is an adverb that expresses an estimate or worry about a probable (usually unwelcome) outcome: 'I'm afraid…', 'probably…'. It goes before the verb or at the start of the clause (恐怕他不会来了). It softens bad news and makes guesses sound polite. Unlike 害怕/怕 ('to fear something'), 恐怕 does not take an object noun; it comments on a whole situation.","ex":[["现在已经八点了，我们恐怕赶不上电影了。","It's already eight; I'm afraid we won't make the film."],["这么多工作，恐怕一个人一天做不完。","I'm afraid this much work can't be finished by one person in a day."],["天这么阴，恐怕下午要下雨。","It's so overcast; it'll probably rain this afternoon."]]},{"t":"敢 / 不敢 — To dare / not dare","m":"敢 is an auxiliary verb placed before another verb: 敢说, 敢一个人去. The negative 不敢 ('daren't, too scared to') is extremely common. Questions: 你敢不敢……？ It can be modified by degree adverbs (很敢说, 更敢). 敢 is about courage; for permission use 能/可以. In polite speech, 不敢当 means 'I don't deserve such praise'.","ex":[["他刚来中国的时候，不敢一个人坐出租车。","When he first came to China, he didn't dare take a taxi alone."],["你敢不敢跟我比一比，看谁跑得快？","Do you dare race me to see who's faster?"],["有问题要敢问，不懂的时候假装懂是学不好的。","You must dare to ask questions; pretending to understand won't get you far."]]},{"t":"重视 / 尊重 — To value / To respect","m":"重视 means to attach importance to something or someone and take it seriously (重视教育, 重视这个问题, 受到重视). 尊重 means to respect people, their opinions, choices or customs (尊重老人, 尊重别人的意见, 互相尊重). Both are transitive verbs that take objects directly; 重视 focuses on how important something is, 尊重 on treating someone properly.","ex":[["这家公司很重视每个人的想法，每个月都开会听大家的意见。","This company takes everyone's ideas seriously and holds a meeting every month to hear their views."],["孩子选什么专业，父母应该尊重他自己的决定。","Whatever major a child chooses, parents should respect his own decision."],["到了别的国家，要尊重那里的人的生活习惯。","In another country, you should respect the way of life of the people there."]]}],"ex":{"judge":[{"s":"马克打算明年去中国读博士，所以最近一直在准备签证材料。他说需要填的表格很多，花了整整一个星期才弄好。","st":"★ 马克已经拿到签证了。","a":false,"en":"Mark plans to do a PhD in China next year, so he's been preparing visa documents. He says there are many forms to fill in; it took a whole week. / ★ Mark already has his visa."},{"s":"这次参观活动下周六进行，想参加的同学请在周三以前到办公室报名。只能去三十个人，先报名的先去。","st":"★ 报名的时间在周三以前。","a":true,"en":"This visit takes place next Saturday; students who want to join must sign up at the office before Wednesday. Only thirty people can go; first to sign up, first to go. / ★ Sign-up is before Wednesday."},{"s":"昨天的足球比赛我们以一比三输了。大家都很失望，可是老师说：“输了不可怕，可怕的是不知道为什么输。”","st":"★ 老师对比赛结果很满意。","a":false,"en":"We lost yesterday's football match 1–3. Everyone was disappointed, but the teacher said, 'Losing isn't frightening; what's frightening is not knowing why you lost.' / ★ The teacher was satisfied with the result."},{"s":"我们的导游是一个二十多岁的小伙子，对每个地方都非常熟悉，说话也很有礼貌。大家这次玩儿得都很开心。","st":"★ 大家对导游很满意。","a":true,"en":"Our tour guide was a young man in his twenties who knew every place well and spoke very politely. Everyone enjoyed the trip. / ★ Everyone was pleased with the guide."},{"s":"做事马虎的人常常会出错，所以老师总是让我们上课前先预习，把重点找出来，下课后再复习一遍。","st":"★ 老师让学生上课前先预习。","a":true,"en":"Careless people often make mistakes, so our teacher always has us preview before class, find the key points, and review once after class. / ★ The teacher has students preview before class."}],"listen":[{"dlg":["女：你到底什么时候回来？","男：会议推到明天了，恐怕要后天才能回去。"],"q":"男的什么时候回来？","opts":["今天","明天","后天"],"a":2,"en":"W: When on earth are you coming back? M: The meeting's been put off to tomorrow, so I'm afraid I won't be back until the day after. Q: When will he return?"},{"dlg":["男：请问，报名要带什么材料？","女：带上护照和两张照片，再填一张表格就可以了。"],"q":"报名不需要什么？","opts":["护照","照片","签证"],"a":2,"en":"M: What documents do I need to sign up? W: Bring your passport and two photos, and fill in a form. Q: What is NOT needed?"},{"dlg":["女：听说你们公司在郊区？每天上班远不远？","男：挺远的，开车要一个多小时。"],"q":"关于男的公司，可以知道什么？","opts":["在郊区","在市中心","离家很近"],"a":0,"en":"W: I hear your company is in the suburbs? Is the commute far? M: Pretty far, over an hour by car. Q: What do we know about his company?"},{"dlg":["男：这次比赛又输了，我真没用。","女：别这么说，你已经进步很多了。","男：可我还是没赢。","女：保持冷静，下次一定可以的。"],"q":"女的是什么态度？","opts":["批评男的","鼓励男的","对男的很失望"],"a":1,"en":"M: Lost again; I'm useless. W: Don't say that, you've improved a lot. M: But I still didn't win. W: Stay calm; next time you'll do it. Q: What's her attitude?"},{"dlg":["女：你怎么不敢去跟经理说？","男：上次我说错了话，经理到现在还没原谅我呢。"],"q":"男的为什么不敢去？","opts":["经理很忙","他上次说错了话","他生病了"],"a":1,"en":"W: Why don't you dare talk to the manager? M: Last time I said the wrong thing and he still hasn't forgiven me. Q: Why doesn't he dare go?"}],"match":[{"q":"你到底去不去？给我个准确的回答。","r":"去，不过我得晚一点儿到。"},{"q":"对不起，我把你的名字写错了。","r":"没关系，我原谅你了，下次注意就行。"},{"q":"请问您的电话号码是多少？","r":"一三九，后面是五八六七二四一零。"},{"q":"这份材料能传真给我吗？","r":"可以，请告诉我您的传真号码。"},{"q":"听说你下周要去郊区参观？","r":"对，是学校安排的，大家一起坐车去。"}],"fill":[{"s":"他从小就想当一名（  ），把世界上发生的事情告诉大家。","a":"记者","en":"Since childhood he wanted to be a reporter, telling everyone what happens in the world."},{"s":"听到自己考上了大学，她（  ）得说不出话来。","a":"激动","en":"Hearing she'd got into university, she was so excited she couldn't speak."},{"s":"他读完硕士以后，又继续读了三年（  ）。","a":"博士","en":"After his master's he went on to do three more years for a doctorate."},{"s":"我们公司搬到了（  ），离市中心有点儿远。","a":"郊区","en":"Our company moved to the suburbs, a bit far from the city centre."},{"s":"遇到问题的时候，先要（  ）下来，再想办法。","a":"冷静","en":"When you meet a problem, first calm down, then think of a solution."},{"s":"A：你怎么这么有（  ）？  B：因为我已经准备了很长时间了。","a":"自信","en":"A: How come you're so self-confident? B: Because I've prepared for a long time."},{"s":"A：明天的会能不能（  ）到下周？  B：恐怕不行，经理下周要出差。","a":"推","en":"A: Can tomorrow's meeting be put off until next week? B: I'm afraid not; the manager has a business trip next week."},{"s":"A：你把那张画儿（  ）在哪儿了？  B：就在门后面，你一进门就能看到。","a":"挂","en":"A: Where did you hang that painting? B: Behind the door; you'll see it as soon as you come in."},{"s":"A：看他哭得那么伤心，我真（  ）他。  B：是啊，丢了工作谁都会难过的。","a":"同情","en":"A: Seeing him cry so sadly, I really feel for him. B: Yes, anyone would be upset losing their job."},{"s":"A：你的作业怎么又错了这么多？  B：对不起，我太（  ）了，没检查就交了。","a":"马虎","en":"A: Why so many mistakes in your homework again? B: Sorry, I was sloppy and handed it in without checking."}],"grammar":[{"q":"你们俩说的不一样，（  ）谁说的是对的？","opts":["到底","恐怕","敢","千万"],"a":0,"exp":"到底 presses for a definite answer in a question-word question.","g":0},{"q":"雨下得这么大，比赛（  ）要推到明天了。","opts":["到
